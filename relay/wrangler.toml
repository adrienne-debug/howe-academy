# Cloudflare settings for the calendar relay. Nothing here is secret.
# Deploy steps are in relay/README.md — deploying is Adrienne's call.
name = "howe-calendar-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# The only web pages allowed to ask the relay for calendars or send it copies.
# Every family app is served from this one GitHub Pages address; localhost:8774 is the Mac test server.
ALLOWED_ORIGINS = "https://adrienne-debug.github.io,http://localhost:8774"

[[kv_namespaces]]
binding = "FEEDS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # filled in once, from `npx wrangler kv namespace create FEEDS`
