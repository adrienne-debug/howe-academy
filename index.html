    setTimeout(()=>{const i=document.getElementById("admin-pin-input");if(i)i.focus();},50);
    return;
  }

  syncPaceData();
  const plans=paceData.plans&&Object.keys(paceData.plans).length>0?paceData.plans:PACE_DEFAULT_PLANS;

  let h=(headerHtml||'')+'<div id="pace-content" style="padding:0 4px">';

  // Kid selector (hide when inside schedule tab — main kid filter handles it)
  if(!schedShowPace){
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
    [{k:"all",label:"All",col:"#111827"},...PACE_KIDS.map(k=>({k,label:cap(k),col:PACE_KCOL[k]}))].forEach(({k:k2,label,col})=>{
      const on=kid===k2||(k2==="all"&&(kid==="all"||kid==="mom"));
      h+='<button onclick="selKid(\''+k2+'\')" style="padding:5px 14px;border-radius:20px;border:1.5px solid '+(on?'transparent':'var(--border)')+';background:'+(on?col:'#fff')+';color:'+(on?'#fff':'var(--muted)')+';font-size:12px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif">'+label+'</button>';
    });
    h+='</div>';
  }

  // Weekly progress bar
  const weeklyCol=(kid==="all"||kid==="mom")?"#111827":PACE_KCOL[kid]||"#111827";
  const _wkMatch=t=>(kid==="all"||kid==="mom")?true:t.who===kid;
  const _wkCascAway=new Set(weekData.tasks.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  const _wkCountable=weekData.tasks.filter(t=>_wkMatch(t)&&(!_wkCascAway.has(t.id)||!!checked[t.id])&&!(t.title||"").toLowerCase().includes("lunch"));
  const weeklyTotal=_wkCountable.length;
  const weeklyDone=_wkCountable.filter(t=>chainDone(t.id,checked,weekData.tasks)).length;
  const weeklyPct=weeklyTotal?Math.min(100,Math.round(weeklyDone/weeklyTotal*100)):0;
  h+='<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
    '<div style="font-size:12px;font-weight:600;color:var(--muted)">This week</div>'+
    '<div style="font-size:12px;font-weight:700;color:'+weeklyCol+'">'+weeklyPct+'%</div>'+
    '</div>'+
    '<div class="day-prog-bar" style="margin-top:0"><div class="day-prog-fill" style="width:'+weeklyPct+'%;background:'+weeklyCol+'"></div></div>'+
    '</div>';

  // Steering summary — the verdict/on-track read lives with the depth view
  const _roll=((kid==="all"||kid==="mom")?PACE_KIDS:[kid]).map(k=>({k,st:paceKidStatus(k),wk:paceKidWeek(k)})).filter(r=>r.st.subjects||r.wk.total);
  h+=paceVerdictHtml(_roll,weeklyPct);

  // Finish Line — projected completion per subject (calendar- and override-aware)
  try{ h+=renderFinishLine(kid); }catch(e){ console.log("[HA] finish line error",e); }

  // Plan sections — READ-ONLY progress view
  Object.entries(plans).forEach(([planKey,plan])=>{
    const planKids=plan.kids||[];
    const visKids=(kid==="all"||kid==="mom")?planKids:planKids.filter(k=>k===kid);
    if(visKids.length===0&&kid!=="all"&&kid!=="mom") return;

    const weekNum=planWeekNum(plan.start||"2026-04-20");
    const totalWeeks=planTotalWeeks(plan.start||"2026-04-20",plan.end||"2026-09-01");
    const ssTotal=sessionSchoolDays(plan);
    const ssRemain=sessionSchoolDaysFromToday(plan);
    const ssDone=Math.max(0,ssTotal.school-ssRemain.school);
    const planPct=ssTotal.school?Math.min(100,Math.round(ssDone/ssTotal.school*100)):0;

    h+='<div class="pace-plan-section">';

    // Plan banner — read-only (no Edit/Map/Auto-Commit controls)
    h+='<div class="pace-year-banner" style="align-items:flex-start">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">'+
      '<div class="pace-year-label">'+plan.label+'</div></div>'+
      '<div class="pace-year-sub">'+formatPlanDate(plan.start||"")+' &ndash; '+formatPlanDate(plan.end||"")+'</div>'+
      '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">'+
      planKids.map(k=>'<span class="pace-plan-kid-chip">'+cap(k)+'</span>').join('')+
      '</div>'+
      '<div class="pace-year-bar"><div class="pace-year-fill" style="width:'+planPct+'%"></div></div>'+
      '</div>'+
      '<div style="text-align:right;flex-shrink:0">'+
      '<div class="pace-year-wk">'+ssDone+' days</div>'+
      '<div class="pace-year-wklbl">of '+ssTotal.school+(ssTotal.off?' ('+ssTotal.off+' off)':'')+'</div>'+
      '<div class="pace-year-wklbl">Wk '+Math.min(weekNum,totalWeeks)+' &middot; '+planPct+'%</div></div>'+
      '</div>';

    // Kid curriculum cards — read-only (no Edit button, no config forms)
    visKids.forEach(k=>{
      const kidSubjs=(paceData.subjects&&paceData.subjects[k])||{};
      const _currSubs=(currData&&currData.subjects&&currData.subjects[k])||{};
      const keys=Object.keys(kidSubjs).filter(sk=>{
        if(_currSubs[sk]&&_currSubs[sk].tracking==="daily") return false;
        if((kidSubjs[sk].total||0)===0) return false;
        return true;
      });
      const col=PACE_KCOL[k];
      let aheadN=0,onN=0,behindN=0;
      const cwn=currWeekNum();
      keys.forEach(sk=>{
        const s=kidSubjs[sk];
        const kws=paceKeywords(k,sk,s);
        const cur=(s.offset||0)+paceAutoCount(k,kws)+(s.adjust||0);
        const exp=currExpected(k,sk,cwn);
        const st=paceHasPendingCascade(k,kws)?"behind":paceStatus(cur,s.total||0,s.startWeek||1,weekNum,totalWeeks,exp);
        if(st==="ahead")aheadN++; else if(st==="behind")behindN++; else if(st!=="not-started")onN++;
      });
      const summaryStr=keys.length?(behindN?behindN+' behind':aheadN?aheadN+' ahead':'All on track'):'No subjects yet';

      h+='<div class="pace-kid-card">'+
        '<div class="pace-kid-hdr">'+
        '<div><div class="pace-kid-name" style="color:'+col+'">'+cap(k)+'</div>'+
        '<div class="pace-kid-meta">'+summaryStr+(keys.length?' &middot; '+keys.length+' subjects':'')+'</div></div>'+
        '</div>';

      if(keys.length){
        h+='<div class="pace-subjects">';
        keys.forEach(sk=>{
          const s=kidSubjs[sk];
          const kws=paceKeywords(k,sk,s);
          const autoC=paceAutoCount(k,kws);
          const offset=s.offset||0,adjust=s.adjust||0,sw=s.startWeek||1;
          const cur=offset+autoC+adjust,tot=s.total||1;
          const pct=Math.min(100,Math.round(cur/tot*100));
          const exp=currExpected(k,sk,cwn);
          const expB=currExpectedBase(k,sk,cwn);
          const status=paceHasPendingCascade(k,kws)?"behind":paceStatus(cur,tot,sw,weekNum,totalWeeks,exp);
          const barCol=status==="ahead"?"#16a34a":status==="behind"?"#ef4444":status==="not-started"?"#d1d5db":"#3b82f6";
          const expPct=exp!==null?Math.min(100,Math.round(exp/tot*100)):null;
          const expBPct=(expB!==null&&exp!==null&&expB!==exp)?Math.min(100,Math.round(expB/tot*100)):null;
          const diff=exp!==null?cur-exp:null;
          const planDelta=(exp!==null&&expB!==null&&exp!==expB)?' &middot; plan '+((exp-expB)>0?'+':'')+(exp-expB)+' vs Excel':'';
          const expLabel=(exp!==null?' &middot; '+(diff>0?diff+' ahead of expected':diff<0?Math.abs(diff)+' behind expected':'on pace for Wk '+cwn):'')+planDelta;
          const _nextLesson=getNextLessonLabel(k,sk);

          h+='<div class="pace-subject-row">'+
            '<div class="pace-subj-hdr">'+
            '<span class="pace-subj-name">'+s.label+'</span>'+
            '<span class="pace-subj-nums">'+cur+' / '+tot+' done</span></div>'+
            '<div class="pace-bar" style="position:relative"><div class="pace-bar-fill" style="width:'+pct+'%;background:'+barCol+'"></div>'+(expPct!==null?'<div style="position:absolute;left:'+expPct+'%;top:-3px;width:2px;height:calc(100% + 6px);background:#374151;border-radius:1px;pointer-events:none" title="Expected (edited plan): '+exp+'/'+tot+'"></div>':'')+(expBPct!==null?'<div style="position:absolute;left:'+expBPct+'%;top:-3px;width:2px;height:calc(100% + 6px);background:#9ca3af;opacity:0.65;pointer-events:none;border-radius:1px" title="Original Excel plan: '+expB+'/'+tot+'"></div>':'')+'</div>'+
            '<div class="pace-status-row">'+
            '<span class="pace-badge '+status+'">'+paceStatusLabel(status)+'</span>'+
            '<span class="pace-pct">'+pct+'% complete'+expLabel+(sw>1&&weekNum<sw?' &middot; starts wk '+sw:'')+'</span></div>';

          if(_nextLesson){
            h+='<div style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:4px 8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px">'+
              '<span style="font-size:10px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap">Next up</span>'+
              '<span style="font-size:12px;color:#15803d;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+_nextLesson+'</span></div>';
          } else if(cur>=tot&&tot>0){
            h+='<div style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:4px 8px;background:#fef9c3;border:1px solid #fde68a;border-radius:6px">'+
              '<span style="font-size:10px;font-weight:700;color:#a16207;text-transform:uppercase;letter-spacing:0.3px">Complete</span>'+
              '<span style="font-size:12px;color:#92400e;font-weight:500">All lessons finished!</span></div>';
          }
          h+='</div>';
        });
        h+='</div>';
      }
      h+='</div>';
    });

    h+='</div>';
  });

  h+='</div>';
  el.innerHTML=h;
}

// One shuffled order per quiz, FROZEN from the first view/print all the way through logging, so
// the printed sheet and the on-screen log are always in the SAME order — clicking Log never
// reshuffles the deck under the parent. The shuffle is (re)built only when the due-set changes
// AND we're not mid-log; logging pins both order and membership so intro graduations / auto-
// pulled cards (mastSlideShown) can't reorder or grow the deck mid-session. Frozen ids are
// looked up in live data so tally/status stay current; only order + membership are pinned.
function mastOrderedDue(pn){
  const due=mastDueItems(masteryKid,pn);
  const key=masteryKid+"|"+due.map(i=>i.id).join(",");
  const _lsk="ha_mast_deck_"+masteryKid;
  // A page reload wipes the in-memory deck. Restore the frozen shuffle for this exact quiz so
  // reloads DON'T reshuffle — the quiz only changes when its contents change or a log clears it.
  if(!mastLogDeck && !mastLogMode){
    try{ const s=JSON.parse(localStorage.getItem(_lsk)||"null"); if(s&&s.key===key&&Array.isArray(s.deck)){ mastLogDeck=s.deck; mastSessionKey=key; } }catch(e){}
  }
  if(!mastLogDeck || (!mastLogMode && mastSessionKey!==key)){
    mastLogDeck=mastShuffleDeck(due).map(i=>i.id);
    mastSessionKey=key;
    try{ localStorage.setItem(_lsk,JSON.stringify({key:key,deck:mastLogDeck})); }catch(e){}
  }
  let all=masteryData[masteryKid]; if(!Array.isArray(all)) all=Object.values(all||{});
  const byId={}; all.forEach(i=>{ if(i&&i.id) byId[i.id]=i; });
  return mastLogDeck.map(id=>byId[id]).filter(Boolean);
}

// Shuffle items WITHIN each category while keeping the categories in their existing order,
// so a drill stays grouped (all Letters, all Numbers…) but the order inside each group
// varies every session. Fisher–Yates per category run.
function mastShuffleDeck(list){
  const order=[], groups={};
  list.forEach(it=>{ const c=(it&&it.subject)||"Other"; if(!groups[c]){ groups[c]=[]; order.push(c); } groups[c].push(it); });
  const out=[];
  order.forEach(c=>{ const g=groups[c]; for(let i=g.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=g[i]; g[i]=g[j]; g[j]=t; } out.push(...g); });
  return out;
}

function mastSaveResults(){
  const pn=mastGetPrintNum();
  const due=mastSessionDue(pn);
  const TIER_LADDER=mastDrillSettings().ladder;

  // Get all items for this kid
  let items=masteryData[masteryKid];
  if(!items) return;
  if(!Array.isArray(items)) items=Object.values(items);

  // Apply results
  let changes=0;
  const touched=[];  // cards whose ladder state changed — for a targeted, non-destructive write
  due.forEach(dueItem=>{
    const score=mastLogScores[dueItem.id];
    if(!score||score==="shown") return; // "shown" already saved by mastSlideShown
    // Find in items array
    const item=items.find(i=>i.id===dueItem.id);
    if(!item) return;
    if(item.status==="introduction") return; // intro items don't get ladder scoring

    const oldTier=item.tier||"daily";
    let oldIdx=TIER_LADDER.indexOf(oldTier);
    if(oldIdx===-1){
      // Item sits on a tier that isn't a rung on this kid's ladder — e.g. a legacy
      // "daily"/"learned" item, or a rung (like every_third_day) that was later removed
      // from the ladder. It still shows up as "due", so without this the score would be
      // silently discarded and the item could never progress. Snap it onto the nearest
      // rung at or below its position in the global tier order, then score it normally.
      const gpos=MAST_TIER_ORDER.indexOf(oldTier);
      oldIdx=0;
      for(let k=0;k<TIER_LADDER.length;k++){
        if(MAST_TIER_ORDER.indexOf(TIER_LADDER[k])<=gpos) oldIdx=k;
      }
      item.tier=TIER_LADDER[oldIdx]; // normalize so it's on-ladder even if it doesn't advance this round
    }

    let newIdx=oldIdx;
    const _ds=mastDrillSettings();
    const _tierStreak=_ds.tier_streaks[oldTier]??_ds.ladder_streak;
    if(score==="c"){
      const cc=(item.consecutive_correct||0)+1;
      if(cc>=_tierStreak) newIdx=Math.min(oldIdx+1,TIER_LADDER.length-1);
    } else if(score==="m"){
      if(_ds.miss_drop==="one") newIdx=Math.max(0,oldIdx-1);
      else newIdx=0;
      item.drop_count=(item.drop_count||0)+1;
      if(_ds.drop_threshold>0&&item.drop_count>=_ds.drop_threshold){
        item.status="introduction"; item.tally_dots=0; item.consecutive_correct=0; item.drop_count=0;
      }
    } else if(score==="~"){
      if(_ds.close_behavior==="count"){
        const cc=(item.consecutive_correct||0)+1;
        if(cc>=_tierStreak) newIdx=Math.min(oldIdx+1,TIER_LADDER.length-1);
      } else if(_ds.close_behavior==="drop"){
        newIdx=Math.max(0,oldIdx-1);
      }
    }

    const newTier=TIER_LADDER[newIdx];
    if(newTier!==oldTier){
      item.tier=newTier;
      item.consecutive_correct=0;
      const interval=MAST_TIER_INT[newTier];
      if(interval){
        const countInTier=items.filter(i=>i.tier===newTier&&i.id!==item.id).length;
        item.cycle=(countInTier%interval)+1;
      }
    } else if(score==="c"||(score==="~"&&_ds.close_behavior==="count")){
      item.consecutive_correct=(item.consecutive_correct||0)+1;
    } else {
      item.consecutive_correct=0;
    }
    touched.push(item);
    changes++;
  });

  const hasShown=Object.values(mastLogScores).some(v=>v==="shown");
  if(!changes&&!hasShown){ alert("No items scored"); return; }

  // Update printLog with today if not present
  let pl=masteryData.printLog||[];
  if(!Array.isArray(pl)) pl=Object.values(pl);
  const today=new Date().toISOString().slice(0,10);
  if(!pl.find(e=>e.date===today)) pl.push({date:today,num:pn});
  masteryData.printLog=pl;

  // Build drill history record
  const drillItems=[];
  let correct=0,miss=0,close=0,shown=0;
  due.forEach(d=>{
    const sc=mastLogScores[d.id];
    if(!sc) return;
    if(sc==="shown"){ shown++; drillItems.push({id:d.id,prompt:d.prompt,result:"shown",tier:d.tier||"daily"}); }
    else { drillItems.push({id:d.id,prompt:d.prompt,result:sc,oldTier:d.tier||"daily"}); if(sc==="c")correct++; else if(sc==="m")miss++; else if(sc==="~")close++; }
  });
  const scored=correct+miss+close;
  const histEntry={
    date:today, printNum:pn, total:due.length, scored:scored,
    correct:correct, miss:miss, close:close, shown:shown,
    pct:scored?Math.round(correct/scored*100):0,
    items:drillItems
  };

  // Save to Firebase — write ONLY the cards that changed, field by field, instead of
  // overwriting the kid's whole list. A whole-list set() is last-writer-wins: a second
  // open tab/device holding older data would silently revert these ladder climbs (the drill
  // history is keyed separately by date, so it survives — exactly the symptom we hit). A
  // targeted update touches only the scored cards, so concurrent drilling can't clobber it.
  if(db){
    const upd={};
    touched.forEach(it=>{
      const ix=items.indexOf(it);
      if(ix<0) return;
      upd[ix+"/tier"]=it.tier;
      upd[ix+"/consecutive_correct"]=it.consecutive_correct||0;
      upd[ix+"/cycle"]=it.cycle||1;
      upd[ix+"/drop_count"]=it.drop_count||0;
      upd[ix+"/status"]=it.status||"active";
      upd[ix+"/tally_dots"]=it.tally_dots??0;
    });
    db.ref("mastery/"+masteryKid).update(upd);
    db.ref("mastery/printLog").set(pl);
    db.ref("mastery/history/"+masteryKid+"/"+today.replace(/-/g,"")).set(histEntry);
  }
  // Update local
  masteryData[masteryKid]=items;
  if(!masteryData.history) masteryData.history={};
  if(!masteryData.history[masteryKid]) masteryData.history[masteryKid]={};
  masteryData.history[masteryKid][today.replace(/-/g,"")]=histEntry;
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  mastLogMode=false;
  mastLogScores={};
  mastLogDeck=null;
  mastSessionKey="";  // logging is the trigger for a new quiz — drop the persisted shuffle so the next view reshuffles
  try{localStorage.removeItem("ha_mast_deck_"+masteryKid);}catch(e){}
  const c=document.getElementById("content"); if(c) renderMastery(c);
}

function mastAdminToggleTier(tier){
  if(!mastAdminLocal) mastAdminInit();
  const ladder=mastAdminLocal.ladder||["every_other_day","weekly","bi_weekly","monthly","graduated"];
  const allTiers=["every_other_day","every_third_day","weekly","bi_weekly","monthly","learned","graduated"];
  if(tier==="graduated") return;
  const idx=ladder.indexOf(tier);
  if(idx!==-1){ ladder.splice(idx,1); }
  else {
    // Insert in correct order relative to allTiers
    const pos=allTiers.indexOf(tier);
    let insertAt=ladder.length-1; // before graduated
    for(let i=0;i<ladder.length;i++){
      if(allTiers.indexOf(ladder[i])>pos){ insertAt=i; break; }
    }
    ladder.splice(insertAt,0,tier);
  }
  mastAdminLocal.ladder=ladder;
  mastAdminDirty=true;
  _mastRe();
}

function mastCompressImg(file,maxPx,quality){
  return new Promise((resolve,reject)=>{
    if(!maxPx) maxPx=400;
    if(!quality) quality=0.8;
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement("canvas");
        let w=img.width, h=img.height;
        if(w>maxPx||h>maxPx){ const r=Math.min(maxPx/w,maxPx/h); w=Math.round(w*r); h=Math.round(h*r); }
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",quality);
        resolve(dataUrl);
      };
      img.onerror=()=>reject(new Error("Could not read image"));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}

function mastGetGenerated(item){
  const today=new Date().toISOString().slice(0,10);
  const key=item.id+"_"+today;

  // Check cache
  if(mastGeneratedCache[key]) return mastGeneratedCache[key];

  // Check Firebase cache
  const fbCached=masteryData._genCache&&masteryData._genCache[item.id];
  if(fbCached&&fbCached.date===today){ mastGeneratedCache[key]=fbCached; return fbCached; }

  // Generate if not already in flight
  if(!mastGenerating[item.id]&&mastAIKey){
    mastGenerating[item.id]=true;
    const kidLabel=SL_KLBL[masteryKid]||masteryKid;
    const count=item.problemCount||1;
    const tier=item.tier||"daily";
    const tierLabel=MAST_TIER_LBL[tier]||tier;

    // Difficulty scaling based on tier
    const diffMap={daily:"beginner — straightforward, one step",every_other_day:"developing — slightly harder, may need two steps",weekly:"intermediate — add a twist or extra step",bi_weekly:"advancing — combine with a related skill",monthly:"challenging — multi-step or requires deeper understanding"};
    const diffHint=diffMap[tier]||"age-appropriate";

    const countInstr=count>1
      ?"Generate exactly "+count+" practice problems"
      :"Generate exactly 1 practice problem";

    const prompt=countInstr+" for a homeschool student.\n\nStudent: "+kidLabel+"\nConcept: "+item.prompt+"\nCurrent mastery tier: "+tierLabel+" (difficulty hint: "+diffHint+")\nRules/Instructions: "+(item.generationRule||item.definition||"Generate an age-appropriate problem for this concept")+"\n\n"+(count>1
      ?"Respond with ONLY a JSON array, no markdown, no explanation. Each element: {\"problem\": \"...\", \"answer\": \"...\"}\nExample: [{\"problem\":\"5+3=\",\"answer\":\"8\"},{\"problem\":\"7+2=\",\"answer\":\"9\"}]"
      :"Respond with ONLY a JSON object, no markdown, no explanation:\n{\"problem\": \"the problem text the student sees\", \"answer\": \"the correct answer\"}");

    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":mastAIKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:count>1?800:200,messages:[{role:"user",content:prompt}]})
    }).then(r=>r.json()).then(data=>{
      try{
        const txt=data.content[0].text.trim();
        const parsed=JSON.parse(txt);
        let entry;
        if(Array.isArray(parsed)){
          entry={date:today,problems:parsed,problem:parsed.map((p,i)=>(i+1)+". "+p.problem).join("\n"),answer:parsed.map(p=>p.answer).join(", ")};
        } else {
          entry={date:today,problems:[parsed],problem:parsed.problem,answer:parsed.answer};
        }
        mastGeneratedCache[key]=entry;
        if(db) db.ref("mastery/_genCache/"+item.id).set(entry);
        if(!masteryData._genCache) masteryData._genCache={};
        masteryData._genCache[item.id]=entry;
      }catch(e){ console.error("Parse error:",e,data); mastGeneratedCache[key]={date:today,problems:[],problem:"[Generation error — tap \u{1F504} to retry]",answer:""}; }
      delete mastGenerating[item.id];
      _mastRe();
    }).catch(err=>{
      console.error("API error:",err);
      mastGeneratedCache[key]={date:today,problems:[],problem:"[API error — check connection]",answer:""};
      delete mastGenerating[item.id];
      _mastRe();
    });
  }

  return null; // Still loading
}

// Writing a kid's WHOLE card array with set() is last-writer-wins: a second open
// tab/device holding older data silently reverts real progress. These helpers touch
// only the cards that actually changed, so concurrent drilling/editing can't clobber.
function mastPutCards(kid,items,cards){            // in-place edit / add / reorder

function mastRemoveByIds(kid,ids){                 // delete — re-read freshest, drop by id
  if(!db||!ids||!ids.length) return;
  const rm=new Set(ids);
  db.ref("mastery/"+kid).transaction(cur=>{
    if(cur==null) return cur;
    const arr=Array.isArray(cur)?cur:Object.values(cur);
    return arr.filter(x=>x&&!rm.has(x.id));

function mastSlideShown(id){
  // Fill the next tally dot for an introduction item
  let items=masteryData[masteryKid];
  if(!items) return;
  if(!Array.isArray(items)) items=Object.values(items);
  const item=items.find(i=>i.id===id);
  if(!item) return;

  const jset=mastDrillSettings();
  const dots=(item.tally_dots||0)+1;
  item.tally_dots=dots;

  let _pulledNew=null;
  if(dots>=jset.intro_dots){
    item.status="active";
    const _gtier=jset.ladder[0]||"every_other_day";
    item.tier=_gtier;
    // Spread graduates across the tier's cycles instead of all landing on cycle 1, which
    // bunched every-other-day items onto the same drills and left alternate drills empty.
    const _giv=MAST_TIER_INT[_gtier];
    item.cycle=_giv?(items.filter(i=>i.tier===_gtier&&i.id!==item.id).length%_giv)+1:1;
    item.consecutive_correct=0;
    item.tally_dots=jset.intro_dots;

    // Auto-pull next curriculum item if enabled
    if(jset.auto_pull){
      const cat=item.subject;
      const introCount=items.filter(i=>i.subject===cat&&i.status==="introduction"&&i.id!==item.id).length;
      if(introCount<jset.max_intro_per_cat){
        const curriculum=mastFullBank()[cat]||[];
        const existingPrompts=new Set(items.filter(i=>i.subject===cat).map(i=>i.prompt));
        const next=curriculum.find(name=>!existingPrompts.has(name));
        if(next){
          const slug=next.toLowerCase().replace(/[^a-z0-9]/g,"_").substring(0,20);
          const _pfx=masteryKid.substring(0,3);
          const newItem={id:_pfx+"_"+slug,subject:cat,type:cat.toLowerCase(),prompt:next,answer:next,tier:"daily",review_mode:"flash",status:"introduction",drop_count:0,consecutive_correct:0,cycle:1,tally_dots:0};
          if((cat==="Animals"||cat==="Dinosaurs")&&MAST_ANIMAL_EMOJI[next]) newItem.emoji=MAST_ANIMAL_EMOJI[next];
          const _apVis=mastGetVisual(cat,next);
          if(_apVis){ if(typeof _apVis==="string") newItem.emoji=_apVis; else if(_apVis.imageUrl) newItem.imageUrl=_apVis.imageUrl; }
          items.push(newItem); _pulledNew=newItem;
        }
      }
    }
  }

  // Save to Firebase — update only THIS card (and any freshly auto-pulled card), not the
  // kid's whole list, so a second open tab/device can't revert it with stale data.
  masteryData[masteryKid]=items;
  if(db){
    const ix=items.indexOf(item);
    const upd={};
    if(ix>=0){
      upd[ix+"/tally_dots"]=item.tally_dots??0;
      upd[ix+"/status"]=item.status||"introduction";
      upd[ix+"/tier"]=item.tier||"daily";
      upd[ix+"/cycle"]=item.cycle||1;
      upd[ix+"/consecutive_correct"]=item.consecutive_correct||0;
    }
    if(_pulledNew){ const nix=items.indexOf(_pulledNew); if(nix>=0) upd[nix]=_pulledNew; }
    db.ref("mastery/"+masteryKid).update(upd);
  }
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  // Mark as handled for this session so we don't double-tap
  mastLogScores[id]="shown";
  // Advance slideshow — all intro items are in the slideshow
  if(item.status==="introduction"||!mastItemIsQuiz(masteryKid,item)) mastSlideIdx++;
  _mastRe();
}

function mastAddItems(){
  const isJ=!!MAST_BANK_MAP[masteryKid];
  let prompts=[];

  if(mastAddTab==="single"){
    const input=document.getElementById("mast-add-single");
    if(!input||!input.value.trim()) return;
    prompts=[input.value.trim()];
  } else {
    const textarea=document.getElementById("mast-add-batch");
    if(!textarea||!textarea.value.trim()) return;
    prompts=textarea.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  }

  if(!prompts.length) return;

  let items=masteryData[masteryKid];
  if(!items) items=[];
  if(!Array.isArray(items)) items=Object.values(items);

  const existingPrompts=new Set(items.map(i=>(i.prompt||"").toLowerCase()));
  let added=0, skipped=0;
  const newItems=[];

  prompts.forEach(p=>{
    if(existingPrompts.has(p.toLowerCase())){ skipped++; return; }

    const slug=p.toLowerCase().replace(/[^a-z0-9]/g,"_").substring(0,20);
    const prefix=masteryKid.substring(0,3);
    const id=prefix+"_"+slug;

    const typeObj=MAST_ITEM_TYPES.find(t=>t.id===mastAddType)||MAST_ITEM_TYPES[0];
    const subj=isJ?(mastAddCustomSubject||mastAddCat):(mastAddCustomSubject||mastAddSubject);
    const item={
      id:id,
      subject:subj,
      type:isJ?mastAddCat.toLowerCase():mastAddType,
      prompt:p,
      answer:p,
      tier:isJ&&mastAddStartMode==="ladder"?(mastDrillSettings().ladder[0]||"every_other_day"):"daily",
      review_mode:isJ?"flash":typeObj.mode,
      status:isJ&&mastAddStartMode==="learn"?"introduction":"active",
      drop_count:0,
      consecutive_correct:0,
      cycle:1,
      tally_dots:0
    };
    // Attach definition/rule + image for single-add
    if(mastAddTab==="single"&&prompts.length===1){
      const typeInfo=MAST_ITEM_TYPES.find(t=>t.id===mastAddType);
      if(typeInfo&&typeInfo.generated){
        const ruleInput=document.getElementById("mast-add-rule");
        if(ruleInput&&ruleInput.value.trim()){ item.generationRule=ruleInput.value.trim(); item.generated=true; item.problemCount=mastAddProbCount||1; }
      } else {
        const defInput=document.getElementById("mast-add-def");
        if(defInput&&defInput.value.trim()){ item.definition=defInput.value.trim(); item.answer=defInput.value.trim(); }
      }
      if(mastAddImageUrl) item.imageUrl=mastAddImageUrl;
    }
    items.push(item); newItems.push(item);
    existingPrompts.add(p.toLowerCase());
    added++;

    // Save flip definition if provided
    if(isJ&&mastAddTab==="single"&&prompts.length===1){
      const _aMode=mastAddItemMode||mastGetCatMode(masteryKid,mastAddCat);
      if(_aMode==="flip"){
        const defInput=document.getElementById("mast-add-def");
        if(defInput&&defInput.value.trim()){
          const s=masteryData[masteryKid+"_settings"]||{};
          if(!s.definitions) s.definitions={};
          s.definitions[p]=defInput.value.trim();
          masteryData[masteryKid+"_settings"]=s;
          if(db) db.ref("mastery/"+masteryKid+"_settings/definitions").set(s.definitions);
        }
      }
    }
  });

  if(!added){
    alert(skipped+" item(s) already exist, nothing added");
    return;
  }

  // If mode was changed from category default, update the category mode
  if(isJ&&mastAddItemMode&&mastAddItemMode!==mastGetCatMode(masteryKid,mastAddCat)){
    mastAdminCatMode(mastAddCat,mastAddItemMode);
  }

  // Assign cycles for new daily items
  const dailyCount=items.filter(i=>i.tier==="daily").length;
  items.filter(i=>i.tier==="daily").forEach((it,idx)=>{it.cycle=(idx%1)+1;});

  // Save to Firebase
  masteryData[masteryKid]=items;
  mastPutCards(masteryKid,items,newItems);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  mastAddMode=false;
  mastAddItemMode="";
  alert(added+" item(s) added"+(skipped?" ("+skipped+" duplicate(s) skipped)":""));
  const c=document.getElementById("content"); if(c) renderMastery(c);
}

function mastPrintDrill(){
  const pStudent=document.getElementById("mast-chk-student")?.checked;
  const pParent=document.getElementById("mast-chk-parent")?.checked;
  if(!pStudent&&!pParent){alert("Check at least one sheet");return;}

  const pn=mastGetPrintNum();
  const due=mastOrderedDue(pn);  // same frozen shuffle the on-screen log uses, so the paper and the log match exactly
  const dueW=due.filter(i=>i.review_mode==="written");
  const color=MAST_KID_COL[masteryKid];
  const label=SL_KLBL[masteryKid];
  const emoji=MAST_KID_EMOJI[masteryKid];
  const today=new Date();
  const dayN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
  const monN=["January","February","March","April","May","June","July","August","September","October","November","December"][today.getMonth()];
  const dateStr=monN+" "+today.getDate()+", "+today.getFullYear();
  const wkLabel=(weekData.week||WK).replace("week","Week ");

  let pages="";

  // Student sheet
  if(pStudent&&dueW.length){
    const twoCol=dueW.length>10;
    let rows="";
    if(twoCol){
      const half=Math.ceil(dueW.length/2);
      for(let i=0;i<half;i++){
        const li=i+1,ri=i+half+1;
        const right=ri<=dueW.length?'<td class="gap"></td><td class="num">'+ri+'.</td><td class="blank"></td>':'<td colspan="3"></td>';
        rows+='<tr><td class="num">'+li+'.</td><td class="blank"></td>'+right+'</tr>';
      }
      rows='<table class="mpp-table-2col">'+rows+'</table>';
    } else {
      for(let i=0;i<dueW.length;i++) rows+='<tr><td class="num">'+(i+1)+'.</td><td class="blank"></td></tr>';
      rows='<table class="mpp-table">'+rows+'</table>';
    }
    pages+='<div class="mpp-sheet"><div class="mpp-header" style="background:'+color+'"><div><div class="mpp-header-name">'+emoji+' '+label+'</div><div class="mpp-header-sub">Spelling &amp; Review</div></div>';
    pages+='<div class="mpp-header-right">'+wkLabel+'<br>'+dayN+', '+dateStr+'</div></div>';
    pages+='<div class="mpp-label" style="color:'+color+';border-color:'+color+'40">Write each word</div>'+rows+'</div>';
  }

  // Parent sheet
  if(pParent&&due.length){
    let rows="";
    due.forEach((it,i)=>{
      const isW=it.review_mode==="written";
      const tl=(MAST_TIER_LBL[it.tier]||it.tier).replace(/_/g," ");
      const icon=isW?"":"<td style=\"width:18px;text-align:center;font-size:0.72rem\">"+({recite:"\u{1F4E2}",oral:"\u{1F5E3}\u{FE0F}",flash:"\u{1F0CF}"}[it.review_mode]||"\u{1F5E3}\u{FE0F}")+"</td>";
      rows+='<tr><td class="td-box"><div class="mpp-score-box"></div></td><td class="td-num">'+(i+1)+'.</td>'+icon+'<td class="td-prompt">'+it.prompt+'</td><td class="td-tier"><span class="mpp-tier-pill">'+tl+'</span></td></tr>';
    });
    pages+='<div class="mpp-sheet"><div class="mpp-header" style="background:'+color+'"><div><div class="mpp-header-name">'+emoji+' '+label+'</div><div class="mpp-header-sub">Parent Drill Sheet</div></div>';
    pages+='<div class="mpp-header-right">'+wkLabel+'<br>'+dayN+', '+dateStr+'</div></div>';
    pages+='<div class="mpp-legend"><div class="mpp-legend-box"></div><span><b>\u{2713}</b> = correct &nbsp; <b>\u{2717}</b> = miss &nbsp; <b>~</b> = close</span></div>';
    pages+='<table class="mpp-ptable">'+rows+'</table></div>';
  }

  let container=document.getElementById("mast-print-container");
  if(!container){container=document.createElement("div");container.id="mast-print-container";container.className="mast-print-page";document.body.appendChild(container);}
  container.innerHTML=pages;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ container.innerHTML=""; },1000); },100);
}

function mastPrintCards(){
  let allItems=masteryData[masteryKid]||[];
  if(!Array.isArray(allItems)) allItems=Object.values(allItems);
  const introItems=allItems.filter(i=>i.status==="introduction");
  const ladderItems=allItems.filter(i=>i.status!=="introduction");

  const COLOR_MAP={Red:"#ef4444",Blue:"#3b82f6",Green:"#22c55e",Yellow:"#eab308",Orange:"#f97316",Purple:"#a855f7",Pink:"#ec4899",Brown:"#92400e",Black:"#1f2937",White:"#e5e7eb"};
  const SHAPE_MAP={Circle:'\u{25CF}',Square:'\u{25A0}',Triangle:'\u{25B2}'};
  const CAT_EMOJI=MAST_CAT_EMOJI_MAP[masteryKid]||{Letters:"\u{1F524}",Numbers:"\u{1F522}",Colors:"\u{1F3A8}",Shapes:"\u{1F537}",Animals:"\u{1F43E}"};
  const TIER_LBL={daily:"Daily",every_other_day:"Every Other Day",weekly:"Weekly",bi_weekly:"Bi-Weekly",monthly:"Monthly"};
  const kc=MAST_KID_COL[masteryKid]||"#c2410c";

  function jVis(it,sz){
    if(it.imageUrl) return '<img src="'+it.imageUrl+'" style="width:'+sz+'px;height:'+sz+'px;object-fit:contain;border-radius:4px">';
    if(it.emoji) return '<span style="font-size:'+sz+'px">'+it.emoji+'</span>';
    if(MAST_ANIMAL_EMOJI[it.prompt]) return '<span style="font-size:'+sz+'px">'+MAST_ANIMAL_EMOJI[it.prompt]+'</span>';
    const cat=it.subject||"";
    if(cat==="Colors"&&COLOR_MAP[it.prompt]){const s=Math.round(sz*0.85);return '<div style="width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+COLOR_MAP[it.prompt]+';border:1.5px solid rgba(0,0,0,0.1);display:inline-block"></div>';}
    if(cat==="Shapes"&&SHAPE_MAP[it.prompt]) return '<span style="font-size:'+sz+'px;color:'+kc+'">'+SHAPE_MAP[it.prompt]+'</span>';
    if(cat==="Counting"){ const cn=mastCountN(it); let cd=''; for(let i=0;i<cn;i++) cd+='<span style="font-size:'+Math.round(sz*0.5)+'px;line-height:1">\u{1F995}</span>'; return '<span style="display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:'+(sz*3)+'px">'+cd+'</span>'; }

  // Introduction cards grouped by category
  const introByCat={};
  introItems.forEach(i=>{const c=i.subject||"Other";if(!introByCat[c])introByCat[c]=[];introByCat[c].push(i);});
  let introHTML="";
  Object.entries(introByCat).forEach(([cat,items])=>{
    let cards="";
    items.forEach(i=>{
      const tally=i.tally_dots||0;

      cards+='<div style="display:flex;gap:2px;align-items:center">'+dots+'<span style="font-size:8px;margin-left:1px">\u{2B50}</span></div>';
      cards+='</div>';

  });

  page+='<div style="padding:8px 10px;flex:1;display:flex;flex-direction:column">'+ladderHTML;
  page+='<div style="margin-top:auto;border-top:1.5px dashed #fed7aa;padding-top:6px">';
  page+='<div style="font-family:monospace;font-size:6.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;background:#16a34a;color:white;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact">\u{1F389} Graduated!</div>';
  page+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">';
  page+='<div style="border:1.5px solid #fed7aa;border-radius:20px;padding:2px 8px;font-size:8px;font-weight:600;color:'+kc+'">\u{2B50} ________</div>';

// ── DISPLACEMENT ENGINE ──────────────────────────────────────────
let displacedResult=null; // {tasks:[], carryOver:[]}
let lastAudit=[]; // auditSchedule() violations for the live schedule ([] = all clear)
function getActiveTasks(){ return displacedResult?displacedResult.tasks:weekData.tasks; }

function taskDevice(t){
  const d=(t.detail||"").toLowerCase();
  if(d.includes("computer")) return "computer";
  if(d.includes("ipad")) return "ipad";
  if(d.includes("phone")) return "phone";
  return "paper";
}
function taskSubject(t){
  const m=(t.title||"").match(/^.{1,2}\s*(.+?)\s*[—–]/);
  return m?m[1].trim():(t.title||"").replace(/^.{1,2}\s*/,"");
}
function fromMin(m){
  let h=Math.floor(m/60), mn=m%60;
  const ap=h>=12?"PM":"AM";
  if(h===0) h=12; else if(h>12) h-=12;
  return h+":"+String(mn).padStart(2,"0")+" "+ap;
}
function taskTier(t){
  if(taskDevice(t)==="computer"||taskDevice(t)==="ipad"||taskDevice(t)==="phone") return "computer";
  if(t.mom==="required") return "required";
  if(t.mom==="maybe") return "maybe";
  return "independent";
}

// AUDIT_START (node-harness extraction boundary)
// Real validator behind the Rules "Audit Checklist" card. Derives its checks from the
// live Rules (overlap set, max-per-day, school-day lunch, calendar off-days) for a set
// of scheduled tasks and returns a list of violations — [] means all clear. Replaces the
// old hardcoded-subject checklist; runs after every displacement (see runDisplacement).
function auditSchedule(tasks){
  if(!tasks||!tasks.length) return [];
  const r=rulesData||{}, ovc=r.overlap||{}, mp=r.maxPerDay||{}, sd=r.schoolDay||{}, sdOv=sd.overrides||{};
  const nv=fbArr(ovc.never_simultaneous);
  const neverSet=new Set((nv&&nv.length)?nv:["mom_required","computer","ipad"]);
  const v=[];
  const lane=t=>{ const dv=t.device||taskDevice(t); return (dv==="ipad"&&t.who==="lucy")?"ipadLucy":dv; };
  const dateOf=d=>{
    let lbl=DAY_DT[d];
    if(!lbl&&d==="saturday"&&DAY_DT.friday){ const f=new Date(DAY_DT.friday+", "+new Date().getFullYear()); f.setDate(f.getDate()+1); return f.getFullYear()+"-"+String(f.getMonth()+1).padStart(2,"0")+"-"+String(f.getDate()).padStart(2,"0"); }
    if(!lbl) return null;
    const dt=new Date(lbl+", "+new Date().getFullYear());
    return isNaN(dt.getTime())?null:dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  };
  const byDay={};
  tasks.forEach(t=>{ if(!t||!t.day||t.day==="carryover") return; if(String(t.id||"").endsWith("_c")) return; (byDay[t.day]=byDay[t.day]||[]).push(t); });
  for(const day in byDay){
    const o=sdOv[day]||{};
    const ls=toMin(o.lunchStart||sd.lunchStart||"1:00 PM"), le=toMin(o.lunchEnd||sd.lunchEnd||"2:00 PM");
    const lbl=DAY_LBL[day]||day;
    const ts=byDay[day].map(t=>({t,s:toMin(t.time),e:toMin(t.time)+(t.dur||20)}));
    const ds=dateOf(day);
    ts.forEach(x=>{
      if(le>ls&&x.s<le&&x.e>ls) v.push(lbl+": "+cap(x.t.who)+" — "+taskSubject(x.t)+" runs through lunch");
      if(ds){ const off=smapIsKidOff(x.t.who,ds); if(off) v.push(lbl+": "+cap(x.t.who)+" scheduled on "+off); }
    });
    for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){
      const a=ts[i],b=ts[j]; if(!(a.s<b.e&&b.s<a.e)) continue;
      if(a.t.who===b.t.who){ v.push(lbl+": "+cap(a.t.who)+" double-booked at "+a.t.time); continue; }
      if(neverSet.has("computer")&&lane(a.t)==="computer"&&lane(b.t)==="computer") v.push(lbl+": two computer tasks at once");
      if(neverSet.has("ipad")&&lane(a.t)==="ipad"&&lane(b.t)==="ipad") v.push(lbl+": two iPad tasks at once");
      if(neverSet.has("mom_required")&&a.t.mom==="required"&&b.t.mom==="required") v.push(lbl+": two Mom-Required at once");
    }
    const cnt={};
    ts.forEach(x=>{ const k=taskSubject(x.t)+"|"+x.t.who; cnt[k]=(cnt[k]||0)+1; });
    for(const k in cnt){ const subj=k.split("|")[0], cfg=mp[subj]; if(!cfg) continue;
      const cap2=(day==="saturday"&&cfg.saturday_max!=null)?cfg.saturday_max:cfg.max;
      if(cap2!=null&&cnt[k]>cap2) v.push(lbl+": "+subj+" over max-per-day ("+cnt[k]+" > "+cap2+")");
    }
  }
  return [...new Set(v)];
}
// AUDIT_END

// RUNDISP_START (node-harness extraction boundary)
function runDisplacement(){
  const bos=Object.values(blockouts);
  if(!bos.length||!weekData.tasks.length){ displacedResult=null; return; }
  if(!rulesData||!rulesData.workflow){ displacedResult=null; return; }
  const r=rulesData;
  const sd=r.schoolDay||{};
  const sdOv=sd.overrides||{};
  const mp=r.maxPerDay||{};
  const wf=r.workflow||{};
  const dayOrder=["monday","tuesday","wednesday","thursday","friday","saturday"];
  const tasks=JSON.parse(JSON.stringify(weekData.tasks));
  const carryOver=[];

  // ── Helpers ──
  function maxFor(subj){return(mp[subj]&&mp[subj].max!=null)?mp[subj].max:999;}
  function _dayStart(d){var ov=sdOv[d];return toMin((ov&&ov.start)||sd.defaultStart||"10:00 AM");}
  function _dayEnd(d){var ov=sdOv[d];return toMin((ov&&ov.end)||sd.defaultEnd||"4:15 PM");}
  function _dayLS(d){var ov=sdOv[d];return toMin((ov&&ov.lunchStart)||sd.lunchStart||"1:00 PM");}
  function _dayLE(d){var ov=sdOv[d];return toMin((ov&&ov.lunchEnd)||sd.lunchEnd||"2:00 PM");}
  // Never re-time TODAY's work into an elapsed slot: when the day being packed is
  // today, start no earlier than the current clock time. A blockout added at 5pm
  // then pushes leftover work to a later day instead of dropping it at 2pm.
  // (_dispNowMin lets the node harness pin "now"; the app reads the real clock.)
  function _nowMin(){ return (typeof _dispNowMin==="number")?_dispNowMin:(new Date().getHours()*60+new Date().getMinutes()); }
  function _floorStart(d,s){ return d===_todayDay?Math.max(s,_nowMin()):s; }
  function _isNotebook(t){return(t.title||"").includes("Notebook");}
  function _isMorningNb(t){return(t.title||"").includes("Morning Notebook");}
  function _isClosingNb(t){return(t.title||"").includes("Closing Notebook");}

  // Workflow-order sort weight for a task (lower = earlier)
  // d=day override, opts.momBack=true forces normal workflow (mom is home)
  function _wfWeight(t,d,opts){
    if(_isClosingNb(t)) return 1000;
    if(_isMorningNb(t)) return -1;
    const kidWf=wf[t.who];
    if(!kidWf) return 0;
    const useSitter=!(opts&&opts.momBack)&&!!(weekData.babysitter&&weekData.babysitter.days&&weekData.babysitter.days.indexOf(d||t.day)>=0);
    const steps=(useSitter?kidWf.babysitter:kidWf.normal)||kidWf.normal||[];
    const tier=taskTier(t);
    const subj=taskSubject(t).toLowerCase();
    const cs=currData&&currData.subjects&&currData.subjects[t.who];
    if(cs){for(const sk in cs){if((cs[sk].rules||"").includes("first")){var lbl=(cs[sk].label||sk.replace(/_/g," ")).toLowerCase();if((t.title||"").toLowerCase().includes(lbl)) return -1;}}}
    // Subject-name match across ALL steps first (workflow assigns subjects
    // regardless of device tier — e.g. Reading Eggspress is "independent")
    for(let i=0;i<steps.length;i++){
      const subs=steps[i].subjects||[];
      for(let j=0;j<subs.length;j++){ if(subj.includes(subs[j].toLowerCase())) return i*10+j; }
    }
    // Fallback: match by tier if no subject matched
    for(let i=0;i<steps.length;i++){ if(steps[i].tier===tier) return i*10+9; }
    return 500;
  }

  // Is this task's subject marked "sequential" in the curriculum? (matched by display name)
  function _isSeqSubject(t){
    if(!currData||!currData.subjects) return false;
    var subs=currData.subjects[t.who]||{};
    var subjL=taskSubject(t).toLowerCase();
    for(var sk in subs){
      var s=subs[sk];
      if(!s||s.paused) continue;
      if(((s.display||sk).trim().toLowerCase())===subjL) return (s.rules||"").includes("sequential");
    }
    return false;
  }

  // Sticky config for a task via curriculum: partner display name + before/after, or null
  function _stickyCfg(t){
    if(!currData||!currData.subjects) return null;
    var subs=currData.subjects[t.who]||{};
    var subjL=taskSubject(t).toLowerCase();
    for(var sk in subs){
      var s=subs[sk];
      if(!s||s.paused) continue;
      if(((s.display||sk).trim().toLowerCase())!==subjL) continue;
      if(!(s.rules||"").includes("sticky")||!s.stickyWith||s.stickyWith===sk) return null;
      var p=subs[s.stickyWith];
      return {partner:(((p&&p.display)||s.stickyWith).trim().toLowerCase()),order:s.stickyOrder||"after"};
    }
    return null;
  }
  // Re-order an array in place so sticky tasks sit immediately before/after
  // their partner (same kid). Tasks whose partner isn't present stay put.
  function _applySticky(arr){
    arr.slice().forEach(function(t){
      var cfg=_stickyCfg(t);
      if(!cfg) return;
      var partner=null;
      for(var j=0;j<arr.length;j++){
        if(arr[j]!==t&&arr[j].who===t.who&&taskSubject(arr[j]).toLowerCase()===cfg.partner){partner=arr[j];break;}
      }
      if(!partner) return;
      var ti=arr.indexOf(t);
      if(ti<0) return;
      arr.splice(ti,1);
      var pi=arr.indexOf(partner);
      arr.splice(cfg.order==="before"?pi:pi+1,0,t);
    });
    return arr;
  }

  // Check if kid is a withSitter kid
  const _sitterKids=(weekData.babysitter&&weekData.babysitter.withSitter)||(r.withSitter)||[];

  // Latest blockout end for a kid on a day (timed only)
  function _boEnd(d,who){
    let latest=0;
    bos.forEach(function(bo){
      if(bo.day!==d||bo.type==="fullDay") return;
      if((bo.kids||[]).indexOf(who)<0) return;
      var e=toMin(bo.end||"");
      if(e>latest) latest=e;
    });
    return latest;
  }
  // Is there a fullDay blockout for kid on day?
  function _fullDay(d,who){
    var fd=false;
    bos.forEach(function(bo){if(bo.day===d&&bo.type==="fullDay"&&(bo.kids||[]).indexOf(who)>=0)fd=true;});
    return fd;
  }
  // Mom return time on a day (from babysitter data)
  function _momReturn(d){
    var mag=weekData.babysitter||{};
    if(!mag.days||mag.days.indexOf(d)<0) return 0;
    return toMin(mag["mom_return_"+d]||mag.mom_return||"2:00 PM");
  }

  // "Checked before the blockout started" — ahead-of-schedule tasks keep their
  // original slot; tasks checked after the blockout began were done in their
  // displaced slot and must stay displaced (otherwise they snap back into the
  // blockout window and the freed slot pulls another task into the day).
  function _chkStamp(id){
    var ts=checked&&checked[id];
    if(typeof ts!=="string") return null;
    var m=ts.match(/(\d{1,2}):(\d{2})\s*(AM|PM)\s+([A-Za-z]{3,})\s+(\d{1,2})/i);
    if(!m) return null;
    var h=parseInt(m[1])%12; if(/pm/i.test(m[3])) h+=12;
    return {mon:m[4].slice(0,3).toLowerCase(),day:parseInt(m[5]),min:h*60+parseInt(m[2])};
  }
  var _MONIDX={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  function _boDayLabel(dayName){
    var lbl=(typeof DAY_DT==="object"&&DAY_DT&&DAY_DT[dayName])||"";
    if(!lbl&&dayName==="saturday"&&DAY_DT&&DAY_DT.friday){
      var fd=new Date(DAY_DT.friday+", "+new Date().getFullYear());
      fd.setDate(fd.getDate()+1);
      lbl=fd.toLocaleDateString("en-US",{month:"long",day:"numeric"});
    }
    return lbl;
  }
  function _mdm(d){ return {mon:d.getMonth(),day:d.getDate(),min:d.getHours()*60+d.getMinutes()}; }
  function _mdmCmp(a,b){ return (a.mon-b.mon)||(a.day-b.day)||(a.min-b.min); }
  function _checkedBeforeBlockout(t,bo){
    if(!(checked&&checked[t.id])) return false;   // not checked — displacement rules apply
    var chk=_chkStamp(t.id);
    if(!chk) return true;                          // undatable check — conservative: stays
    var chkT={mon:_MONIDX[chk.mon],day:chk.day,min:chk.min};
    if(chkT.mon==null) return true;
    // The blockout takes effect at the LATER of its window start (on its day)
    // and the moment it was entered into the app. Tasks checked before that
    // moment were done at their original slots (ahead of schedule, or before
    // mom added the blockout) and keep them; tasks checked after were done in
    // their displaced slots and stay displaced.
    var lbl=_boDayLabel(bo.day);
    var p=lbl.match(/([A-Za-z]+)\s+(\d{1,2})/);
    if(!p) return true;
    var bm=_MONIDX[p[1].slice(0,3).toLowerCase()];
    if(bm==null) return true;
    var eff={mon:bm,day:parseInt(p[2]),min:(bo.type==="fullDay")?0:toMin(bo.start||"")};
    if(bo.created){
      var cT=_mdm(new Date(bo.created));
      if(_mdmCmp(cT,eff)>0) eff=cT;
    }
    return _mdmCmp(chkT,eff)<0;
  }

  // ── Phase 0: Identify displaced tasks ──
  const displacedIds=new Set();
  bos.forEach(function(bo){
    var kids=bo.kids||[];
    tasks.forEach(function(t){
      if(t.day!==bo.day||kids.indexOf(t.who)<0) return;
      if(_checkedBeforeBlockout(t,bo)) return; // done ahead of schedule — keeps its original slot
      if(bo.type==="fullDay"){ displacedIds.add(t.id); return; }
      var tMin=toMin(t.time), bS=toMin(bo.start||""), bE=toMin(bo.end||"");
      if(bS&&bE&&tMin>=bS&&tMin<bE) displacedIds.add(t.id);
    });
  });
  if(!displacedIds.size){ displacedResult=null; return; }

  var displacedTasks=tasks.filter(function(t){return displacedIds.has(t.id);});
  var keptTasks=tasks.filter(function(t){return !displacedIds.has(t.id);});
  var working=keptTasks.slice();

  // ── Phase 1: Rebuild blockout day — all tasks re-timed in workflow order ──
  var byDay={};
  displacedTasks.forEach(function(dt){ if(!byDay[dt.day]) byDay[dt.day]=[]; byDay[dt.day].push(dt); });
  var needsCrossDay=[];

  Object.keys(byDay).forEach(function(d){
    // Full-day blockout — everything goes cross-day
    var anyFullDay=false;
    bos.forEach(function(bo){if(bo.day===d&&bo.type==="fullDay") anyFullDay=true;});
    if(anyFullDay){
      byDay[d].forEach(function(dt){ needsCrossDay.push(dt); });
      return;
    }

    var dEnd=_dayEnd(d), dLunchS=_dayLS(d), dLunchE=_dayLE(d);
    var momRet=_momReturn(d);

    // Pull kept tasks OFF working — we'll rebuild the whole day
    var keptOnDay=[];
    working=working.filter(function(t){
      if(t.day===d){ keptOnDay.push(t); return false; }
      return true;
    });

    // Combine kept + displaced, group by kid
    var allOnDay=keptOnDay.concat(byDay[d]);
    var kids={};
    allOnDay.forEach(function(t){ if(!kids[t.who]) kids[t.who]=[]; kids[t.who].push(t); });

    Object.keys(kids).forEach(function(who){
      // Checked tasks keep their time unless they were displaced (checked after the
      // blockout started) — those rebuild with the rest so they hold the slot they
      // were actually done in, and checking one doesn't pull a new task into the day.
      kids[who]=kids[who].filter(function(t){
        if(checked&&checked[t.id]&&!displacedIds.has(t.id)){ working.push(t); return false; }
        return true;
      });
      if(!kids[who].length) return;
      var boE=_boEnd(d,who);
      if(!boE){ // no timed blockout for this kid — keep original times
        kids[who].forEach(function(t){ working.push(t); });
        return;
      }
      // If blockout ends after mom returns, use normal workflow (mom is home)
      var momIsBack=momRet>0&&boE>=momRet;
      var wfOpts=momIsBack?{momBack:true}:null;
      kids[who].sort(function(a,b){ return _wfWeight(a,d,wfOpts)-_wfWeight(b,d,wfOpts); });
      _applySticky(kids[who]);

      var cursorStart=boE;
      // withSitter or mom-required: start at mom return
      if(_sitterKids.indexOf(who)>=0&&momRet>cursorStart) cursorStart=momRet;

      // maxPerDay selection (timing handled by packAround below). Excess displaced
      // tasks go cross-day; excess kept tasks stay as-is (matches prior behavior).
      var toPlace=[];
      kids[who].forEach(function(t){
        if(!(checked&&checked[t.id])){
          var subj=taskSubject(t), mx=maxFor(subj);
          if(mx<999){
            var ct=0;
            working.forEach(function(w){if(w.day===d&&taskSubject(w)===subj&&w.who===who)ct++;});
            toPlace.forEach(function(w){if(taskSubject(w)===subj)ct++;});
            if(ct>=mx){ if(displacedIds.has(t.id)){needsCrossDay.push(t);}else{working.push(t);} return; }
          }
        }
        toPlace.push(t);
      });
      if(!toPlace.length) return;
      function _markDisp(t){ if(displacedIds.has(t.id)){ t._displaced=true; t._originalDay=t._originalDay||d; } }
      var _ctx={start:_dayStart(d),end:dEnd,lunchStart:dLunchS,lunchEnd:dLunchE,momStart:momRet,kidStart:{},overtimeMax:240};
      _ctx.kidStart[who]=cursorStart;

      // Live (unchecked) tasks pack from the blockout end; anything past day-end goes cross-day.
      // On TODAY, also floor at "now" so leftover work can't land in an already-elapsed slot.
      var live=toPlace.filter(function(t){return !(checked&&checked[t.id]);});
      var over=packAround(working.filter(function(t){return t.day===d;}),live,Object.assign({},_ctx,{allowOvertime:false,start:_floorStart(d,_ctx.start)}));
      var overSet=new Set(over);
      live.forEach(function(t){
        if(overSet.has(t)){ t._displaced=true; t._originalDay=t._originalDay||d; needsCrossDay.push(t); }
        else { _markDisp(t); working.push(t); }
      });

      // Done tasks never leave their own day — stack past day-end (overtime) around the rest.
      var done=toPlace.filter(function(t){return checked&&checked[t.id];});
      if(done.length){
        packAround(working.filter(function(t){return t.day===d;}),done,Object.assign({},_ctx,{allowOvertime:true}));
        done.forEach(function(t){ _markDisp(t); working.push(t); });
      }
    });
  });

  // ── Phase 2: Distribute bumped work across the REMAINING days by capacity ──
  // Fill every day still ahead (today after "now" → Saturday) in turn, packing each
  // around what's already there and spilling overflow to the next day; Saturday
  // (overtime) then carry-over are the last resorts. Replaces the old greedy "drop on
  // the first allowed day" placement, which piled everything onto day+1 and let the
  // rest fall to carry-over while mid-week afternoons sat empty.
  // relaxMax: Saturday is the catch-up day — a sequential subject may double up there
  // (the Phase 4 re-sequencer keeps the lesson numbers in order).
  // Resolve a weekday name to its calendar date (YYYY-MM-DD) for off-day checks.
  function _dateOfDay(d){
    var lbl=DAY_DT[d];
    if(!lbl&&d==="saturday"&&DAY_DT.friday){
      var fd=new Date(DAY_DT.friday+", "+new Date().getFullYear()); fd.setDate(fd.getDate()+1);
      return fd.getFullYear()+"-"+String(fd.getMonth()+1).padStart(2,"0")+"-"+String(fd.getDate()).padStart(2,"0");
    }
    if(!lbl) return null;
    var dt=new Date(lbl+", "+new Date().getFullYear());
    if(isNaN(dt.getTime())) return null;
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  }
  // Rules-eligibility of a task on a day (off / full-day / calendar; babysitter — mom-
  // required & sitter kids can't work then; maxPerDay via the running per-(kid|subject)
  // count `pend` PLUS what's already on the day). Saturday relaxes max for sequential.
  function _eligibleOn(t,d,pend){
    if(_fullDay(d,t.who)) return false;
    var _ds=_dateOfDay(d);
    if(_ds&&smapIsKidOff(t.who,_ds)) return false; // calendar holiday/vacation/kid-off
    var bab=null;bos.forEach(function(bo){if(bo.day===d&&bo.type==="babysitter")bab=bo;});
    if(bab&&(bab.kids||[]).indexOf(t.who)>=0){ if(t.mom==="required")return false; if(_sitterKids.indexOf(t.who)>=0)return false; }
    var subj=taskSubject(t),mx=maxFor(subj),relax=(d==="saturday")&&_isSeqSubject(t);
    if(mx<999&&!relax){
      var ct=(pend[t.who+"|"+subj]||0);
      working.forEach(function(w){if(w.day===d&&taskSubject(w)===subj&&w.who===t.who)ct++;});
      if(ct>=mx) return false;
    }
    return true;
  }
  // Keep the Closing Notebook the LAST thing in a kid's day: after bumped work lands,
  // push their closing to just after their last other task so nothing sits after it.
  function _closingLast(d,who){
    var mine=working.filter(function(t){return t.day===d&&t.who===who;});
    var closing=mine.filter(_isClosingNb), others=mine.filter(function(t){return !_isClosingNb(t);});
    if(!closing.length||!others.length) return;
    var lastEnd=0; others.forEach(function(t){ var e=toMin(t.time)+(t.dur||20); if(e>lastEnd)lastEnd=e; });
    closing.forEach(function(c){ c.time=fromMin(lastEnd); });
  }

  // Bumped CLASSES cascade across the open days (workflow order, sticky pairs adjacent);
  // bumped NOTEBOOKS belong to their own day and don't travel — they go home (below).
  var carry=needsCrossDay.filter(function(t){return !_isNotebook(t);});
  carry.sort(function(a,b){ return _wfWeight(a)-_wfWeight(b); });
  _applySticky(carry);
  var noteHome=needsCrossDay.filter(_isNotebook);
  var _ti=dayOrder.indexOf(_todayDay); if(_ti<0) _ti=0;

  // Fill one remaining day with the bumped classes that fit, packed AROUND the day's
  // existing work — but NOT its closing notebook, which is pushed to the very end after,
  // so bumped work always lands before the wrap-up. Day start is floored to "now" when
  // the day is today; overflow stays in carry for the next day.
  function _fillDay(d){
    if(!carry.length) return;
    var pend={};
    var take=carry.filter(function(t){
      if(!_eligibleOn(t,d,pend)) return false;
      var k=t.who+"|"+taskSubject(t); pend[k]=(pend[k]||0)+1; return true;
    });
    if(!take.length) return;
    take.sort(function(a,b){ return _wfWeight(a,d)-_wfWeight(b,d); });
    _applySticky(take);
    var momRet=_momReturn(d), ks={};
    take.forEach(function(t){ var s=_boEnd(d,t.who); if(_sitterKids.indexOf(t.who)>=0&&momRet>s)s=momRet; if(s)ks[t.who]=s; });
    var existing=working.filter(function(t){return t.day===d&&!_isClosingNb(t);});
    var overflow=packAround(existing,take,{start:_floorStart(d,_dayStart(d)),end:_dayEnd(d),
      lunchStart:_dayLS(d),lunchEnd:_dayLE(d),momStart:momRet,kidStart:ks,
      allowOvertime:(d==="saturday"),overtimeMax:180});
    var overSet=new Set(overflow), moved={};
    take.forEach(function(t){
      if(overSet.has(t)) return; // didn't fit → leave in carry for the next day
      t._displaced=true; t._originalDay=t._originalDay||t.day; t.day=d; working.push(t); moved[t.who]=1;
      var ci=carry.indexOf(t); if(ci>=0) carry.splice(ci,1);
    });
    Object.keys(moved).forEach(function(who){ _closingLast(d,who); });
  }
  // Today (floored to "now") through Friday in order, then Saturday with overtime.
  dayOrder.slice(_ti).forEach(function(d){ if(d!=="saturday") _fillDay(d); });
  _fillDay("saturday");

  // Notebooks return to their own day (a blocked day still keeps its own Morning-first /
  // Closing-last bookends — they never travel to another day and double up).
  noteHome.forEach(function(t){
    var home=t._originalDay||t.day; t._displaced=true; t._originalDay=home; t.day=home;
    if(_isMorningNb(t)){ var st=Math.max(_floorStart(home,_dayStart(home)),_boEnd(home,t.who)); t.time=fromMin(st); }
    working.push(t);
  });
  noteHome.forEach(function(t){ if(_isClosingNb(t)) _closingLast(t.day,t.who); });

  // Still unplaced after the whole remaining week → carry-over (never silently dropped).
  carry.forEach(function(t){ t._displaced=true; t._originalDay=t._originalDay||t.day; t._carryOver=true; carryOver.push(t); });

  // ── Re-time a day's displaced tasks through the shared packer (packDay) ──
  // Duration-aware, all kids in parallel (one Mom / one computer / one shared iPad,
  // Lucy on her own iPad), nothing during lunch, fitting AROUND any already-fixed
  // (checked / earlier-placed) work on that day. allowOvertime stacks up to 3h past
  // the day's end (Saturday catch-up) before a task is returned as overflow.
  // Shared by blockout receiving-days, the Saturday re-time, and manual "+Saturday".
  // PACKSAT_START (node-harness extraction boundary)
  function _packFit(day,newTasks,allowOvertime){
    if(!newTasks.length) return [];
    var newSet=new Set(newTasks);
    var existing=working.filter(function(t){return t.day===day&&!newSet.has(t);});
    return packAround(existing,newTasks,{start:_floorStart(day,_dayStart(day)),end:_dayEnd(day),
      lunchStart:_dayLS(day),lunchEnd:_dayLE(day),allowOvertime:allowOvertime,overtimeMax:180});
  }
  // PACKSAT_END
  // (Saturday is filled in chronological turn by the remaining-days cascade above.)

  // ── Phase 3.6: Re-apply persisted "+ Saturday" choices from the carry-over alert ──
  var msat=coManualSat[WK]||{};
  if(Object.keys(msat).length&&carryOver.length){
    var _manualSat=[];
    for(var ci=carryOver.length-1;ci>=0;ci--){
      var co2=carryOver[ci];
      if(!msat[co2.id]) continue;
      carryOver.splice(ci,1);
      co2._carryOver=false; co2._displaced=true; co2._originalDay=co2._originalDay||co2.day; co2.day="saturday";
      working.push(co2);
      _manualSat.push(co2);
    }
    // Pack mom's forced picks around what's already on Saturday; if they still won't fit
    // in 3h overtime they go back to carry-over (never silently dropped).
    _packFit("saturday",_manualSat,true).forEach(function(dt){
      dt._carryOver=true; var idx=working.indexOf(dt); if(idx>=0) working.splice(idx,1); carryOver.push(dt);
    });
  }

  // ── Phase 4: Re-sequence "sequential" subjects so lessons stay in day order ──
  if(currData&&currData.subjects){
    var _dOrd={monday:0,tuesday:1,wednesday:2,thursday:3,friday:4,saturday:5};
    var allPool=working.concat(carryOver);
    for(var kid in currData.subjects){
      var subs=currData.subjects[kid];
      for(var sk in subs){
        var s=subs[sk];
        if(!s||s.paused) continue;
        if(!(s.rules||"").includes("sequential")) continue;
        if(s.tracking==="daily") continue;
        var disp=(s.display||sk).trim().toLowerCase();
        var matched=allPool.filter(function(t){
          if(t.who!==kid) return false;
          if(checked&&checked[t.id]) return false;
          return taskSubject(t).toLowerCase()===disp;
        });
        if(matched.length<2) continue;
        var seq=buildSubjectLessons(kid,sk);
        // Build multi-map for duplicate labels (e.g. "Bridge" appears multiple times)
        var seqPosAll={};
        seq.forEach(function(e,i){
          var lbl=e.lesson.trim();
          if(!seqPosAll[lbl]) seqPosAll[lbl]=[];
          seqPosAll[lbl].push(i);
        });
        var labels=matched.map(function(t){var m=(t.title||"").match(/[—–]\s*(.+)$/);return m?m[1].trim():"";});
        // For duplicate labels, pick the occurrence closest to unique neighbors
        var uniquePositions=labels.filter(function(l){return seqPosAll[l]&&seqPosAll[l].length===1;})
          .map(function(l){return seqPosAll[l][0];});
        var median=uniquePositions.length?uniquePositions.sort(function(a,b){return a-b;})[Math.floor(uniquePositions.length/2)]:0;
        var seqPos={};
        for(var lbl in seqPosAll){
          if(seqPosAll[lbl].length===1){ seqPos[lbl]=seqPosAll[lbl][0]; }
          else {
            // Pick the occurrence closest to the median of unique neighbors
            var best=seqPosAll[lbl][0];
            seqPosAll[lbl].forEach(function(p){ if(Math.abs(p-median)<Math.abs(best-median)) best=p; });
            seqPos[lbl]=best;
          }
        }
        var sorted=labels.slice().sort(function(a,b){
          var ia=seqPos[a]!==undefined?seqPos[a]:999999;
          var ib=seqPos[b]!==undefined?seqPos[b]:999999;
          if(ia!==ib) return ia-ib;
          return a.localeCompare(b);
        });
        matched.sort(function(a,b){
          var da=a._carryOver?7:(_dOrd[a.day]!=null?_dOrd[a.day]:6);
          var db=b._carryOver?7:(_dOrd[b.day]!=null?_dOrd[b.day]:6);
          if(da!==db) return da-db;
          return toMin(a.time)-toMin(b.time);
        });
        for(var i=0;i<matched.length;i++){
          if(!sorted[i]) continue;
          var old=(matched[i].title||"").match(/[—–]\s*(.+)$/);
          if(old&&old[1].trim()!==sorted[i]){
            matched[i].title=matched[i].title.replace(/\s*[—–]\s*.+$/," — "+sorted[i]);
          }
        }
      }
    }
  }

  displacedResult={tasks:working,carryOver};

  // ── Audit the live schedule + verify nothing was silently dropped ──
  // Non-essential: a bug in the audit must NEVER break scheduling, so guard it.
  try{
    lastAudit=auditSchedule(working);
    var seen={}; working.forEach(function(t){seen[t.id]=1;}); carryOver.forEach(function(t){seen[t.id]=1;});
    var nd=(rulesData&&rulesData.nothingDropsOff)||{}, exMap=nd.exception||{};
    var _canDrop=function(t){ var subj=(taskSubject(t)||"").toLowerCase(); for(var k in exMap){ if(exMap[k]&&exMap[k].can_drop&&subj.indexOf(k.toLowerCase())>=0) return true; } return false; };
    tasks.forEach(function(t){
      if(String(t.id).endsWith("_c")||(checked&&checked[t.id])) return;
      if(!seen[t.id]&&!_canDrop(t)) lastAudit.push((DAY_LBL[t.day]||t.day||"?")+": "+cap(t.who)+" — "+taskSubject(t)+" was dropped (not placed or carried over)");
    });
  }catch(e){ lastAudit=[]; dbg&&dbg("auditSchedule error: "+e.message); }
}
// RUNDISP_END

function removeConstraint(day){
  if(!db||!adminPinUnlocked) return;
  // Remove constraint and revert window to default for this day
  delete CONSTRAINT[day];
  if(WIN[day]) delete WIN[day];
  // Patch Firebase meta — null removes the child key
  const patch={};
  patch["constraints/"+day]=null;

  resortDayTasks(day);

function resortDayTasks(day,startOverride,momOverride){
  if(!weekData||!weekData.tasks) return;
  const r=rulesData||{};
  const sd=r.schoolDay||{};
  const sdOv=(sd.overrides||{})[day]||{};
  const schoolStart=startOverride!=null?startOverride:toMin(sdOv.start||sd.defaultStart||"10:00 AM");
  const momAvail=momOverride!=null?momOverride:schoolStart;
  const schoolEnd=toMin(sdOv.end||sd.defaultEnd||"4:15 PM");
  const lunchS=toMin(sdOv.lunchStart||sd.lunchStart||"1:00 PM");
  const lunchE=toMin(sdOv.lunchEnd||sd.lunchEnd||"2:00 PM");
  // ALL tasks for this day (checked or not), in current time order — re-sort the whole day.
  const dayTasks=weekData.tasks.filter(t=>t.day===day&&!t.id.endsWith("_c"));
  if(!dayTasks.length) return;
  dayTasks.sort((a,b)=>toMin(a.time)-toMin(b.time));
  // Re-time through the shared packer (packAround): duration-aware, all kids parallel,
  // device by stamped t.device (legacy fallback taskDevice), Mom may start later
  // (babysitter window). Overtime keeps everything on the day instead of overlapping.
  const before={}; dayTasks.forEach(t=>{ before[t.id]=t.time; });
  packAround([],dayTasks,{start:schoolStart,end:schoolEnd,lunchStart:lunchS,lunchEnd:lunchE,
    momStart:momAvail,allowOvertime:true,overtimeMax:240});
  const changed=dayTasks.some(t=>before[t.id]!==t.time);
  if(!changed) return;
  sv(WK+"_tasks",weekData.tasks);
  safeWriteTasks("runDisplacement");
}

}

  const r=JSON.parse(JSON.stringify(rulesData||{}));
  if(!r.withSitter) r.withSitter=[];
  const i=r.withSitter.indexOf(kid);
  if(i>=0) r.withSitter.splice(i,1); else r.withSitter.push(kid);
  saveRules(r);
  renderAll();
}

function rulesUpdateTime(field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.schoolDay) r.schoolDay={};
  r.schoolDay[field]=to12h(val);
  saveRules(r);
}
function rulesUpdateDayOverride(day,field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.schoolDay) r.schoolDay={};
  if(!r.schoolDay.overrides) r.schoolDay.overrides={};
  if(!r.schoolDay.overrides[day]) r.schoolDay.overrides[day]={};
  if(val==="") delete r.schoolDay.overrides[day][field];
  else r.schoolDay.overrides[day][field]=to12h(val);
  if(Object.keys(r.schoolDay.overrides[day]).length===0) delete r.schoolDay.overrides[day];
  if(r.schoolDay.overrides&&Object.keys(r.schoolDay.overrides).length===0) delete r.schoolDay.overrides;
  saveRules(r);
}
function rulesRemoveDayOverride(day){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(r.schoolDay&&r.schoolDay.overrides&&r.schoolDay.overrides[day]){
    delete r.schoolDay.overrides[day];
    if(Object.keys(r.schoolDay.overrides).length===0) delete r.schoolDay.overrides;
    saveRules(r);
  }
}

function rulesSwapWf(kid,mode,i,dir){
  const r=JSON.parse(JSON.stringify(rulesData));
  const arr=fbArr(r.workflow[kid][mode]);
  const j=i+dir;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  r.workflow[kid][mode]=arr;
  saveRules(r);
}

function rulesUpdateMax(subj,field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.maxPerDay) r.maxPerDay={};
  if(!r.maxPerDay[subj]) r.maxPerDay[subj]={};
  if(field==="max"||field==="saturday_max") r.maxPerDay[subj][field]=(val===""?null:parseInt(val));
  else r.maxPerDay[subj][field]=!r.maxPerDay[subj][field];
  saveRules(r);
}
function rulesRemoveMax(subj){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(r.maxPerDay) delete r.maxPerDay[subj];
  saveRules(r);
}
function rulesAddMax(subj){
  if(!subj) return;
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.maxPerDay) r.maxPerDay={};
  if(!r.maxPerDay[subj]) r.maxPerDay[subj]={max:1};
  saveRules(r);
}

function rulesToggleOverlap(listKey,idx){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.overlap) r.overlap={};
  const arr=fbArr(r.overlap[listKey])||[];
  arr.splice(idx,1);
  r.overlap[listKey]=arr;
  saveRules(r);
}

function rulesToggleDropOff(subj,field){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.nothingDropsOff) r.nothingDropsOff={enabled:true,exception:{}};
  if(!r.nothingDropsOff.exception) r.nothingDropsOff.exception={};
  if(!r.nothingDropsOff.exception[subj]) r.nothingDropsOff.exception[subj]={};
  r.nothingDropsOff.exception[subj][field]=!r.nothingDropsOff.exception[subj][field];
  saveRules(r);
}

function rulesUpdateDeviceQueue(device,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.devices) r.devices={};
  if(!r.devices.queue) r.devices.queue={};
  if(val==="") delete r.devices.queue[device];
  else r.devices.queue[device]=parseInt(val);
  saveRules(r);
}
function rulesUpdateSaturday(field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.saturday) r.saturday={};
  if(val==="") delete r.saturday[field];
  else r.saturday[field]=parseInt(val);
  saveRules(r);
}

function slotCfgEnsure(kid){
  if(!slotConfig[kid]||!slotConfig[kid].length) slotConfig[kid]=JSON.parse(JSON.stringify(SLOT_DEFAULTS));
}
function slotCfgSet(kid,i,field,val){
  slotCfgEnsure(kid);
  slotConfig[kid][i][field]=val;
  slotCfgSave();
}
function slotCfgAddRow(kid){
  slotCfgEnsure(kid);
  slotConfig[kid].push({pts:0,weight:10,msg:"New tier"});
  slotCfgSave(); renderAll();
}
function slotCfgRemoveRow(kid){
  slotCfgEnsure(kid);
  slotConfig[kid].pop();
  slotCfgSave(); renderAll();
}
function slotCfgReset(kid){
  delete slotConfig[kid];
  slotCfgSave(); renderAll();
}
function slotCfgCopy(){
  slotCfgEnsure("lincoln");
  ["ellis","lucy","julian"].forEach(k=>{ slotConfig[k]=JSON.parse(JSON.stringify(slotConfig["lincoln"])); });
  slotCfgSave(); renderAll();
  const m=document.getElementById("slot-cfg-msg"); if(m) m.textContent="Copied Lincoln's config to all kids.";
}
function slotCfgSave(){
  if(db) db.ref("config/slot_config").set(slotConfig);
}

    if(gain>0){el.textContent=`🎉 +${gain} words A→B (${pct}% gain) — decoding is clicking!`;el.style.color="#16a34a";}
    else if(gain===0){el.textContent="Consistent score — solid foundation, keep drilling.";el.style.color="#d97706";}

async function sprintGenerate(){
  if(sprintGenerating) return;
  const customPhono=document.getElementById("sp-custom-phono")?.value?.trim()||"";
  const focusPhono=sprintSelectedPhono?sprintSelectedPhono.pg:customPhono;
  const focusSounds=sprintSelectedPhono?sprintSelectedPhono.sounds:"";
  if(!focusPhono){
    const el=document.getElementById("sp-status");
    if(el){el.textContent="Please select or type a focus phonogram.";el.style.display="block";el.style.background="#fee2e2";el.style.color="#991b1b";}
