function buildKidAttendance(kid){
  const weeks=[]; const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  Object.keys(archive).sort().forEach(wkKey=>{
    const aw=archive[wkKey];
    const awt=(aw.tasks||[]).filter(t=>t.who===kid&&!t.id.endsWith("_c"));
    const awc=aw.checked||{}; const awd=aw.dates||{};
    const days=[];
    DAYS.forEach(d=>{
      const dt=awt.filter(t=>t.day===d);
      const ov=((attOverrides[wkKey]||{})[d]||{})[kid];
      if(!dt.length&&ov===undefined) return; // skip only if no tasks AND no override
      const computed=dt.some(t=>awc[t.id]||awc[t.id+"_c"]);
      const attended=ov!==undefined?ov:computed;
      days.push({day:d,date:awd[d]||null,attended,past:true});
    });
    if(days.length) weeks.push({wkKey,label:(aw.weekLabel||wkKey).replace("week","Week "),days,archived:true});
  });
  const cur=(weekData.tasks||[]).filter(t=>t.who===kid&&!t.id.endsWith("_c"));
  const curDays=[];
  DAYS.forEach(d=>{ const dt=cur.filter(t=>t.day===d); if(!dt.length)return;
    const ds=DAY_DT[d]||""; let past=true;
    if(ds){ const p=new Date(ds+", "+new Date().getFullYear()); p.setHours(0,0,0,0); past=p<=todayMid; }
    curDays.push({day:d,date:ds,attended:dt.some(t=>checked[t.id]||checked[t.id+"_c"]),past}); });
  if(curDays.length) weeks.push({wkKey:WK,label:(WK||"week").replace("week","Week "),days:curDays,current:true});
  const total=weeks.reduce((s,w)=>s+w.days.filter(d=>d.past&&d.attended).length,0);
  return {weeks,total};
}

function addManualAttWeek(label){
  const raw=label||"";
  const wkKey=raw.trim().toLowerCase().replace(/\s+/g,"");
  if(!wkKey){ alert("Please enter a week label (e.g. week1)"); return; }
  if(archive[wkKey]){ alert("That week already exists in the archive."); return; }
  const entry={weekLabel:wkKey,archivedAt:nowTs(),history:{},tasks:[],checked:{},dates:{}};
  archive[wkKey]=entry;
  try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e){}
  if(db) db.ref("archive/"+wkKey).set(entry);
  const el=document.getElementById("content"); if(el) renderHistory(el);
}

function setAttOverride(wkKey,day,kid,val){
  if(!attOverrides[wkKey]) attOverrides[wkKey]={};

  attOverrides[wkKey][day][kid]=val;
  try{localStorage.setItem("ha_att_overrides",JSON.stringify(attOverrides));}catch(e){}
  if(db) db.ref("att_overrides/"+wkKey+"/"+day+"/"+kid).set(val);
  const el=document.getElementById("content"); if(el) renderHistory(el);
}
function setAttDate(wkKey,day,val){
  if(!archive[wkKey]) return;
  if(!archive[wkKey].dates) archive[wkKey].dates={};

  try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e){}
  if(db) db.ref("archive/"+wkKey+"/dates/"+day).set(val.trim());
  const el=document.getElementById("content"); if(el) renderHistory(el);
}

  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.week||!d.tasks){document.getElementById("admin-msg").textContent="❌ JSON missing week or tasks.";return;}
      const lunchConflicts=(d.tasks||[]).filter(t=>{
        const p=t.time&&t.time.match(/(\d+):(\d+)\s*(AM|PM)/i); if(!p)return false;
        let h=parseInt(p[1]); if(p[3].toUpperCase()==="PM"&&h!==12)h+=12; if(p[3].toUpperCase()==="AM"&&h===12)h=0;
        const m=h*60+parseInt(p[2]); return m>=780&&m<840;
      });
      if(lunchConflicts.length){
        const names=lunchConflicts.map(t=>t.id+"("+t.day+" "+t.time+")").join(", ");
        document.getElementById("admin-msg").textContent="⚠️ "+lunchConflicts.length+" task(s) during lunch (1–2 PM): "+names+". Move to 2:05 PM or later.";
        return;
      }
      isUploading=true;
      const activeWK=localStorage.getItem("ha_active_wk")||WK;
      const isSameWeek=!!(d.week===activeWK);
      if(isSameWeek){
        const lsChecked=ld(activeWK+"_checked")||{};
        const memChecked=checked||{};
        const snapChecked={...lsChecked,...memChecked};
        const snapHist=ld(activeWK+"_history")||{};
        const oldLookup={};
        (weekData.tasks||[]).forEach(t=>{
          const key=(t.title||"")+"|"+(t.who||"");
          if(snapChecked[t.id]) oldLookup[key]={ts:snapChecked[t.id],oldId:t.id};
        });
        d.tasks.forEach(t=>{
          if(snapChecked[t.id]) return;
          const key=(t.title||"")+"|"+(t.who||"");
          if(oldLookup[key]){
            snapChecked[t.id]=oldLookup[key].ts;
            if(snapHist[oldLookup[key].oldId]&&!snapHist[t.id])
              snapHist[t.id]={...snapHist[oldLookup[key].oldId],id:t.id};
          }
        });
        const snapSl=ld(activeWK+"_sl")||slState||{};
        // Re-attach cross-week carry-over tasks:
        // Pass 1 — grab any _c tasks still alive in weekData.tasks whose base isn't in the new JSON
        const newIds=new Set(d.tasks.map(t=>t.id));
        (weekData.tasks||[]).filter(t=>t.id.endsWith("_c")&&!newIds.has(t.id)&&!newIds.has(baseId(t.id)))
          .forEach(t=>{ d.tasks.push(t); newIds.add(t.id); });
        // Pass 2 — reconstruct from the most-recent archive in case carry-overs were already wiped.
        // Same filter as the Carry-overs tab: all base tasks not completed in any form.
        const _archPrev=Object.values(archive||{}).filter(a=>a&&a.tasks&&a.weekLabel!==d.week)
          .sort((a,b)=>{
            const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
            const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
            return nb-na;
          })[0];
        if(_archPrev){
          const _awc=_archPrev.checked||{};
          (_archPrev.tasks||[]).filter(t=>!t.id.endsWith("_c")&&!_awc[t.id]&&!_awc[t.id+"_c"])
            .forEach(t=>{
              const _cId=t.id+"_c";
              if(newIds.has(_cId)) return;                        // already present
              if((snapChecked||{})[_cId]) return;               // already completed this week
              if((coExclusions[d.week]||{})[_cId]) return;      // user explicitly excluded
              d.tasks.push({...t,id:_cId,day:"monday",cascade:true,
                detail:(t.detail||t.title||"")+" (Carried from "+(_archPrev.weekLabel||"prev week")+")"});
              newIds.add(_cId);
            });
        }
        WK=activeWK; weekData=d; checked=snapChecked; slState=snapSl;
        if(d.supplies&&Array.isArray(d.supplies)){SUP=d.supplies;sv(WK+"_supplies_def",d.supplies);}
        if(d.supplyCategories&&Array.isArray(d.supplyCategories)) SUP_CATS=d.supplyCategories;
        applyWeekMeta(d);
        sv(WK+"_tasks",d.tasks); sv(WK+"_maggie",d.maggie||null);
        sv(WK+"_checked",snapChecked); sv(WK+"_history",snapHist); sv(WK+"_sl",snapSl);
        sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        if(db){
          const obj={};d.tasks.forEach(t=>obj[t.id]=t);
          db.ref(WK+"/tasks").set(obj);
          if(Object.keys(snapChecked).length) db.ref(WK+"/checked").update(snapChecked);
          if(Object.keys(snapHist).length) db.ref(WK+"/history").update(snapHist);
          if(Object.keys(snapSl).length) db.ref(WK+"/sl").set(snapSl);
          if(d.maggie) db.ref(WK+"/maggie").set(d.maggie);
          db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        }
        fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
        renderAll(); runCascade();
        document.getElementById("admin-msg").textContent="✅ "+d.week+" updated — "+d.tasks.length+" tasks. Completions & history preserved.";
      } else {
        const oldWK=activeWK;
        const snapHist=ld(oldWK+"_history")||{};
        const snapTasks=weekData.tasks||[];
        const snapChecked={...(ld(oldWK+"_checked")||{}), ...checked};
        snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"]).forEach(t=>{
          if(!snapHist[t.id+"_missed"])
            snapHist[t.id+"_missed"]={id:t.id,title:t.title,who:t.who,day:t.day,ts:"Week Closed",missed:true,momRequired:t.mom==="required"};
        });
        const hasAnything=Object.keys(snapHist).length>0||snapTasks.length>0;
        if(hasAnything){
          const entry={weekLabel:oldWK,archivedAt:nowTs(),history:snapHist,tasks:snapTasks,checked:snapChecked,dates:{...DAY_DT}};
          archive[oldWK]=entry;
          try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e2){}
          if(db) db.ref("archive/"+oldWK).set(entry);
        }
        // Carry ALL uncompleted tasks from old week into Monday of new week.
        // Same filter as Carry-overs tab: base tasks where neither original nor _c was checked.
        snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"])
          .forEach(t=>{
            const cId=t.id+"_c";
            if(!d.tasks.some(x=>x.id===cId))
              d.tasks.push({...t,id:cId,day:"monday",cascade:true,
                detail:(t.detail||t.title||"")+" (Carried from "+oldWK+")"});
          });
        WK=d.week; localStorage.setItem("ha_active_wk",WK);
        if(db) db.ref("ha_active_wk").set(WK);
        weekData=d; checked={}; slState={};
        if(d.supplies&&Array.isArray(d.supplies)){SUP=d.supplies;sv(WK+"_supplies_def",d.supplies);}
        if(d.supplyCategories&&Array.isArray(d.supplyCategories)) SUP_CATS=d.supplyCategories;
        applyWeekMeta(d);
        sv(WK+"_tasks",d.tasks); sv(WK+"_maggie",d.maggie||null);
        sv(WK+"_checked",{}); sv(WK+"_sl",{}); sv(WK+"_history",{});
        sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        if(db){
          const obj={};d.tasks.forEach(t=>obj[t.id]=t);
          db.ref(WK+"/tasks").set(obj);
          db.ref(WK+"/checked").set({}); db.ref(WK+"/sl").set({}); db.ref(WK+"/history").set({});
          if(d.maggie) db.ref(WK+"/maggie").set(d.maggie);
          db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
          attachWeekListeners(WK);
        }
        fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
        renderAll(); runCascade();
        document.getElementById("admin-msg").textContent="✅ "+d.week+" loaded — "+d.tasks.length+" tasks. Previous week archived.";
      }
      setTimeout(()=>{ isUploading=false; },3000);
    }catch(err){ isUploading=false; document.getElementById("admin-msg").textContent="❌ "+err.message; }
  };
  r.readAsText(f);
}

function printSchedule(){
  const kids=["lincoln","ellis","lucy"];
  const names={lincoln:"Lincoln",ellis:"Ellis",lucy:"Lucy"};
  const momColors={required:"#fde8d8",maybe:"#fdf6e3",none:"#ffffff"};
  const momLabels={required:"★",maybe:"◆",none:""};
  const days=DAYS.filter(d=>weekData.tasks.some(t=>t.day===d));

  function fmtTime(t){
    t=t.trim();
    if(t.endsWith("AM")) return t.slice(0,-3).trim()+"a";
    if(t.endsWith("PM")) return t.slice(0,-3).trim()+"p";
    return t;
  }
  function cleanTitle(t){
    return t.replace(/^[\u{1F000}-\u{1FFFF}\u{2600}-\u{27FF}\u{1F300}-\u{1FAFF}]\s*/u,"").trim();
  }

  let pages="";
  for(const day of days){
    const dateStr=DAY_DT[day]||"";
    const constraint=CONSTRAINT[day]||"";
    const window_=WIN[day]||WIN["default"]||"";
    const constraintHtml=constraint
      ? `<div style="background:#fff2cc;color:#7d4c00;font-size:8.5pt;font-weight:bold;padding:3px 8px;margin-bottom:5px;border-left:3px solid #f0a500">${constraint}</div>`
      : "";

    let cols="";
    for(const kid of kids){
      const tasks=weekData.tasks.filter(t=>t.day===day&&t.who===kid&&!t.id.endsWith("_c"));
      let rows="";
      for(const t of tasks){
        const bg=momColors[t.mom]||"#fff";
        const star=momLabels[t.mom]||"";
        const starHtml=star?`<span style="font-size:7pt;margin-left:3px;color:#c0541a">${star}</span>`:"";
        rows+=`<div style="display:grid;grid-template-columns:52px 1fr;border-bottom:1px solid #eee;background:${bg}">
          <div style="background:#f5f5f5;color:#555;font-size:7.5pt;padding:3px 4px;text-align:right;border-right:1px solid #e0e0e0;white-space:nowrap">${fmtTime(t.time)}</div>
          <div style="padding:3px 6px;font-size:8pt;line-height:1.3">${cleanTitle(t.title)}${starHtml}</div>
        </div>`;
      }
      if(!rows) rows=`<div style="padding:8px;color:#aaa;font-size:8pt;text-align:center">—</div>`;
      cols+=`<div style="border:1px solid #ccc;border-radius:3px;overflow:hidden">
        <div style="background:#2c5f8a;color:#fff;font-weight:bold;font-size:10pt;padding:4px 8px;text-align:center">${names[kid]}</div>
        ${rows}
      </div>`;
    }

    pages+=`<div style="width:100%;page-break-after:always;padding:8px 10px 4px">
      <div style="background:#1a1a1a;color:#fff;font-size:11pt;font-weight:bold;padding:5px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">
        <span>${day.charAt(0).toUpperCase()+day.slice(1)} — ${dateStr}</span>
        <span style="font-size:8pt;font-weight:normal;color:#ccc">${window_}</span>
      </div>
      ${constraintHtml}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">${cols}</div>
      <div style="margin-top:6px;font-size:7.5pt;color:#666;text-align:right">★ Mom Required &nbsp;&nbsp; ◆ May need Mom</div>
    </div>`;
  }

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${(WK||"week").replace("week","Week ")} Schedule</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:9pt;color:#222}
    @media print{@page{size:landscape;margin:0.4in}div[style*="page-break-after:always"]:last-child{page-break-after:avoid}}</style>
    </head><body>${pages}</body></html>`;

  const w=window.open("","_blank");
  w.document.write(html);
  w.document.close();
  w.onload=function(){w.print();};
}

// Debounced cascade scheduler — collapses multiple rapid listener fires into one cascade run.
// Only runs when BOTH checked and tasks have been loaded from Firebase.
function schedCascade(){
  clearTimeout(cascadeDebounce);
  cascadeDebounce=setTimeout(()=>{
    if(fbCheckedLoaded&&fbTasksLoaded&&fbHistoryLoaded){
      _syncCarryOvers(); // ensure carry-overs stay in the schedule across reloads
      runCascade();
    }
  },2000);
}

function runCascade(){
  if(!fbHistoryLoaded||!fbCheckedLoaded||!fbTasksLoaded) return;
  const toRestore={};
  const histUpdates={};
  weekData.tasks.forEach(t=>{
    if(checked[t.id]) return;
    const h=histState[t.id];
    if(h&&h.ts&&!h.missed&&!h.flag){ toRestore[t.id]=h.ts; return; }
    if(t.title&&t.who){
      for(const k in histState){
        const v=histState[k];
        if(v&&v.ts&&!v.missed&&!v.flag&&v.title===t.title&&v.who===t.who){
          toRestore[t.id]=v.ts;
          if(!histState[t.id]){ histUpdates[t.id]={...v,id:t.id}; histState[t.id]=histUpdates[t.id]; }
          break;
        }
      }
    }
  });
  if(Object.keys(toRestore).length){
    Object.assign(checked,toRestore);
    sv(WK+"_checked",checked);
    lastCheckedWrite=Date.now();
    if(db) db.ref(WK+"/checked").update(toRestore);
    if(Object.keys(histUpdates).length){
      sv(WK+"_history",histState);
      if(db) db.ref(WK+"/history").update(histUpdates);
    }
    dbg("reconciled "+Object.keys(toRestore).length+" checks from history");
    renderAll();
  }
}

function actAllItems(){ return ACT_BASE.concat(actExtras); }

function actCatColor(id){ for(var i=0;i<ACT_CATS.length;i++) if(ACT_CATS[i].id===id) return ACT_CATS[i].color; return '#888'; }
function actCatLabel(id){ for(var i=0;i<ACT_CATS.length;i++) if(ACT_CATS[i].id===id) return ACT_CATS[i].label; return id; }

function toggleActFav(id){
  actFavs[id]=!actFavs[id];
  if(!actFavs[id]) delete actFavs[id];
  try{localStorage.setItem('act_favs',JSON.stringify(actFavs));}catch(e){}
  if(db) db.ref("act_favs").set(actFavs);
  if(tab==='activities'){ renderActFilters(); renderActCards(); }
}

function loadActJson(){
  var f=document.getElementById('act-json-input').files[0];
  var msg=document.getElementById('act-upload-msg');
  if(!f){if(msg)msg.textContent='No file selected.';return;}
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      var arr=Array.isArray(d)?d:(d.activities||[]);
      if(!arr.length){if(msg)msg.textContent='❌ No activities found. Expecting an array or {activities:[...]}';return;}
      var added=0;
      arr.forEach(function(a){
        if(!a.id||!a.cat||!a.t||!a.d) return;
        var exists=actExtras.find(function(x){return x.id===a.id;});
        if(!exists){actExtras.push(a);added++;}
      });
      actUploadMsg='✅ Added '+added+' new activities ('+actExtras.length+' total extras).';
      if(msg) msg.textContent=actUploadMsg;
      renderActCards();
    }catch(err){
      actUploadMsg='❌ '+err.message;
      if(msg) msg.textContent=actUploadMsg;
    }
  };
  r.readAsText(f);
}

function renderActivities(el){
  // Only build the full shell if it doesn't exist yet (first load or tab switch)
  if(!document.getElementById('act-upload-bar')){
    el.innerHTML=
      '<div id="act-upload-bar">'+
        '<input type="file" id="act-json-input" accept=".json"/>'+
        '<button class="btn-p" onclick="loadActJson()" style="white-space:nowrap">+ Add JSON</button>'+
        '<button class="act-fav-btn" id="act-fav-toggle" onclick="toggleActFavOnly()">★ Favorites</button>'+
        '<div id="act-upload-msg"></div>'+
      '</div>'+
      '<div class="act-search-row">'+
        '<input type="text" id="act-search" placeholder="Search activities…" oninput="renderActCards()"/>'+
      '</div>'+
      '<div class="act-filter-row" id="act-filter-row"></div>'+
      '<div class="act-count" id="act-count"></div>'+
      '<div class="act-grid" id="act-grid"></div>';
    // Restore upload message if there was one
    if(actUploadMsg){ var m=document.getElementById('act-upload-msg'); if(m) m.textContent=actUploadMsg; }
  }
  // Always refresh the dynamic parts
  renderActFilters();
  renderActCards();
}

function renderActFilters(){
  var fb=document.getElementById('act-filter-row');
  if(!fb) return;
  var h='<button class="act-fbtn'+(actFilter==='all'?' on':'')+'" style="'+(actFilter==='all'?'background:#111827;color:#fff;border-color:transparent;':'')+'" onclick="setActFilter(\'all\')">All</button>';
  ACT_CATS.forEach(function(c){
    var on=actFilter===c.id;
    h+='<button class="act-fbtn'+(on?' on':'')+'" style="'+(on?'background:'+c.color+';color:#fff;border-color:transparent;':'')+'" onclick="setActFilter(\''+c.id+'\')">'+c.label+'</button>';
  });
  fb.innerHTML=h;
  var favBtn=document.getElementById('act-fav-toggle');
  if(favBtn) favBtn.className='act-fav-btn'+(actFavOnly?' on':'');
}

function renderActCards(){
  var grid=document.getElementById('act-grid');
  var countEl=document.getElementById('act-count');
  if(!grid||!countEl) return;
  var all=actAllItems();
  var searchEl=document.getElementById('act-search');
  var q=searchEl?searchEl.value.toLowerCase():'';
  var items=all.filter(function(a){
    if(actFilter!=='all'&&a.cat!==actFilter) return false;
    if(actFavOnly&&!actFavs[a.id]) return false;
    if(q&&a.t.toLowerCase().indexOf(q)===-1&&a.d.toLowerCase().indexOf(q)===-1&&actCatLabel(a.cat).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  countEl.textContent=items.length+' of '+all.length+' activities';
  if(!items.length){
    grid.innerHTML='<div class="act-empty">No activities match — try a different filter or search.</div>';
    return;
  }
  var cards='';
  items.forEach(function(a){
    var starred=!!actFavs[a.id];
    var color=actCatColor(a.cat);
    cards+='<div class="act-card'+(starred?' starred':'')+'">'+
      '<button class="act-star" onclick="toggleActFav(\''+a.id+'\')">'+(starred?'★':'☆')+'</button>'+
      '<div class="act-cat-row"><span class="act-dot" style="background:'+color+'"></span><span class="act-cat-lbl">'+actCatLabel(a.cat)+'</span></div>'+
      '<div class="act-title">'+a.t+'</div>'+
      '<div class="act-desc">'+a.d+'</div>'+
      '</div>';
  });
  grid.innerHTML=cards;
}

function setActFilter(id){ actFilter=id; renderActFilters(); renderActCards(); }
function toggleActFavOnly(){ actFavOnly=!actFavOnly; renderActFilters(); renderActCards(); }

function planWeekNum(startStr){
  const ms=Date.now()-new Date(startStr).getTime();
  return Math.max(1, Math.floor(ms/(7*24*60*60*1000))+1);
}

function planTotalWeeks(startStr,endStr){
  return Math.ceil((new Date(endStr)-new Date(startStr))/(7*24*60*60*1000));
}

function formatPlanDate(d){
  return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}

function paceStatus(current,total,startWeek,weekNum,totalWeeks){
  if(!total) return "on-track";
  const sw=startWeek||1;
  if(weekNum<sw) return "not-started";
  const weeksActive=weekNum-sw+1;
  const weeksTotal=Math.max(1,totalWeeks-sw+1);
  const diff=(current/total)-(weeksActive/weeksTotal);
  if(diff>0.08) return "ahead";
  if(diff<-0.08) return "behind";
  return "on-track";
}

function paceStatusLabel(s){
  return s==="ahead"?"Ahead":s==="behind"?"Behind":s==="not-started"?"Not Started":"On Track";
}

function parseTaskCount(title){
  let m=title.match(/pp\.\s*(\d+)\s*[–\-]\s*(\d+)/i);
  if(m) return Math.max(1,parseInt(m[2])-parseInt(m[1])+1);
  m=title.match(/\bMod(?:ules?)?\s+(\d+)\s*[–\-]\s*(\d+)/i);
  if(m) return Math.max(1,parseInt(m[2])-parseInt(m[1])+1);
  m=title.match(/\bMod(?:ules?)?\s+([\d][,\d\s]+)/i);
  if(m) return m[1].split(',').filter(x=>x.trim().match(/^\d+$/)).length||1;
  return 1;
}

function baseId(id){ let b=id; while(b.endsWith("_c"))b=b.slice(0,-2); return b; }
function histDone(id){
  // Check histState for a valid completion (not a missed/flag entry) on this id or any _c chain
  let cur=id;
  while(true){
    const e=histState[cur];
    if(e&&typeof e==="object"&&e.ts&&!e.missed&&!e.flag) return true;
    if(!cur.endsWith("_c")) break;
    cur=cur.slice(0,-2);
    if(cur===id) break; // safety
  }
  // Also check the original base id
  const base=baseId(id);
  const eb=histState[base];
  if(eb&&typeof eb==="object"&&eb.ts&&!eb.missed&&!eb.flag) return true;
  // Fallback: a JSON re-upload can renumber task IDs, so history entry may exist under an old ID.
  // Match by title+who on the current task being checked.
  const curTask=(weekData.tasks||[]).find(t=>t.id===id);
  if(curTask&&curTask.title&&curTask.who){
    for(const k in histState){
      const v=histState[k];
      if(v&&typeof v==="object"&&v.ts&&!v.missed&&!v.flag&&v.title===curTask.title&&v.who===curTask.who) return true;
    }
  }
  return false;
}
function chainDone(origId, checkedObj, tasksArr){
  if(checkedObj[origId]||histDone(origId)) return true;
  let id=origId+"_c";
  while(tasksArr.some(t=>t.id===id)){
    if(checkedObj[id]||histDone(id)) return true;
    id=id+"_c";
  }
  return false;
}
function effectiveDay(t){
  if(t.id.endsWith("_c")) return t.day;
  if(!t.cascade) return t.day;
  if(checked[t.id]){
    const h=histState[t.id];
    if(h&&h.checkedOnDay) return h.checkedOnDay;
    return t.day;
  }
  const order=["monday","tuesday","wednesday","thursday","friday","saturday"];
  const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  const jsDay=new Date().getDay();
  let idx=order.indexOf(t.day);
  if(idx<0) return t.day;
  while(idx<order.length){
    const d=order[idx];
    let isPast=false;
    if(DAY_DT[d]){
      const cal=new Date(DAY_DT[d]+", "+todayMid.getFullYear());
      cal.setHours(0,0,0,0);
      isPast=cal<todayMid;
    } else {
      const dIdx={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6}[d]||0;
      isPast=dIdx<(jsDay||7);
    }
    if(!isPast) return d;
    idx++;
  }
  return "carryover";
}
function paceAutoCount(kid,keyword){
  if(!keyword) return 0;
  const kw=keyword.toLowerCase().trim();
  let count=0;
  weekData.tasks.filter(t=>t.who===kid&&!t.id.endsWith("_c")).forEach(t=>{
    if(chainDone(t.id,checked,weekData.tasks)&&t.title.toLowerCase().includes(kw))
      count+=parseTaskCount(t.title);
  });
  Object.values(archive).forEach(aw=>{
    const awChecked=aw.checked||{};
    const awTasks=aw.tasks||[];
    awTasks.filter(t=>t.who===kid&&!t.id.endsWith("_c")).forEach(t=>{
      if(chainDone(t.id,awChecked,awTasks)&&t.title.toLowerCase().includes(kw))
        count+=parseTaskCount(t.title);
    });
  });
  return count;
}

function paceHasPendingCascade(kid,keyword){
  if(!keyword) return false;
  const kw=keyword.toLowerCase();
  // Cascade tasks that were themselves re-cascaded to another day
  const furtherCascaded=new Set(weekData.tasks.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  return weekData.tasks.some(t=>
    t.who===kid&&t.id.endsWith("_c")&&
    !checked[t.id]&&!checked[t.id+"_c"]&&
    !furtherCascaded.has(t.id)&&
    t.title.toLowerCase().includes(kw)
  );
}

function updatePaceField(kid,key,field,value){
  const s=((paceData.subjects&&paceData.subjects[kid])||{})[key];
  if(!s) return;
  savePaceSubject(kid,key,{...s,[field]:value});
}

function addPaceSubject(kid){
  const labelEl=document.getElementById("pace-new-label-"+kid);
  const kwEl=document.getElementById("pace-new-kw-"+kid);
  const totalEl=document.getElementById("pace-new-total-"+kid);
  const swEl=document.getElementById("pace-new-sw-"+kid);
  if(!labelEl||!kwEl||!totalEl) return;
  const label=labelEl.value.trim(),keyword=kwEl.value.trim(),total=parseInt(totalEl.value)||0;
  const startWeek=parseInt(swEl&&swEl.value)||1;
  if(!label||!keyword||!total){labelEl.style.borderColor="#f87171";return;}
  labelEl.style.borderColor="";
  const key=label.toLowerCase().replace(/[^a-z0-9]/g,"_")+"_"+Date.now();
  savePaceSubject(kid,key,{label,keyword,total,offset:0,adjust:0,startWeek});
  labelEl.value="";kwEl.value="";totalEl.value="";if(swEl)swEl.value="1";
  renderAll();
}

function togglePaceEdit(kid){
  paceEditKid=paceEditKid===kid?null:kid; renderAll();
}

function renderPace(el){
  if(!el){el=document.getElementById("content");if(!el)return;}

  // Seed defaults to Firebase if no plans exist yet
  const hasSavedPlans=paceData.plans&&Object.keys(paceData.plans).length>0;
  if(!hasSavedPlans) Object.entries(PACE_DEFAULT_PLANS).forEach(([k,v])=>savePacePlan(k,v));
  const plans=hasSavedPlans?paceData.plans:PACE_DEFAULT_PLANS;

  // Remove stale/duplicate keys seeded during early testing
  const PACE_STALE_KEYS={ellis:["math_reason"]};
  Object.entries(PACE_STALE_KEYS).forEach(([k,keys])=>{
    const existing=(paceData.subjects&&paceData.subjects[k])||{};
    keys.forEach(key=>{ if(existing[key]) deletePaceSubject(k,key); });
  });

  // Seed default subjects per kid — only add keys that don't already exist
  ["lincoln","ellis","lucy"].forEach(k=>{
    const existing=(paceData.subjects&&paceData.subjects[k])||{};
    if(PACE_DEFAULT_SUBJECTS[k]){
      Object.entries(PACE_DEFAULT_SUBJECTS[k]).forEach(([key,subj])=>{
        if(!existing[key]){
          savePaceSubject(k,key,subj);
        } else {
          // Always sync startWeek and total from Excel defaults; preserve user offset/adjust
          const cur=existing[key];
          if(cur.startWeek!==subj.startWeek||cur.total!==subj.total){
            savePaceSubject(k,key,{...cur,startWeek:subj.startWeek,total:subj.total});
          }
        }
      });
    }
  });

  let h='<div id="pace-content">';

  // Kid selector
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
  [{k:"all",label:"All",col:"#111827"},...PACE_KIDS.map(k=>({k,label:cap(k),col:PACE_KCOL[k]}))].forEach(({k:k2,label,col})=>{
    const on=kid===k2||(k2==="all"&&(kid==="all"||kid==="mom"));
    h+='<button onclick="selKid(\''+k2+'\')" style="padding:5px 14px;border-radius:20px;border:1.5px solid '+(on?'transparent':'var(--border)')+';background:'+(on?col:'#fff')+';color:'+(on?'#fff':'var(--muted)')+';font-size:12px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif">'+label+'</button>';
  });
  h+='</div>';

  // Weekly progress bar
  const weeklyCol=(kid==="all"||kid==="mom")?"#111827":PACE_KCOL[kid]||"#111827";
  const _wkMatch=t=>(kid==="all"||kid==="mom")?true:t.who===kid;
  const _wkCascAway=new Set(weekData.tasks.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  const _wkCountable=weekData.tasks.filter(t=>_wkMatch(t)&&(!_wkCascAway.has(t.id)||!!checked[t.id])&&!(t.title||"").toLowerCase().includes("lunch"));
  const weeklyTotal=_wkCountable.length;
  const weeklyDone=_wkCountable.filter(t=>chainDone(t.id,checked,weekData.tasks)).length;
  const weeklyPct=weeklyTotal?Math.min(100,Math.round(weeklyDone/weeklyTotal*100)):0;
  h+='<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
    '<div style="font-size:12px;font-weight:600;color:var(--muted)">This week</div>'+
    '<div style="font-size:12px;font-weight:700;color:'+weeklyCol+'">'+weeklyPct+'%</div>'+
    '</div>'+
    '<div class="day-prog-bar" style="margin-top:0"><div class="day-prog-fill" style="width:'+weeklyPct+'%;background:'+weeklyCol+'"></div></div>'+
    '</div>';

  // Plan sections
  Object.entries(plans).forEach(([planKey,plan])=>{
    const planKids=plan.kids||[];
    const visKids=(kid==="all"||kid==="mom")?planKids:planKids.filter(k=>k===kid);

    const weekNum=planWeekNum(plan.start||"2026-04-20");
    const totalWeeks=planTotalWeeks(plan.start||"2026-04-20",plan.end||"2026-09-01");
    const planPct=Math.min(100,Math.round(Math.min(weekNum,totalWeeks)/totalWeeks*100));

        'oninput="updatePlanField(\''+planKey+'\',\'label\',this.value)"/></div>'+
        '<div></div>'+
        '<div><div class="pace-config-label">Start Date</div>'+
        '<input class="pace-config-input" type="date" value="'+(plan.start||'')+'" '+
        'oninput="updatePlanField(\''+planKey+'\',\'start\',this.value)"/></div>'+
        '<div><div class="pace-config-label">End Date</div>'+
        '<input class="pace-config-input" type="date" value="'+(plan.end||'')+'" '+
        'oninput="updatePlanField(\''+planKey+'\',\'end\',this.value)"/></div>'+
        '</div>'+
        '<div class="pace-config-label" style="margin-bottom:6px">Kids in this plan</div>'+
        '<div class="pace-plan-kids-row">'+
        PACE_KIDS.map(k=>{
          const on=(plan.kids||[]).includes(k);
          return '<button class="pace-plan-kid-toggle'+(on?' on':'')+'" onclick="togglePlanKid(\''+planKey+'\',\''+k+'\')">'+cap(k)+'</button>';
        }).join('')+
        '</div>'+
        '<button class="pace-del-btn" onclick="if(confirm(\'Delete this plan?\'))deletePacePlan(\''+planKey+'\')">Delete Plan</button>'+
        '</div>';
    }

    // Kid curriculum cards
    visKids.forEach(k=>{
      const kidSubjs=(paceData.subjects&&paceData.subjects[k])||{};
      const keys=Object.keys(kidSubjs);
      const isEditing=paceEditKid===k;
      const col=PACE_KCOL[k];
      let aheadN=0,onN=0,behindN=0;
      keys.forEach(sk=>{

        if(st==="ahead")aheadN++; else if(st==="behind")behindN++; else if(st!=="not-started")onN++;

      h+='<div class="pace-kid-card">'+
        '<div class="pace-kid-hdr">'+
        '<div><div class="pace-kid-name" style="color:'+col+'">'+cap(k)+'</div>'+
        '<div class="pace-kid-meta">'+summaryStr+(keys.length?' &middot; '+keys.length+' subjects':'')+'</div></div>'+
        '<div class="pace-kid-actions">'+
        '<button class="pace-edit-btn'+(isEditing?' active':'')+'" onclick="togglePaceEdit(\''+k+'\')">'+
        (isEditing?'Done':'Edit')+'</button></div>'+

      if(keys.length||isEditing){
        h+='<div class="pace-subjects">';
        if(!keys.length) h+='<div class="pace-empty">No subjects yet — add one below.</div>';

        keys.forEach(sk=>{
          const s=kidSubjs[sk];

          const offset=s.offset||0,adjust=s.adjust||0,sw=s.startWeek||1;
          const cur=offset+autoC+adjust,tot=s.total||1;
          const pct=Math.min(100,Math.round(cur/tot*100));
          const status=paceHasPendingCascade(k,s.keyword||"")?"behind":paceStatus(cur,tot,sw,weekNum,totalWeeks);
          const barCol=status==="ahead"?"#16a34a":status==="behind"?"#ef4444":status==="not-started"?"#d1d5db":"#3b82f6";

          h+='<div class="pace-subject-row">'+

          if(isEditing){
            h+='<div class="pace-config-grid">'+
              '<div><div class="pace-config-label">Keyword</div>'+

              '<div><div class="pace-config-label">Total</div>'+
              '<input class="pace-config-input" type="number" min="1" value="'+(s.total||'')+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'total\',parseInt(this.value)||0)"/></div>'+
              '<div><div class="pace-config-label">Start Wk</div>'+
              '<input class="pace-config-input" type="number" min="1" value="'+sw+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'startWeek\',parseInt(this.value)||1)"/></div>'+
              '</div>'+
              '<div class="pace-auto-info">'+
              '<span>Auto: <span class="pace-auto-num">'+autoC+'</span></span>'+
              '<span style="color:var(--border)">+</span>'+
              '<span>Offset: <input class="pace-num-input" type="number" min="0" value="'+offset+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'offset\',parseInt(this.value)||0)"/></span>'+
              '<span style="color:var(--border)">+</span>'+
              '<span>Adjust: <input class="pace-num-input" type="number" value="'+adjust+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'adjust\',parseInt(this.value)||0)"/></span>'+
              '<span style="color:var(--border)">=</span>'+
              '<span><span class="pace-auto-num">'+cur+'</span> done</span>'+
              '<button class="pace-del-btn" style="margin-left:auto" onclick="deletePaceSubject(\''+k+'\',\''+sk+'\')">Remove</button>'+
              '</div>';
          }
          h+='</div>';
        });

        if(isEditing){
          h+='<div class="pace-add-row">'+
            '<input id="pace-new-label-'+k+'" type="text" placeholder="Subject name" maxlength="30"/>'+
            '<input id="pace-new-kw-'+k+'" type="text" placeholder="Keyword" maxlength="40"/>'+
            '<input id="pace-new-total-'+k+'" type="number" placeholder="Total" min="1" max="9999" style="width:60px"/>'+

            '<button class="pace-add-btn" onclick="addPaceSubject(\''+k+'\')">+ Add</button></div>';
        }
        h+='</div>';
      }
      h+='</div>';
    });

    h+='</div>';
  });

  // Add plan form
  h+='<div class="pace-add-plan-row">'+
    '<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.3px">Add New Plan</div>'+
    '<div class="pace-add-plan-grid">'+
    '<div><div class="pace-config-label">Name</div><input id="pace-new-plan-label" class="pace-config-input" type="text" placeholder="e.g. Summer Session"/></div>'+
    '<div><div class="pace-config-label">Start Date</div><input id="pace-new-plan-start" class="pace-config-input" type="date"/></div>'+

  h+='</div>';
  el.innerHTML=h;
}

// ── MASTERY TAB ──────────────────────────────────────────────────
const MAST_TIER_ORDER=["daily","every_other_day","every_third_day","weekly","bi_weekly","monthly","learned","graduated"];
const MAST_TIER_LBL={daily:"Daily",every_other_day:"Every Other Day",every_third_day:"Every 3rd Day",weekly:"Weekly",bi_weekly:"Bi-Weekly",monthly:"Monthly",learned:"Learned",graduated:"Graduated"};
const MAST_TIER_COL={daily:"#dc2626",every_other_day:"#ea580c",every_third_day:"#d97706",weekly:"#ca8a04",bi_weekly:"#65a30d",monthly:"#0d9488",learned:"#2563eb",graduated:"#7c3aed"};
const MAST_TIER_INT={daily:1,every_other_day:2,every_third_day:3,weekly:7,bi_weekly:14,monthly:28,learned:null,graduated:null};
const MAST_ANIMAL_EMOJI={Lion:"\u{1F981}",Giraffe:"\u{1F992}","T-Rex":"\u{1F996}",Brachiosaurus:"\u{1F995}",Dog:"\u{1F436}",Cat:"\u{1F431}",Elephant:"\u{1F418}",Bear:"\u{1F43B}",Penguin:"\u{1F427}",Rabbit:"\u{1F430}",Fox:"\u{1F98A}",Owl:"\u{1F989}",Horse:"\u{1F434}",Turtle:"\u{1F422}",Whale:"\u{1F433}",Tiger:"\u{1F42F}",Zebra:"\u{1F993}",Shark:"\u{1F988}",Deer:"\u{1F98C}"};
const MAST_COLOR_MAP={Red:"#ef4444",Blue:"#3b82f6",Green:"#22c55e",Yellow:"#eab308",Orange:"#f97316",Purple:"#a855f7",Pink:"#ec4899",Brown:"#92400e",Black:"#1f2937",White:"#e5e7eb"};
const MAST_KID_COL={lincoln:"#1e3a5f",ellis:"#2d5a3d",lucy:"#5b3a8c",julian:"#c45e1a"};
const MAST_KID_EMOJI={lincoln:"\u{1F40D}",ellis:"\u{1F916}",lucy:"\u{1F984}",julian:"\u{1F995}"};

function mastGetPrintNum(){
  const today=new Date().toISOString().slice(0,10);
  let pl=masteryData.printLog||[];
  if(!Array.isArray(pl)) pl=Object.values(pl);

  const existing=pl.find(x=>x.date===today);
  if(existing) return existing.num;

  // New day — assign next number and save it immediately
  const maxNum=pl.reduce((m,x)=>Math.max(m,x.num||0),0);
  const num=maxNum+1;
  pl.push({date:today,num:num});
  masteryData.printLog=pl;
  if(db) db.ref("mastery/printLog").set(pl);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}
  return num;
}

function mastIsDue(item,pn){
  const iv=MAST_TIER_INT[item.tier||"daily"];
  if(iv===null||iv===undefined) return false;
  const cy=item.cycle||1;
  return (pn-1)%iv===(cy-1)%iv;
}

function mastDueItems(kid,pn){
  let items=masteryData[kid];
  if(!items) return [];
  if(!Array.isArray(items)) items=Object.values(items);
  const due=items.filter(i=>mastIsDue(i,pn));
  due.sort((a,b)=>MAST_TIER_ORDER.indexOf(a.tier||"daily")-MAST_TIER_ORDER.indexOf(b.tier||"daily"));
  return due;
}

let mastLogMode=false;
let mastLogScores={};  // {itemId: "c"|"m"|"~"}

function mastSetKid(k){ masteryKid=k; mastLogMode=false; mastLogScores={}; mastSlideIdx=0; mastScoreItemId=null; const c=document.getElementById("content"); if(c) renderMastery(c); }
function mastSetView(v){ mastView=v; mastScoreItemId=null; _mastRe(); }
function mastShowItemHist(id){ mastScoreItemId=mastScoreItemId===id?null:id; _mastRe(); }
function mastToggleTier(t){ masteryCollapsed[masteryKid+"_"+t]=!masteryCollapsed[masteryKid+"_"+t]; const c=document.getElementById("content"); if(c) renderMastery(c); }
function mastStartLog(){ mastLogMode=true; mastLogScores={}; mastSlideIdx=0; const c=document.getElementById("content"); if(c) renderMastery(c); }
function mastCancelLog(){ mastLogMode=false; mastLogScores={}; const c=document.getElementById("content"); if(c) renderMastery(c); }
function mastScore(id,val){ mastLogScores[id]=val; const c=document.getElementById("content"); if(c) renderMastery(c); }

function mastSaveResults(){
  const pn=mastGetPrintNum();
  const due=mastDueItems(masteryKid,pn);
  const TIER_LADDER_STD=["daily","every_other_day","every_third_day","weekly","bi_weekly","monthly","learned","graduated"];
  const TIER_LADDER_JULIAN=["every_other_day","weekly","bi_weekly","monthly","graduated"];
  const TIER_LADDER=masteryKid==="julian"?TIER_LADDER_JULIAN:TIER_LADDER_STD;

  // Get all items for this kid
  let items=masteryData[masteryKid];
  if(!items) return;
  if(!Array.isArray(items)) items=Object.values(items);

  // Apply results
  let changes=0;
  due.forEach(dueItem=>{
    const score=mastLogScores[dueItem.id];
    if(!score||score==="shown") return; // "shown" already saved by mastSlideShown
    // Find in items array
    const item=items.find(i=>i.id===dueItem.id);
    if(!item) return;
    if(item.status==="introduction") return; // intro items don't get ladder scoring

    const oldTier=item.tier||"daily";
    const oldIdx=TIER_LADDER.indexOf(oldTier);
    if(oldIdx===-1) return;

    let newIdx=oldIdx;
    if(score==="c") newIdx=Math.min(oldIdx+1,TIER_LADDER.length-1);
    else if(score==="m"){ newIdx=Math.max(oldIdx-1,0); item.drop_count=(item.drop_count||0)+1; }
    // ~ stays same

    const newTier=TIER_LADDER[newIdx];
    if(newTier!==oldTier){
      item.tier=newTier;
      // Assign new cycle: count items already in that tier, wrap within interval
      const interval=MAST_TIER_INT[newTier];
      if(interval){
        const countInTier=items.filter(i=>i.tier===newTier&&i.id!==item.id).length;
        item.cycle=(countInTier%interval)+1;
      }
    }
    item.consecutive_correct=score==="c"?(item.consecutive_correct||0)+1:0;
    changes++;
  });

  const hasShown=Object.values(mastLogScores).some(v=>v==="shown");
  if(!changes&&!hasShown){ alert("No items scored"); return; }

  // Update printLog with today if not present
  let pl=masteryData.printLog||[];
  if(!Array.isArray(pl)) pl=Object.values(pl);
  const today=new Date().toISOString().slice(0,10);
  if(!pl.find(e=>e.date===today)) pl.push({date:today,num:pn});
  masteryData.printLog=pl;

  // Build drill history record
  const drillItems=[];
  let correct=0,miss=0,close=0,shown=0;
  due.forEach(d=>{
    const sc=mastLogScores[d.id];
    if(!sc) return;
    if(sc==="shown"){ shown++; drillItems.push({id:d.id,prompt:d.prompt,result:"shown",tier:d.tier||"daily"}); }
    else { drillItems.push({id:d.id,prompt:d.prompt,result:sc,oldTier:d.tier||"daily"}); if(sc==="c")correct++; else if(sc==="m")miss++; else if(sc==="~")close++; }
  });
  const scored=correct+miss+close;
  const histEntry={
    date:today, printNum:pn, total:due.length, scored:scored,
    correct:correct, miss:miss, close:close, shown:shown,
    pct:scored?Math.round(correct/scored*100):0,
    items:drillItems
  };

  // Save to Firebase
  if(db){
    db.ref("mastery/"+masteryKid).set(items);
    db.ref("mastery/printLog").set(pl);
    db.ref("mastery/history/"+masteryKid+"/"+today.replace(/-/g,"")).set(histEntry);
  }
  // Update local
  masteryData[masteryKid]=items;
  if(!masteryData.history) masteryData.history={};
  if(!masteryData.history[masteryKid]) masteryData.history[masteryKid]={};
  masteryData.history[masteryKid][today.replace(/-/g,"")]=histEntry;
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  mastLogMode=false;
  mastLogScores={};
  const c=document.getElementById("content"); if(c) renderMastery(c);
}

function _mastRe(){ const c=document.getElementById("content"); if(c) renderMastery(c); }
let mastExpandedId=null;
let mastSlideIdx=0;
let mastEditId=null;
let mastEditDots=0;
let mastEditConsec=0;
let mastEditTier="";
function mastToggleExpand(id){ mastExpandedId=mastExpandedId===id?null:id; _mastRe(); }

function mastEditOpen(id){
  let items=masteryData[masteryKid]||[];
  if(!Array.isArray(items)) items=Object.values(items);
  const it=items.find(i=>i.id===id);
  if(!it) return;
  mastEditId=id;
  mastEditDots=it.tally_dots||0;
  mastEditConsec=it.consecutive_correct||0;
  mastEditTier=it.tier||"daily";
  _mastRe();
}
function mastEditClose(){ mastEditId=null; _mastRe(); }
function mastEditAdjDots(d){ mastEditDots=Math.max(0,Math.min(5,mastEditDots+d)); _mastRe(); }
function mastEditAdjConsec(d){ mastEditConsec=Math.max(0,Math.min(3,mastEditConsec+d)); _mastRe(); }
function mastEditSetTier(t){ mastEditTier=t; _mastRe(); }

function mastEditSave(){
  let items=masteryData[masteryKid]||[];
  if(!Array.isArray(items)) items=Object.values(items);
  const it=items.find(i=>i.id===mastEditId);
  if(!it) return;

  it.tally_dots=mastEditDots;
  it.consecutive_correct=mastEditConsec;
  it.tier=mastEditTier;

  // If dots hit 5 and still intro, promote
  if(it.status==="introduction"&&mastEditDots>=5){
    it.status="active";
    it.tier="every_other_day";
    it.cycle=1;
    it.tally_dots=5;
  }
  // If manually set to intro tier and was active, revert to intro
  if(mastEditDots<5&&it.status==="active"&&masteryKid==="julian"){
    it.status="introduction";
    it.tier="daily";
  }

  masteryData[masteryKid]=items;
  if(db) db.ref("mastery/"+masteryKid).set(items);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}
  mastEditId=null;
  _mastRe();
}

function mastEditDelete(){
  if(!confirm("Remove this item from mastery?")) return;
  let items=masteryData[masteryKid]||[];
  if(!Array.isArray(items)) items=Object.values(items);
  items=items.filter(i=>i.id!==mastEditId);
  masteryData[masteryKid]=items;
  if(db) db.ref("mastery/"+masteryKid).set(items);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}
  mastEditId=null;
  _mastRe();
}
function mastJulianVis(it){

  if(MAST_ANIMAL_EMOJI[it.prompt]) return MAST_ANIMAL_EMOJI[it.prompt];

function mastExpandHtml(it){
  const open=mastExpandedId===it.id;
  let inner="";
  if(it.answer&&it.answer!==it.prompt) inner+='<div>'+it.answer+'</div>';
  if(it.definition) inner+='<div>'+it.definition+'</div>';

function mastOpenAdd(){ mastAddMode=true; mastAddImageUrl=""; _mastRe(); }
function mastCloseAdd(){ mastAddMode=false; mastAddImageUrl=""; _mastRe(); }
function mastAddSetTab(t){ mastAddTab=t; mastAddImageUrl=""; _mastRe(); }
function mastSetType(t){ mastAddType=t; _mastRe(); }
function mastSetSubject(s){ mastAddSubject=s; mastAddCustomSubject=""; _mastRe(); }
function mastSetCustomSubj(){ mastAddCustomSubject=mastAddCustomSubject||"New"; _mastRe(); }
function mastSetJulianCat(s){ mastAddJulianCat=s; _mastRe(); }
function mastSlideNext(){ mastSlideIdx++; _mastRe(); }
function mastSlidePrev(){ mastSlideIdx--; _mastRe(); }
function mastSlideScore(id,val){ mastLogScores[id]=val; mastSlideIdx++; _mastRe(); }

function mastSlideShown(id){
  // Fill the next tally dot for an introduction item
  let items=masteryData[masteryKid];
  if(!items) return;
  if(!Array.isArray(items)) items=Object.values(items);
  const item=items.find(i=>i.id===id);
  if(!item) return;

  const dots=(item.tally_dots||0)+1;
  item.tally_dots=dots;

  // After 5 dots, promote to ladder (starts at every_other_day — daily was the intro phase)
  if(dots>=5){
    item.status="active";
    item.tier="every_other_day";
    item.cycle=1;
    item.consecutive_correct=0;
    item.tally_dots=5;
  }

  // Save to Firebase
  masteryData[masteryKid]=items;
  if(db) db.ref("mastery/"+masteryKid).set(items);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  // Mark as handled for this session so we don't double-tap
  mastLogScores[id]="shown";
  mastSlideIdx++;
  _mastRe();
}

function mastUploadImage(file){
  if(!file) return;
  if(file.size>5*1024*1024){ alert("Image too large (max 5MB)"); return; }
  mastAddUploading=true;
  const c=document.getElementById("content"); if(c) renderMastery(c);

  const storage=firebase.storage();
  const ts=Date.now();
  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path="mastery_images/"+masteryKid+"/"+ts+"_"+safeName;
  const ref=storage.ref(path);

  ref.put(file).then(snapshot=>{
    return snapshot.ref.getDownloadURL();
  }).then(url=>{
    mastAddImageUrl=url;
    mastAddUploading=false;
    const c=document.getElementById("content"); if(c) renderMastery(c);
  }).catch(err=>{
    console.error("Upload failed:",err);
    alert("Upload failed: "+err.message);
    mastAddUploading=false;
    const c=document.getElementById("content"); if(c) renderMastery(c);
  });
}

function mastRemoveImage(){ mastAddImageUrl=""; const c=document.getElementById("content"); if(c) renderMastery(c); }

function mastAddItems(){
  const isJulian=masteryKid==="julian";
  let prompts=[];

  if(mastAddTab==="single"){
    const input=document.getElementById("mast-add-single");
    if(!input||!input.value.trim()) return;
    prompts=[input.value.trim()];
  } else {
    const textarea=document.getElementById("mast-add-batch");
    if(!textarea||!textarea.value.trim()) return;
    prompts=textarea.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  }

  if(!prompts.length) return;

  let items=masteryData[masteryKid];
  if(!items) items=[];
  if(!Array.isArray(items)) items=Object.values(items);

  const existingPrompts=new Set(items.map(i=>(i.prompt||"").toLowerCase()));
  let added=0, skipped=0;

  prompts.forEach(p=>{
    if(existingPrompts.has(p.toLowerCase())){ skipped++; return; }

    const slug=p.toLowerCase().replace(/[^a-z0-9]/g,"_").substring(0,20);
    const prefix=masteryKid.substring(0,3);
    const id=prefix+"_"+slug;

    const typeObj=MAST_ITEM_TYPES.find(t=>t.id===mastAddType)||MAST_ITEM_TYPES[0];
    const subj=isJulian?mastAddJulianCat:(mastAddCustomSubject||mastAddSubject);
    const item={
      id:id,
      subject:subj,
      type:isJulian?mastAddJulianCat.toLowerCase():mastAddType,
      prompt:p,
      answer:p,
      tier:"daily",
      review_mode:isJulian?"flash":typeObj.mode,
      status:isJulian?"introduction":"active",
      drop_count:0,
      consecutive_correct:0,
      cycle:1
    };
    // Attach definition + image for single-add
    if(mastAddTab==="single"&&prompts.length===1){
      const defInput=document.getElementById("mast-add-def");
      if(defInput&&defInput.value.trim()){ item.definition=defInput.value.trim(); item.answer=defInput.value.trim(); }
      if(mastAddImageUrl) item.imageUrl=mastAddImageUrl;
    }
    items.push(item);
    existingPrompts.add(p.toLowerCase());
    added++;
  });

  if(!added){
    alert(skipped+" item(s) already exist, nothing added");
    return;
  }

  // Assign cycles for new daily items
  const dailyCount=items.filter(i=>i.tier==="daily").length;
  items.filter(i=>i.tier==="daily").forEach((it,idx)=>{it.cycle=(idx%1)+1;});

  // Save to Firebase
  masteryData[masteryKid]=items;
  if(db) db.ref("mastery/"+masteryKid).set(items);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  mastAddMode=false;
  alert(added+" item(s) added"+(skipped?" ("+skipped+" duplicate(s) skipped)":""));
  const c=document.getElementById("content"); if(c) renderMastery(c);
}

function _renderMasteryInner(el){
  const kids=["lincoln","ellis","lucy","julian"];

  let items=masteryData[masteryKid]||[];

  let h='<div style="padding:12px 12px 80px">';

  // Kid filter + add button
  h+='<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;align-items:center">';
  kids.forEach(k=>{
    let kitems=masteryData[k]||[]; if(!Array.isArray(kitems)) kitems=Object.values(kitems);
    const active=k===masteryKid;
    h+='<button class="kid-btn'+(active?' active':'')+'" data-kid="'+k+'" onclick="mastSetKid(\''+k+'\')" style="'+(active?'background:'+MAST_KID_COL[k]+';color:#fff;border-color:transparent':'')+'">';
    h+=MAST_KID_EMOJI[k]+' '+SL_KLBL[k]+' <span style="opacity:0.6;font-size:10px">('+kitems.length+')</span></button>';
  });
  h+='<button onclick="mastOpenAdd()" style="width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:'+color+'">+</button>';
  h+='</div>';

  // View tabs: Drill / Scores
  h+='<div class="mast-view-tabs">';
  h+='<button class="mast-view-tab'+(mastView==="drill"?" active":"")+'" onclick="mastSetView(\'drill\')">Today\'s Drill</button>';
  h+='<button class="mast-view-tab'+(mastView==="scores"?" active":"")+'" onclick="mastSetView(\'scores\')">Scores</button></div>';

  // ── SCORES VIEW ──
  if(mastView==="scores"){
    const hist=masteryData.history&&masteryData.history[masteryKid]?masteryData.history[masteryKid]:{};
    const entries=Object.values(hist).sort((a,b)=>b.date.localeCompare(a.date));

    if(!entries.length){
      h+='<div class="mast-none">No scores yet. Log a drill to see results here.</div>';
    } else {
      // Trend chart
      const chartData=entries.slice().reverse().slice(-14); // last 14 sessions
      if(chartData.length>=2){
        const w=360,ht=100,pad=20;
        const step=(w-2*pad)/Math.max(chartData.length-1,1);
        let pts="";let labels="";
        chartData.forEach((e,i)=>{
          const x=pad+i*step;
          const y=ht-pad-(e.pct/100)*(ht-2*pad);
          pts+=(i?'L':'M')+x+','+y+' ';
          if(i===0||i===chartData.length-1||i%3===0){
            const d=e.date.slice(5);
            labels+='<text x="'+x+'" y="'+(ht-2)+'" text-anchor="middle" font-size="7" fill="#9ca3af">'+d+'</text>';
          }
        });
        // Dots
        let dots="";
        chartData.forEach((e,i)=>{
          const x=pad+i*step;
          const y=ht-pad-(e.pct/100)*(ht-2*pad);
          const col=e.pct>=80?"#16a34a":e.pct>=60?"#d97706":"#dc2626";
          dots+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+col+'" stroke="white" stroke-width="1.5"/>';
        });
        h+='<div class="mast-chart"><div class="mast-chart-title">Score Trend</div>';
        h+='<svg class="mast-chart-svg" viewBox="0 0 '+w+' '+ht+'">';
        h+='<line x1="'+pad+'" y1="'+(ht-pad)+'" x2="'+(w-pad)+'" y2="'+(ht-pad)+'" stroke="#e5e7eb" stroke-width="1"/>';
        h+='<line x1="'+pad+'" y1="'+pad+'" x2="'+(w-pad)+'" y2="'+pad+'" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="3"/>';
        h+='<text x="'+(pad-4)+'" y="'+(pad+3)+'" text-anchor="end" font-size="7" fill="#9ca3af">100%</text>';
        h+='<text x="'+(pad-4)+'" y="'+(ht-pad+3)+'" text-anchor="end" font-size="7" fill="#9ca3af">0%</text>';
        h+='<path d="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        h+=dots+labels;
        h+='</svg></div>';
      }

      // Daily score cards
      entries.forEach(e=>{
        const pctCol=e.pct>=80?"#16a34a":e.pct>=60?"#d97706":"#dc2626";
        const dateObj=new Date(e.date+"T12:00:00");
        const dayN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dateObj.getDay()];

        h+='</div>';

        // Expandable item list

          e.items.forEach(it=>{
            const rc=it.result==="c"?"r-c":it.result==="m"?"r-m":it.result==="~"?"r-t":"r-shown";
            const rl=it.result==="c"?"\u{2713}":it.result==="m"?"\u{2717}":it.result==="~"?"~":"\u{1F441}\u{FE0F}";

          h+='</div>';
        }
        h+='</div>';
      });
    }

    h+='</div>';
