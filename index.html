function openSlotMachine(taskId){
  if(paceToastTimer) clearTimeout(paceToastTimer);
  document.getElementById("pace-toast").classList.remove("show");
  if(taskId&&pendingSpins[taskId]){
    slotKid=pendingSpins[taskId].kid;
    slotSpinDay=pendingSpins[taskId].day;
  }
  slotPendingTaskId=taskId||null;
  const k=slotKid||"lincoln";
  const todayPts=getKidDayPoints(k,slotSpinDay||day);
  const weekPts=getKidPoints(k);
  document.getElementById("slot-kid-name").textContent=cap(k)+"'s Spin";
  document.getElementById("slot-pts-display").textContent="Today ⭐"+todayPts+" · Week ⭐"+weekPts;
  document.getElementById("slot-result").className="slot-result";
  document.getElementById("slot-result").textContent="";
  document.getElementById("slot-msg").textContent="";
  document.getElementById("slot-spin-btn").disabled=false;
  document.getElementById("slot-spin-btn").textContent="SPIN!";
  for(let i=0;i<3;i++){
    const reel=document.getElementById("reel"+i);
    reel.innerHTML='<div class="slot-symbol">'+SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]+'</div>';
    reel.style.transform="translateY(0)";
  }
  document.getElementById("slot-overlay").classList.add("show");
}
function closeSlotMachine(){
  document.getElementById("slot-overlay").classList.remove("show");
  renderAll();
}
function spinSlots(){
  const btn=document.getElementById("slot-spin-btn");
  btn.disabled=true; btn.textContent="...";
  const outcome=pickOutcome();
  const finalSymbols=outcome.pts===0
    ?[SLOT_SYMBOLS[6],SLOT_SYMBOLS[Math.floor(Math.random()*6)],SLOT_SYMBOLS[6]]
    :outcome.pts===25
    ?[SLOT_SYMBOLS[2],SLOT_SYMBOLS[2],SLOT_SYMBOLS[2]]
    :(()=>{ const s=[]; for(let i=0;i<3;i++) s.push(SLOT_SYMBOLS[Math.floor(Math.random()*6)]); return s; })();

  for(let i=0;i<3;i++){
    const reel=document.getElementById("reel"+i);
    const count=12+i*4;
    let h="";
    for(let j=0;j<count;j++) h+='<div class="slot-symbol">'+SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]+'</div>';
    h+='<div class="slot-symbol">'+finalSymbols[i]+'</div>';
    reel.innerHTML=h;
    reel.style.transition="none";
    reel.style.transform="translateY(0)";
    reel.offsetHeight;
    const dist=count*80;
    reel.style.transition="transform "+(0.8+i*0.4)+"s cubic-bezier(0.15,0.8,0.3,1)";
    reel.style.transform="translateY(-"+dist+"px)";
  }

  const totalTime=800+2*400+300;
  const k=slotKid||"lincoln";
  const d=slotSpinDay||day;
  setTimeout(()=>{
    const resEl=document.getElementById("slot-result");
    const msgEl=document.getElementById("slot-msg");
    if(outcome.pts>0){
      resEl.textContent="+"+outcome.pts+" points!";
      resEl.className="slot-result show";
      addKidPoints(k,outcome.pts,d);
      const todayPts=getKidDayPoints(k,d);
      const weekPts=getKidPoints(k);
      document.getElementById("slot-pts-display").textContent="Today ⭐"+todayPts+" · Week ⭐"+weekPts;
    } else {
      resEl.textContent="0 points";
      resEl.className="slot-result show zero";
    }
    msgEl.textContent=outcome.msg;
    btn.textContent="Done!";
    btn.disabled=false;
    btn.onclick=closeSlotMachine;
    if(slotPendingTaskId){ claimPendingSpin(slotPendingTaskId); slotPendingTaskId=null; }
  },totalTime);
}

        '<div style="font-size:13px;color:var(--muted);margin-bottom:16px">Enter the Mom PIN to access admin tools.</div>'+
        '<input id="admin-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="off" '+
        'style="width:120px;text-align:center;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;letter-spacing:8px;font-family:\'DM Sans\',sans-serif" '+
        'oninput="checkAdminPin(this.value,\'admin-pin-err\')" autofocus>'+
        '<div id="admin-pin-err" style="font-size:11px;color:#b5394a;margin-top:6px;min-height:14px"></div></div>';
      setTimeout(()=>{const i=document.getElementById("admin-pin-input");if(i)i.focus();},50);
      return;
    }
    let ah='<div style="display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:12px">';
    ["settings","generate","curriculum"].forEach(s=>{
      const active=adminSubTab===s||(s==="settings"&&adminSubTab==="rules");
      const label=s.charAt(0).toUpperCase()+s.slice(1);
      ah+='<button style="flex:1;padding:10px 4px;font-size:12px;font-weight:700;border:none;background:none;cursor:pointer;font-family:\'DM Sans\',sans-serif;color:'+(active?"var(--text)":"var(--muted)")+';border-bottom:2px solid '+(active?"var(--header)":"transparent")+';margin-bottom:-2px" onclick="setAdminSub(\''+s+'\')">'+label+'</button>';
    });
    ah+='</div>';
    if(adminSubTab==="settings"||adminSubTab==="rules"){ renderSettings(el,ah); }
    else if(adminSubTab==="generate"){ renderAdminGenerate(el,ah); }
    else if(adminSubTab==="curriculum"){ renderCurriculumView(el,ah); }
    return;
  }
  const col=DAY_COL[day]||"#666", pct=dayPct(day);
  const activeTasks=displacedResult?displacedResult.tasks:weekData.tasks;

  let allDay=activeTasks.filter(t=>effectiveDay(t)===day);
  if(kid==="mom") allDay=allDay.filter(t=>t.mom==="required"||t.mom==="maybe");
  else if(kid!=="all") allDay=allDay.filter(t=>t.who===kid);

  let tasks=allDay.filter(t=>t.day===day&&!t.id.endsWith("_c"));
  let carriedOver=allDay.filter(t=>t.day!==day||t.id.endsWith("_c"));

  const tmap={};
  tasks.forEach(t=>{ if(!tmap[t.time])tmap[t.time]=[]; tmap[t.time].push(t); });
  const times=Object.keys(tmap).sort((a,b)=>toMin(a)-toMin(b));
  const win=WIN[day]||WIN.default;

  let h='<div class="day-banner" style="--day-color:'+col+'">'+
    '<div class="day-banner-inner">'+
    '<div><div class="day-name">'+(DAY_LBL[day]||day)+'<button class="bo-btn" onclick="openBoDialog(\''+day+'\')">+ Blockout</button></div>'+
    '<div class="day-date">'+(DAY_DT[day]||"")+" · "+(weekData.week||WK).replace("week","Week ")+'</div>'+
    '<div class="day-window">'+win+'</div></div>'+
    '<div class="day-pct-badge">'+pct+'%</div></div>'+
    '<div class="day-prog-bar"><div class="day-prog-fill" style="width:'+pct+'%"></div></div></div>';

  if(CONSTRAINT[day]){
    h+='<div class="constraint-alert" style="display:flex;align-items:center;gap:8px">'+
      '<div style="flex:1">'+CONSTRAINT[day]+'</div>'+
      (adminPinUnlocked?'<button onclick="removeConstraint(\''+day+'\')" style="background:none;border:none;font-size:16px;color:#92400e;cursor:pointer;padding:2px 4px;flex-shrink:0" title="Remove constraint">✕</button>':'')+
      '</div>';
  }
  h+=renderBlockoutBanners(day);
  h+=dailyPaceTracker(allDay, day);

  // ── SCHEDULE LOCK CHECK ──────────────────────────────────────────
  const unlocked = isScheduleUnlocked(kid, day);
  const lockMsg = (kid==="all")
    ? "All four kids need to check off their Morning slot in Skylight above."
    : cap(kid)+"'s Morning slot needs to be checked off in Skylight above.";

  if(carriedOver.length){
    let coHtml='<div style="margin:10px 12px 0;border-left:4px solid #6366f1;background:#eef2ff;border-radius:0 10px 10px 0;padding:10px 12px">'+
      '<div style="font-size:11px;font-weight:800;color:#4338ca;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.4px">📋 Carried Over</div>';
    carriedOver.forEach(t=>{
      let fromLabel;
      if(t.id.endsWith("_c")){
        const m=t.detail.match(/Carried from (.+?)\)/);
        fromLabel="Carried from "+(m?m[1]:"previous week");
      } else {
        fromLabel="Originally "+cap(t.day);
      }
      coHtml+=taskCard(t, fromLabel);
    });
    coHtml+='</div>';
    if(!unlocked){
      h+='<div class="sched-locked-wrap"><div class="sched-blur">'+coHtml+'</div>'+
        '<div class="sched-lock-overlay" onclick="scrollToSkylight()"></div></div>';
    } else {
      h+=coHtml;
    }
  }

  const innerStart = unlocked
    ? '<div class="time-slots">'
    : '<div class="sched-locked-wrap"><div class="sched-blur"><div class="time-slots">';

  h += innerStart;
  let lunchDone=false;
  times.forEach(t=>{
    if(!lunchDone&&toMin(t)>=13*60){ h+=lunchBlock(); lunchDone=true; }
    h+='<div class="time-row"><div class="time-pill">'+t+'</div><div class="slot-tasks">';
    tmap[t].forEach(tk=>{ h+=taskCard(tk); });
    h+='</div></div>';
  });
  if(!lunchDone&&times.length&&toMin(times[times.length-1])<13*60) h+=lunchBlock();

  if(!unlocked){
    // Close the blurred inner wrapper, then add the overlay
    h+='</div></div>'; // close .time-slots and .sched-blur
    h+='<div class="sched-lock-overlay" onclick="scrollToSkylight()">'+
      '<div class="lock-bubble">'+
      '<span class="lock-icon">🔒</span>'+
      '<div class="lock-title">Schedule Locked</div>'+
      '<div class="lock-sub">'+lockMsg+'</div>'+
      '<button class="lock-btn">↑ Go to Morning Check-In</button>'+
      '</div></div>';
    h+='</div>'; // close .sched-locked-wrap
  } else {
    h+='</div>'; // close .time-slots
  }

  // Carry-over alert from displacement
  if(displacedResult&&displacedResult.carryOver&&displacedResult.carryOver.length){
    const co=displacedResult.carryOver;
    const kidMatch=t=>kid==="all"||kid==="mom"?true:t.who===kid;
    const vis=co.filter(kidMatch);
    if(vis.length){
      const isReflex=t=>(taskSubject(t)||"").toLowerCase().includes("reflex");
      h+='<div style="margin:12px;border-left:4px solid #ef4444;background:#fef2f2;border-radius:0 10px 10px 0;padding:12px">';
      h+='<div style="font-size:11px;font-weight:800;color:#991b1b;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">&#9888; Carry-Over Alert — '+vis.length+' task(s) couldn\'t fit</div>';
      h+='<div style="font-size:12px;color:#7f1d1d;margin-bottom:8px">These tasks were displaced but no day had room.</div>';
      vis.forEach(t=>{
        const skipped=!!(coExclusions[WK]&&coExclusions[WK][t.id]);
        const reflexDefault=isReflex(t)&&!skipped;
        h+='<div style="background:#fff;border:1.5px solid '+(skipped?'#e5e7eb':'#fca5a5')+';border-radius:10px;padding:10px 12px;margin-bottom:6px;'+(skipped?'opacity:0.5':'')+'">';
        h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
        h+='<span class="kid-badge badge-'+t.who+'" style="font-size:10px">'+cap(t.who)+'</span>';
        h+='<span style="font-size:13px;font-weight:600;flex:1">'+t.title+'</span>';
        h+='<span style="font-size:10px;color:#991b1b">from '+cap(t._originalDay||"")+'</span>';
        h+='</div>';
        if(reflexDefault) h+='<div style="font-size:10px;color:#f59e0b;font-weight:600;margin-bottom:4px">Reflex can be skipped — no content dependency</div>';
        if(!skipped){
          h+='<div style="display:flex;gap:6px">';
          h+='<button onclick="coAddToSaturday(\''+t.id+'\')" style="padding:4px 12px;border-radius:8px;border:1px solid #1a6b5a;background:#f0fdf4;color:#1a6b5a;font-size:11px;font-weight:700;cursor:pointer;font-family:\'DM Sans\',sans-serif">+ Saturday</button>';
          h+='<button onclick="coSkipTask(\''+t.id+'\')" style="padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif">Skip</button>';
          h+='</div>';
        } else {
          h+='<div style="font-size:11px;color:var(--muted);font-style:italic">Skipped — <button onclick="coUnskipTask(\''+t.id+'\')" style="background:none;border:none;color:#3b82f6;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif;font-size:11px;text-decoration:underline">undo</button></div>';
        }
        h+='</div>';
      });
      h+='</div>';
    }
  }


  // End-of-day section for individual kids
  if(!["all","mom"].includes(kid) && unlocked){
    const kidDayTasks=allDay.filter(t=>t.who===kid&&!t.title.toLowerCase().includes("lunch"));
    const kidDayDone=kidDayTasks.filter(t=>!!checked[t.id]).length;
    if(kidDayTasks.length && kidDayDone===kidDayTasks.length){
      const aftDone=getSlot(kid,"afternoon").done;
      const choresDone=getSlot(kid,"chores").done;
      if(!aftDone||!choresDone){
        const missing=[];
        if(!aftDone) missing.push("Afternoon");
        if(!choresDone) missing.push("Chores");
        h+='<div style="margin:16px 12px;border-radius:12px;padding:16px;background:#eff6ff;border:1.5px solid #93c5fd;text-align:center">'+
          '<div style="font-size:28px;margin-bottom:8px">🎉</div>'+
          '<div style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700;color:#1d4ed8;margin-bottom:6px">All Schoolwork Done!</div>'+
          '<div style="font-size:13px;color:#1e40af">Check off <strong>'+missing.join(' &amp; ')+'</strong> in Skylight above to see your points for today.</div>'+
          '</div>';
      } else {
        const dayPts=getKidDayPoints(kid,day);
        h+='<div style="margin:16px 12px;border-radius:12px;padding:16px;background:#f0fdf4;border:1.5px solid #86efac;text-align:center">'+
          '<div style="font-size:28px;margin-bottom:8px">⭐</div>'+
          '<div style="font-family:\'Fraunces\',serif;font-size:24px;font-weight:700;color:#15803d;margin-bottom:4px">'+dayPts+' Points Today!</div>'+
          '<div style="font-size:13px;color:#166534;margin-bottom:8px">Great job today, '+cap(kid)+'!</div>'+
          '<div style="font-size:12px;color:#15803d;font-weight:600">Have mom upload your points to Skylight 🚀</div>'+
          '</div>';
      }
    }
  }

  el.innerHTML=h;
  if(pnwOpen) renderPlanNextWeek();
}

function taskCard(t, fromDay){
  const done=!!checked[t.id];
  const future=DAYS.indexOf(t.day)>DAYS.indexOf(day);
  const bcls=t.mom==="required"?"req":t.mom==="maybe"?"maybe":"";
  const klbl=cap(t.who);
  let mb="";
  if(kid==="mom"){
    const lbl=t.mom==="required"?"Mom Required — "+klbl:"May Need Mom — "+klbl;
    mb='<span class="mom-badge '+(t.mom==="required"?"req-badge":"maybe-badge")+'">'+lbl+'</span>';
  } else if(t.mom==="required"){
    mb='<span class="mom-badge req-badge">Mom Required</span>';
  } else if(t.mom==="maybe"){
    mb='<span class="mom-badge maybe-badge">May Need Mom</span>';
  }
  const hasPending=done&&!!pendingSpins[t.id];
  const dr=done?'<div class="done-row">✓ '+checked[t.id]+'</div>':"";
  const spinBtn=hasPending?'<div style="margin-top:4px"><button onclick="event.stopPropagation();openSlotMachine(\''+t.id+'\')" style="padding:4px 12px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:\'DM Sans\',sans-serif;animation:spinPulse 2s ease-in-out infinite">🎰 Spin!</button></div>':"";
  // Strip the "Cascaded from X" note from detail for display
  const cleanDetail=t.detail.replace(/\s*\(Cascaded from \w+\)/,"");
  const disLabel=t._displaced?'<div style="font-size:10px;font-weight:700;color:#7c3aed;background:#ede9fe;display:inline-block;padding:1px 7px;border-radius:8px;margin-bottom:4px">&#8618; Moved from '+cap(t._originalDay||"")+'</div><br>':'';
  const carryLabel=fromDay?'<div style="font-size:10px;font-weight:700;color:#4338ca;background:#e0e7ff;display:inline-block;padding:1px 7px;border-radius:8px;margin-bottom:4px">↩ '+fromDay+'</div><br>':'';
  const cascLabel=t.cascadedFrom?'<div style="font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;display:inline-block;padding:1px 7px;border-radius:8px;margin-bottom:4px">↩ From '+cap(t.cascadedFrom)+'</div><br>':'';
  return '<div class="task-card '+bcls+(done?" done":"")+(future?" future":"")+(t._displaced?" displaced":"")+'">'+
    '<div class="card-inner">'+
    '<div class="task-cb'+(done?" checked":"")+'" onclick="tapTask(\''+t.id+'\')">'+(done?"✓":"")+'</div>'+
    '<div class="card-body">'+
    '<div class="card-header"><span class="kid-badge badge-'+t.who+'">'+klbl+'</span>'+
    '<div class="task-title">'+disLabel+carryLabel+cascLabel+t.title+'</div>'+mb+'</div>'+
    '<div class="task-detail">'+cleanDetail+'</div>'+dr+spinBtn+
    '</div></div></div>';
}

// ── TASK TAP ──────────────────────────────────────────────────────
function tapTask(id){
  const t=weekData.tasks.find(x=>x.id===id); if(!t)return;
  const isDone=!!checked[id];
  const future=DAYS.indexOf(t.day)>DAYS.indexOf(day);
  pendingId=id;
  document.getElementById("dlg-title").textContent=t.title;
  document.getElementById("dlg-detail").textContent=isDone?"Completed: "+checked[id]:t.detail;
  const btn=document.getElementById("dlg-ok");
  const unBtn=document.getElementById("dlg-uncheck");
  if(isDone){ btn.style.display="none"; unBtn.style.display="block"; }
  else { btn.style.display="block"; btn.textContent=future?"Mark Done (Future Day)":"✓ Mark Done"; btn.style.background=future?"#f59e0b":"#16a34a"; unBtn.style.display="none"; }
  document.getElementById("dlg").style.display="flex";
}
document.getElementById("dlg-ok").onclick=()=>{
  if(!pendingId)return;
  const ts=nowTs();
  checked[pendingId]=ts; sv(WK+"_checked",checked);
  lastCheckedWrite=Date.now();
  dbg("write checked id="+pendingId+" n="+Object.keys(checked).length);
  if(db) db.ref(WK+"/checked").set(checked);
  const hist=ld(WK+"_history")||{};
  const t=weekData.tasks.find(x=>x.id===pendingId);
  if(t){
    const origDay=t.cascadedFrom||t.day;
    const origDateStr=DAY_DT[origDay];
    let daysLate=null;
    if(origDateStr){const yr=new Date().getFullYear();const od=new Date(origDateStr+", "+yr);const td=new Date();od.setHours(0,0,0,0);td.setHours(0,0,0,0);daysLate=Math.round((td-od)/864e5);}
    const entry={id:pendingId,title:t.title,who:t.who,day:t.day,originalDay:origDay,checkedOnDay:effectiveDay(t),daysLate:daysLate,ts,week:WK};
    hist[pendingId]=entry; histState[pendingId]=entry; sv(WK+"_history",hist); if(db) db.ref(WK+"/history/"+pendingId).set(entry);
  }
  const doneId=pendingId;
  closeDlg(); renderAll();
  showPaceToast(doneId);
};
document.getElementById("dlg-uncheck").onclick=()=>{
  if(!pendingId)return;
  manualUnchecks.add(pendingId);
  delete checked[pendingId]; sv(WK+"_checked",checked);
  lastCheckedWrite=Date.now();
  dbg("write uncheck id="+pendingId+" n="+Object.keys(checked).length);
  if(db) db.ref(WK+"/checked").set(checked);
  const hist=ld(WK+"_history")||{};
  delete hist[pendingId]; delete histState[pendingId]; sv(WK+"_history",hist);
  if(db) db.ref(WK+"/history/"+pendingId).remove();
  closeDlg(); schedCascade(); renderAll();
};
function closeDlg(){ document.getElementById("dlg").style.display="none"; pendingId=null; }

let mpActiveDay = null;
let mpChoreState = {};

function mpInit() {
  try {
    const saved = localStorage.getItem('mp_weekly_data');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.days) {
        MP_DATA.weekLabel = data.weekLabel || MP_DATA.weekLabel;
        MP_DATA.winOfTheDay = data.winOfTheDay || MP_DATA.winOfTheDay;
        MP_DATA.skylightTip = data.skylightTip || MP_DATA.skylightTip;
        MP_DATA.days = data.days;
        MP_DATA.allMeals = data.allMeals || MP_DATA.allMeals;
      }
    }
  } catch(e) {}
  try { const s=localStorage.getItem('mp_chore_state'); mpChoreState=s?JSON.parse(s):{}; } catch(e){}
  const todayDay = MP_DATA.days.find(d=>d.isToday);
  mpActiveDay = todayDay ? todayDay.id : MP_DATA.days[0].id;
}

function mpSelectDay(id) {
  mpActiveDay = id;
  const el = document.getElementById('content');
  renderMomsPlan(el);
}

function mpToggleChore(dayId, index) {
  if (!mpChoreState[dayId]) mpChoreState[dayId] = {};
  mpChoreState[dayId][index] = !mpChoreState[dayId][index];
  try { localStorage.setItem('mp_chore_state', JSON.stringify(mpChoreState)); } catch(e) {}
  if(db) db.ref("mp_chore_state").set(mpChoreState);
  const el = document.getElementById('content');
  renderMomsPlan(el);
  const day = MP_DATA.days.find(d=>d.id===dayId);
  const total = day.chores.length;
  const done = Object.values(mpChoreState[dayId]).filter(Boolean).length;
  if (done === total && total > 0) {
    const msg = document.createElement('div');
    msg.textContent = '🎉 All tasks done — you crushed it!';
    Object.assign(msg.style, {
      position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',
      background:'#2B7A78',color:'#fff',padding:'8px 18px',borderRadius:'20px',
      fontFamily:"'DM Sans',sans-serif",fontSize:'12px',fontWeight:'700',
      zIndex:'9999',whiteSpace:'nowrap',opacity:'1',transition:'opacity 0.5s'
    });
    document.body.appendChild(msg);
    setTimeout(()=>{ msg.style.opacity='0'; setTimeout(()=>msg.remove(),500); }, 2500);
  }
}

function mpHandleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.days || !Array.isArray(data.days)) throw new Error('Invalid schema — missing days array');
      MP_DATA.weekLabel = data.weekLabel || MP_DATA.weekLabel;
      MP_DATA.winOfTheDay = data.winOfTheDay || MP_DATA.winOfTheDay;
      MP_DATA.skylightTip = data.skylightTip || MP_DATA.skylightTip;
      MP_DATA.days = data.days;
      MP_DATA.allMeals = data.allMeals || MP_DATA.allMeals;
      mpChoreState = {};
      try { localStorage.setItem('mp_weekly_data', JSON.stringify(data)); } catch(err) {}
      try { localStorage.removeItem('mp_chore_state'); } catch(err) {}
      // Sync Mom's Plan to Firebase so all devices stay current
      if(db){ db.ref("mp_data").set(data); db.ref("mp_chore_state").set({}); }
      const todayDay = MP_DATA.days.find(d => d.isToday);
      mpActiveDay = todayDay ? todayDay.id : MP_DATA.days[0].id;
      const el = document.getElementById('content');
      renderMomsPlan(el);
      const msg = document.createElement('div');
      msg.textContent = '✅ New week plan loaded!';
      Object.assign(msg.style, {
        position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',
        background:'#2B7A78',color:'#fff',padding:'8px 18px',borderRadius:'20px',
        fontFamily:"'DM Sans',sans-serif",fontSize:'12px',fontWeight:'700',
        zIndex:'9999',whiteSpace:'nowrap',opacity:'1',transition:'opacity 0.5s'
      });
      document.body.appendChild(msg);
      setTimeout(()=>{ msg.style.opacity='0'; setTimeout(()=>msg.remove(),500); }, 2500);
    } catch(err) {
      alert('❌ Invalid JSON — ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

const HIST_KCOL_LIGHT={lincoln:"#93c5fd",ellis:"#86efac",lucy:"#c4b5fd",julian:"#fdba74"};
function timingStats(histEntries,filterKids){
  const all={onTime:0,early:0,late:0,totalLateDays:0,carryOver:0,total:0};
  const byKid={};
  Object.values(histEntries).forEach(e=>{
    if(!e||!e.who||e.daysLate===undefined||e.daysLate===null)return;
    if(filterKids&&!filterKids.includes(e.who))return;
    if(!byKid[e.who])byKid[e.who]={onTime:0,early:0,late:0,totalLateDays:0,carryOver:0,total:0};
    const s=byKid[e.who];
    s.total++; all.total++;
    if(e.daysLate==="co"){s.carryOver++;all.carryOver++;}
    else if(e.daysLate===0){s.onTime++;all.onTime++;}
    else if(e.daysLate<0){s.early++;all.early++;}
    else{s.late++;s.totalLateDays+=e.daysLate;all.late++;all.totalLateDays+=e.daysLate;}
  });
  return {all,byKid};
}
function renderTimingCard(histEntries,filterKids){
  const ts=timingStats(histEntries,filterKids);
  if(!ts.all.total)return '';
  const pill=(label,count,bg,fg)=>'<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:'+bg+';color:'+fg+';margin:0 2px">'+label+' '+count+'</span>';

  const order=["lincoln","ellis","lucy","julian"].filter(k=>ts.byKid[k]);
  order.forEach(k=>{
    const s=ts.byKid[k];
    const col=PACE_KCOL[k]||"#fff";
    const avgLate=s.late?Math.round(s.totalLateDays/s.late*10)/10:0;
    h+='<div style="display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap">';
    h+='<span style="font-size:11px;font-weight:700;color:'+col+';min-width:54px">'+cap(k)+'</span>';
    if(s.onTime)h+=pill('✓',s.onTime,'rgba(34,197,94,0.2)','#4ade80');
    if(s.early)h+=pill('Early',s.early,'rgba(96,165,250,0.2)','#93c5fd');
    if(s.late)h+=pill('Late '+avgLate+'d',s.late,'rgba(251,146,60,0.2)','#fb923c');
    if(s.carryOver)h+=pill('CO',s.carryOver,'rgba(168,85,247,0.2)','#c084fc');
    h+='</div>';
  });
  // overall bar
  const a=ts.all;
  if(a.total>1){
    const pOn=Math.round(a.onTime/a.total*100);
    const pEarly=Math.round(a.early/a.total*100);
    const pLate=Math.round(a.late/a.total*100);
    const pCo=Math.round(a.carryOver/a.total*100);
    h+='<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px">';

    if(pEarly)h+='<div style="width:'+pEarly+'%;background:#93c5fd"></div>';
    if(pLate)h+='<div style="width:'+pLate+'%;background:#fb923c"></div>';
    if(pCo)h+='<div style="width:'+pCo+'%;background:#c084fc"></div>';
    h+='</div>';
    h+='<div style="display:flex;gap:8px;margin-top:4px;font-size:9px;color:rgba(255,255,255,0.45)">';
    h+='<span>✓ On time '+pOn+'%</span>';
    if(pEarly)h+='<span>Early '+pEarly+'%</span>';
    if(pLate)h+='<span>Late '+pLate+'%</span>';
    if(pCo)h+='<span>CO '+pCo+'%</span>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

// ── CARRY-OVER REVIEW ────────────────────────────────────────────
function getCarryOverPool(){
  const curWeek=weekData.week||WK;
  // Sort by numeric week number — archivedAt is a human-readable string, not sortable as-is
  const archEntries=Object.values(archive||{})
    .filter(a=>a&&a.tasks&&a.weekLabel!==curWeek)
    .sort((a,b)=>{
      const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
      const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
      return nb-na;
    });
  if(!archEntries.length) return {prev:null,tasks:[]};
  const prev=archEntries[0];
  const awChecked=prev.checked||{};
  const curIds=new Set((weekData.tasks||[]).map(t=>t.id));
  // Mirror exactly what the history log shows as pink "missed" items:
  // non-_c base tasks where neither the original nor its _c was checked.
  // included = true by default; only false if user explicitly unchecked it.
  const excl=coExclusions[WK]||{};
  const tasks=(prev.tasks||[])
    .filter(t=>!t.id.endsWith("_c")
      &&!awChecked[t.id]&&!awChecked[t.id+"_c"]  // not completed in previous week
      &&!checked[t.id+"_c"])                       // not completed this week either
    .map(t=>({...t,id:t.id+"_c",day:"monday",cascade:true,
      included:!excl[t.id+"_c"],
      prevWeek:prev.weekLabel||"prev week"}));
  return {prev,tasks};
}

// Auto-add any non-excluded carry-over tasks that aren't yet in weekData.tasks.
// Figures out the correct school day to place them on (today or next upcoming day).
function _syncCarryOvers(){
  const pool=getCarryOverPool();
  // Find the current or next upcoming school day based on calendar dates + day-of-week
  const _dayOrder=["monday","tuesday","wednesday","thursday","friday"];
  const _jsIdx={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5};
  const _todayIdx=new Date().getDay()||7; // Sunday→7
  const _todayMid=new Date(); _todayMid.setHours(0,0,0,0);
  let targetDay="monday";
  for(const _d of _dayOrder){
    // Use calendar date if available, otherwise fall back to day-of-week index
    if(DAY_DT[_d]){
      const _cal=new Date(DAY_DT[_d]+", "+_todayMid.getFullYear()); _cal.setHours(0,0,0,0);
      if(_cal>=_todayMid){ targetDay=_d; break; }
    } else if(_jsIdx[_d]>=_todayIdx){ targetDay=_d; break; }
  }
  let changed=false;
  pool.tasks.filter(t=>t.included&&!weekData.tasks.some(x=>x.id===t.id)).forEach(t=>{
    weekData.tasks.push({...t,day:targetDay,included:undefined,prevWeek:undefined,
      detail:(t.detail||t.title||"")+" (Carried from "+(t.prevWeek||"prev week")+")"});
    changed=true;
  });
  if(changed){
    sv(WK+"_tasks",weekData.tasks);
    lastTasksWrite=Date.now();
    if(db){const obj={};weekData.tasks.forEach(t=>obj[t.id]=t);db.ref(WK+"/tasks").set(obj);}
    renderAll();
  }
}

function toggleCarryOver(taskId,include){
  if(!coExclusions[WK]) coExclusions[WK]={};
  if(include){
    // Re-check: remove from exclusions, add back to task list
    delete coExclusions[WK][taskId];
    if(!weekData.tasks.some(x=>x.id===taskId)){
      const pool=getCarryOverPool();
      const t=pool.tasks.find(x=>x.id===taskId);
      if(t) weekData.tasks.push({...t,included:undefined,prevWeek:undefined,
        detail:(t.detail||t.title||"")+" (Carried from "+(t.prevWeek||"prev week")+")"});
    }
  } else {
    // Uncheck: add to exclusions, remove from task list
    coExclusions[WK][taskId]=true;
    weekData.tasks=weekData.tasks.filter(x=>x.id!==taskId);
    delete checked[taskId]; sv(WK+"_checked",checked);
    if(db) db.ref(WK+"/checked").set(checked);
  }
  try{localStorage.setItem("ha_co_excl",JSON.stringify(coExclusions));}catch(e){}
  if(db) db.ref("co_excl/"+WK).set(coExclusions[WK]);
  sv(WK+"_tasks",weekData.tasks);
  lastTasksWrite=Date.now();
  if(db){const obj={};weekData.tasks.forEach(t=>obj[t.id]=t);db.ref(WK+"/tasks").set(obj);}
  const el=document.getElementById("content"); if(el&&tab==="history") renderHistory(el);
}

function checkOffCarryOver(taskId){
  const t=weekData.tasks.find(x=>x.id===taskId); if(!t) return;
  const ts=nowTs();
  checked[taskId]=ts; sv(WK+"_checked",checked);
  lastCheckedWrite=Date.now();
  if(db) db.ref(WK+"/checked").set(checked);
  const hist=ld(WK+"_history")||{};

  hist[taskId]=entry; histState[taskId]=entry;
  sv(WK+"_history",hist);
  if(db) db.ref(WK+"/history/"+taskId).set(entry);
  renderAll();
}

function buildKidAttendance(kid){
  const weeks=[]; const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  Object.keys(archive).sort().forEach(wkKey=>{
    const aw=archive[wkKey];
    const awt=(aw.tasks||[]).filter(t=>t.who===kid&&!t.id.endsWith("_c"));
    const awc=aw.checked||{}; const awd=aw.dates||{};
    const days=[];
    DAYS.forEach(d=>{
      const dt=awt.filter(t=>t.day===d);
      const ov=((attOverrides[wkKey]||{})[d]||{})[kid];
      if(!dt.length&&ov===undefined) return; // skip only if no tasks AND no override
      const computed=dt.some(t=>awc[t.id]||awc[t.id+"_c"]);
      const attended=ov!==undefined?ov:computed;
      days.push({day:d,date:awd[d]||null,attended,past:true});
    });
    if(days.length) weeks.push({wkKey,label:(aw.weekLabel||wkKey).replace("week","Week "),days,archived:true});
  });
  const cur=(weekData.tasks||[]).filter(t=>t.who===kid&&!t.id.endsWith("_c"));
  const curDays=[];
  DAYS.forEach(d=>{ const dt=cur.filter(t=>t.day===d); if(!dt.length)return;
    const ds=DAY_DT[d]||""; let past=true;
    if(ds){ const p=new Date(ds+", "+new Date().getFullYear()); p.setHours(0,0,0,0); past=p<=todayMid; }
    curDays.push({day:d,date:ds,attended:dt.some(t=>checked[t.id]||checked[t.id+"_c"]),past}); });
  if(curDays.length) weeks.push({wkKey:WK,label:(WK||"week").replace("week","Week "),days:curDays,current:true});
  const total=weeks.reduce((s,w)=>s+w.days.filter(d=>d.past&&d.attended).length,0);
  return {weeks,total};
}

function printWeekReport(weekKey,filterKid){
  const fk=filterKid||(kid!=="all"&&kid!=="mom"?kid:null);
  let tasks,chk,dates,label,hist;
  if(!weekKey||weekKey===WK){
    tasks=weekData.tasks||[];chk=checked||{};dates={...DAY_DT};
    label=(weekData.week||WK).replace("week","Week ");
    hist=histState||{};
  } else {
    const aw=archive[weekKey]; if(!aw)return;
    tasks=aw.tasks||[];chk=aw.checked||{};dates=aw.dates||{};
    label=(aw.weekLabel||weekKey).replace("week","Week ");
    hist=aw.history||{};
  }
  if(fk) label+=(' — '+cap(fk));
  const kids=fk?[fk]:["lincoln","ellis","lucy","julian"];
  let body='';
  kids.forEach(k=>{
    const kt=tasks.filter(t=>t.who===k&&!t.id.endsWith("_c"));
    if(!kt.length)return;
    const subjs={};
    kt.forEach(t=>{
      const title=t.title||"";
      const dash=title.indexOf(" — ");
      const prefix=dash>0?title.substring(0,dash).replace(/[^\x20-\x7E]/g,"").trim():"Other";
      const detail=dash>0?title.substring(dash+3).trim():title.replace(/[^\x20-\x7E]/g,"").trim();
      const isDone=!!(chk[t.id]||chk[t.id+"_c"]);
      if(!subjs[prefix])subjs[prefix]={done:[],missed:[]};
      subjs[prefix][isDone?"done":"missed"].push({detail,day:t.day||""});
    });
    const totalDone=kt.filter(t=>chk[t.id]||chk[t.id+"_c"]).length;
    const pct=kt.length?Math.round(totalDone/kt.length*100):0;
    const col=PACE_KCOL[k]||"#374151";
    body+='<div style="page-break-inside:avoid;margin-bottom:16px">';
    body+='<h2 style="color:'+col+';margin:16px 0 6px;border-bottom:2px solid '+col+';padding-bottom:4px">'+cap(k);
    body+='<span style="float:right;font-size:11pt;font-weight:400;color:#555">'+totalDone+'/'+kt.length+' ('+pct+'%)</span></h2>';
    Object.keys(subjs).sort().forEach(subj=>{
      const s=subjs[subj];
      body+='<div style="margin:4px 0 8px">';
      body+='<div style="font-weight:700;font-size:10pt;color:#374151;padding:2px 0;border-bottom:1px solid #e5e7eb">'+subj;
      body+='<span style="font-weight:400;color:#9ca3af;font-size:9pt"> — '+s.done.length+'/'+(s.done.length+s.missed.length)+'</span></div>';
      s.done.forEach(t=>{
        body+='<div style="font-size:9pt;color:#16a34a;padding:1px 0 1px 12px">&#10003; '+t.detail;
        if(t.day)body+=' <span style="color:#9ca3af;font-size:8pt">('+cap(t.day).slice(0,3)+')</span>';
        body+='</div>';
      });
      s.missed.forEach(t=>{
        body+='<div style="font-size:9pt;color:#dc2626;padding:1px 0 1px 12px">&#10007; '+t.detail;
        if(t.day)body+=' <span style="color:#9ca3af;font-size:8pt">('+cap(t.day).slice(0,3)+')</span>';
        body+='</div>';
      });
      body+='</div>';
    });
    body+='</div>';
  });
  const dv=Object.values(dates).filter(Boolean).sort();
  const dateStr=dv.length?dv[0]+' – '+dv[dv.length-1]:'';
  let html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Howe Academy — '+label+' Report</title>'+
    '<style>body{font-family:Arial,sans-serif;font-size:10pt;color:#222;max-width:680px;margin:0 auto;padding:24px}'+
    'h1{font-size:16pt;margin-bottom:4px}h2{font-size:12pt;page-break-after:avoid}'+
    '@media print{@page{size:portrait;margin:0.5in}}</style></head><body>'+
    '<h1>Howe Academy — Weekly Completion Report</h1>'+
    '<p style="font-size:10pt;color:#444;margin:2px 0"><strong>'+label+'</strong>'+(dateStr?' &middot; '+dateStr:'')+'</p>'+
    '<p style="font-size:9pt;color:#888;margin:2px 0 10px">Generated '+nowTs()+'</p>'+
    '<hr style="border:none;border-top:1px solid #ccc;margin:0 0 4px">'+body;
  // Timing stats section (only if data exists)
  const ts=timingStats(hist,fk?[fk]:null);
  if(ts.all.total){
    html+='<div style="page-break-inside:avoid;margin-top:16px;padding-top:10px;border-top:1px solid #ccc">';
    html+='<h2 style="font-size:11pt;margin:0 0 6px;color:#374151">Completion Timing</h2>';
    const kidOrder=["lincoln","ellis","lucy","julian"].filter(k=>ts.byKid[k]);
    kidOrder.forEach(k=>{
      const s=ts.byKid[k];const avgL=s.late?Math.round(s.totalLateDays/s.late*10)/10:0;
      const col=PACE_KCOL[k]||"#374151";
      html+='<div style="margin:3px 0;font-size:9pt"><span style="font-weight:700;color:'+col+'">'+cap(k)+':</span> ';
      const parts=[];
      if(s.onTime)parts.push('<span style="color:#16a34a">'+s.onTime+' on time</span>');
      if(s.early)parts.push('<span style="color:#3b82f6">'+s.early+' early</span>');
      if(s.late)parts.push('<span style="color:#ea580c">'+s.late+' late (avg '+avgL+'d)</span>');
      if(s.carryOver)parts.push('<span style="color:#7c3aed">'+s.carryOver+' carry-over</span>');
      html+=parts.join(' · ')+'</div>';
    });
    html+='</div>';
  }
  html+='</body></html>';
  const w=window.open("","_blank");w.document.write(html);w.document.close();w.onload=()=>w.print();
}

function addManualAttWeek(label){
  const raw=label||"";
  const wkKey=raw.trim().toLowerCase().replace(/\s+/g,"");
  if(!wkKey){ alert("Please enter a week label (e.g. week1)"); return; }
  if(archive[wkKey]){ alert("That week already exists in the archive."); return; }
  const entry={weekLabel:wkKey,archivedAt:nowTs(),history:{},tasks:[],checked:{},dates:{}};
  archive[wkKey]=entry;
  try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e){}
  if(db) db.ref("archive/"+wkKey).set(entry);
  const el=document.getElementById("content"); if(el) renderHistory(el);
}

// ── JSON LOAD ─────────────────────────────────────────────────────
function loadJson(){
  const f=document.getElementById("json-input").files[0];
  if(!f){document.getElementById("admin-msg").textContent="No file selected.";return;}
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.week||!d.tasks){document.getElementById("admin-msg").textContent="❌ JSON missing week or tasks.";return;}
      const lunchConflicts=(d.tasks||[]).filter(t=>{
        const p=t.time&&t.time.match(/(\d+):(\d+)\s*(AM|PM)/i); if(!p)return false;
        let h=parseInt(p[1]); if(p[3].toUpperCase()==="PM"&&h!==12)h+=12; if(p[3].toUpperCase()==="AM"&&h===12)h=0;
        const m=h*60+parseInt(p[2]); return m>=780&&m<840;
      });
      if(lunchConflicts.length){
        const names=lunchConflicts.map(t=>t.id+"("+t.day+" "+t.time+")").join(", ");
        document.getElementById("admin-msg").textContent="⚠️ "+lunchConflicts.length+" task(s) during lunch (1–2 PM): "+names+". Move to 2:05 PM or later.";
        return;
      }
      isUploading=true;
      const activeWK=localStorage.getItem("ha_active_wk")||WK;
      const isSameWeek=!!(d.week===activeWK);
      if(isSameWeek){
        const lsChecked=ld(activeWK+"_checked")||{};
        const memChecked=checked||{};
        const snapChecked={...lsChecked,...memChecked};
        const snapHist=ld(activeWK+"_history")||{};
        const oldLookup={};
        (weekData.tasks||[]).forEach(t=>{
          const key=(t.title||"")+"|"+(t.who||"");
          if(snapChecked[t.id]) oldLookup[key]={ts:snapChecked[t.id],oldId:t.id};
        });
        d.tasks.forEach(t=>{
          if(snapChecked[t.id]) return;
          const key=(t.title||"")+"|"+(t.who||"");
          if(oldLookup[key]){
            snapChecked[t.id]=oldLookup[key].ts;
            if(snapHist[oldLookup[key].oldId]&&!snapHist[t.id])
              snapHist[t.id]={...snapHist[oldLookup[key].oldId],id:t.id};
          }
        });
        const snapSl=ld(activeWK+"_sl")||slState||{};
        // Re-attach cross-week carry-over tasks:
        // Pass 1 — grab any _c tasks still alive in weekData.tasks whose base isn't in the new JSON
        const newIds=new Set(d.tasks.map(t=>t.id));
        (weekData.tasks||[]).filter(t=>t.id.endsWith("_c")&&!newIds.has(t.id)&&!newIds.has(baseId(t.id)))
          .forEach(t=>{ d.tasks.push(t); newIds.add(t.id); });
        // Pass 2 — reconstruct from the most-recent archive in case carry-overs were already wiped.
        // Same filter as the Carry-overs tab: all base tasks not completed in any form.
        const _archPrev=Object.values(archive||{}).filter(a=>a&&a.tasks&&a.weekLabel!==d.week)
          .sort((a,b)=>{
            const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
            const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
            return nb-na;
          })[0];
        if(_archPrev){
          const _awc=_archPrev.checked||{};
          (_archPrev.tasks||[]).filter(t=>!t.id.endsWith("_c")&&!_awc[t.id]&&!_awc[t.id+"_c"])
            .forEach(t=>{
              const _cId=t.id+"_c";
              if(newIds.has(_cId)) return;                        // already present
              if((snapChecked||{})[_cId]) return;               // already completed this week
              if((coExclusions[d.week]||{})[_cId]) return;      // user explicitly excluded
              d.tasks.push({...t,id:_cId,day:"monday",cascade:true,
                detail:(t.detail||t.title||"")+" (Carried from "+(_archPrev.weekLabel||"prev week")+")"});
              newIds.add(_cId);
            });
        }
        // GC: purge checked/history entries for task IDs not in the new set
        const commitIds=new Set(d.tasks.map(t=>t.id));
        for(const id in snapChecked){ if(!commitIds.has(id)) delete snapChecked[id]; }
        for(const id in snapHist){ if(!commitIds.has(id)) delete snapHist[id]; }
        WK=activeWK; weekData=d; checked=snapChecked; slState=snapSl;
        if(d.supplies&&Array.isArray(d.supplies)){SUP=d.supplies;sv(WK+"_supplies_def",d.supplies);}
        if(d.supplyCategories&&Array.isArray(d.supplyCategories)) SUP_CATS=d.supplyCategories;
        applyWeekMeta(d);
        sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
        sv(WK+"_checked",snapChecked); sv(WK+"_history",snapHist); sv(WK+"_sl",snapSl);
        sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        if(db){
          const obj={};d.tasks.forEach(t=>obj[t.id]=t);
          db.ref(WK+"/tasks").set(obj);
          db.ref(WK+"/checked").set(snapChecked);
          db.ref(WK+"/history").set(snapHist);
          if(Object.keys(snapSl).length) db.ref(WK+"/sl").set(snapSl);
          if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
          db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        }
        fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
        renderAll(); runCascade();
        document.getElementById("admin-msg").textContent="✅ "+d.week+" updated — "+d.tasks.length+" tasks. Completions & history preserved.";
      } else {
        const oldWK=activeWK;
        const snapHist=ld(oldWK+"_history")||{};
        const snapTasks=weekData.tasks||[];
        const snapChecked={...(ld(oldWK+"_checked")||{}), ...checked};
        snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"]).forEach(t=>{
          if(!snapHist[t.id+"_missed"])
            snapHist[t.id+"_missed"]={id:t.id,title:t.title,who:t.who,day:t.day,ts:"Week Closed",missed:true,momRequired:t.mom==="required"};
        });
        const hasAnything=Object.keys(snapHist).length>0||snapTasks.length>0;
        if(hasAnything){
          const snapSlotPts=ld(oldWK+"_slot_points")||{};
          const entry={weekLabel:oldWK,archivedAt:nowTs(),history:snapHist,tasks:snapTasks,checked:snapChecked,dates:{...DAY_DT},slot_points:snapSlotPts};
          archive[oldWK]=entry;
          try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e2){}
          if(db) db.ref("archive/"+oldWK).set(entry);
        }
        // Carry ALL uncompleted tasks from old week into Monday of new week.
        // Same filter as Carry-overs tab: base tasks where neither original nor _c was checked.
        snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"])
          .forEach(t=>{
            const cId=t.id+"_c";
            if(!d.tasks.some(x=>x.id===cId))
              d.tasks.push({...t,id:cId,day:"monday",cascade:true,
                detail:(t.detail||t.title||"")+" (Carried from "+oldWK+")"});
          });
        WK=d.week; localStorage.setItem("ha_active_wk",WK);
        if(db) db.ref("ha_active_wk").set(WK);
        weekData=d; checked={}; slState={};
        if(d.supplies&&Array.isArray(d.supplies)){SUP=d.supplies;sv(WK+"_supplies_def",d.supplies);}
        if(d.supplyCategories&&Array.isArray(d.supplyCategories)) SUP_CATS=d.supplyCategories;
        sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
        sv(WK+"_checked",{}); sv(WK+"_sl",{}); sv(WK+"_history",{});
        sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        if(db){
          db.ref(WK+"/checked").set({}); db.ref(WK+"/sl").set({}); db.ref(WK+"/history").set({});
          const obj={};d.tasks.forEach(t=>obj[t.id]=t);
          db.ref(WK+"/tasks").set(obj);
          if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
          db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
          attachWeekListeners(WK);
        }
        applyWeekMeta(d);
        fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
        renderAll(); runCascade();
        document.getElementById("admin-msg").textContent="✅ "+d.week+" loaded — "+d.tasks.length+" tasks. Previous week archived.";
      }
      setTimeout(()=>{ isUploading=false; },3000);
    }catch(err){ isUploading=false; document.getElementById("admin-msg").textContent="❌ "+err.message; }
  };
  r.readAsText(f);
}

// ── CURRICULUM UPLOAD ─────────────────────────────────────────────
function uploadCurriculum(){
  const msg=document.getElementById("admin-msg");
  if(!adminPinUnlocked){msg.textContent="Enter Mom PIN first (Rules tab).";return;}
  const f=document.getElementById("xlsx-input").files[0];
  if(!f){msg.textContent="No .xlsx file selected.";return;}
  if(!db){msg.textContent="Not connected to Firebase.";return;}
  msg.textContent="Parsing curriculum...";
  const reader=new FileReader();
  reader.onerror=()=>{msg.textContent="Failed to read file.";};
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
      const curriculum={uploadedAt:new Date().toISOString(),fileName:f.name,subjects:{},lessons:{},weekDays:{}};
      const empty=v=>{const s=String(v??"").trim();return !s||s==="nan"||s==="NaN"||s==="None"||s==="—"||s==="undefined";};
      const weekNum=w=>{const m=String(w).match(/Wk\s*(\d+)/i);return m?parseInt(m[1]):0;};

      for(const[sheet,kid] of Object.entries(CURR_SHEET_KID)){
        if(!wb.SheetNames.includes(sheet)){msg.textContent="Sheet not found: "+sheet;return;}
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:false,dateNF:'yyyy-mm-dd'});
        const keyMap=CURR_KEY_MAP[sheet]||{};
        const headerRow=rows[2]||[];
        const deviceRow=rows[3]||[];
        const momRow=rows[4]||[];
        const minutesRow=rows[5]||[];
        const rulesRow=rows[6]||[];
        const daysRow=rows[7]||[];

        const subjects={};
        for(const[colStr,key] of Object.entries(keyMap)){
          const c=parseInt(colStr);
          let display=String(headerRow[c]??"").trim().replace(/\n/g," ").replace(/\s*\([^)]*\)\s*$/,"").trim();
          if(empty(display))display=key;
          const device=empty(deviceRow[c])?"paper":String(deviceRow[c]).trim().toLowerCase();
          const mom=empty(momRow[c])?"none":String(momRow[c]).trim().toLowerCase();
          const minutes=parseInt(String(minutesRow[c]??"20"))||20;
          const rules=empty(rulesRow[c])?"":String(rulesRow[c]).trim();
          const days=empty(daysRow[c])?"":String(daysRow[c]).trim();
          subjects[key]={display,device,mom,minutes,rules,days,total:0};
        }

        const lessons={};
        const wdMap={};
        for(let r=8;r<rows.length;r++){
          const row=rows[r];
          if(!row||!row.length)continue;
          const dayRaw=row[0];
          const dayNum=parseInt(String(dayRaw));
          if(isNaN(dayNum))continue;
          const wkRaw=String(row[2]??"").trim();
          if(!wkRaw||weekNum(wkRaw)<CURR_MIN_WEEK)continue;

          let dateStr="";
          const dateVal=row[1];
          if(dateVal instanceof Date&&!isNaN(dateVal)){dateStr=dateVal.toISOString().split("T")[0];}
          else if(dateVal){
            const s=String(dateVal).trim();
            const p=Date.parse(s);
            if(!isNaN(p))dateStr=new Date(p).toISOString().split("T")[0];
            else dateStr=s;
          }

          const lesson={week:wkRaw,date:dateStr};
          let hasData=false;
          for(const[colStr,key] of Object.entries(keyMap)){
            const c=parseInt(colStr);
            const val=row[c];
            if(!empty(val)){
              lesson[key]=String(val).trim();
              subjects[key].total++;
              hasData=true;
            }
          }
          if(hasData){
            lessons[dayNum]=lesson;
            if(!wdMap[wkRaw])wdMap[wkRaw]=[];
            wdMap[wkRaw].push(dayNum);
          }
        }

        for(const wk of Object.keys(wdMap))wdMap[wk].sort((a,b)=>a-b);
        curriculum.subjects[kid]=subjects;
        curriculum.lessons[kid]=lessons;
        curriculum.weekDays[kid]=wdMap;
      }

      const stats=Object.entries(CURR_SHEET_KID).map(([_,kid])=>{
        const ns=Object.keys(curriculum.subjects[kid]||{}).length;
        const nd=Object.keys(curriculum.lessons[kid]||{}).length;
        const nw=Object.keys(curriculum.weekDays[kid]||{}).length;
        return kid+": "+ns+" subjects, "+nd+" days, "+nw+" weeks";
      });

      msg.textContent="Uploading to Firebase...";
      db.ref("curriculum").set(curriculum).then(()=>{
        msg.innerHTML="Curriculum uploaded!<br>"+stats.join("<br>");
      }).catch(err=>{
        msg.textContent="Firebase error: "+err.message;
      });
    }catch(err){
      msg.textContent="Parse error: "+err.message;
      console.error("Curriculum parse error:",err);
    }
  };
  reader.readAsArrayBuffer(f);
}

function printSchedule(){
  const kids=["lincoln","ellis","lucy"];
  const names={lincoln:"Lincoln",ellis:"Ellis",lucy:"Lucy"};
  const momColors={required:"#fde8d8",maybe:"#fdf6e3",none:"#ffffff"};
  const momLabels={required:"★",maybe:"◆",none:""};
  const days=DAYS.filter(d=>weekData.tasks.some(t=>t.day===d));

  function fmtTime(t){
    t=t.trim();
    if(t.endsWith("AM")) return t.slice(0,-3).trim()+"a";
    if(t.endsWith("PM")) return t.slice(0,-3).trim()+"p";
    return t;
  }
  function cleanTitle(t){
    return t.replace(/^[\u{1F000}-\u{1FFFF}\u{2600}-\u{27FF}\u{1F300}-\u{1FAFF}]\s*/u,"").trim();
  }

  let pages="";
  for(const day of days){
    const dateStr=DAY_DT[day]||"";
    const constraint=CONSTRAINT[day]||"";
    const window_=WIN[day]||WIN["default"]||"";
    const constraintHtml=constraint
      ? `<div style="background:#fff2cc;color:#7d4c00;font-size:8.5pt;font-weight:bold;padding:3px 8px;margin-bottom:5px;border-left:3px solid #f0a500">${constraint}</div>`
      : "";

    let cols="";
    for(const kid of kids){
      const tasks=weekData.tasks.filter(t=>t.day===day&&t.who===kid&&!t.id.endsWith("_c"));
      let rows="";
      for(const t of tasks){
        const bg=momColors[t.mom]||"#fff";
        const star=momLabels[t.mom]||"";
        const starHtml=star?`<span style="font-size:7pt;margin-left:3px;color:#c0541a">${star}</span>`:"";
        rows+=`<div style="display:grid;grid-template-columns:52px 1fr;border-bottom:1px solid #eee;background:${bg}">
          <div style="background:#f5f5f5;color:#555;font-size:7.5pt;padding:3px 4px;text-align:right;border-right:1px solid #e0e0e0;white-space:nowrap">${fmtTime(t.time)}</div>
          <div style="padding:3px 6px;font-size:8pt;line-height:1.3">${cleanTitle(t.title)}${starHtml}</div>
        </div>`;
      }
      if(!rows) rows=`<div style="padding:8px;color:#aaa;font-size:8pt;text-align:center">—</div>`;
      cols+=`<div style="border:1px solid #ccc;border-radius:3px;overflow:hidden">
        <div style="background:#2c5f8a;color:#fff;font-weight:bold;font-size:10pt;padding:4px 8px;text-align:center">${names[kid]}</div>
        ${rows}
      </div>`;
    }

    pages+=`<div style="width:100%;page-break-after:always;padding:8px 10px 4px">
      <div style="background:#1a1a1a;color:#fff;font-size:11pt;font-weight:bold;padding:5px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">
        <span>${day.charAt(0).toUpperCase()+day.slice(1)} — ${dateStr}</span>
        <span style="font-size:8pt;font-weight:normal;color:#ccc">${window_}</span>
      </div>
      ${constraintHtml}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">${cols}</div>
      <div style="margin-top:6px;font-size:7.5pt;color:#666;text-align:right">★ Mom Required &nbsp;&nbsp; ◆ May need Mom</div>
    </div>`;
  }

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${(WK||"week").replace("week","Week ")} Schedule</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:9pt;color:#222}
    @media print{@page{size:landscape;margin:0.4in}div[style*="page-break-after:always"]:last-child{page-break-after:avoid}}</style>
    </head><body>${pages}</body></html>`;

  const w=window.open("","_blank");
  w.document.write(html);
  w.document.close();
  w.onload=function(){w.print();};
}

// Debounced cascade scheduler — collapses multiple rapid listener fires into one cascade run.
// Only runs when BOTH checked and tasks have been loaded from Firebase.
function schedCascade(){
  clearTimeout(cascadeDebounce);
  cascadeDebounce=setTimeout(()=>{
    if(fbCheckedLoaded&&fbTasksLoaded&&fbHistoryLoaded){
      cascadeIntraWeek();
      runCascade();
    }
  },2000);
}

function cascadeIntraWeek(){
  const dayOrder=["monday","tuesday","wednesday","thursday","friday"];
  const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  const jsDay=new Date().getDay()||7;
  let today=null;
  for(const d of dayOrder){
    if(DAY_DT[d]){
      const cal=new Date(DAY_DT[d]+", "+todayMid.getFullYear()); cal.setHours(0,0,0,0);
      if(cal.getTime()===todayMid.getTime()){ today=d; break; }
    } else if({monday:1,tuesday:2,wednesday:3,thursday:4,friday:5}[d]===jsDay){ today=d; break; }
  }
  if(!today) return;
  const todayIdx=dayOrder.indexOf(today);
  let changed=false;
  weekData.tasks.forEach(t=>{
    if(t.id.endsWith("_c")) return;
    if(checked[t.id]) return;
    const idx=dayOrder.indexOf(t.day);
    if(idx<0||idx>=todayIdx) return;
    let isPast=false;
    if(DAY_DT[t.day]){
      const cal=new Date(DAY_DT[t.day]+", "+todayMid.getFullYear()); cal.setHours(0,0,0,0);
      isPast=cal<todayMid;
    } else { isPast={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5}[t.day]<jsDay; }
    if(!isPast) return;
    t.cascadedFrom=t.cascadedFrom||t.day;
    t.day=today;
    changed=true;
  });
  if(!changed) return;
  const r=rulesData||{};
  const sd=r.schoolDay||{};
  const sdOv=(sd.overrides||{})[today]||{};
  const dEnd=toMin(sdOv.end||sd.defaultEnd||"4:15 PM");
  const lunchS=toMin(sdOv.lunchStart||sd.lunchStart||"1:00 PM");
  const lunchE=toMin(sdOv.lunchEnd||sd.lunchEnd||"2:00 PM");
  const existing=weekData.tasks.filter(t=>!t.cascadedFrom&&t.day===today);
  let cursor=0;
  existing.forEach(t=>{ const m=toMin(t.time); if(m>cursor) cursor=m; });
  if(cursor>0) cursor+=20;
  const dStart=toMin(sdOv.start||sd.defaultStart||"10:00 AM");
  if(cursor<dStart) cursor=dStart;
  // Check if today is a babysitter day — respect sitter rules for cascaded tasks
  const mag=weekData.babysitter||{};
  const isSitterToday=mag.days&&mag.days.includes(today);
  const sitterReturn=isSitterToday?toMin(mag["mom_return_"+today]||mag.mom_return||"2:00 PM"):0;
  const sitterKids=mag.withSitter||(rulesData&&rulesData.withSitter)||[];
  weekData.tasks.filter(t=>t.cascadedFrom&&t.day===today&&!checked[t.id]).forEach(t=>{
    // withSitter kids: ALL tasks after return. Other kids: only mom-required after return.
    if(isSitterToday&&cursor<sitterReturn){
      if(sitterKids.includes(t.who)||t.mom==="required") cursor=sitterReturn;
    }
    if(cursor>=lunchS&&cursor<lunchE) cursor=lunchE;
    if(cursor>=dEnd) cursor=dEnd-20;
    t.time=fromMin(cursor);
    cursor+=20;
  });
  sv(WK+"_tasks",weekData.tasks);
  lastTasksWrite=Date.now();
  if(db){const obj={};weekData.tasks.forEach(t=>obj[t.id]=t);db.ref(WK+"/tasks").set(obj);}
  renderAll();
}

function runCascade(){
  if(!fbHistoryLoaded||!fbCheckedLoaded||!fbTasksLoaded) return;
  // GC: remove checked/history entries that don't belong to any current task
  const taskIds=new Set(weekData.tasks.map(x=>x.id));
  if(taskIds.size>0){
    let gcCount=0;
    for(const id in checked){ if(!taskIds.has(id)){ delete checked[id]; gcCount++; } }
    for(const id in histState){ if(!taskIds.has(id)){ delete histState[id]; gcCount++; } }
    if(gcCount){
      sv(WK+"_checked",checked); sv(WK+"_history",histState);
      lastCheckedWrite=Date.now();
      if(db){ db.ref(WK+"/checked").set(checked); db.ref(WK+"/history").set(histState); }
      dbg("gc: purged "+gcCount+" orphan entries");
    }
  }
  const toRestore={};
  const histUpdates={};
  const currentIds=taskIds;
  weekData.tasks.forEach(t=>{
    if(checked[t.id]) return;
    if(manualUnchecks.has(t.id)) return;
    const h=histState[t.id];
    if(h&&h.ts&&!h.missed&&!h.flag&&(!h.week||h.week===WK)){ toRestore[t.id]=h.ts; return; }
    if(t.title&&t.who){
      const cutoff=Date.now()-7*24*60*60*1000;
      for(const k in histState){
        if(currentIds.has(k)) continue;
        const v=histState[k];
        if(!v||!v.ts||v.missed||v.flag) continue;
        if(v.title!==t.title||v.who!==t.who||v.day!==t.day) continue;
        if(v.week&&v.week!==WK) continue;
        const tsMs=(typeof v.ts==="number")?v.ts:new Date(v.ts).getTime();
        if(tsMs<cutoff) continue;
        toRestore[t.id]=v.ts;
        if(!histState[t.id]){ histUpdates[t.id]={...v,id:t.id,week:WK}; histState[t.id]=histUpdates[t.id]; }
        break;
      }
    }
  });
  if(Object.keys(toRestore).length){
    Object.assign(checked,toRestore);
    sv(WK+"_checked",checked);
    lastCheckedWrite=Date.now();
    if(db) db.ref(WK+"/checked").update(toRestore);
    if(Object.keys(histUpdates).length){
      sv(WK+"_history",histState);
      if(db) db.ref(WK+"/history").update(histUpdates);
    }
    dbg("reconciled "+Object.keys(toRestore).length+" checks from history");
    renderAll();
  }
}

function toggleActFav(id){
  actFavs[id]=!actFavs[id];
  if(!actFavs[id]) delete actFavs[id];
  try{localStorage.setItem('act_favs',JSON.stringify(actFavs));}catch(e){}
  if(db) db.ref("act_favs").set(actFavs);
  if(tab==='activities'){ renderActFilters(); renderActCards(); }
}

function loadActJson(){
  var f=document.getElementById('act-json-input').files[0];
  var msg=document.getElementById('act-upload-msg');
  if(!f){if(msg)msg.textContent='No file selected.';return;}
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      var arr=Array.isArray(d)?d:(d.activities||[]);
      if(!arr.length){if(msg)msg.textContent='❌ No activities found. Expecting an array or {activities:[...]}';return;}
      var added=0;
      arr.forEach(function(a){
        if(!a.id||!a.cat||!a.t||!a.d) return;
        var exists=actExtras.find(function(x){return x.id===a.id;});
        if(!exists){actExtras.push(a);added++;}
      });
      actUploadMsg='✅ Added '+added+' new activities ('+actExtras.length+' total extras).';
      if(msg) msg.textContent=actUploadMsg;
      renderActCards();
    }catch(err){
      actUploadMsg='❌ '+err.message;
      if(msg) msg.textContent=actUploadMsg;
    }
  };
  r.readAsText(f);
}

// Build cumulative expected counts from curriculum data
function buildCurrPaceCum(){
  currPaceCum={};
  if(!currData||!currData.weekDays||!currData.lessons||!currData.subjects) return;
  for(const kid of Object.keys(currData.subjects)){
    currPaceCum[kid]={};
    const wdMap=currData.weekDays[kid]||{};
    const lessons=currData.lessons[kid]||{};
    const subjectKeys=Object.keys(currData.subjects[kid]||{});
    // Collect all week numbers, sorted
    const weekNums=Object.keys(wdMap).map(w=>{const m=w.match(/Wk\s*(\d+)/i);return m?parseInt(m[1]):0;}).filter(n=>n>0);
    weekNums.sort((a,b)=>a-b);
    for(const sk of subjectKeys){
      let cum=0;
      const byWk={};
      for(const wn of weekNums){
        const dayNums=wdMap["Wk "+wn]||[];
        for(const d of dayNums){if(lessons[d]&&lessons[d][sk])cum++;}
        byWk[wn]=cum;
      }
      currPaceCum[kid][sk]=byWk;
    }
  }
}

// Get current app week number from WK variable (e.g. "week8" → 8)
function currWeekNum(){
  const m=(WK||"").match(/(\d+)/);

}

// Get curriculum-based expected count for a subject through a given week
function currExpected(kid,subjectKey,weekNum){
  const byWk=(currPaceCum[kid]||{})[subjectKey];
  if(!byWk) return null;
  // Find the closest week <= weekNum
  let best=null;
  for(const wn of Object.keys(byWk)){
    const n=parseInt(wn);
    if(n<=weekNum&&(best===null||n>best)) best=n;
  }
  return best!==null?byWk[best]:null;
}

// Get keyword for auto-counting: prefer curriculum display name, fall back to pace subject keyword
function currKeyword(kid,subjectKey,paceSubj){

    return currData.subjects[kid][subjectKey].display;
  }

}

function paceStatus(current,total,startWeek,weekNum,totalWeeks,expected){
  if(!total) return "on-track";
  // Use curriculum expected count when available
  if(expected!==null&&expected!==undefined){
    const diff=current-expected;
    if(diff>=3) return "ahead";
    if(diff<=-3) return "behind";
    return "on-track";
  }
  // Fallback: linear estimate
  const sw=startWeek||1;
  if(weekNum<sw) return "not-started";
  const weeksActive=weekNum-sw+1;
  const weeksTotal=Math.max(1,totalWeeks-sw+1);
  const diff=(current/total)-(weeksActive/weeksTotal);
  if(diff>0.08) return "ahead";
  if(diff<-0.08) return "behind";
  return "on-track";
}

function paceStatusLabel(s){
  return s==="ahead"?"Ahead":s==="behind"?"Behind":s==="not-started"?"Not Started":"On Track";
}

// ── PACE AUTO-ADVANCE: lesson cursor from curriculum ──
// Build ordered sequence of lessons for a kid+subject from curriculum data
function buildSubjectLessons(kid,subjectKey){
  if(!currData||!currData.lessons||!currData.lessons[kid]) return [];
  const lessons=currData.lessons[kid];
  const seq=[];
  const dayNums=Object.keys(lessons).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  for(const dn of dayNums){
    const entry=lessons[dn];
    if(!entry) continue;
    const val=entry[subjectKey];
    if(val&&val!=="—"&&val!=="nan"&&val.trim()){
      seq.push({dayNum:dn,lesson:val,date:entry.date||""});
    }
  }
  return seq;
}

// Get the next upcoming lesson for a kid+subject based on auto-count cursor
function getNextLessons(kid,subjectKey,count){
  const seq=buildSubjectLessons(kid,subjectKey);
  if(!seq.length) return [];
  const paceSubj=((paceData.subjects||{})[kid]||{})[subjectKey];
  const kws=paceKeywords(kid,subjectKey,paceSubj);
  const autoC=paceAutoCount(kid,kws);
  const offset=(paceSubj&&paceSubj.offset)||0;
  const adjust=(paceSubj&&paceSubj.adjust)||0;
  const cursor=offset+autoC+adjust;
  // Return the next N lessons after the cursor
  const upcoming=[];
  for(let i=cursor;i<seq.length&&upcoming.length<(count||1);i++){
    upcoming.push(seq[i]);
  }
  return upcoming;
}

// Compute cursor position for a kid+subject without returning lessons
// (factored out of getNextLessons for two-tier cursor system)
function computeSubjectCursor(kid,subjectKey,excludeWeek){
  const paceSubj=((paceData.subjects||{})[kid]||{})[subjectKey];
  const kws=paceKeywords(kid,subjectKey,paceSubj);
  const autoC=paceAutoCount(kid,kws,excludeWeek);
  const offset=(paceSubj&&paceSubj.offset)||0;
  const adjust=(paceSubj&&paceSubj.adjust)||0;
  return offset+autoC+adjust;
}

// Get next lessons starting from a pre-computed cursor position
// (used by regeneration to avoid recalculating via paceAutoCount)
function getNextLessonsFromCursor(kid,subjectKey,cursor,count){
  const seq=buildSubjectLessons(kid,subjectKey);
  if(!seq.length) return [];
  const upcoming=[];
  for(let i=cursor;i<seq.length&&upcoming.length<(count||1);i++){
    upcoming.push(seq[i]);
  }
  return upcoming;
}

// Get just the next single lesson label (for display)
function getNextLessonLabel(kid,subjectKey){
  const next=getNextLessons(kid,subjectKey,1);
  return next.length?next[0].lesson:null;
}

// Get total lessons available in curriculum for a subject
function getCurrLessonCount(kid,subjectKey){

function parseTaskCount(title){
  let m=title.match(/pp\.\s*(\d+)\s*[–\-]\s*(\d+)/i);
  if(m) return Math.max(1,parseInt(m[2])-parseInt(m[1])+1);
  m=title.match(/\bMod(?:ules?)?\s+(\d+)\s*[–\-]\s*(\d+)/i);
  if(m) return Math.max(1,parseInt(m[2])-parseInt(m[1])+1);
  m=title.match(/\bMod(?:ules?)?\s+([\d][,\d\s]+)/i);
  if(m) return m[1].split(',').filter(x=>x.trim().match(/^\d+$/)).length||1;
  return 1;
}

function baseId(id){ let b=id; while(b.endsWith("_c"))b=b.slice(0,-2); return b; }
function histDone(id){
  // Check histState for a valid completion (not a missed/flag entry) on this id or any _c chain
  let cur=id;
  while(true){
    const e=histState[cur];
    if(e&&typeof e==="object"&&e.ts&&!e.missed&&!e.flag) return true;
    if(!cur.endsWith("_c")) break;
    cur=cur.slice(0,-2);
    if(cur===id) break; // safety
  }
  // Also check the original base id
  const base=baseId(id);
  const eb=histState[base];
  if(eb&&typeof eb==="object"&&eb.ts&&!eb.missed&&!eb.flag) return true;
  // Fallback: a JSON re-upload can renumber task IDs, so history entry may exist under an old ID.
  // Match by title+who on the current task being checked.
  const curTask=(weekData.tasks||[]).find(t=>t.id===id);
  if(curTask&&curTask.title&&curTask.who){
    for(const k in histState){
      const v=histState[k];
      if(v&&typeof v==="object"&&v.ts&&!v.missed&&!v.flag&&v.title===curTask.title&&v.who===curTask.who) return true;
    }
  }
  return false;
}
function chainDone(origId, checkedObj, tasksArr){
  if(checkedObj[origId]||histDone(origId)) return true;
  let id=origId+"_c";
  while(tasksArr.some(t=>t.id===id)){
    if(checkedObj[id]||histDone(id)) return true;
    id=id+"_c";
  }
  return false;
}
function effectiveDay(t){
  if(t.id.endsWith("_c")) return t.day;
  if(checked[t.id]){
    const h=histState[t.id];
    if(h&&h.checkedOnDay) return h.checkedOnDay;
    return t.day;
  }
  const order=["monday","tuesday","wednesday","thursday","friday","saturday"];
  const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  const jsDay=new Date().getDay();
  let idx=order.indexOf(t.day);
  if(idx<0) return t.day;
  while(idx<order.length){
    const d=order[idx];
    let isPast=false;
    if(DAY_DT[d]){
      const cal=new Date(DAY_DT[d]+", "+todayMid.getFullYear());
      cal.setHours(0,0,0,0);
      isPast=cal<todayMid;
    } else {
      const dIdx={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6}[d]||0;
      isPast=dIdx<(jsDay||7);
    }
    if(!isPast) return d;
    idx++;
  }
  return "carryover";
}
function currFirstWeekNum(){
  if(!currData||!currData.weekDays) return 1;
  let min=9999;
  for(const kid of Object.keys(currData.weekDays)){
    for(const wk of Object.keys(currData.weekDays[kid])){
      const n=parseInt((wk.match(/\d+/)||[0])[0])||0;
      if(n>0&&n<min) min=n;
    }
  }
  return min===9999?1:min;
}
function paceAutoCount(kid,keywords,excludeWeek){
  if(!keywords||!keywords.length) return 0;
  const kws=(typeof keywords==="string"?[keywords]:keywords).map(k=>k.toLowerCase().trim());
  const currStart=currFirstWeekNum();
  let count=0;
  if(!excludeWeek||excludeWeek!==WK){
    weekData.tasks.filter(t=>t.who===kid&&!t.id.endsWith("_c")).forEach(t=>{
      if(chainDone(t.id,checked,weekData.tasks)&&kws.some(kw=>(t.title||"").toLowerCase().includes(kw)))
        count+=1;
    });
  }
  Object.values(archive).forEach(aw=>{
    if(excludeWeek&&aw.weekLabel===excludeWeek) return;
    const awNum=parseInt(((aw.weekLabel||"").match(/\d+/)||[0])[0])||0;
    if(awNum>0&&awNum<currStart) return;
    const awChecked=aw.checked||{};
    const awTasks=aw.tasks||[];
    awTasks.filter(t=>t.who===kid&&!t.id.endsWith("_c")).forEach(t=>{
      if(chainDone(t.id,awChecked,awTasks)&&kws.some(kw=>(t.title||"").toLowerCase().includes(kw)))
        count+=1;
    });
  });
  return count;
}

function paceHasPendingCascade(kid,keywords){
  if(!keywords||!keywords.length) return false;
  const kws=(typeof keywords==="string"?[keywords]:keywords).map(k=>k.toLowerCase().trim());
  const furtherCascaded=new Set(weekData.tasks.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  return weekData.tasks.some(t=>
    t.who===kid&&t.id.endsWith("_c")&&
    !checked[t.id]&&!checked[t.id+"_c"]&&
    !furtherCascaded.has(t.id)&&
    kws.some(kw=>(t.title||"").toLowerCase().includes(kw))
  );
}
