function gwApplyRedistribution(dayData,rules){
  const WDAY_NAMES={0:"monday",1:"tuesday",2:"wednesday",3:"thursday",4:"friday",5:"saturday",6:"sunday"};
  const dateByName={};
  for(const dk of Object.keys(dayData)){
    const d=gwParseDate(dk);
    const dn=WDAY_NAMES[d.getDay()];
    if(dn) dateByName[dn]=dk;
  }

  dayData=JSON.parse(JSON.stringify(dayData));

  for(const rule of rules){
    const kid=rule.kid;
    const fromDay=rule.from.toLowerCase();
    const toDay=rule.to.toLowerCase();
    const subjects=rule.subjects;

    const fromDate=dateByName[fromDay];
    const toDate=dateByName[toDay];
    if(!fromDate||!toDate) continue;
    const fromKidTasks=(dayData[fromDate]||{})[kid];
    if(!fromKidTasks||!Object.keys(fromKidTasks).length) continue;

    const cls=gwClassifySubjects(kid);
    let keysToMove;
    if(subjects==="paper") keysToMove=Object.keys(fromKidTasks).filter(k=>cls.paper.includes(k));
    else if(subjects==="ipad") keysToMove=Object.keys(fromKidTasks).filter(k=>cls.ipad.includes(k));
    else if(subjects==="all") keysToMove=Object.keys(fromKidTasks);
    else if(Array.isArray(subjects)) keysToMove=subjects.filter(k=>fromKidTasks[k]);
    else continue;

    if(!keysToMove.length) continue;
    if(!dayData[toDate]) dayData[toDate]={};
    if(!dayData[toDate][kid]) dayData[toDate][kid]={};

    for(const key of keysToMove){
      dayData[toDate][kid][key]=fromKidTasks[key];
      delete fromKidTasks[key];
    }
  }
  return dayData;
}

function gwAutoBalance(dayData,lateStart,skipDays){
  const WDAY_NAMES={0:"monday",1:"tuesday",2:"wednesday",3:"thursday",4:"friday",5:"saturday"};
  dayData=JSON.parse(JSON.stringify(dayData));
  const sortedDates=Object.keys(dayData).sort();
  const skipSet=new Set((skipDays||[]).map(d=>d.toLowerCase()));
  const _rr=gwRules();
  const DAY_END=_rr.schoolEnd;
  const LUNCH=_rr.lunchEnd-_rr.lunchStart;

  for(const kid of ["lincoln","ellis","lucy","julian"]){
    const subjects=gwGetSubjects(kid);
    const durMap={};
    for(const[k,s] of Object.entries(subjects)) durMap[k]=s.minutes||20;
    const subjectRules={};
    for(const[k,s] of Object.entries(subjects)) subjectRules[k]=s.rules||"";
    // Subjects something sticks to can't move days either, or the pair splits
    const stickyTargets=new Set();
    for(const[k,s] of Object.entries(subjects)){
      if((s.rules||"").includes("sticky")&&s.stickyWith) stickyTargets.add(s.stickyWith);
    }

    const dayDates=[];
    const dayTotals={};
    for(const dk of sortedDates){
      const d=gwParseDate(dk);
      const dn=WDAY_NAMES[d.getDay()];
      if(!dn||skipSet.has(dn)) continue;
      const kidTasks=(dayData[dk]||{})[kid]||{};
      dayTotals[dk]=Object.keys(kidTasks).reduce((sum,k)=>sum+(durMap[k]||20),0);
      dayDates.push([dk,dn]);
    }

    // Capture original column order: values in Excel day order per subject
    const origOrder={};
    for(const[dk] of dayDates){
      const kt=(dayData[dk]||{})[kid]||{};
      for(const key of Object.keys(kt)){
        if(!origOrder[key]) origOrder[key]=[];
        origOrder[key].push(kt[key]);
      }
    }

    // Track slot counts per day per subject (supports doubling up)
    const slotCount={};
    for(const[dk] of dayDates){
      const kt=(dayData[dk]||{})[kid]||{};
      for(const key of Object.keys(kt)){
        const sk=dk+"|"+key;
        slotCount[sk]=1;
      }
    }

    let changed=true;
    while(changed){
      changed=false;
      const ranked=[...dayDates].sort((a,b)=>dayTotals[a[0]]-dayTotals[b[0]]);

      for(const[dk,dayName] of ranked){
        const startStr=(lateStart||{})[dayName]||((rulesData&&rulesData.schoolDay&&rulesData.schoolDay.defaultStart)||"10:00 AM");
        const capacity=DAY_END-toMin(startStr)-LUNCH;
        let room=capacity-dayTotals[dk];
        if(room<15) continue;

        const donors=[...dayDates].filter(x=>x[0]!==dk).sort((a,b)=>dayTotals[b[0]]-dayTotals[a[0]]);

        for(const[ld2,lday] of donors){
          if(room<15) break;
          if(dayTotals[ld2]<=dayTotals[dk]) continue;
          const srcTasks=(dayData[ld2]||{})[kid]||{};

          for(const key of Object.keys(srcTasks)){
            if(room<15) break;
            const dur=durMap[key]||20;
            if(dayTotals[ld2]-dur<dayTotals[dk]+dur) continue;
            const rules=subjectRules[key]||"";
            if(rules.includes("sticky")) continue;
            if(stickyTargets.has(key)) continue;
            if(rules.includes("no-fri")&&dayName==="friday") continue;
            if(rules.includes("mon-thu")&&!["monday","tuesday","wednesday","thursday"].includes(dayName)) continue;
            const allowed=subjects[key]&&subjects[key].allowedDays||[];
            const dayAbbr={monday:"Mon",tuesday:"Tue",wednesday:"Wed",thursday:"Thu",friday:"Fri",saturday:"Sat"}[dayName];
            if(allowed.length&&dayAbbr&&!allowed.includes(dayAbbr)) continue;
            // Only block doubling for max1 subjects (reflex, dictation)
            const dstTasks=(dayData[dk]||{})[kid]||{};
            if(dstTasks[key]!==undefined&&rules.includes("max1")) continue;
            if(dur>room) continue;

            // Decrement source slot count; delete key when count reaches 0
            const srcSlot=ld2+"|"+key;
            slotCount[srcSlot]=(slotCount[srcSlot]||1)-1;
            if(slotCount[srcSlot]<=0){
              delete slotCount[srcSlot];
              delete srcTasks[key];
            }
            // Increment dest slot count; ensure key exists in dayData
            const dstSlot=dk+"|"+key;
            slotCount[dstSlot]=(slotCount[dstSlot]||0)+1;
            if(!dayData[dk]) dayData[dk]={};
            if(!dayData[dk][kid]) dayData[dk][kid]={};
            dayData[dk][kid][key]="TMP";

            room-=dur;
            dayTotals[dk]+=dur;
            dayTotals[ld2]-=dur;
            changed=true;
          }
        }
      }
    }

    // Reassign values from original column order using slot counts
    // Earlier values go to earlier days; doubled days get values in order
    for(const key of Object.keys(origOrder)){
      const vals=origOrder[key];
      let vi=0;
      for(const[dk] of dayDates){
        const count=slotCount[dk+"|"+key]||0;
        if(count<=0){
          // Subject no longer on this day — clean up
          if(dayData[dk]&&dayData[dk][kid]&&dayData[dk][kid][key]!==undefined)
            delete dayData[dk][kid][key];
          continue;
        }
        if(!dayData[dk]) dayData[dk]={};
        if(!dayData[dk][kid]) dayData[dk][kid]={};
        if(count===1){
          dayData[dk][kid][key]=vals[vi++];
        } else {
          // Multiple on same day: array, earlier values first
          dayData[dk][kid][key]=vals.slice(vi,vi+count);
          vi+=count;
        }
      }
    }
  }
  return dayData;
}

// Mon..Sun date range for a plan week — extrapolates past the grid so
// synthesized make-up weeks (Finish Line "Extend") can be generated.
function gwWeekDateRange(weekNum){
  if(!currData||!currData.weekDays||!currData.lessons) return null;
  let anyDate=null;
  for(const kid of Object.keys(currData.weekDays)){
    const dayNums=(currData.weekDays[kid]||{})["Wk "+weekNum]||[];
    for(const dn of dayNums){ const l=(currData.lessons[kid]||{})[dn]; if(l&&l.date){anyDate=l.date;break;} }
    if(anyDate) break;
  }
  let mon;
  if(anyDate){ mon=gwParseDate(anyDate); }
  else {
    const mx=_maxPlanWeek();
    if(weekNum<=mx) return null;
    let anchor=null;
    for(const kid of Object.keys(currData.weekDays)){
      const dayNums=(currData.weekDays[kid]||{})["Wk "+mx]||[];
      for(const dn of dayNums){ const l=(currData.lessons[kid]||{})[dn]; if(l&&l.date&&(!anchor||l.date<anchor)) anchor=l.date; }
    }
    if(!anchor) return null;
    mon=gwParseDate(anchor);
    mon.setDate(mon.getDate()+(weekNum-mx)*7);
  }
  mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const end=new Date(mon); end.setDate(end.getDate()+6);
  const f=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return {start:f(mon),end:f(end)};
}

function gwReadWeek(weekNum,ignoreAuto){
  if(!currData||!currData.weekDays||!currData.lessons) return null;
  const dayData={};
  const weekLabel="Wk "+weekNum;

  for(const kid of ["lincoln","ellis","lucy","julian"]){
    const wdMap=currData.weekDays[kid]||{};
    const lessons=currData.lessons[kid]||{};
    const dayNums=wdMap[weekLabel];
    if(!dayNums||!dayNums.length) continue;

    for(const dn of dayNums){
      const lesson=lessons[dn];
      if(!lesson) continue;
      const dateStr=lesson.date;
      if(!dateStr) continue;
      if(smapIsKidOff(kid,dateStr)) continue; // calendar vacation/holiday/kid-off — slots vanish, cursors carry content forward
      if(_ovOffX(kid,dateStr,ignoreAuto)) continue; // Lesson Map: day turned off for this kid
      if(!dayData[dateStr]) dayData[dateStr]={};
      if(!dayData[dateStr][kid]) dayData[dateStr][kid]={};

      const subjects=currData.subjects[kid]||{};
      for(const key of Object.keys(subjects)){
        if(subjects[key].paused) continue;
        if(_ovRmX(kid,dateStr,key,ignoreAuto)) continue; // Lesson Map: subject removed from this day
        if(lesson[key]&&lesson[key]!=="—"&&lesson[key]!=="nan"){
          dayData[dateStr][kid][key]=lesson[key];
        }
      }
    }
  }

  // Inject manual additions on dates the grid doesn't carry — including
  // synthesized make-up weeks past the plan's end (Finish Line "Extend").
  const range=gwWeekDateRange(weekNum);
  if(range){
    for(const dateStr of Object.keys(scheduleOverrides||{})){
      if(dateStr<range.start||dateStr>range.end) continue;
      for(const kid of Object.keys(scheduleOverrides[dateStr]||{})){
        const ov=scheduleOverrides[dateStr][kid];
        if(!ov||!ov.added) continue;
        if(_ovOffX(kid,dateStr,ignoreAuto)) continue;
        if(smapIsKidOff(kid,dateStr)) continue;
        for(const sk of Object.keys(ov.added)){
          const subj=((currData.subjects||{})[kid]||{})[sk];
          if(!subj||subj.paused) continue;
          if(dayData[dateStr]&&dayData[dateStr][kid]&&dayData[dateStr][kid][sk]) continue;
          if(!dayData[dateStr]) dayData[dateStr]={};
          if(!dayData[dateStr][kid]) dayData[dateStr][kid]={};
          dayData[dateStr][kid][sk]="TMP";
        }
      }
    }
  }
  return dayData;
}

// Pattern-only walker: which subjects occupy slots on which dates for a week,
// after Excel grid + session maps + in-app subjects + calendar are applied.
// Shared by the generator, Finish Line math, and the Lesson Map editor so all
// three always agree. Returns {dayData, slots:{kid:{sk:[dateStr,...]}}}.
function resolveWeekSlots(weekNum,ignoreAuto){
  const dayData=gwReadWeek(weekNum,ignoreAuto);
  if(!dayData) return null;

  const WDAY_ABBR={0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  const sortedDates=Object.keys(dayData).sort();
  const slots={};

  for(const kid of ["lincoln","ellis","lucy","julian"]){
    const subjects=currData.subjects[kid]||{};
    const subjectSlots={};
    slots[kid]=subjectSlots;
    for(const dateStr of sortedDates){
      if(!dayData[dateStr]||!dayData[dateStr][kid]) continue;
      for(const sk of Object.keys(dayData[dateStr][kid])){
        if(!subjectSlots[sk]) subjectSlots[sk]=[];
        subjectSlots[sk].push(dateStr);
      }
    }

    // Inject subjects from session maps (generated by session generator + overrides)
    for(const smKey of Object.keys(sessionMapData||{})){
      const sm=sessionMapData[smKey];
      if(!sm||!sm.map) continue;
      const ov=sm.overrides||{};
      for(const dateStr of sortedDates){
        if(smapIsKidOff(kid,dateStr)||_ovOffX(kid,dateStr,ignoreAuto)) continue;
        const kidMap=(sm.map[dateStr]||{})[kid];
        const dayOv=(ov[dateStr]||{})[kid]||{};
        const removed=new Set(dayOv.removed||[]);
        const added=dayOv.added||[];
        const autoKeys=kidMap?Object.keys(kidMap).filter(sk=>!removed.has(sk)):[];
        const allKeys=[...new Set([...autoKeys,...added])];
        for(const sk of allKeys){
          if(_ovRmX(kid,dateStr,sk,ignoreAuto)) continue; // Lesson Map removal beats session-map injection
          if(subjectSlots[sk]) continue;
          if(!subjects[sk]||subjects[sk].paused) continue;
          if(!subjectSlots[sk]) subjectSlots[sk]=[];
          subjectSlots[sk].push(dateStr);
          if(!dayData[dateStr]) dayData[dateStr]={};
          if(!dayData[dateStr][kid]) dayData[dateStr][kid]={};
          dayData[dateStr][kid][sk]="TMP";
        }
      }
    }

    // Inject in-app subjects (lessonSeq, no Excel data) onto matching days
    for(const[sk,s] of Object.entries(subjects)){
      if(s.paused) continue;
      if(subjectSlots[sk]) continue;
      const rules=s.rules||"";
      if(rules.includes("first")||rules.includes("last")) continue;
      const isDaily=s.tracking==="daily";
      if(!isDaily&&(!s.lessonSeq||!s.lessonSeq.length)) continue;
      const allowed=s.allowedDays||[];
      const matchDates=sortedDates.filter(d=>{
        if(smapIsKidOff(kid,d)||_ovOffX(kid,d,ignoreAuto)) return false;
        if(_ovRmX(kid,d,sk,ignoreAuto)) return false;
        if(!allowed.length) return true;
        const dObj=gwParseDate(d);
        const abbr=WDAY_ABBR[dObj.getDay()];
        return abbr&&allowed.includes(abbr);
      });
      if(!matchDates.length) continue;
      if(isDaily){
        for(const d of matchDates){
          if(!dayData[d][kid]) dayData[d][kid]={};
          dayData[d][kid][sk]=s.display||sk;
        }
        continue;
      }
      subjectSlots[sk]=matchDates;
      for(const d of matchDates){
        if(!dayData[d][kid]) dayData[d][kid]={};
        dayData[d][kid][sk]="TMP";
      }
    }

    // Manual Lesson Map additions (scheduleOverrides.added) — densify days on purpose
    for(const dateStr of sortedDates){
      const ov=schedOv(dateStr,kid);
      if(!ov||!ov.added) continue;
      if(_ovOffX(kid,dateStr,ignoreAuto)) continue;
      for(const sk of Object.keys(ov.added)){
        if(!subjects[sk]||subjects[sk].paused) continue;
        if(!subjectSlots[sk]) subjectSlots[sk]=[];
        if(subjectSlots[sk].indexOf(dateStr)>=0) continue;
        subjectSlots[sk].push(dateStr);
        if(!dayData[dateStr][kid]) dayData[dateStr][kid]={};
        dayData[dateStr][kid][sk]="TMP";
      }
    }
    // Keep slot dates chronological so cursor fill assigns lessons in order
    for(const sk of Object.keys(subjectSlots)) subjectSlots[sk].sort();
  }
  return {dayData,slots};
}

// Auto-advance version: same schedule pattern as the fixed week but replaces
// lesson content with cursor-based next lessons from check-off progress.
// excludeWeek: on regeneration, excludes this week's own tasks from cursor count
//   so the cursor reflects only prior-week progress (prevents self-counting drift).
// Returns {dayData, cursors} so generateWeek can store the snapshot.
function gwReadWeekAutoAdvance(weekNum,savedCursors,excludeWeek,ignoreAuto){
  const resolved=resolveWeekSlots(weekNum,ignoreAuto);
  if(!resolved) return null;
  const dayData=resolved.dayData;

  const cursors={};

  for(const kid of ["lincoln","ellis","lucy","julian"]){
    cursors[kid]={};
    const subjects=currData.subjects[kid]||{};
    const subjectSlots=resolved.slots[kid]||{};

    for(const sk of Object.keys(subjectSlots)){
      const dates=subjectSlots[sk];
      const cursor=(savedCursors&&savedCursors[kid]&&savedCursors[kid][sk]!==undefined)
        ?savedCursors[kid][sk]
        :computeSubjectCursor(kid,sk,excludeWeek);
      cursors[kid][sk]=cursor;

      // Every planned slot fills with the next lesson; a finished subject stops filling.
      // (carryoverCap now governs how many make-up slots the Lesson Map suggests —
      // the old limit here could never bind and was dead code.)
      const seq=buildSubjectLessons(kid,sk);
      const remaining=seq.length-cursor;
      let slotsToFill=remaining<=0?0:dates.length;

      const nextLessons=getNextLessonsFromCursor(kid,sk,cursor,slotsToFill);
      for(let i=0;i<dates.length;i++){
        if(i<slotsToFill&&nextLessons[i]){
          dayData[dates[i]][kid][sk]=nextLessons[i].lesson;
        } else {
          if(dayData[dates[i]]&&dayData[dates[i]][kid]) delete dayData[dates[i]][kid][sk];
        }
      }
    }
  }
  return {dayData,cursors};
}

// Which plan week does a date fall in? (Mon–Sun ranges; null past the grid)
function weekNumForDate(dateStr){
  const mx=_maxPlanWeek();
  for(let w=1;w<=mx;w++){
    const r=gwWeekDateRange(w);
    if(r&&dateStr>=r.start&&dateStr<=r.end) return w;
  }
  return null;
}
// Does the Excel grid plan Saturday lessons for week wn?
function gwSatPlanned(wn){
  const r=gwWeekDateRange(wn);
  if(!r||!currData||!currData.lessons) return false;
  const m=gwParseDate(r.start); m.setDate(m.getDate()+5);
  const sat=m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");
  for(const kid of Object.keys(currData.lessons)){
    const lessons=currData.lessons[kid]||{};
    for(const dn of Object.keys(lessons)){ if(lessons[dn]&&lessons[dn].date===sat) return true; }
  }
  return false;
}

// ── AUTO-GENERATE: when a new plan week has started and no schedule exists,
// build and commit it with a clean default config — the Calendar and Lesson
// Map drive the shape. A review banner appears; the wizard can regenerate
// with different settings anytime (auto overrides are cleared per commit).
let _autoGenTried=false;
function autoGenerateWeekIfNeeded(){
  if(_autoGenTried) return;
  if(!db||!currData||!currData.subjects||!currData.weekDays||!currData.lessons) return;
  const wn=weekNumForDate(_todayStr());
  if(!wn||wn<=currWeekNum()) return; // still inside (or behind) the active week
  _autoGenTried=true;
  db.ref("week"+wn+"/tasks").once("value",s=>{
    if(s.val()&&Object.keys(s.val()).length) return; // another device already built it
    const cfg={weekNum:String(wn),babysitter:{},withSitter:[],skipDays:[],lateStart:{},carSchool:{},theater:false,saturday:gwSatPlanned(wn),redistribute:[],autoAdvance:true};
    const gen=generateWeek(cfg);
    if(gen.error){ dbg("auto-gen wk"+wn+" skipped: "+gen.error); return; }
    gwConfig=cfg;
    gwResult=gen.result; gwDropped=gen.dropped; gwCarryOverCount=gen.carryOverCount||0;
    gwCursors=gen.cursors||null; gwCalendarSkips=gen.calendarSkips||null;
    gwCommit();
    try{localStorage.setItem("ha_autogen_notice",JSON.stringify({week:wn,ts:Date.now()}));}catch(e){}
    dbg("auto-generated week "+wn);
    renderAll();
  });
}

function generateWeek(config){
  const weekNum=parseInt(config.weekNum);
  if(!weekNum) return {error:"Week number required"};
  const weekLabel="week"+weekNum;

  let dayData, weekCursors=null;
  if(config.autoAdvance){
    // Two-tier cursor: detect regeneration vs new week
    const activeWK=localStorage.getItem("ha_active_wk")||WK;
    const isRegen=(weekLabel===activeWK);
    // Regeneration: recompute cursor excluding this week's own checked tasks
    // so the cursor reflects only progress from prior weeks (not self-counting).
    // New week: compute normally (prior weeks are in archive, current week is old week).
    const excludeWeek=isRegen?weekLabel:null;
    // ignoreAuto: the wizard's current skip-day/Saturday/car settings drive the
    // preview — auto overrides from a PREVIOUS commit of this week are ignored
    // (they're cleared and rewritten from the new settings at commit).
    const result=gwReadWeekAutoAdvance(weekNum,null,excludeWeek,true);
    if(!result) return {error:"No curriculum data found for Wk "+weekNum};
    dayData=result.dayData;
    weekCursors=result.cursors;
  } else {
    dayData=gwReadWeek(weekNum,true);
  }
  if(!dayData||!Object.keys(dayData).length) return {error:"No curriculum data found for Wk "+weekNum};

  // Calendar-skipped dates for this week (vacation/holiday/kid-off) — surfaced in preview
  const calendarSkips=[];
  (function(){
    const seen={};
    for(const kid of ["lincoln","ellis","lucy","julian"]){
      const wdMap=(currData.weekDays||{})[kid]||{};
      const lessons=(currData.lessons||{})[kid]||{};
      for(const dn of (wdMap["Wk "+weekNum]||[])){
        const l=lessons[dn]; if(!l||!l.date) continue;
        const why=smapIsKidOff(kid,l.date);
        if(!why) continue;
        if(!seen[l.date]) seen[l.date]={date:l.date,reason:why,kids:[]};
        if(seen[l.date].kids.indexOf(kid)<0) seen[l.date].kids.push(kid);
      }
    }
    Object.values(seen).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>calendarSkips.push(s));
  })();

  // Apply redistribution
  let balanced=config.redistribute&&config.redistribute.length
    ? gwApplyRedistribution(dayData,config.redistribute)
    : JSON.parse(JSON.stringify(dayData));

  // Auto-balance
  balanced=gwAutoBalance(balanced,config.lateStart||{},config.skipDays||[]);

  // Inject daily curriculum subjects (notebooks, drills) into every school day — reads from curriculum data
  const _WDAY_ABBR2={0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  for(const dk of Object.keys(balanced)){
    if(!balanced[dk]) continue;
    const dkDate=gwParseDate(dk);
    const dkAbbr=_WDAY_ABBR2[dkDate.getDay()];
    for(const kid of ["lincoln","ellis","lucy","julian"]){
      if(!balanced[dk][kid]||!Object.keys(balanced[dk][kid]).length) continue;
      const subs=currData&&currData.subjects[kid]||{};
      for(const sk of Object.keys(subs)){
        if(subs[sk].paused) continue;
        const r=subs[sk].rules||"";
        if(!r.includes("first")&&!r.includes("last")) continue;
        const al=subs[sk].allowedDays||[];
        if(al.length&&dkAbbr&&!al.includes(dkAbbr)) continue;
        balanced[dk][kid][sk]=subs[sk].display||"Daily";
      }
    }
  }

  const skipSet=new Set((config.skipDays||[]).map(d=>d.toLowerCase()));
  const sortedDates=Object.keys(balanced).sort();

  const WDAY_MAP={0:"sunday",1:"monday",2:"tuesday",3:"wednesday",4:"thursday",5:"friday",6:"saturday"};
  const dates={};
  for(const dk of sortedDates){
    const d=gwParseDate(dk);
    const dn=WDAY_MAP[d.getDay()];
    if(!dn||skipSet.has(dn)) continue;
    if(dn==="saturday"&&!config.saturday) continue;
    const mon=d.toLocaleDateString("en-US",{month:"long",day:"numeric",timeZone:"UTC"});
    dates[dn]=mon;
  }

  // Build constraints, windows, babysitter
  const constraints={};
  const windows={};
  const sitterCfg=config.babysitter||config.maggie||{};
  const withSitterKids=config.withSitter||[];
  for(const[dn,raw] of Object.entries(sitterCfg)){
    const mg=gwNormSitter(raw);
    constraints[dn]="\u{1F338} "+SITTER_NAME+" "+mg.start+"–"+mg.end+" \xB7 Mom Required from "+mg.end;
    windows[dn]=SITTER_NAME+" "+mg.start+"–"+mg.end+" \xB7 Mom Required from "+mg.end;
  }
  for(const[dn,startTime] of Object.entries(config.lateStart||{})){
    constraints[dn]="\u{1F550} Late start \xB7 School begins at "+startTime;
    windows[dn]="Late start \xB7 School from "+startTime;
  }
  for(const[dn,csInfo] of Object.entries(config.carSchool||{})){
    const note=csInfo.note||"Travel Day";
    const end=csInfo.end||"12:00 PM";
    constraints[dn]="\u{1F697} "+note+" \xB7 Car schooling until "+end;
    windows[dn]=note+" \xB7 Car school until "+end;
  }
  const theaterNote=config.theater?" \xB7 Theater 4:30 Mon–Thu":"";
  const gwR=gwRules();
  windows.default="School "+fromMin(gwR.schoolStart)+"–"+fromMin(gwR.schoolEnd)+theaterNote;

  let sitterObj=null;
  if(Object.keys(sitterCfg).length){
    const magDays=Object.keys(sitterCfg);
    sitterObj={days:magDays};
    if(withSitterKids.length) sitterObj.withSitter=withSitterKids;
    for(const[dn,raw] of Object.entries(sitterCfg)){
      const mg=gwNormSitter(raw);
      if(magDays.length===1){
        sitterObj.hours=mg.start+" - "+mg.end;
        sitterObj.mom_return=mg.end;
      } else {
        sitterObj["hours_"+dn]=mg.start+" - "+mg.end;
        sitterObj["mom_return_"+dn]=mg.end;
      }
    }
  }

  // Schedule tasks for each day
  const allTasks=[];
  const allDropped=[];
  let taskCounter=1;

  function dayOfYear(dt){ const jan1=new Date(dt.getFullYear(),0,0); return Math.floor((dt-jan1)/86400000); }

  for(const dk of sortedDates){
    const d=gwParseDate(dk);
    const dn=WDAY_MAP[d.getDay()];
    if(!dn||skipSet.has(dn)||!dates[dn]) continue;

    const idPrefix=d.getFullYear()+"d"+dayOfYear(d)+"_";

    // School start: late start override > rules per-day override > rules default
    const rulesSD=(rulesData&&rulesData.schoolDay)||{};
    const rulesDayOv=(rulesSD.overrides||{})[dn]||{};
    const rulesDefaultStart=rulesSD.defaultStart||"10:00 AM";
    const schoolStartStr=(config.lateStart||{})[dn]||rulesDayOv.start||rulesDefaultStart;
    const schoolStartMin=toMin(schoolStartStr);

    const isSitter=!!sitterCfg[dn];
    const mgNorm=isSitter?gwNormSitter(sitterCfg[dn]):{start:schoolStartStr,end:schoolStartStr};
    const sitterStartMin=isSitter?toMin(mgNorm.start):schoolStartMin;
    const sitterEndMin=isSitter?toMin(mgNorm.end):schoolStartMin;
    const momAvailable=schoolStartMin;

    const isCar=!!(config.carSchool||{})[dn];

    const dayConfig={
      schoolStart:schoolStartMin,
      momAvailable:momAvailable,
      isCarSchool:isCar,
      isSitter:isSitter,
      sitterStart:isSitter?sitterStartMin:0,
      sitterEnd:isSitter?sitterEndMin:0,
      withSitter:isSitter?withSitterKids:[],
      theater:!!config.theater,
      dayName:dn,
      dateStr:dk
    };

    const result=gwBuildDayTasks(balanced[dk]||{},dayConfig,idPrefix,taskCounter);
    taskCounter=result.counter;
    allTasks.push(...result.tasks);
    allDropped.push(...result.dropped);
  }

  // Inject carryovers from previous week
  // When auto-advance is on, the cursor replays unchecked curriculum lessons,
  // so skip carryovers whose title matches a task already generated for that kid.
  const coPool=getCarryOverPool();
  let coTasks=coPool.tasks.filter(t=>t.included);
  if(config.autoAdvance&&coTasks.length){
    const genTitles={};
    allTasks.forEach(t=>{
      const k=t.who+"|"+(t.title||"").toLowerCase();
      genTitles[k]=true;
    });
    coTasks=coTasks.filter(t=>!genTitles[t.who+"|"+(t.title||"").toLowerCase()]);
  }
  const firstDay=Object.keys(dates).sort((a,b)=>{
    const ord={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
    return (ord[a]||9)-(ord[b]||9);
  })[0]||"monday";
  coTasks.forEach(t=>{
    allTasks.push({
      id:t.id,who:t.who,day:firstDay,time:t.time||fromMin(gwRules().schoolStart),dur:t.dur||20,
      title:t.title,detail:(t.detail||t.title||"")+" (Carried from "+(t.prevWeek||"prev week")+")",
      mom:t.mom||"none",cascade:true,device:t.device||taskDevice(t),subjectKey:t.subjectKey
    });
  });

  const output={
    week:weekLabel,
    dates:dates,
    constraints:constraints,
    windows:windows,
    tasks:allTasks
  };
  if(sitterObj) output.babysitter=sitterObj;

  return {result:output,dropped:allDropped,carryOverCount:coTasks.length,cursors:weekCursors,calendarSkips};
}

function runGenerateWeek(){
  if(!gwConfig.weekNum){
    gwShowToast("Enter a week number first.");
    return;
  }
  if(parseInt(gwConfig.weekNum)<currWeekNum()){
    gwShowToast("Can't generate a past week (current is Week "+currWeekNum()+").");
    return;
  }
  if(!currData||!currData.subjects){
    gwShowToast("No curriculum loaded. Upload via admin panel.");
    return;
  }
  const gen=generateWeek(gwConfig);
  if(gen.error){
    gwShowToast(gen.error);
    return;
  }
  gwResult=gen.result;
  gwDropped=gen.dropped;
  gwCarryOverCount=gen.carryOverCount||0;
  gwCursors=gen.cursors||null;
  gwCalendarSkips=gen.calendarSkips||null;
  renderAll();
}

function gwCommit(){
  if(!gwResult) return;
  // Build a fake file-load event to reuse loadJson's write logic
  const d=gwResult;

  // Record this generation's one-off shape choices as auto overrides so the
  // Lesson Map, pace drift, and Finish Line see the week as actually planned,
  // then snapshot the resolved structure for later change detection.
  try{
    const wn=parseInt((d.week||"").replace(/\D/g,""));
    if(wn){
      gwSyncConfigOverrides(wn,gwConfig||{},gwDropped||[]);
      const sig=weekShapeSig(wn);
      committedShapeSigs[d.week]=sig;
      try{localStorage.setItem("ha_shape_sigs",JSON.stringify(committedShapeSigs));}catch(e2){}
      if(db) db.ref("shape_sigs/"+d.week).set(sig);
    }
  }catch(e){ console.log("[HA] override sync error",e); }

  // Same logic as loadJson
  isUploading=true;
  const activeWK=localStorage.getItem("ha_active_wk")||WK;
  const isSameWeek=(d.week===activeWK);

  if(isSameWeek){
    const lsChecked=ld(activeWK+"_checked")||{};
    const memChecked=checked||{};
    const snapChecked={...lsChecked,...memChecked};
    const snapHist=ld(activeWK+"_history")||{};
    // Build lookup of old checks by title+who+day for matching after regeneration.
    // Only carry checks from this week (within 7 days) to prevent stale cross-week bleed.
    const oldLookup={};
    const weekCutoff=Date.now()-7*24*60*60*1000;
    (weekData.tasks||[]).forEach(t=>{
      const key=(t.title||"")+"|"+(t.who||"")+"|"+(t.day||"");
      if(!snapChecked[t.id]) return;
      const ts=snapChecked[t.id];
      const tsMs=(typeof ts==="number")?ts:new Date(ts).getTime();
      if(tsMs<weekCutoff) return;
      oldLookup[key]={ts:ts,oldId:t.id};
    });
    d.tasks.forEach(t=>{
      if(snapChecked[t.id]) return;
      const key=(t.title||"")+"|"+(t.who||"")+"|"+(t.day||"");
      if(oldLookup[key]){
        snapChecked[t.id]=oldLookup[key].ts;
        if(snapHist[oldLookup[key].oldId]&&!snapHist[t.id])
          snapHist[t.id]={...snapHist[oldLookup[key].oldId],id:t.id};
      }
    });
    const snapSl=ld(activeWK+"_sl")||slState||{};
    // Re-attach carry-overs
    const newIds=new Set(d.tasks.map(t=>t.id));
    (weekData.tasks||[]).filter(t=>t.id.endsWith("_c")&&!newIds.has(t.id)&&!newIds.has(baseId(t.id)))
      .forEach(t=>{ d.tasks.push(t); newIds.add(t.id); });
    const _archPrev=Object.values(archive||{}).filter(a=>a&&a.tasks&&a.weekLabel!==d.week)
      .sort((a,b)=>{
        const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
        const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
        return nb-na;
      })[0];
    if(_archPrev){
      const _awc=_archPrev.checked||{};
      (_archPrev.tasks||[]).filter(t=>!t.id.endsWith("_c")&&!_awc[t.id]&&!_awc[t.id+"_c"])
        .forEach(t=>{
          const _cId=t.id+"_c";
          if(newIds.has(_cId)) return;
          if((snapChecked||{})[_cId]) return;
          if((coExclusions[d.week]||{})[_cId]) return;
          d.tasks.push({...t,id:_cId,day:"monday",cascade:true,
            detail:(t.detail||t.title||"")+" (Carried from "+(_archPrev.weekLabel||"prev week")+")"});
          newIds.add(_cId);
        });
    }
    // GC: purge checked/history entries for task IDs not in the new set
    const commitIds=new Set(d.tasks.map(t=>t.id));
    for(const id in snapChecked){ if(!commitIds.has(id)) delete snapChecked[id]; }
    for(const id in snapHist){ if(!commitIds.has(id)) delete snapHist[id]; }
    WK=activeWK; weekData=d; checked=snapChecked; slState=snapSl;
    applyWeekMeta(d);
    sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
    sv(WK+"_checked",snapChecked); sv(WK+"_history",snapHist); sv(WK+"_sl",snapSl);
    sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
    if(db){
      const obj={};d.tasks.forEach(t=>obj[t.id]=t);
      db.ref(WK+"/tasks").set(obj);
      db.ref(WK+"/checked").set(snapChecked);
      db.ref(WK+"/history").set(snapHist);
      if(Object.keys(snapSl).length) db.ref(WK+"/sl").set(snapSl);
      if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
      db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
    }
    // Regeneration: always save fresh cursor snapshot (overwrites stale values)
    if(gwCursors){
      sv(WK+"_cursors",gwCursors);
      if(db) db.ref(WK+"/cursors").set(gwCursors);
    }
    fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
  } else {
    const oldWK=activeWK;
    const snapHist=ld(oldWK+"_history")||{};
    const snapTasks=weekData.tasks||[];
    const snapChecked={...(ld(oldWK+"_checked")||{}),...checked};
    snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"]).forEach(t=>{
      if(!snapHist[t.id+"_missed"])
        snapHist[t.id+"_missed"]={id:t.id,title:t.title,who:t.who,day:t.day,ts:"Week Closed",missed:true,momRequired:t.mom==="required"};
    });
    const hasAnything=Object.keys(snapHist).length>0||snapTasks.length>0;
    if(hasAnything){
      const snapSlotPts=ld(oldWK+"_slot_points")||{};
      const entry={weekLabel:oldWK,archivedAt:nowTs(),history:snapHist,tasks:snapTasks,checked:snapChecked,dates:{...DAY_DT},slot_points:snapSlotPts};
      archive[oldWK]=entry;
      try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e2){}
      if(db) db.ref("archive/"+oldWK).set(entry);
    }
    snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"])
      .forEach(t=>{
        const cId=t.id+"_c";
        if(!d.tasks.some(x=>x.id===cId))
          d.tasks.push({...t,id:cId,day:"monday",cascade:true,
            detail:(t.detail||t.title||"")+" (Carried from "+oldWK+")"});
      });
    WK=d.week; localStorage.setItem("ha_active_wk",WK);
    if(db) db.ref("ha_active_wk").set(WK);
    weekData=d; checked={}; slState={};
    sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
    sv(WK+"_checked",{}); sv(WK+"_sl",{}); sv(WK+"_history",{});
    sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
    // New week: store cursor snapshot — this is the anchor for all future regenerations
    if(gwCursors){
      sv(WK+"_cursors",gwCursors);
    }
    if(db){
      // Write clean slate BEFORE attaching listeners to prevent stale data bleed
      db.ref(WK+"/checked").set({});
      db.ref(WK+"/sl").set({});
      db.ref(WK+"/history").set({});
      const obj={};d.tasks.forEach(t=>obj[t.id]=t);
      db.ref(WK+"/tasks").set(obj);
      if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
      db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
      if(gwCursors) db.ref(WK+"/cursors").set(gwCursors);
      attachWeekListeners(WK);
    }
    applyWeekMeta(d);
    fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
  }

  gwResult=null; gwDropped=null; gwCursors=null;
   setTimeout(()=>{ isUploading=false; },3000);
  renderAll(); runCascade();
  gwShowToast("Week "+gwConfig.weekNum+" applied to schedule!");
}
