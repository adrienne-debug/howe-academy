        h+='<input type="file" id="mast-img-file" accept="image/*" style="display:none" onchange="mastUploadImage(this.files[0])">';
        h+='<button class="mast-img-btn" onclick="document.getElementById(\'mast-img-file\').click()">\u{1F4F7} Add Photo</button>';
        h+='<span style="font-size:10px;color:var(--muted)">or take a photo on phone</span>';
      }
      h+='</div>';
    } else {
      h+='<div class="mast-add-label">'+(isJ?"Items":"Words / Rules")+' (comma or newline separated)</div>';
      h+='<textarea class="mast-add-textarea" id="mast-add-batch" placeholder="'+(isJ?"Dog, Elephant, Horse":"splash, crash, brush")+'"></textarea>';
    }

    h+='<div class="mast-add-preview">New items enter at <strong>daily</strong> tier'+(isJ?' as <strong>introduction</strong>':' with cycle #1')+'</div>';
    h+='<button class="mast-add-submit" onclick="mastAddItems()">Add to '+SL_KLBL[masteryKid]+'\'s Mastery</button>';
    h+='</div></div>';
  }

  // Today's drill
  const pn=mastGetPrintNum();
  const due=mastDueItems(masteryKid,pn);
  const dueW=due.filter(i=>i.review_mode==="written");
  const dueO=due.filter(i=>i.review_mode!=="written");
  const today=new Date();
  const dayN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
  const monN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][today.getMonth()];
  const dateStr=dayN+", "+monN+" "+today.getDate();

  h+='<div class="mast-drill">';
  h+='<div class="mast-drill-hdr" style="border-bottom:1.5px solid '+color+'">';
  h+='<div><div class="mast-drill-title" style="color:'+color+'">'+emoji+' Today\'s Drill</div>';
  h+='<div class="mast-drill-date">'+dateStr+'</div></div>';
  h+='<div class="mast-drill-pnum">Print #'+pn+'</div></div>';

  if(!due.length) h+='<div class="mast-none">Nothing due today \u{1F389}</div>';
  else if(masteryKid==="julian"){
    // ── JULIAN SLIDESHOW (normal + log mode) ──
    if(mastSlideIdx<0) mastSlideIdx=0;
    if(mastSlideIdx>=due.length) mastSlideIdx=due.length-1;
    const it=due[mastSlideIdx];
    const catE3={Letters:"\u{1F524}",Numbers:"\u{1F522}",Colors:"\u{1F3A8}",Shapes:"\u{1F537}",Animals:"\u{1F43E}"};

    const sc=mastLogMode?(mastLogScores[it.id]||""):"";
    const slideClass="mast-slide"+(sc==="c"?" scored-c":sc==="m"?" scored-m":sc==="~"?" scored-t":"");

    h+='<div style="padding:10px 14px">';
    h+='<div class="'+slideClass+'">';
    h+='<div class="mast-slide-cat">'+(catE3[it.subject]||"")+' '+(it.subject||"")+'</div>';

    // Big visual
    let bigVis=it.imageUrl?'<img src="'+it.imageUrl+'" style="max-width:160px;max-height:140px;border-radius:12px;object-fit:contain">':'';
    if(!bigVis&&it.emoji) bigVis='<span style="font-size:80px">'+it.emoji+'</span>';
    if(!bigVis&&MAST_ANIMAL_EMOJI[it.prompt]) bigVis='<span style="font-size:80px">'+MAST_ANIMAL_EMOJI[it.prompt]+'</span>';
    const cat=it.subject||"";
    if(!bigVis&&cat==="Colors"&&MAST_COLOR_MAP[it.prompt]) bigVis='<div style="width:80px;height:80px;border-radius:50%;background:'+MAST_COLOR_MAP[it.prompt]+';border:2px solid rgba(0,0,0,0.1)"></div>';
    if(!bigVis&&cat==="Shapes") bigVis='<span style="font-size:80px">'+({Circle:"\u{1F534}",Square:"\u{1F7E7}",Triangle:"\u{1F53A}"}[it.prompt]||it.prompt)+'</span>';
    if(!bigVis) bigVis='<span style="font-size:64px;font-weight:800;color:#c2410c">'+it.prompt+'</span>';
    h+='<div class="mast-slide-img">'+bigVis+'</div>';

    h+='<div class="mast-slide-name">'+it.prompt+'</div>';

    const isIntro=it.status==="introduction";
    const tallyCount=isIntro?(it.tally_dots||0):(it.consecutive_correct||0);
    const tallyMax=isIntro?5:3;

    // Tally dots
    h+='<div class="mast-slide-tally">';
    for(let d=0;d<tallyMax;d++) h+='<div class="mast-slide-dot'+(d<tallyCount?" filled":"")+'"></div>';
    if(isIntro) h+='<span style="font-size:14px;margin-left:4px">\u{2B50}</span>';
    h+='</div>';

    if(isIntro){
      // Introduction phase label
      h+='<div style="font-size:10px;color:#9a3412;font-weight:600;margin-top:4px">'+tallyCount+'/5 days shown'+(tallyCount>=5?' \u{2014} entering the ladder!':'')+'</div>';
    } else {
      // Ladder phase label
      h+='<div style="font-size:10px;color:var(--muted);font-weight:600;margin-top:4px">'+(MAST_TIER_LBL[it.tier]||it.tier)+' \u{00B7} '+tallyCount+'/3 streak</div>';
    }

    // Buttons based on mode and phase
    if(mastLogMode){
      const shown=sc==="shown";
      if(isIntro&&!shown){
        // Introduction: just a "Shown" button to fill next dot
        h+='<div style="margin-top:14px">';
        h+='<button class="mast-slide-score-btn" style="width:auto;padding:12px 32px;font-size:16px;background:#fff7ed;border-color:#c2410c;color:#c2410c;border-radius:14px" onclick="mastSlideShown(\''+it.id+'\')">\u{1F441}\u{FE0F} Shown Today</button>';
        h+='</div>';
      } else if(isIntro&&shown){
        // Already marked shown
        h+='<div style="margin-top:14px;font-size:13px;font-weight:700;color:#16a34a">\u{2713} Marked!</div>';
      } else {
        // Ladder: score buttons
        h+='<div class="mast-slide-score">';
        h+='<button class="mast-slide-score-btn'+(sc==="c"?" sel-c":"")+'" onclick="mastSlideScore(\''+it.id+'\',\'c\')">\u{2713}</button>';
        h+='<button class="mast-slide-score-btn'+(sc==="m"?" sel-m":"")+'" onclick="mastSlideScore(\''+it.id+'\',\'m\')">\u{2717}</button>';
        h+='<button class="mast-slide-score-btn'+(sc==="~"?" sel-t":"")+'" onclick="mastSlideScore(\''+it.id+'\',\'~\')">~</button>';
        h+='</div>';
      }
    }

    h+='</div>'; // close slide

    // Navigation arrows + counter
    h+='<div class="mast-slide-nav">';
    h+='<button class="mast-slide-arrow" onclick="mastSlidePrev()"'+(mastSlideIdx<=0?' disabled':'')+'">\u{2190}</button>';
    h+='<span class="mast-slide-counter">'+(mastSlideIdx+1)+' / '+due.length+'</span>';
    h+='<button class="mast-slide-arrow" onclick="mastSlideNext()"'+(mastSlideIdx>=due.length-1?' disabled':'')+'">\u{2192}</button>';
    h+='</div>';

    h+='</div>'; // close padding

    // Bottom bar
    if(mastLogMode){
      const scored=Object.keys(mastLogScores).length;
      const allScored=scored===due.length;
      h+='<div class="mast-save-bar"><span class="mast-save-count">'+scored+' / '+due.length+' scored</span>';
      h+='<button class="mast-save-btn" onclick="mastSaveResults()"'+(allScored?'':' disabled')+'>Save Results</button></div>';
      h+='<div style="padding:8px 14px;text-align:center"><button class="mast-log-btn" onclick="mastCancelLog()">Cancel</button></div>';
    } else {
      h+='<div class="mast-print-bar">';
      h+='<button class="mast-print-btn" onclick="mastPrintJulian()">\u{1F5A8}\u{FE0F} Print Flashcards</button>';
      h+='<button class="mast-log-btn" onclick="mastStartLog()" style="margin-left:6px">\u{1F4DD} Log</button></div>';
    }
  } else if(mastLogMode){
    // ── STANDARD LOGGING MODE ──
    h+='<div style="padding:6px 14px 2px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Tap \u{2713} \u{2717} or ~ for each item</div></div>';
    due.forEach((it,i)=>{
      const sc=mastLogScores[it.id]||"";
      const isW=it.review_mode==="written";
      const mi=isW?(i+1)+".":({recite:"\u{1F4E2}",oral:"\u{1F5E3}\u{FE0F}",flash:"\u{1F0CF}"}[it.review_mode]||"\u{1F5E3}\u{FE0F}");
      h+='<div class="mast-log-item">';
      h+='<span class="mast-log-num">'+mi+'</span>';
      h+='<span class="mast-log-prompt">'+it.prompt+'</span>';
      h+='<div class="mast-log-btns">';
      h+='<button class="mast-score-btn'+(sc==="c"?" sel-c":"")+'" onclick="mastScore(\''+it.id+'\',\'c\')">\u{2713}</button>';
      h+='<button class="mast-score-btn'+(sc==="m"?" sel-m":"")+'" onclick="mastScore(\''+it.id+'\',\'m\')">\u{2717}</button>';
      h+='<button class="mast-score-btn'+(sc==="~"?" sel-t":"")+'" onclick="mastScore(\''+it.id+'\',\'~\')">~</button>';
      h+='</div></div>';
    });
    const scored=Object.keys(mastLogScores).length;
    const allScored=scored===due.length;
    h+='<div class="mast-save-bar"><span class="mast-save-count">'+scored+' / '+due.length+' scored</span>';
    h+='<button class="mast-save-btn" onclick="mastSaveResults()"'+(allScored?'':' disabled')+'>Save Results</button></div>';
    h+='<div style="padding:8px 14px;text-align:center"><button class="mast-log-btn" onclick="mastCancelLog()">Cancel</button></div>';
  } else {
    // ── STANDARD NORMAL VIEW ──
    if(dueW.length){
      h+='<div class="mast-section"><div class="mast-section-lbl">\u{270F}\u{FE0F} Written <span class="cnt">'+dueW.length+'</span></div>';
      dueW.forEach((it,i)=>{
        const tc=MAST_TIER_COL[it.tier]||"#666";
        const hasDetail=it.answer&&it.answer!==it.prompt||it.definition||it.imageUrl;
        h+='<div class="mast-ditem'+(hasDetail?" mast-ditem-tap":"")+'"'+(hasDetail?' onclick="mastToggleExpand(\''+it.id+'\')"':'')+'>';
        h+='<span class="mast-ditem-num">'+(i+1)+'.</span><span class="mast-ditem-prompt">'+it.prompt+'</span>';
        if(it.drop_count) h+='<span class="mast-irow-drop">\u{2B07}'+it.drop_count+'</span>';
        h+='<span class="mast-ditem-tier" style="background:'+tc+'15;color:'+tc+'">'+(MAST_TIER_LBL[it.tier]||it.tier)+'</span></div>';
        if(hasDetail) h+=mastExpandHtml(it);
      });
      h+='</div>';
    }
    if(dueO.length){
      if(dueW.length) h+='<div class="mast-divider"></div>';
      h+='<div class="mast-section"><div class="mast-section-lbl">\u{1F5E3}\u{FE0F} Oral / Flash / Recite <span class="cnt">'+dueO.length+'</span></div>';
      dueO.forEach(it=>{
        const tc=MAST_TIER_COL[it.tier]||"#666";
        const mi={recite:"\u{1F4E2}",oral:"\u{1F5E3}\u{FE0F}",flash:"\u{1F0CF}"}[it.review_mode]||"\u{1F5E3}\u{FE0F}";
        h+='<div class="mast-ditem mast-ditem-tap" onclick="mastToggleExpand(\''+it.id+'\')">';
        h+='<span class="mast-ditem-num">'+mi+'</span><span class="mast-ditem-prompt">'+it.prompt+'</span>';
        h+='<span class="mast-ditem-tier" style="background:'+tc+'15;color:'+tc+'">'+(MAST_TIER_LBL[it.tier]||it.tier)+'</span></div>';
        h+=mastExpandHtml(it);
      });
      h+='</div>';
    }
    h+='<div class="mast-print-bar">';
    h+='<label class="mast-print-chk"><input type="checkbox" id="mast-chk-student" checked> Student</label>';
    h+='<label class="mast-print-chk"><input type="checkbox" id="mast-chk-parent" checked> Parent</label>';
    h+='<button class="mast-print-btn" onclick="mastPrintDrill()">\u{1F5A8}\u{FE0F} Print</button>';
    h+='<button class="mast-log-btn" onclick="mastStartLog()" style="margin-left:6px">\u{1F4DD} Log</button></div>';
  }
  h+='</div>';

  // Summary
  const total=items.length;
  h+='<div class="mast-summary">';
  h+='<div class="mast-scard"><div class="mast-scard-num" style="color:'+color+'">'+total+'</div><div class="mast-scard-lbl">Total Items</div></div>';
  h+='<div class="mast-scard"><div class="mast-scard-num" style="color:'+color+'">'+due.length+'</div><div class="mast-scard-lbl">Due Today</div></div></div>';

  // Ladder
  const byTier={}; MAST_TIER_ORDER.forEach(t=>byTier[t]=[]);
  items.forEach(i=>{const t=i.tier||"daily";if(!byTier[t])byTier[t]=[];byTier[t].push(i);});

  h+='<div class="mast-ladder">';
  MAST_TIER_ORDER.forEach(t=>{
    const cnt=byTier[t]?.length||0;
    if(!cnt&&!["daily","every_other_day","weekly","bi_weekly","monthly"].includes(t)) return;
    const pct=total?Math.round(cnt/total*100):0;
    h+='<div class="mast-ladder-tier"><div class="mast-ladder-cnt" style="color:'+MAST_TIER_COL[t]+'">'+cnt+'</div>';
    h+='<div class="mast-ladder-bar"><div class="mast-ladder-bg"></div><div class="mast-ladder-fill" style="width:'+pct+'%;background:'+MAST_TIER_COL[t]+'"></div></div>';
    h+='<div class="mast-ladder-lbl">'+(t==="every_other_day"?"EOD":t==="bi_weekly"?"Bi-Wk":t==="monthly"?"Mo":(MAST_TIER_LBL[t]||t).substring(0,5))+'</div></div>';
  });
  h+='</div>';

  // Julian flashcard grid
  if(masteryKid==="julian"){
    const byCat={};
    items.forEach(i=>{const c=i.subject||"Other";if(!byCat[c])byCat[c]=[];byCat[c].push(i);});
    const catE={Letters:"\u{1F524}",Numbers:"\u{1F522}",Colors:"\u{1F3A8}",Shapes:"\u{1F537}",Animals:"\u{1F43E}"};
    Object.entries(byCat).forEach(([cat,citems])=>{
      h+='<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;color:#c2410c;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;padding-left:4px">'+(catE[cat]||"\u{1F4CC}")+' '+cat+'</div>';
      h+='<div class="mast-jgrid">';
      citems.forEach(i=>{
        const vis=mastJulianVis(i);
        const isIntro=i.status==="introduction";
        const dotCount=isIntro?(i.tally_dots||0):(i.consecutive_correct||0);
        const dotMax=isIntro?5:3;
        let dots="";for(let d=0;d<dotMax;d++) dots+='<div class="mast-jdot" style="'+(d<dotCount?"background:#c2410c;":"")+'"></div>';
        const tierLbl=isIntro?(dotCount+"/5"):(MAST_TIER_LBL[i.tier]||"").substring(0,5);
        h+='<div class="mast-jcard" style="cursor:pointer" onclick="mastEditOpen(\''+i.id+'\')">';
        h+='<div class="mast-jcard-img">'+vis+'</div><div class="mast-jcard-name">'+i.prompt+'</div>';
        h+='<div class="mast-jcard-tally">'+dots+'</div>';
        if(!isIntro) h+='<div style="font-size:6px;color:var(--muted);margin-top:2px">'+tierLbl+'</div>';
        h+='</div>';

        // Edit panel for this card
        if(mastEditId===i.id){
          const JTIERS=["every_other_day","weekly","bi_weekly","monthly","graduated"];
          h+='<div class="mast-edit-card" style="grid-column:1/-1">';
          h+='<div class="mast-edit-hdr"><span class="mast-edit-title">'+vis+' '+i.prompt+'</span>';
          h+='<button class="mast-add-close" onclick="mastEditClose()">\u{2715}</button></div>';
          h+='<div class="mast-edit-body">';

          if(isIntro||mastEditDots<5){
            h+='<div class="mast-edit-row"><span class="mast-edit-label">Intro Dots</span>';
            h+='<div class="mast-edit-val"><button class="mast-edit-adj" onclick="mastEditAdjDots(-1)">\u{2212}</button>';
            h+='<span class="mast-edit-num">'+mastEditDots+'</span>';
            h+='<button class="mast-edit-adj" onclick="mastEditAdjDots(1)">+</button></div></div>';
          }

          if(!isIntro||mastEditDots>=5){
            h+='<div class="mast-edit-row"><span class="mast-edit-label">Streak</span>';
            h+='<div class="mast-edit-val"><button class="mast-edit-adj" onclick="mastEditAdjConsec(-1)">\u{2212}</button>';
            h+='<span class="mast-edit-num">'+mastEditConsec+'</span>';
            h+='<button class="mast-edit-adj" onclick="mastEditAdjConsec(1)">+</button></div></div>';

            h+='<div class="mast-edit-row"><span class="mast-edit-label">Tier</span>';
            h+='<div class="mast-add-pills">';
            JTIERS.forEach(t=>{h+='<button class="mast-add-pill'+(mastEditTier===t?" active":"")+'" onclick="mastEditSetTier(\''+t+'\')" style="font-size:9px;padding:3px 8px">'+(MAST_TIER_LBL[t]||t)+'</button>';});
            h+='</div></div>';
          }

          h+='<button class="mast-edit-save" onclick="mastEditSave()">\u{2713} Save Changes</button>';
          h+='<button class="mast-edit-del" onclick="mastEditDelete()">\u{1F5D1}\u{FE0F} Remove Item</button>';
          h+='</div></div>';
        }
      });
      h+='</div></div>';
    });
    h+='</div>';
    el.innerHTML=h;
    return;
  }

  // Full inventory by tier
  h+='<div class="mast-inv-hdr">All Items by Tier</div>';
  MAST_TIER_ORDER.forEach(t=>{
    const ti=byTier[t]; if(!ti||!ti.length) return;
    const coll=masteryCollapsed[masteryKid+"_"+t];
    h+='<div class="mast-tier-sec"><div class="mast-tier-hdr" style="background:'+MAST_TIER_COL[t]+'" onclick="mastToggleTier(\''+t+'\')">';
    h+='<span class="mast-tier-lbl">'+(MAST_TIER_LBL[t]||t)+'</span>';
    h+='<span style="display:flex;align-items:center;gap:8px"><span class="mast-tier-cnt">'+ti.length+' item'+(ti.length!==1?"s":"")+'</span>';
    h+='<span class="mast-tier-chev'+(coll?"":" open")+'">&#9660;</span></span></div>';
    h+='<div class="mast-tier-items'+(coll?" collapsed":"")+'">';
    ti.forEach(i=>{
      const mode=i.review_mode||"oral";
      const ml={written:"\u{270F}\u{FE0F} Written",recite:"\u{1F4E2} Recite",oral:"\u{1F5E3}\u{FE0F} Oral",flash:"\u{1F0CF} Flash"}[mode]||mode;
      h+='<div class="mast-irow mast-irow-tap" onclick="mastToggleExpand(\''+i.id+'\')">';
      if(i.imageUrl) h+='<img src="'+i.imageUrl+'" style="width:24px;height:24px;border-radius:4px;object-fit:cover;flex-shrink:0">';
      h+='<span class="mast-irow-prompt">'+i.prompt+'</span>';
      if(i.drop_count) h+='<span class="mast-irow-drop">\u{2B07}'+i.drop_count+'</span>';
      h+='<span class="mast-irow-mode '+mode+'">'+ml+'</span></div>';
      h+=mastExpandHtml(i);
    });
    h+='</div></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function mastPrintDrill(){
  const pStudent=document.getElementById("mast-chk-student")?.checked;
  const pParent=document.getElementById("mast-chk-parent")?.checked;
  if(!pStudent&&!pParent){alert("Check at least one sheet");return;}

  const pn=mastGetPrintNum();
  const due=mastDueItems(masteryKid,pn);
  const dueW=due.filter(i=>i.review_mode==="written");
  const color=MAST_KID_COL[masteryKid];
  const label=SL_KLBL[masteryKid];
  const emoji=MAST_KID_EMOJI[masteryKid];
  const today=new Date();
  const dayN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
  const monN=["January","February","March","April","May","June","July","August","September","October","November","December"][today.getMonth()];
  const dateStr=monN+" "+today.getDate()+", "+today.getFullYear();
  const wkLabel=(weekData.week||WK).replace("week","Week ");

  let pages="";

  // Student sheet
  if(pStudent&&dueW.length){
    const twoCol=dueW.length>10;
    let rows="";
    if(twoCol){
      const half=Math.ceil(dueW.length/2);
      for(let i=0;i<half;i++){
        const li=i+1,ri=i+half+1;
        const right=ri<=dueW.length?'<td class="gap"></td><td class="num">'+ri+'.</td><td class="blank"></td>':'<td colspan="3"></td>';
        rows+='<tr><td class="num">'+li+'.</td><td class="blank"></td>'+right+'</tr>';
      }
      rows='<table class="mpp-table-2col">'+rows+'</table>';
    } else {
      for(let i=0;i<dueW.length;i++) rows+='<tr><td class="num">'+(i+1)+'.</td><td class="blank"></td></tr>';
      rows='<table class="mpp-table">'+rows+'</table>';
    }
    pages+='<div class="mpp-sheet"><div class="mpp-header" style="background:'+color+'"><div><div class="mpp-header-name">'+emoji+' '+label+'</div><div class="mpp-header-sub">Spelling &amp; Review</div></div>';
    pages+='<div class="mpp-header-right">'+wkLabel+'<br>'+dayN+', '+dateStr+'</div></div>';
    pages+='<div class="mpp-label" style="color:'+color+';border-color:'+color+'40">Write each word</div>'+rows+'</div>';
  }

  // Parent sheet
  if(pParent&&due.length){
    let rows="";
    due.forEach((it,i)=>{
      const isW=it.review_mode==="written";
      const tl=(MAST_TIER_LBL[it.tier]||it.tier).replace(/_/g," ");
      const icon=isW?"":"<td style=\"width:18px;text-align:center;font-size:0.72rem\">"+({recite:"\u{1F4E2}",oral:"\u{1F5E3}\u{FE0F}",flash:"\u{1F0CF}"}[it.review_mode]||"\u{1F5E3}\u{FE0F}")+"</td>";
      rows+='<tr><td class="td-box"><div class="mpp-score-box"></div></td><td class="td-num">'+(i+1)+'.</td>'+icon+'<td class="td-prompt">'+it.prompt+'</td><td class="td-tier"><span class="mpp-tier-pill">'+tl+'</span></td></tr>';
    });
    pages+='<div class="mpp-sheet"><div class="mpp-header" style="background:'+color+'"><div><div class="mpp-header-name">'+emoji+' '+label+'</div><div class="mpp-header-sub">Parent Drill Sheet</div></div>';
    pages+='<div class="mpp-header-right">'+wkLabel+'<br>'+dayN+', '+dateStr+'</div></div>';
    pages+='<div class="mpp-legend"><div class="mpp-legend-box"></div><span><b>\u{2713}</b> = correct &nbsp; <b>\u{2717}</b> = miss &nbsp; <b>~</b> = close</span></div>';
    pages+='<table class="mpp-ptable">'+rows+'</table></div>';
  }

  let container=document.getElementById("mast-print-container");
  if(!container){container=document.createElement("div");container.id="mast-print-container";container.className="mast-print-page";document.body.appendChild(container);}
  container.innerHTML=pages;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ container.innerHTML=""; },1000); },100);
}

function mastPrintJulian(){
  let allItems=masteryData.julian||[];
  if(!Array.isArray(allItems)) allItems=Object.values(allItems);
  const introItems=allItems.filter(i=>i.status==="introduction");
  const ladderItems=allItems.filter(i=>i.status!=="introduction");

  const COLOR_MAP={Red:"#ef4444",Blue:"#3b82f6",Green:"#22c55e",Yellow:"#eab308",Orange:"#f97316",Purple:"#a855f7",Pink:"#ec4899",Brown:"#92400e",Black:"#1f2937",White:"#e5e7eb"};
  const SHAPE_MAP={Circle:'\u{25CF}',Square:'\u{25A0}',Triangle:'\u{25B2}'};
  const CAT_EMOJI={Letters:"\u{1F524}",Numbers:"\u{1F522}",Colors:"\u{1F3A8}",Shapes:"\u{1F537}",Animals:"\u{1F43E}"};
  const TIER_LBL={daily:"Daily",every_other_day:"Every Other Day",weekly:"Weekly",bi_weekly:"Bi-Weekly",monthly:"Monthly"};
  const kc="#c2410c";

  function jVis(it,sz){
    if(it.imageUrl) return '<img src="'+it.imageUrl+'" style="width:'+sz+'px;height:'+sz+'px;object-fit:contain;border-radius:4px">';
    if(it.emoji) return '<span style="font-size:'+sz+'px">'+it.emoji+'</span>';
    if(MAST_ANIMAL_EMOJI[it.prompt]) return '<span style="font-size:'+sz+'px">'+MAST_ANIMAL_EMOJI[it.prompt]+'</span>';
    const cat=it.subject||"";
    if(cat==="Colors"&&COLOR_MAP[it.prompt]){const s=Math.round(sz*0.85);return '<div style="width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+COLOR_MAP[it.prompt]+';border:1.5px solid rgba(0,0,0,0.1);display:inline-block"></div>';}
    if(cat==="Shapes"&&SHAPE_MAP[it.prompt]) return '<span style="font-size:'+sz+'px;color:'+kc+'">'+SHAPE_MAP[it.prompt]+'</span>';
    return '<span style="font-size:'+sz+'px;font-weight:800;color:'+kc+'">'+it.prompt+'</span>';
  }

  // Introduction cards grouped by category
  const introByCat={};
  introItems.forEach(i=>{const c=i.subject||"Other";if(!introByCat[c])introByCat[c]=[];introByCat[c].push(i);});
  let introHTML="";
  Object.entries(introByCat).forEach(([cat,items])=>{
    let cards="";
    items.forEach(i=>{
      const tally=i.tally_dots||0;
      let dots="";for(let d=0;d<5;d++) dots+='<div style="width:8px;height:8px;border-radius:50%;border:1.5px solid #fed7aa;background:'+(d<tally?kc:"white")+'"></div>';
      cards+='<div style="border:1.5px solid #fed7aa;border-radius:7px;background:#fff7ed;display:flex;flex-direction:column;align-items:center;padding:5px 3px 4px;width:60px;gap:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact">';
      cards+='<div style="font-size:24px;line-height:1;min-height:28px;display:flex;align-items:center;justify-content:center">'+jVis(i,24)+'</div>';
      cards+='<div style="font-size:7px;font-weight:700;color:'+kc+';text-align:center;line-height:1.2">'+i.prompt+'</div>';
      cards+='<div style="display:flex;gap:2px;align-items:center">'+dots+'<span style="font-size:8px;margin-left:1px">\u{2B50}</span></div>';
      cards+='</div>';
    });
    introHTML+='<div style="font-family:monospace;font-size:7px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:'+kc+';padding-bottom:3px;border-bottom:1.5px solid #fed7aa;margin-bottom:5px">'+(CAT_EMOJI[cat]||"")+' '+cat+'</div>';
    introHTML+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">'+cards+'</div>';
  });
  if(!introHTML) introHTML='<div style="font-size:8px;color:#9ca3af;padding:10px">No items in introduction</div>';

  // Ladder cards grouped by tier
  let ladderHTML="";
  ["every_other_day","weekly","bi_weekly","monthly"].forEach(tier=>{
    const tierItems=ladderItems.filter(i=>i.tier===tier);
    if(!tierItems.length) return;
    let cards="";
    tierItems.forEach(i=>{
      const con=i.consecutive_correct||0;
      let dots="";for(let d=0;d<3;d++) dots+='<div style="width:8px;height:8px;border-radius:50%;border:1.5px solid #fed7aa;background:'+(d<con?kc:"white")+'"></div>';
      cards+='<div style="border:1.5px solid #fed7aa;border-radius:6px;background:white;display:flex;align-items:center;padding:4px 7px;gap:6px;margin-bottom:3px">';
      cards+='<div style="font-size:18px;line-height:1;flex-shrink:0;min-width:22px;text-align:center">'+jVis(i,18)+'</div>';
      cards+='<div style="font-size:8px;font-weight:600;color:'+kc+';flex:1">'+i.prompt+'</div>';
      cards+='<div style="display:flex;gap:2px">'+dots+'<span style="font-size:8px">\u{2B50}</span></div>';
      cards+='</div>';
    });
    ladderHTML+='<div style="margin-bottom:6px"><div style="font-family:monospace;font-size:6.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;background:'+kc+';color:white;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact">'+(TIER_LBL[tier]||tier)+'</div>'+cards+'</div>';
  });
  if(!ladderHTML) ladderHTML='<div style="font-size:8px;color:#9ca3af;padding:10px">No items on ladder yet \u{2014} fill 5 dots to enter!</div>';

  const today=new Date();
  const dayN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
  const monN=["January","February","March","April","May","June","July","August","September","October","November","December"][today.getMonth()];
  const dateStr=monN+" "+today.getDate()+", "+today.getFullYear();
  const wkLabel=(weekData.week||WK).replace("week","Week ");

  let page='<div class="mpp-sheet" style="display:flex;flex-direction:column">';
  page+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  page+='<div><div style="font-size:1.1rem;font-weight:700;color:'+kc+'">\u{1F995} Julian</div>';
  page+='<div style="font-size:0.6rem;color:#6b7280">Pre-K \u{00B7} Left = introduction \u{00B7} fill 5 dots \u{2192} \u{2B50} enters ladder \u{00B7} Right = ladder \u{00B7} 3 in a row \u{2192} moves up</div></div>';
  page+='<div style="font-family:monospace;font-size:8.5px;color:#9ca3af;text-align:right;line-height:1.7">'+wkLabel+'<br>'+dayN+', '+dateStr+'</div></div>';

  page+='<div style="display:flex;gap:14px;flex:1;min-width:0;width:100%">';
  page+='<div style="flex:1;min-width:0;border:1.5px solid #fed7aa;border-radius:8px;display:flex;flex-direction:column">';
  page+='<div style="font-size:8px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:white;background:'+kc+';padding:4px 10px;border-radius:4px;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact">\u{2B50} Introduction \u{2014} fill 5 dots to enter the ladder</div>';
  page+='<div style="padding:8px 10px">'+introHTML+'</div></div>';

  page+='<div style="width:220px;flex-shrink:0;border:1.5px solid #fed7aa;border-radius:8px;display:flex;flex-direction:column">';
  page+='<div style="font-size:8px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:white;background:'+kc+';padding:4px 10px;border-radius:4px;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact">\u{1FA9C} Ladder \u{2014} 3 in a row \u{2192} moves up</div>';
  page+='<div style="padding:8px 10px;flex:1;display:flex;flex-direction:column">'+ladderHTML;
  page+='<div style="margin-top:auto;border-top:1.5px dashed #fed7aa;padding-top:6px">';
  page+='<div style="font-family:monospace;font-size:6.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;background:#16a34a;color:white;padding:2px 7px;border-radius:3px;display:inline-block;margin-bottom:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact">\u{1F389} Graduated!</div>';
  page+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">';
  page+='<div style="border:1.5px solid #fed7aa;border-radius:20px;padding:2px 8px;font-size:8px;font-weight:600;color:'+kc+'">\u{2B50} ________</div>';
  page+='<div style="border:1.5px solid #fed7aa;border-radius:20px;padding:2px 8px;font-size:8px;font-weight:600;color:'+kc+'">\u{2B50} ________</div>';
  page+='<div style="border:1.5px solid #fed7aa;border-radius:20px;padding:2px 8px;font-size:8px;font-weight:600;color:'+kc+'">\u{2B50} ________</div>';
  page+='</div></div></div></div>';
  page+='</div>';

  page+='<div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;font-size:8px;color:#6b7280">';
  page+='<span>\u{1F995} Drill streak <span style="display:inline-block;border-bottom:1.5px solid '+kc+';width:26px;height:13px"></span> days</span>';
  page+='<span>5 intro dots \u{2192} enters ladder \u{00B7} 3 correct in a row \u{2192} moves up \u{00B7} miss \u{2192} drops one tier</span></div>';
  page+='</div>';

  let container=document.getElementById("mast-print-container");
  if(!container){container=document.createElement("div");container.id="mast-print-container";container.className="mast-print-page";document.body.appendChild(container);}
  container.innerHTML=page;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ container.innerHTML=""; },1000); },100);
}
