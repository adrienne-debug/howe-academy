        <div style="font-size:10px;color:#78716c;margin-top:2px">words / 60s</div>
      </div>
      <div style="border-radius:10px;padding:11px;text-align:center;background:#eff6ff;border:1.5px solid #93c5fd">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#1e3a5f;margin-bottom:4px">Sheet B — Second Pass</div>
        <input type="number" id="sp-score-b" min="0" placeholder="—" oninput="sprintUpdateGain()" autocomplete="off" style="width:80px;font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:#1e3a5f;border:none;background:transparent;text-align:center;outline:none;padding:0"/>
        <div style="font-size:10px;color:#78716c;margin-top:2px">words / 60s</div>
      </div>
    </div>
    <div id="sp-gain" style="text-align:center;padding-top:8px;border-top:1px solid #e2ddd6;font-size:12px;font-weight:700;color:#78716c">Enter scores above to see session gain</div>
  </div>`;

  h+=`<div id="sp-sheets"></div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PHASE 4 — PLAN NEXT WEEK WIZARD
// ═══════════════════════════════════════════════════════════════════════════════

function openPlanNextWeek(weekNum){
  if(!adminPinUnlocked){
    pnwPendingWeek=weekNum||null;
    pnwOpen='pin';
    renderPlanNextWeek();
    return;
  }
  pnwStartWizard(weekNum);
}

function pnwStartWizard(weekOverride){
  const nw=weekOverride||currWeekNum()+1;
  gwConfig={weekNum:String(nw),babysitter:{},withSitter:(rulesData&&rulesData.withSitter)||[],skipDays:[],lateStart:{},carSchool:{},theater:false,saturday:false,redistribute:[],autoAdvance:true};
  pnwStep=0; pnwResult=null; pnwDropped=null; pnwConfigReady=false; pnwOpen=true;
  renderPlanNextWeek();
  if(db){
    db.ref("weekConfig/"+nw).once("value",s=>{
      const v=s.val();
      if(v){
        const rawMag=v.babysitter||v.maggie||{};
        const normMag={};
        for(const[k,val] of Object.entries(rawMag)) normMag[k]=gwNormSitter(val);
        gwConfig={weekNum:v.weekNum||String(nw),babysitter:normMag,withSitter:v.withSitter||(rulesData&&rulesData.withSitter)||[],skipDays:v.skipDays||[],lateStart:v.lateStart||{},carSchool:v.carSchool||{},theater:!!v.theater,saturday:!!v.saturday,redistribute:v.redistribute||[],autoAdvance:true};
      }
      pnwConfigReady=true;
      renderPlanNextWeek();
    });
  } else { pnwConfigReady=true; renderPlanNextWeek(); }
}

function closePlanNextWeek(){
  pnwOpen=false; pnwStep=0; pnwResult=null; pnwDropped=null;
  const ol=document.getElementById("pnw-overlay");
  if(ol) ol.remove();
}

function pnwGenerate(){
  if(!currData||!currData.subjects) return;
  if(parseInt(gwConfig.weekNum)<currWeekNum()){
    gwShowToast("Can't generate a past week (current is Week "+currWeekNum()+").");
    return;
  }
  const gen=generateWeek(gwConfig);
  if(gen.error){ gwShowToast(gen.error); return; }
  pnwResult=gen.result; pnwDropped=gen.dropped; pnwCarryOverCount=gen.carryOverCount||0;
  pnwStep=1;
  renderPlanNextWeek();
}

function pnwApply(){
  if(!pnwResult) return;
  gwResult=pnwResult; gwDropped=pnwDropped; gwCarryOverCount=pnwCarryOverCount;
  gwCommit();
  closePlanNextWeek();
}

function pnwBack(){
  if(pnwStep>0){ pnwStep--; renderPlanNextWeek(); }
  else closePlanNextWeek();
}

function renderPlanNextWeek(){
  let ol=document.getElementById("pnw-overlay");
  if(!ol){ ol=document.createElement("div"); ol.id="pnw-overlay"; ol.className="pnw-overlay"; document.body.appendChild(ol); }

  if(pnwOpen==='pin'){
    ol.innerHTML='<div class="pnw-header"><button class="pnw-back" onclick="closePlanNextWeek()">←</button><div class="pnw-title">Plan Next Week</div></div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center">'+
      '<div style="font-size:48px;margin-bottom:12px">📋</div>'+
      '<div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:700;margin-bottom:4px">Enter Mom PIN</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-bottom:16px">Required to plan and generate weeks.</div>'+
      '<input id="pnw-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="off" '+
      'style="width:120px;text-align:center;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;letter-spacing:8px;font-family:\'DM Sans\',sans-serif" '+
      'oninput="pnwCheckPin(this.value)">'+
      '<div id="pnw-pin-err" style="font-size:11px;color:#b5394a;margin-top:6px;min-height:14px"></div></div>';
    setTimeout(()=>{const i=document.getElementById("pnw-pin-input");if(i)i.focus();},50);
    return;
  }

  if(!pnwConfigReady){
    ol.innerHTML='<div class="pnw-header"><button class="pnw-back" onclick="closePlanNextWeek()">←</button><div class="pnw-title">Plan Week '+gwConfig.weekNum+'</div></div>'+
      '<div style="padding:60px 20px;text-align:center;color:var(--muted)"><div style="font-size:24px;margin-bottom:8px">Loading...</div></div>';
    return;
  }

  const WDAYS=["monday","tuesday","wednesday","thursday","friday"];
  const c=gwConfig;
  const stepLabels=["Configure","Preview","Apply"];

  let h='<div class="pnw-header"><button class="pnw-back" onclick="pnwBack()">←</button><div class="pnw-title">Plan Week '+c.weekNum+'</div></div>';
  h+='<div class="pnw-steps">';
  stepLabels.forEach((lbl,i)=>{
    const cls=i===pnwStep?"active":i<pnwStep?"done":"";
    h+='<div class="pnw-step '+cls+'"><span class="pnw-step-num">'+(i<pnwStep?"✓":(i+1))+'</span>'+lbl+'</div>';
  });
  h+='</div>';

  h+='<div class="pnw-body">';

  if(pnwStep===0){
    // ── STEP 1: CONFIGURE ──
    const sitterCount=Object.keys(c.babysitter).length;
    const skipCount=c.skipDays.length;
    const lateCount=Object.keys(c.lateStart).length;
    const carCount=Object.keys(c.carSchool).length;

    h+='<div class="pnw-section"><div class="pnw-section-title">'+SITTER_NAME+' Days'+(sitterCount?' <span style="font-size:11px;color:#16a34a;font-weight:600">'+sitterCount+' selected</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=!!c.babysitter[d];
      h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleSitter(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div>';
    Object.entries(c.babysitter).forEach(([d,v])=>{
      const mg=gwNormSitter(v);
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0;flex-wrap:wrap"><span style="font-size:12px;font-weight:600;width:44px">'+cap(d).substring(0,3)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">Start:</span>'+
        '<input type="time" value="'+ampmTo24(mg.start)+'" class="pnw-time-input" style="width:95px" onchange="gwConfig.babysitter[\''+d+'\'].start=to12h(this.value);renderPlanNextWeek()">'+
        '<span style="font-size:11px;color:var(--muted)">Return:</span>'+
        '<input type="time" value="'+ampmTo24(mg.end)+'" class="pnw-time-input" style="width:95px" onchange="gwConfig.babysitter[\''+d+'\'].end=to12h(this.value);renderPlanNextWeek()"></div>';
    });
    if(sitterCount){
      h+='<div style="margin-top:10px"><span style="font-size:12px;font-weight:600">With '+SITTER_NAME+'</span> <span style="font-size:11px;color:var(--muted)">(no school during window)</span></div>';
      h+='<div class="pnw-chip-row" style="margin-top:4px">';
      ["lincoln","ellis","lucy","julian"].forEach(k=>{
        const on=(c.withSitter||[]).includes(k);
        h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleWithSitter(\''+k+'\')">'+cap(k)+'</div>';
      });
      h+='</div>';
    }
    h+='</div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Skip Days'+(skipCount?' <span style="font-size:11px;color:#991b1b;font-weight:600">'+skipCount+' off</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=c.skipDays.includes(d);
      h+='<div class="pnw-chip'+(on?" skip":"")+'" onclick="pnwToggleSkip(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div></div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Late Start'+(lateCount?' <span style="font-size:11px;color:#c45e1a;font-weight:600">'+lateCount+' day(s)</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=!!c.lateStart[d];
      h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleLate(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div>';
    Object.entries(c.lateStart).forEach(([d,t])=>{
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0"><span style="font-size:12px;font-weight:600;width:60px">'+cap(d).substring(0,3)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">Start:</span>'+
        '<input type="time" value="'+ampmTo24(t)+'" class="pnw-time-input" onchange="gwConfig.lateStart[\''+d+'\']=to12h(this.value);renderPlanNextWeek()"></div>';
    });
    h+='</div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Car School'+(carCount?' <span style="font-size:11px;color:#c45e1a;font-weight:600">'+carCount+' day(s)</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=!!c.carSchool[d];
      h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleCar(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div>';
    Object.entries(c.carSchool).forEach(([d,info])=>{
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0;flex-wrap:wrap"><span style="font-size:12px;font-weight:600;width:60px">'+cap(d).substring(0,3)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">Until:</span>'+
        '<input type="time" value="'+ampmTo24(info.end)+'" class="pnw-time-input" onchange="gwConfig.carSchool[\''+d+'\'].end=to12h(this.value);renderPlanNextWeek()">'+
        '<input type="text" value="'+(info.note||"")+'" placeholder="Note" style="flex:1;min-width:100px;padding:6px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-family:\'DM Sans\',sans-serif" onchange="gwConfig.carSchool[\''+d+'\'].note=this.value"></div>';
    });
    h+='</div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Options</div>';
    h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
    h+='<div class="pnw-chip'+(c.theater?" on":"")+'" onclick="gwConfig.theater=!gwConfig.theater;renderPlanNextWeek()">Theater Week</div>';
    h+='<div class="pnw-chip'+(c.saturday?" on":"")+'" onclick="gwConfig.saturday=!gwConfig.saturday;renderPlanNextWeek()">Include Saturday</div>';
    h+='</div></div>';

    if(c.redistribute.length){
      h+='<div class="pnw-section"><div class="pnw-section-title">Redistribution Rules <span style="font-size:11px;color:var(--muted);font-weight:500">'+c.redistribute.length+' rule(s)</span></div>';
      c.redistribute.forEach((r,i)=>{
        h+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600">'+
          cap(r.kid)+' · '+cap(r.from)+' → '+cap(r.to)+' ('+r.subjects+')'+
          '<button style="margin-left:auto;background:none;border:none;color:#ef4444;font-size:14px;cursor:pointer" onclick="gwConfig.redistribute.splice('+i+',1);renderPlanNextWeek()">✕</button></div>';
      });
      h+='</div>';
    }

  } else if(pnwStep===1){
    // ── STEP 2: PREVIEW ──
    const r=pnwResult;
    if(!r){ pnwStep=0; renderPlanNextWeek(); return; }

    const tasksByDay={};
    r.tasks.forEach(t=>{
      if(!tasksByDay[t.day]) tasksByDay[t.day]=[];
      tasksByDay[t.day].push(t);
    });
    const droppedByDay={};
    (pnwDropped||[]).forEach(d=>{
      if(!droppedByDay[d.day]) droppedByDay[d.day]=[];
      droppedByDay[d.day].push(d);
    });

    const totalTasks=r.tasks.length;
    const totalDays=Object.keys(r.dates).length;
    const totalDropped=(pnwDropped||[]).filter(d=>d.reason.includes("CUTOFF")).length;
    const totalMin=r.tasks.reduce((s,t)=>s+(t.dur||20),0);

    h+='<div class="pnw-summary"><div class="pnw-summary-big">'+r.week.replace("week","Week ")+'</div>';
    h+='<div class="pnw-summary-sub">'+totalTasks+' tasks across '+totalDays+' days · ~'+Math.round(totalMin/60)+' hrs total';
    if(pnwCarryOverCount) h+=' · <span style="color:#7c3aed">'+pnwCarryOverCount+' carry-over'+(pnwCarryOverCount>1?'s':'')+'</span>';
    if(totalDropped) h+=' · <span style="color:#991b1b">'+totalDropped+' dropped</span>';
    h+='</div></div>';

    const KID_COL={lincoln:"#1e3a5f",ellis:"#2d5a3d",lucy:"#5b3a8c",julian:"#c45e1a"};
    const dayOrder=["monday","tuesday","wednesday","thursday","friday","saturday"];
    const sortedDays=Object.keys(r.dates).sort((a,b)=>dayOrder.indexOf(a)-dayOrder.indexOf(b));

    sortedDays.forEach(dn=>{
      const dt=r.dates[dn];
      const dayTasks=tasksByDay[dn]||[];
      const dayDrops=droppedByDay[dn]||[];
      const cutoffs=dayDrops.filter(d=>d.reason.includes("CUTOFF"));
      const dayMin=dayTasks.reduce((s,t)=>s+(t.dur||20),0);

      const kidCounts={};
      dayTasks.forEach(t=>{ kidCounts[t.who]=(kidCounts[t.who]||0)+1; });

      h+='<div class="pnw-day-card" style="border-left:3px solid '+(DAY_COL[dn]||"#666")+'">';
      h+='<div class="pnw-day-hdr"><div><div class="pnw-day-name" style="color:'+(DAY_COL[dn]||"#666")+'">'+(DAY_LBL[dn]||dn)+'</div><div class="pnw-day-date">'+dt+'</div></div>';
      h+='<div style="font-size:20px;font-weight:700;font-family:\'Fraunces\',serif;color:'+(DAY_COL[dn]||"#666")+'">'+dayTasks.length+'</div></div>';

      h+='<div class="pnw-day-stats">';
      h+='<div class="pnw-stat"><div class="pnw-stat-val">'+dayTasks.length+'</div><div class="pnw-stat-lbl">Tasks</div></div>';
      h+='<div class="pnw-stat"><div class="pnw-stat-val">'+Math.round(dayMin/60*10)/10+'h</div><div class="pnw-stat-lbl">Duration</div></div>';
      h+='<div class="pnw-stat"><div class="pnw-stat-val">'+(cutoffs.length||'—')+'</div><div class="pnw-stat-lbl">Dropped</div></div>';
      h+='</div>';

      h+='<div class="pnw-day-kids">';
      Object.entries(kidCounts).sort((a,b)=>b[1]-a[1]).forEach(([k,cnt])=>{
        h+='<span class="pnw-kid-pill" style="background:'+(KID_COL[k]||"#666")+'">'+cap(k)+' · '+cnt+'</span>';
      });
      h+='</div>';

      if(r.constraints&&r.constraints[dn]){
        h+='<div class="pnw-constraint">'+r.constraints[dn]+'</div>';
      }
      if(cutoffs.length){
        h+='<div class="pnw-dropped">⚠️ '+cutoffs.length+' task(s) ran past cutoff: '+cutoffs.map(d=>cap(d.kid)+' '+d.key).join(', ')+'</div>';
      }
      h+='</div>';
    });
  }

  h+='</div>'; // close pnw-body

  // ── FOOTER ──
  h+='<div class="pnw-footer">';
  if(pnwStep===0){
    h+='<button class="pnw-btn pnw-btn-secondary" onclick="closePlanNextWeek()">Cancel</button>';
    h+='<button class="pnw-btn pnw-btn-primary" onclick="pnwSaveAndGenerate()">Preview Week →</button>';
  } else if(pnwStep===1){
    h+='<button class="pnw-btn pnw-btn-secondary" onclick="pnwBack()">← Edit Config</button>';
    h+='<button class="pnw-btn pnw-btn-go" onclick="pnwApply()">Looks Good — Apply ✓</button>';
  }
  h+='</div>';

  ol.innerHTML=h;
  ol.scrollTop=0;
}

function pnwCheckPin(val){
  if(val.length<4) return;
  if(val===APP_PIN){
    adminPinUnlocked=true;
    pnwStartWizard(pnwPendingWeek||null);
  } else {
    const err=document.getElementById("pnw-pin-err");
    const inp=document.getElementById("pnw-pin-input");
    if(err) err.textContent="Incorrect PIN";
    if(inp){inp.value="";inp.style.borderColor="#b5394a";}
    setTimeout(()=>{if(err)err.textContent="";if(inp)inp.style.borderColor="var(--border)";},1500);
  }
}

function pnwToggleSitter(d){
  if(gwConfig.babysitter[d]) delete gwConfig.babysitter[d];
  else gwConfig.babysitter[d]={start:"10:00 AM",end:"2:00 PM"};
  renderPlanNextWeek();
}
function pnwToggleWithSitter(k){
  if(!gwConfig.withSitter) gwConfig.withSitter=[];
  const i=gwConfig.withSitter.indexOf(k);
  if(i>=0) gwConfig.withSitter.splice(i,1); else gwConfig.withSitter.push(k);
  renderPlanNextWeek();
}
function pnwToggleSkip(d){
  const i=gwConfig.skipDays.indexOf(d);
  if(i>=0) gwConfig.skipDays.splice(i,1); else gwConfig.skipDays.push(d);
  renderPlanNextWeek();
}
function pnwToggleLate(d){
  if(gwConfig.lateStart[d]) delete gwConfig.lateStart[d];
  else gwConfig.lateStart[d]="11:00 AM";
  renderPlanNextWeek();
}
function pnwToggleCar(d){
  if(gwConfig.carSchool[d]) delete gwConfig.carSchool[d];
  else gwConfig.carSchool[d]={end:"12:00 PM",note:"Travel Day"};
  renderPlanNextWeek();
}

function pnwSaveAndGenerate(){
  if(db&&gwConfig.weekNum) db.ref("weekConfig/"+gwConfig.weekNum).set({...gwConfig});
  pnwGenerate();
}

// ═══════════════════════════════════════════════════════════════════════════════
// PHASE 2 — WEEK CONFIG UI
// ═══════════════════════════════════════════════════════════════════════════════

function loadWeekConfig(wn){
  if(!db||!wn) return;
  db.ref("weekConfig/"+wn).once("value",s=>{
    const v=s.val();
    if(v){
      const rawMag=v.babysitter||v.maggie||{};
      const normMag={};
      for(const[k,val] of Object.entries(rawMag)) normMag[k]=gwNormSitter(val);
      gwConfig={
        weekNum:v.weekNum||wn,
        babysitter:normMag,
        withSitter:v.withSitter||[],
        skipDays:v.skipDays||[],
        lateStart:v.lateStart||{},
        carSchool:v.carSchool||{},
        theater:!!v.theater,
        saturday:!!v.saturday,
        redistribute:v.redistribute||[]
      };
    } else {
      gwConfig.weekNum=wn;
    }
    renderAll();
  });
}

function saveWeekConfig(){
  if(!gwConfig.weekNum) return;
  const c={...gwConfig};
  if(db) db.ref("weekConfig/"+c.weekNum).set(c);
  gwShowToast("Config saved for Week "+c.weekNum);
}

function gwShowToast(msg){
  gwStatus=msg;
  renderAll();
  setTimeout(()=>{ gwStatus=""; renderAll(); },3000);
}

function gwToggleCard(key){
  gwConfigOpen[key]=!gwConfigOpen[key]; renderAll();
}

function gwNormSitter(v){
  if(typeof v==="string") return {start:"10:00 AM",end:v};
  return {start:v.start||"10:00 AM",end:v.end||"2:00 PM"};
}
function gwToggleSitter(d){
  if(gwConfig.babysitter[d]) delete gwConfig.babysitter[d];
  else gwConfig.babysitter[d]={start:"10:00 AM",end:"2:00 PM"};
  renderAll();
}
function gwSetSitterTime(d,v){ gwConfig.babysitter[d].end=to12h(v); renderAll(); }
function gwSetSitterStart(d,v){ gwConfig.babysitter[d].start=to12h(v); renderAll(); }

function gwToggleSkip(d){
  const i=gwConfig.skipDays.indexOf(d);
  if(i>=0) gwConfig.skipDays.splice(i,1); else gwConfig.skipDays.push(d);
  renderAll();
}

function gwToggleLate(d){
  if(gwConfig.lateStart[d]) delete gwConfig.lateStart[d];
  else gwConfig.lateStart[d]="11:00 AM";
  renderAll();
}
function gwSetLateTime(d,v){ gwConfig.lateStart[d]=to12h(v); renderAll(); }

function gwToggleCar(d){
  if(gwConfig.carSchool[d]) delete gwConfig.carSchool[d];
  else gwConfig.carSchool[d]={end:"12:00 PM",note:"Travel Day"};
  renderAll();
}
function gwSetCarEnd(d,v){ if(gwConfig.carSchool[d]) gwConfig.carSchool[d].end=to12h(v); renderAll(); }
function gwSetCarNote(d,v){ if(gwConfig.carSchool[d]) gwConfig.carSchool[d].note=v; }

function gwToggleTheater(){ gwConfig.theater=!gwConfig.theater; renderAll(); }
function gwToggleSaturday(){ gwConfig.saturday=!gwConfig.saturday; renderAll(); }

function gwAddRedist(){
  gwConfig.redistribute.push({kid:"ellis",from:"wednesday",to:"tuesday",subjects:"paper"});
  renderAll();
}

function gwSetRedist(i,field,val){ gwConfig.redistribute[i][field]=val; renderAll(); }

function gwParseDate(s){
  const p=s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
}

// Read from Rules tab — falls back to sensible defaults if rules not loaded
function gwRules(){
  const r=rulesData||{};
  const sd=r.schoolDay||{};
  return {
    schoolStart: toMin(sd.defaultStart||"10:00 AM"),
    schoolEnd:   toMin(sd.defaultEnd||"4:15 PM"),
    lunchStart:  toMin(sd.lunchStart||"1:00 PM"),
    lunchEnd:    toMin(sd.lunchEnd||"2:00 PM")
  };
}
const GW_DAY_NAMES=["monday","tuesday","wednesday","thursday","friday","saturday"];
const GW_DAY_PREFIXES=["m","t","w","th","f","sat"];
const GW_DEVICE_EMOJI={paper:"\u{1F4C4}",computer:"\u{1F4BB}",ipad:"\u{1F4F1}",phone:"\u{1F4DE}",book:"\u{1F4D6}"};
const GW_CAR_SAFE_KEYS=new Set(["eggspress_l","ind_read","read_eggs","nzk_l"]);

function gwSkipLunch(start,duration){
  const r=gwRules();
  if(start>=r.lunchEnd) return start;
  if(start+duration<=r.lunchStart) return start;
  return r.lunchEnd;
}

function gwGetSubjects(kid){
  if(!currData||!currData.subjects) return {};
  return currData.subjects[kid]||{};
}

function gwClassifySubjects(kid){
  const subjects=gwGetSubjects(kid);
  const paper=[],computer=[],ipad=[];
  for(const[key,s] of Object.entries(subjects)){
    if(s.device==="computer") computer.push(key);
    else if(s.device==="ipad") ipad.push(key);
    else paper.push(key);
  }
  return {paper,computer,ipad};
}

function gwByCategory(kid,tasksDict){
  const subjects=gwGetSubjects(kid);
  const buckets={first:[],computer:[],ipad:[],phone:[],independent:[],maybe_paper:[],required_paper:[],last:[]};
  for(const[key,raw] of Object.entries(tasksDict)){
    const s=subjects[key];
    if(!s) continue;
    // Expand arrays (doubled-up subjects from autoBalance) into separate entries
    const vals=Array.isArray(raw)?raw:[raw];
    const rules=s.rules||"";
    for(const val of vals){
      if(rules.includes("first")){ buckets.first.push([key,val]); continue; }
      if(rules.includes("last")){ buckets.last.push([key,val]); continue; }
      if(s.device==="computer") buckets.computer.push([key,val]);
      else if(s.device==="ipad") buckets.ipad.push([key,val]);
      else if(s.device==="phone") buckets.phone.push([key,val]);
      else if(s.mom==="required") buckets.required_paper.push([key,val]);
      else if(s.mom==="maybe") buckets.maybe_paper.push([key,val]);
      else buckets.independent.push([key,val]);
    }
  }
  // Sort required_paper so priority items come first
  buckets.required_paper.sort((a,b)=>{
    const aP=(subjects[a[0]]&&(subjects[a[0]].rules||"").includes("priority"))?0:1;
    const bP=(subjects[b[0]]&&(subjects[b[0]].rules||"").includes("priority"))?0:1;
    return aP-bP;
  });
  return buckets;
}

function gwTaskTitle(kid,key,excelVal,dayName,isCarSchool,ellisHasIpad){
  const subjects=gwGetSubjects(kid);
  const s=subjects[key];
  if(!s) return "\u{1F4C4} "+key+" — "+excelVal;
  let display=s.display||key;
  let emoji=GW_DEVICE_EMOJI[s.device]||"\u{1F4C4}";

  if(key==="eggspress_l") emoji=isCarSchool?"\u{1F4DE}":"\u{1F4BB}";
  if(key==="read_eggs"||key==="nzk_l") emoji=(isCarSchool||ellisHasIpad)?"\u{1F4DE}":"\u{1F4F1}";
  if(key==="fast_phon"||key==="mathseeds") emoji=isCarSchool?"\u{1F4DE}":"\u{1F4F1}";
  if(key==="eggspress_e"||key==="nzk_e") emoji="\u{1F4F1}";

  if(key==="mr_pages"){
    display=excelVal.includes("MR6")?"MR6 Math Reasoning":"MR5 Math Reasoning";
  }
  return emoji+" "+display+" — "+excelVal;
}

function gwSubjectDetail(kid,key){
  const s=gwGetSubjects(kid)[key];
  if(!s) return "";
  const parts=[];
  if(["paper","computer","ipad","phone"].includes(s.device)) parts.push(cap(s.device)+".");
  else if(s.device==="book") parts.push(s.minutes+" minutes.");
  if(s.mom==="required") parts.push("Mom Required.");
  else if(s.mom==="maybe") parts.push("May need Mom.");
  const rules=s.rules||"";
  if(rules.includes("sequential")) parts.push("Sequential.");
  if(rules.includes("max1")) parts.push("Max 1 per day.");
  if(rules.includes("mon-thu")) parts.push("Mon–Thu only.");
  if(rules.includes("no-fri")) parts.push("Not on Fridays.");
  return parts.join(" ");
}

class GWScheduler{
  constructor(schoolStart,momAvailable,cutoff,sitterStart,sitterEnd){
    this.computerFree=schoolStart;
    this.ipadFree=schoolStart;
    this.ipadFreeLucy=schoolStart;
    this.momFree=momAvailable;
    this.kidFree={lincoln:schoolStart,ellis:schoolStart,lucy:schoolStart};
    this.cutoff=cutoff;
    this.sitterStart=sitterStart||0;
    this.sitterEnd=sitterEnd||0;
  }
  _earliest(kid,reqComp,reqIpad,reqMom){
    let t=this.kidFree[kid];
    if(reqComp) t=Math.max(t,this.computerFree);
    if(reqIpad) t=Math.max(t,kid==="lucy"?this.ipadFreeLucy:this.ipadFree);
    if(reqMom) t=Math.max(t,this.momFree);
    return t;
  }
  place(kid,key,duration,reqComp,reqIpad,reqMom){
    let start=this._earliest(kid,reqComp,reqIpad,reqMom);
    start=gwSkipLunch(start,duration);
    if(reqMom&&this.sitterEnd>this.sitterStart&&start<this.sitterEnd&&start+duration>this.sitterStart){
      start=this.sitterEnd;
      start=gwSkipLunch(start,duration);
    }
    const end=start+duration;
    if(end>this.cutoff) return null;
    this.kidFree[kid]=end;
    if(reqComp) this.computerFree=end;
    if(reqIpad){ if(kid==="lucy") this.ipadFreeLucy=end; else this.ipadFree=end; }
    if(reqMom) this.momFree=end;
    return start;
  }
}

function gwBuildDayTasks(kidAssignments,dayConfig,prefix,counter){
  const schoolStart=dayConfig.schoolStart;
  const momAvailable=dayConfig.momAvailable;
  const isSitter=dayConfig.isSitter;
  const sitterStart=dayConfig.sitterStart;
  const sitterEnd=dayConfig.sitterEnd;
  const withSitter=dayConfig.withSitter||[];
  const isCarSchool=dayConfig.isCarSchool;
  const theater=dayConfig.theater;
  const dayName=dayConfig.dayName;
  const isFriday=dayName==="friday";
  const r=gwRules();
  const cutoff=(theater&&dayName!=="friday"&&dayName!=="saturday")?r.schoolEnd:Math.max(r.schoolEnd,17*60);

  // Inject built-in daily subjects into curriculum so getMeta/addTask work
  if(currData&&currData.subjects){
    const DAILY={morning_nb:{display:"Morning Notebook",device:"book",mom:"none",minutes:5,rules:"first",days:"",total:0},
                 closing_nb:{display:"Closing Notebook",device:"book",mom:"none",minutes:5,rules:"last",days:"",total:0}};
    ["lincoln","ellis","lucy"].forEach(k=>{
      if(!currData.subjects[k]) return;
      for(const[sk,sv] of Object.entries(DAILY)) if(!currData.subjects[k][sk]) currData.subjects[k][sk]=sv;
    });
    if(currData.subjects.lincoln&&!currData.subjects.lincoln.drills_l)
      currData.subjects.lincoln.drills_l={display:"Drills",device:"paper",mom:"required",minutes:5,rules:"priority",days:"",total:0};
  }

  const sched=new GWScheduler(schoolStart,momAvailable,cutoff,sitterStart,sitterEnd);
  const tasks=[];
  const dropped=[];

  const ellisHasIpad=["nzk_e","eggspress_e"].some(k=>(kidAssignments.ellis||{})[k]);

  function getMeta(kid,key){
    return gwGetSubjects(kid)[key]||null;
  }

  function addTask(kid,key,excelVal,startMin){
    const s=getMeta(kid,key);
    if(!s) return;
    const title=gwTaskTitle(kid,key,excelVal,dayName,isCarSchool,ellisHasIpad);
    const detail=gwSubjectDetail(kid,key);
    const taskId=prefix+(counter++);
    tasks.push({
      id:taskId,who:kid,day:dayName,time:fromMin(startMin),dur:s.minutes||20,
      title:title,detail:detail,mom:s.mom||"none",cascade:true
    });
  }

  function schedule(kid,key,excelVal){
    const s=getMeta(kid,key);
    if(!s) return;
    const reqMom=(s.mom==="required");
    if(isCarSchool&&s.device!=="ipad"&&!GW_CAR_SAFE_KEYS.has(key)){
      dropped.push({kid,day:dayName,key,val:excelVal,reason:"car school day — paper/computer tasks skipped"});
      return;
    }
    const rules=s.rules||"";
    if(rules.includes("no-fri")&&isFriday){
      dropped.push({kid,day:dayName,key,val:excelVal,reason:"Not scheduled on Fridays (Excel rule)"});
      return;
    }
    if(rules.includes("mon-thu")&&!["monday","tuesday","wednesday","thursday"].includes(dayName)){
      dropped.push({kid,day:dayName,key,val:excelVal,reason:"Mon–Thu only (Excel rule)"});
      return;
    }
    const isComp=s.device==="computer";
    const isIpad=s.device==="ipad";
    const start=sched.place(kid,key,s.minutes||20,isComp,isIpad,reqMom);
    if(start===null){
      dropped.push({kid,day:dayName,key,val:excelVal,reason:"⚠️ RAN PAST SCHOOL-DAY CUTOFF — needs manual placement"});
      return;
    }
    addTask(kid,key,excelVal,start);
  }

  function schedBucket(kid,bucket){ bucket.forEach(([key,val])=>schedule(kid,key,val)); }

  // ── JULIAN NOTEBOOK — 10:00 AM, 10 min ──
  tasks.push({
    id:prefix+(counter++),who:"julian",day:dayName,
    time:fromMin(Math.max(schoolStart,600)),dur:10,
    title:"\u{1F4D6} Notebook — Daily",detail:"Paper. 10 minutes.",
    mom:"none",cascade:true
  });

  const l=gwByCategory("lincoln",kidAssignments.lincoln||{});
  const e=gwByCategory("ellis",kidAssignments.ellis||{});
  const c=gwByCategory("lucy",kidAssignments.lucy||{});

  // First-of-day subjects (rule: "first") — skip withSitter kids on babysitter days
  const kidBuckets=[["lincoln",l],["ellis",e],["lucy",c]];
  kidBuckets.forEach(([kid,b])=>{
    if(isSitter&&withSitter.includes(kid)) return; // deferred to Phase C
    schedBucket(kid,b.first||[]);
  });

  if(isSitter){
    // ── Babysitter day — reads config from rules tab ──
    // withSitter kids: ALL tasks pushed past sitterEnd (no school during window)
    // Other kids: no-mom tasks fill window, mom-required after return

    // Phase A: schedule no-mom tasks for kids NOT with babysitter
    kidBuckets.forEach(([kid,b])=>{
      if(withSitter.includes(kid)) return; // skip — all tasks go after return
      schedBucket(kid,b.computer||[]);
      schedBucket(kid,b.ipad||[]);
      schedBucket(kid,b.phone||[]);
      schedBucket(kid,b.independent||[]);
      schedBucket(kid,b.maybe_paper||[]);
    });

    // Phase B: push everyone past babysitter return
    kidBuckets.forEach(([kid])=>{ sched.kidFree[kid]=Math.max(sched.kidFree[kid],sitterEnd); });
    sched.momFree=Math.max(sched.momFree,sitterEnd);

    // Phase C: mom-required tasks + ALL tasks for withSitter kids (including first/last)
    kidBuckets.forEach(([kid,b])=>{
      if(withSitter.includes(kid)){
        // This kid was with babysitter — schedule everything now (after return)
        schedBucket(kid,b.first||[]);
        schedBucket(kid,b.computer||[]);
        schedBucket(kid,b.ipad||[]);
        schedBucket(kid,b.phone||[]);
        schedBucket(kid,b.independent||[]);
        schedBucket(kid,b.maybe_paper||[]);
        schedBucket(kid,b.last||[]);
      }
      schedBucket(kid,b.required_paper||[]);
    });
  } else {
    // Normal day: original phase order
    // Phase 1
    schedBucket("lincoln",l.computer);
    schedBucket("ellis",e.required_paper);
    schedBucket("lucy",c.phone);

    // Phase 2
    schedBucket("lincoln",l.independent);
    schedBucket("ellis",e.maybe_paper);

    // Phase 3
    schedBucket("lincoln",l.maybe_paper);
    schedBucket("ellis",e.ipad);
    schedBucket("ellis",e.computer);

    // Phase 4
    schedBucket("lincoln",l.required_paper);

    // Phase 5
    schedBucket("lucy",c.ipad);
    schedBucket("lucy",[...c.independent,...c.maybe_paper,...c.required_paper]);
  }

  // Last-of-day subjects (rule: "last") — withSitter kids already got theirs in Phase C
  kidBuckets.forEach(([kid,b])=>{
    if(isSitter&&withSitter.includes(kid)) return; // already scheduled in Phase C
    schedBucket(kid,b.last||[]);
  });

  tasks.sort((a,b)=>toMin(a.time)-toMin(b.time));
  return {tasks,counter,dropped};
}

function gwApplyRedistribution(dayData,rules){
  const WDAY_NAMES={0:"monday",1:"tuesday",2:"wednesday",3:"thursday",4:"friday",5:"saturday",6:"sunday"};
  const dateByName={};
  for(const dk of Object.keys(dayData)){
    const d=gwParseDate(dk);
    const dn=WDAY_NAMES[d.getDay()];
    if(dn) dateByName[dn]=dk;
  }

  dayData=JSON.parse(JSON.stringify(dayData));

  for(const rule of rules){
    const kid=rule.kid;
    const fromDay=rule.from.toLowerCase();
    const toDay=rule.to.toLowerCase();
    const subjects=rule.subjects;

    const fromDate=dateByName[fromDay];
    const toDate=dateByName[toDay];
    if(!fromDate||!toDate) continue;
    const fromKidTasks=(dayData[fromDate]||{})[kid];
    if(!fromKidTasks||!Object.keys(fromKidTasks).length) continue;

    const cls=gwClassifySubjects(kid);
    let keysToMove;
    if(subjects==="paper") keysToMove=Object.keys(fromKidTasks).filter(k=>cls.paper.includes(k));
    else if(subjects==="ipad") keysToMove=Object.keys(fromKidTasks).filter(k=>cls.ipad.includes(k));
    else if(subjects==="all") keysToMove=Object.keys(fromKidTasks);
    else if(Array.isArray(subjects)) keysToMove=subjects.filter(k=>fromKidTasks[k]);
    else continue;

    if(!keysToMove.length) continue;
    if(!dayData[toDate]) dayData[toDate]={};
    if(!dayData[toDate][kid]) dayData[toDate][kid]={};

    for(const key of keysToMove){
      dayData[toDate][kid][key]=fromKidTasks[key];
      delete fromKidTasks[key];
    }
  }
  return dayData;
}

function gwAutoBalance(dayData,lateStart,skipDays){
  const WDAY_NAMES={0:"monday",1:"tuesday",2:"wednesday",3:"thursday",4:"friday",5:"saturday"};
  dayData=JSON.parse(JSON.stringify(dayData));
  const sortedDates=Object.keys(dayData).sort();
  const skipSet=new Set((skipDays||[]).map(d=>d.toLowerCase()));
  const _rr=gwRules();
  const DAY_END=_rr.schoolEnd;
  const LUNCH=_rr.lunchEnd-_rr.lunchStart;

  for(const kid of ["lincoln","ellis","lucy"]){
    const subjects=gwGetSubjects(kid);
    const durMap={};
    for(const[k,s] of Object.entries(subjects)) durMap[k]=s.minutes||20;
    const subjectRules={};
    for(const[k,s] of Object.entries(subjects)) subjectRules[k]=s.rules||"";

    const dayDates=[];
    const dayTotals={};
    for(const dk of sortedDates){
      const d=gwParseDate(dk);
      const dn=WDAY_NAMES[d.getDay()];
      if(!dn||skipSet.has(dn)) continue;
      const kidTasks=(dayData[dk]||{})[kid]||{};
      dayTotals[dk]=Object.keys(kidTasks).reduce((sum,k)=>sum+(durMap[k]||20),0);
      dayDates.push([dk,dn]);
    }

    // Capture original column order: values in Excel day order per subject
    const origOrder={};
    for(const[dk] of dayDates){
      const kt=(dayData[dk]||{})[kid]||{};
      for(const key of Object.keys(kt)){
        if(!origOrder[key]) origOrder[key]=[];
        origOrder[key].push(kt[key]);
      }
    }

    // Track slot counts per day per subject (supports doubling up)
    const slotCount={};
    for(const[dk] of dayDates){
      const kt=(dayData[dk]||{})[kid]||{};
      for(const key of Object.keys(kt)){
        const sk=dk+"|"+key;
        slotCount[sk]=1;
      }
    }

    let changed=true;
    while(changed){
      changed=false;
      const ranked=[...dayDates].sort((a,b)=>dayTotals[a[0]]-dayTotals[b[0]]);

      for(const[dk,dayName] of ranked){
        const startStr=(lateStart||{})[dayName]||((rulesData&&rulesData.schoolDay&&rulesData.schoolDay.defaultStart)||"10:00 AM");
        const capacity=DAY_END-toMin(startStr)-LUNCH;
        let room=capacity-dayTotals[dk];
        if(room<15) continue;

        const donors=[...dayDates].filter(x=>x[0]!==dk).sort((a,b)=>dayTotals[b[0]]-dayTotals[a[0]]);

        for(const[ld2,lday] of donors){
          if(room<15) break;
          if(dayTotals[ld2]<=dayTotals[dk]) continue;
          const srcTasks=(dayData[ld2]||{})[kid]||{};

          for(const key of Object.keys(srcTasks)){
            if(room<15) break;
            const dur=durMap[key]||20;
            if(dayTotals[ld2]-dur<dayTotals[dk]+dur) continue;
            const rules=subjectRules[key]||"";
            if(rules.includes("sticky")) continue;
            if(rules.includes("no-fri")&&dayName==="friday") continue;
            if(rules.includes("mon-thu")&&!["monday","tuesday","wednesday","thursday"].includes(dayName)) continue;
            // Only block doubling for max1 subjects (reflex, dictation)
            const dstTasks=(dayData[dk]||{})[kid]||{};
            if(dstTasks[key]!==undefined&&rules.includes("max1")) continue;
            if(dur>room) continue;

            // Decrement source slot count; delete key when count reaches 0
            const srcSlot=ld2+"|"+key;
            slotCount[srcSlot]=(slotCount[srcSlot]||1)-1;
            if(slotCount[srcSlot]<=0){
              delete slotCount[srcSlot];
              delete srcTasks[key];
            }
            // Increment dest slot count; ensure key exists in dayData
            const dstSlot=dk+"|"+key;
            slotCount[dstSlot]=(slotCount[dstSlot]||0)+1;
            if(!dayData[dk]) dayData[dk]={};
            if(!dayData[dk][kid]) dayData[dk][kid]={};
            dayData[dk][kid][key]="TMP";

            room-=dur;
            dayTotals[dk]+=dur;
            dayTotals[ld2]-=dur;
            changed=true;
          }
        }
      }
    }

    // Reassign values from original column order using slot counts
    // Earlier values go to earlier days; doubled days get values in order
    for(const key of Object.keys(origOrder)){
      const vals=origOrder[key];
      let vi=0;
      for(const[dk] of dayDates){
        const count=slotCount[dk+"|"+key]||0;
        if(count<=0){
          // Subject no longer on this day — clean up
          if(dayData[dk]&&dayData[dk][kid]&&dayData[dk][kid][key]!==undefined)
            delete dayData[dk][kid][key];
          continue;
        }
        if(!dayData[dk]) dayData[dk]={};
        if(!dayData[dk][kid]) dayData[dk][kid]={};
        if(count===1){
          dayData[dk][kid][key]=vals[vi++];
        } else {
          // Multiple on same day: array, earlier values first
          dayData[dk][kid][key]=vals.slice(vi,vi+count);
          vi+=count;
        }
      }
    }
  }
  return dayData;
}

function gwReadWeek(weekNum){
  if(!currData||!currData.weekDays||!currData.lessons) return null;
  const dayData={};
  const weekLabel="Wk "+weekNum;

  for(const kid of ["lincoln","ellis","lucy"]){
    const wdMap=currData.weekDays[kid]||{};
    const lessons=currData.lessons[kid]||{};
    const dayNums=wdMap[weekLabel];
    if(!dayNums||!dayNums.length) continue;

    for(const dn of dayNums){
      const lesson=lessons[dn];
      if(!lesson) continue;
      const dateStr=lesson.date;
      if(!dateStr) continue;
      if(!dayData[dateStr]) dayData[dateStr]={};
      if(!dayData[dateStr][kid]) dayData[dateStr][kid]={};

      const subjects=currData.subjects[kid]||{};
      for(const key of Object.keys(subjects)){
        if(lesson[key]&&lesson[key]!=="—"&&lesson[key]!=="nan"){
          dayData[dateStr][kid][key]=lesson[key];
        }
      }
    }
  }
  return dayData;
}

// Auto-advance version: same schedule pattern as the fixed week but replaces
// lesson content with cursor-based next lessons from check-off progress.
// excludeWeek: on regeneration, excludes this week's own tasks from cursor count
//   so the cursor reflects only prior-week progress (prevents self-counting drift).
// Returns {dayData, cursors} so generateWeek can store the snapshot.
function gwReadWeekAutoAdvance(weekNum,savedCursors,excludeWeek){
  const dayData=gwReadWeek(weekNum);
  if(!dayData) return null;

  const cursors={};

  for(const kid of ["lincoln","ellis","lucy"]){
    cursors[kid]={};
    const subjectSlots={};
    const sortedDates=Object.keys(dayData).sort();
    for(const dateStr of sortedDates){
      if(!dayData[dateStr]||!dayData[dateStr][kid]) continue;
      for(const sk of Object.keys(dayData[dateStr][kid])){
        if(!subjectSlots[sk]) subjectSlots[sk]=[];
        subjectSlots[sk].push(dateStr);
      }
    }
    for(const sk of Object.keys(subjectSlots)){
      const dates=subjectSlots[sk];
      // Two-tier: use saved cursor if available, otherwise compute fresh
      // On regeneration: exclude this week's own tasks so cursor doesn't drift
      const cursor=(savedCursors&&savedCursors[kid]&&savedCursors[kid][sk]!==undefined)
        ?savedCursors[kid][sk]
        :computeSubjectCursor(kid,sk,excludeWeek);
      cursors[kid][sk]=cursor;
      const nextLessons=getNextLessonsFromCursor(kid,sk,cursor,dates.length);
      for(let i=0;i<dates.length;i++){
        if(nextLessons[i]){
          dayData[dates[i]][kid][sk]=nextLessons[i].lesson;
        } else {
          delete dayData[dates[i]][kid][sk];
        }
      }
    }
  }
  return {dayData,cursors};
}

function generateWeek(config){
  const weekNum=parseInt(config.weekNum);
  if(!weekNum) return {error:"Week number required"};
  const weekLabel="week"+weekNum;

  let dayData, weekCursors=null;
  if(config.autoAdvance){
    // Two-tier cursor: detect regeneration vs new week
    const activeWK=localStorage.getItem("ha_active_wk")||WK;
    const isRegen=(weekLabel===activeWK);
    // Regeneration: recompute cursor excluding this week's own checked tasks
    // so the cursor reflects only progress from prior weeks (not self-counting).
    // New week: compute normally (prior weeks are in archive, current week is old week).
    const excludeWeek=isRegen?weekLabel:null;
    const result=gwReadWeekAutoAdvance(weekNum,null,excludeWeek);
    if(!result) return {error:"No curriculum data found for Wk "+weekNum};
    dayData=result.dayData;
    weekCursors=result.cursors;
  } else {
    dayData=gwReadWeek(weekNum);
  }
  if(!dayData||!Object.keys(dayData).length) return {error:"No curriculum data found for Wk "+weekNum};

  // Apply redistribution
  let balanced=config.redistribute&&config.redistribute.length
    ? gwApplyRedistribution(dayData,config.redistribute)
    : JSON.parse(JSON.stringify(dayData));

  // Auto-balance
  balanced=gwAutoBalance(balanced,config.lateStart||{},config.skipDays||[]);

  // Inject daily curriculum subjects (notebooks, drills) into every school day
  for(const dk of Object.keys(balanced)){
    if(!balanced[dk]) continue;
    for(const kid of ["lincoln","ellis","lucy"]){
      if(!balanced[dk][kid]||!Object.keys(balanced[dk][kid]).length) continue;
      balanced[dk][kid].morning_nb="Daily";
      balanced[dk][kid].closing_nb="Daily";
      if(kid==="lincoln") balanced[dk][kid].drills_l="Practice";
    }
  }

  const skipSet=new Set((config.skipDays||[]).map(d=>d.toLowerCase()));
  const sortedDates=Object.keys(balanced).sort();

  const WDAY_MAP={0:"sunday",1:"monday",2:"tuesday",3:"wednesday",4:"thursday",5:"friday",6:"saturday"};
  const dates={};
  for(const dk of sortedDates){
    const d=gwParseDate(dk);
    const dn=WDAY_MAP[d.getDay()];
    if(!dn||skipSet.has(dn)) continue;
    if(dn==="saturday"&&!config.saturday) continue;
    const mon=d.toLocaleDateString("en-US",{month:"long",day:"numeric",timeZone:"UTC"});
    dates[dn]=mon;
  }

  // Build constraints, windows, babysitter
  const constraints={};
  const windows={};
  const sitterCfg=config.babysitter||config.maggie||{};
  const withSitterKids=config.withSitter||[];
  for(const[dn,raw] of Object.entries(sitterCfg)){
    const mg=gwNormSitter(raw);
    constraints[dn]="\u{1F338} "+SITTER_NAME+" "+mg.start+"–"+mg.end+" \xB7 Mom Required from "+mg.end;
    windows[dn]=SITTER_NAME+" "+mg.start+"–"+mg.end+" \xB7 Mom Required from "+mg.end;
  }
  for(const[dn,startTime] of Object.entries(config.lateStart||{})){
    constraints[dn]="\u{1F550} Late start \xB7 School begins at "+startTime;
    windows[dn]="Late start \xB7 School from "+startTime;
  }
  for(const[dn,csInfo] of Object.entries(config.carSchool||{})){
    const note=csInfo.note||"Travel Day";
    const end=csInfo.end||"12:00 PM";
    constraints[dn]="\u{1F697} "+note+" \xB7 Car schooling until "+end;
    windows[dn]=note+" \xB7 Car school until "+end;
  }
  const theaterNote=config.theater?" \xB7 Theater 4:30 Mon–Thu":"";
  const gwR=gwRules();
  windows.default="School "+fromMin(gwR.schoolStart)+"–"+fromMin(gwR.schoolEnd)+theaterNote;

  let sitterObj=null;
  if(Object.keys(sitterCfg).length){
    const magDays=Object.keys(sitterCfg);
    sitterObj={days:magDays};
    if(withSitterKids.length) sitterObj.withSitter=withSitterKids;
    for(const[dn,raw] of Object.entries(sitterCfg)){
      const mg=gwNormSitter(raw);
      if(magDays.length===1){
        sitterObj.hours=mg.start+" - "+mg.end;
        sitterObj.mom_return=mg.end;
      } else {
        sitterObj["hours_"+dn]=mg.start+" - "+mg.end;
        sitterObj["mom_return_"+dn]=mg.end;
      }
    }
  }

  // Schedule tasks for each day
  const allTasks=[];
  const allDropped=[];
  let taskCounter=1;

  function dayOfYear(dt){ const jan1=new Date(dt.getFullYear(),0,0); return Math.floor((dt-jan1)/86400000); }

  for(const dk of sortedDates){
    const d=gwParseDate(dk);
    const dn=WDAY_MAP[d.getDay()];
    if(!dn||skipSet.has(dn)||!dates[dn]) continue;

    const idPrefix=d.getFullYear()+"d"+dayOfYear(d)+"_";

    // School start: late start override > rules per-day override > rules default
    const rulesSD=(rulesData&&rulesData.schoolDay)||{};
    const rulesDayOv=(rulesSD.overrides||{})[dn]||{};
    const rulesDefaultStart=rulesSD.defaultStart||"10:00 AM";
    const schoolStartStr=(config.lateStart||{})[dn]||rulesDayOv.start||rulesDefaultStart;
    const schoolStartMin=toMin(schoolStartStr);

    const isSitter=!!sitterCfg[dn];
    const mgNorm=isSitter?gwNormSitter(sitterCfg[dn]):{start:schoolStartStr,end:schoolStartStr};
    const sitterStartMin=isSitter?toMin(mgNorm.start):schoolStartMin;
    const sitterEndMin=isSitter?toMin(mgNorm.end):schoolStartMin;
    const momAvailable=schoolStartMin;

    const isCar=!!(config.carSchool||{})[dn];

    const dayConfig={
      schoolStart:schoolStartMin,
      momAvailable:momAvailable,
      isCarSchool:isCar,
      isSitter:isSitter,
      sitterStart:isSitter?sitterStartMin:0,
      sitterEnd:isSitter?sitterEndMin:0,
      withSitter:isSitter?withSitterKids:[],
      theater:!!config.theater,
      dayName:dn
    };

    const result=gwBuildDayTasks(balanced[dk]||{},dayConfig,idPrefix,taskCounter);
    taskCounter=result.counter;
    allTasks.push(...result.tasks);
    allDropped.push(...result.dropped);
  }

  // Inject carryovers from previous week
  // When auto-advance is on, the cursor replays unchecked curriculum lessons,
  // so skip carryovers whose title matches a task already generated for that kid.
  const coPool=getCarryOverPool();
  let coTasks=coPool.tasks.filter(t=>t.included);
  if(config.autoAdvance&&coTasks.length){
    const genTitles={};
    allTasks.forEach(t=>{
      const k=t.who+"|"+(t.title||"").toLowerCase();
      genTitles[k]=true;
    });
    coTasks=coTasks.filter(t=>!genTitles[t.who+"|"+(t.title||"").toLowerCase()]);
  }
  const firstDay=Object.keys(dates).sort((a,b)=>{
    const ord={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
    return (ord[a]||9)-(ord[b]||9);
  })[0]||"monday";
  coTasks.forEach(t=>{
    allTasks.push({
      id:t.id,who:t.who,day:firstDay,time:t.time||fromMin(gwRules().schoolStart),dur:t.dur||20,
      title:t.title,detail:(t.detail||t.title||"")+" (Carried from "+(t.prevWeek||"prev week")+")",
      mom:t.mom||"none",cascade:true
    });
  });

  const output={
    week:weekLabel,
    dates:dates,
    constraints:constraints,
    windows:windows,
    tasks:allTasks
  };
  if(sitterObj) output.babysitter=sitterObj;

  return {result:output,dropped:allDropped,carryOverCount:coTasks.length,cursors:weekCursors};
}

function runGenerateWeek(){
  if(!gwConfig.weekNum){
    gwShowToast("Enter a week number first.");
    return;
  }
  if(parseInt(gwConfig.weekNum)<currWeekNum()){
    gwShowToast("Can't generate a past week (current is Week "+currWeekNum()+").");
    return;
  }
  if(!currData||!currData.subjects){
    gwShowToast("No curriculum loaded. Upload via admin panel.");
    return;
  }
  const gen=generateWeek(gwConfig);
  if(gen.error){
    gwShowToast(gen.error);
    return;
  }
  gwResult=gen.result;
  gwDropped=gen.dropped;
  gwCarryOverCount=gen.carryOverCount||0;
  gwCursors=gen.cursors||null;
  renderAll();
}

function gwCommit(){
  if(!gwResult) return;
  // Build a fake file-load event to reuse loadJson's write logic
  const d=gwResult;

  // Same logic as loadJson
  isUploading=true;
  const activeWK=localStorage.getItem("ha_active_wk")||WK;
  const isSameWeek=(d.week===activeWK);

  if(isSameWeek){
    const lsChecked=ld(activeWK+"_checked")||{};
    const memChecked=checked||{};
    const snapChecked={...lsChecked,...memChecked};
    const snapHist=ld(activeWK+"_history")||{};
    // Build lookup of old checks by title+who+day for matching after regeneration.
    // Only carry checks from this week (within 7 days) to prevent stale cross-week bleed.
    const oldLookup={};
    const weekCutoff=Date.now()-7*24*60*60*1000;
    (weekData.tasks||[]).forEach(t=>{
      const key=(t.title||"")+"|"+(t.who||"")+"|"+(t.day||"");
      if(!snapChecked[t.id]) return;
      const ts=snapChecked[t.id];
      const tsMs=(typeof ts==="number")?ts:new Date(ts).getTime();
      if(tsMs<weekCutoff) return;
      oldLookup[key]={ts:ts,oldId:t.id};
    });
    d.tasks.forEach(t=>{
      if(snapChecked[t.id]) return;
      const key=(t.title||"")+"|"+(t.who||"")+"|"+(t.day||"");
      if(oldLookup[key]){
        snapChecked[t.id]=oldLookup[key].ts;
        if(snapHist[oldLookup[key].oldId]&&!snapHist[t.id])
          snapHist[t.id]={...snapHist[oldLookup[key].oldId],id:t.id};
      }
    });
    const snapSl=ld(activeWK+"_sl")||slState||{};
    // Re-attach carry-overs
    const newIds=new Set(d.tasks.map(t=>t.id));
    (weekData.tasks||[]).filter(t=>t.id.endsWith("_c")&&!newIds.has(t.id)&&!newIds.has(baseId(t.id)))
      .forEach(t=>{ d.tasks.push(t); newIds.add(t.id); });
    const _archPrev=Object.values(archive||{}).filter(a=>a&&a.tasks&&a.weekLabel!==d.week)
      .sort((a,b)=>{
        const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
        const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
        return nb-na;
      })[0];
    if(_archPrev){
      const _awc=_archPrev.checked||{};
      (_archPrev.tasks||[]).filter(t=>!t.id.endsWith("_c")&&!_awc[t.id]&&!_awc[t.id+"_c"])
        .forEach(t=>{
          const _cId=t.id+"_c";
          if(newIds.has(_cId)) return;
          if((snapChecked||{})[_cId]) return;
          if((coExclusions[d.week]||{})[_cId]) return;
          d.tasks.push({...t,id:_cId,day:"monday",cascade:true,
            detail:(t.detail||t.title||"")+" (Carried from "+(_archPrev.weekLabel||"prev week")+")"});
          newIds.add(_cId);
        });
    }
    // GC: purge checked/history entries for task IDs not in the new set
    const commitIds=new Set(d.tasks.map(t=>t.id));
    for(const id in snapChecked){ if(!commitIds.has(id)) delete snapChecked[id]; }
    for(const id in snapHist){ if(!commitIds.has(id)) delete snapHist[id]; }
    WK=activeWK; weekData=d; checked=snapChecked; slState=snapSl;
    applyWeekMeta(d);
    sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
    sv(WK+"_checked",snapChecked); sv(WK+"_history",snapHist); sv(WK+"_sl",snapSl);
    sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
    if(db){
      const obj={};d.tasks.forEach(t=>obj[t.id]=t);
      db.ref(WK+"/tasks").set(obj);
      db.ref(WK+"/checked").set(snapChecked);
      db.ref(WK+"/history").set(snapHist);
      if(Object.keys(snapSl).length) db.ref(WK+"/sl").set(snapSl);
      if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
      db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
    }
    // Regeneration: always save fresh cursor snapshot (overwrites stale values)
    if(gwCursors){
      sv(WK+"_cursors",gwCursors);
      if(db) db.ref(WK+"/cursors").set(gwCursors);
    }
    fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
  } else {
    const oldWK=activeWK;
    const snapHist=ld(oldWK+"_history")||{};
    const snapTasks=weekData.tasks||[];
    const snapChecked={...(ld(oldWK+"_checked")||{}),...checked};
    snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"]).forEach(t=>{
      if(!snapHist[t.id+"_missed"])
        snapHist[t.id+"_missed"]={id:t.id,title:t.title,who:t.who,day:t.day,ts:"Week Closed",missed:true,momRequired:t.mom==="required"};
    });
    const hasAnything=Object.keys(snapHist).length>0||snapTasks.length>0;
    if(hasAnything){
      const snapSlotPts=ld(oldWK+"_slot_points")||{};
      const entry={weekLabel:oldWK,archivedAt:nowTs(),history:snapHist,tasks:snapTasks,checked:snapChecked,dates:{...DAY_DT},slot_points:snapSlotPts};
      archive[oldWK]=entry;
      try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e2){}
      if(db) db.ref("archive/"+oldWK).set(entry);
    }
    snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"])
      .forEach(t=>{
        const cId=t.id+"_c";
        if(!d.tasks.some(x=>x.id===cId))
          d.tasks.push({...t,id:cId,day:"monday",cascade:true,
            detail:(t.detail||t.title||"")+" (Carried from "+oldWK+")"});
      });
    WK=d.week; localStorage.setItem("ha_active_wk",WK);
    if(db) db.ref("ha_active_wk").set(WK);
    weekData=d; checked={}; slState={};
    sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
    sv(WK+"_checked",{}); sv(WK+"_sl",{}); sv(WK+"_history",{});
    sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
    // New week: store cursor snapshot — this is the anchor for all future regenerations
    if(gwCursors){
      sv(WK+"_cursors",gwCursors);
    }
    if(db){
      // Write clean slate BEFORE attaching listeners to prevent stale data bleed
      db.ref(WK+"/checked").set({});
      db.ref(WK+"/sl").set({});
      db.ref(WK+"/history").set({});
      const obj={};d.tasks.forEach(t=>obj[t.id]=t);
      db.ref(WK+"/tasks").set(obj);
      if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
      db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
      if(gwCursors) db.ref(WK+"/cursors").set(gwCursors);
      attachWeekListeners(WK);
    }
    applyWeekMeta(d);
    fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
  }

  gwResult=null; gwDropped=null; gwCursors=null;
   setTimeout(()=>{ isUploading=false; },3000);
  renderAll(); runCascade();
  gwShowToast("Week "+gwConfig.weekNum+" applied to schedule!");
}
</script>
