  }

  sprintSaveInputs();
  const _sprintNum=sprintNum;
  const date=sprintDate;
  const prevBest=parseInt(sprintPrevBest||"0")||null;
  const {diff,gs,nw,ps}=sprintPillState;
  const gridSizes={small:[3,6],medium:[4,7],large:[5,8]};
  const [cols,rows]=gridSizes[gs]||[4,7];
  const total=cols*rows;
  const revCount=sprintReviewPhonos.length>0?Math.min(Math.floor(total*0.2),sprintReviewPhonos.length*3):0;
  const nsCount=nw==="yes"?Math.floor(total*0.12):0;
  const focusCount=total-revCount-nsCount;
  const diffDesc={intro:"very simple CVC and CVCC single-syllable words — max 6 letters, high success rate",building:"mostly single-syllable with 2-3 two-syllable words",fluency:"mix of single and two-syllable words, varied patterns"}[diff]||"simple single-syllable words";
  const kidName=SL_KLBL[masteryKid]||"Student";

  sprintGenerating=true;
  const btn=document.getElementById("sp-gen-btn");
  if(btn){btn.disabled=true;btn.textContent="Generating A & B...";}
  const statusEl=document.getElementById("sp-status");
  if(statusEl) statusEl.style.display="none";

  const makePrompt=(sheet)=>`You are generating a phonics fluency sprint sheet (Sheet ${sheet}) for a homeschool student named ${kidName}.
FOCUS PHONOGRAM: "${focusPhono}"
SHEET: ${sheet} — ${sheet==="A"?"first pass, establishes the baseline":"second pass, COMPLETELY DIFFERENT words from Sheet A. Fresh word set, same phonogram."}
DIFFICULTY: ${diffDesc}
Generate exactly ${focusCount} focus words containing "${focusPhono}".
${sprintReviewPhonos.length>0?`Include exactly ${revCount} review words using: ${sprintReviewPhonos.map(r=>r.pg).join(", ")}.`:""}
${nw==="yes"?`Include exactly ${nsCount} nonsense/pseudo-words following the phonogram pattern. Mark each with * suffix in JSON.`:""}
${(ps==="both"||ps==="phrases")?`Generate 4 short decodable phrases (3-5 words) using "${focusPhono}". Fun and concrete.`:""}
${(ps==="both"||ps==="sentences")?`Generate 3 decodable sentences (6-10 words). Sight words allowed: the, a, I, is, was, his, her, said, to, do, of, are, my, we.`:""}
RULES: All words decodable with LOE Foundations A+B only. ${sheet==="B"?"Completely different word list from Sheet A.":"No repeated words."} Nonsense words marked with * in JSON only.
Respond ONLY with valid JSON, no markdown:
{"focusPhono":"${focusPhono}","focusSounds":"${focusSounds}","gridWords":["w1","w2"],"reviewWords":[],"nonsenseWords":[],"phrases":[],"sentences":[]}`;

  try{
    const apiKey=mastAIKey;
    const headers={"Content-Type":"application/json","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
    if(apiKey) headers["x-api-key"]=apiKey;
    const _fixJson=(s)=>{let t=s.trim().replace(/```json|```/g,"").trim();if(!t.endsWith("}"))t=t.substring(0,t.lastIndexOf("}")+1);return t;};
    const [resA,resB]=await Promise.all([
      fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:makePrompt("A")}]})}),
      fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:makePrompt("B")}]})})
    ]);
    const [dA,dB]=await Promise.all([resA.json(),resB.json()]);
    if(dA.error||dB.error){ const e=dA.error||dB.error; throw new Error((e.type||"error")+": "+(e.message||JSON.stringify(e))); }
    const pA=JSON.parse(_fixJson(dA.content[0].text));
    const pB=JSON.parse(_fixJson(dB.content[0].text));
    sprintRenderSheets(pA,pB,{sprintNum:_sprintNum,date,prevBest,cols,rows,ps,kidName});
  } catch(e){
    console.error("Sprint generate error:",e);
    sprintRenderSheets(sprintDemoA(focusPhono,focusSounds),sprintDemoB(focusPhono,focusSounds),{sprintNum:_sprintNum,date,prevBest,cols,rows,ps,kidName});
    const errMsg=mastAIKey?"⚠️ API call failed: "+e.message+" — showing demo content":"⚠️ No API key found in Firebase at config/anthropic_key — showing demo content";
    if(statusEl){statusEl.textContent=errMsg;statusEl.style.display="block";statusEl.style.background="#ede9fe";statusEl.style.color="#5b3a8c";}
  } finally{
    sprintGenerating=false;
    if(btn){btn.disabled=false;btn.textContent="✨ Generate A & B Sprint Sheets";}
  }
}

function sprintDemoA(pg,sounds){return{focusPhono:pg||"sh",focusSounds:sounds||"/sh/",gridWords:["ship","shop","shed","shell","fish","dish","wish","rush","flush","brush","shin","shack","shock","shred","shelf","mesh","fresh","clash"],reviewWords:["rain","play","see"],nonsenseWords:["shrop*","shelt*"],phrases:["the big ship","a red fish dish","rush to the shed","wish on a shell"],sentences:["The fish is in the dish on the shelf.","She will rush to the shop and grab the brush.","The ship can flash its bright light at the dock."]};}
function sprintDemoB(pg,sounds){return{focusPhono:pg||"sh",focusSounds:sounds||"/sh/",gridWords:["shim","shaft","shrub","shift","gush","lush","plush","slush","clash","flash","shrug","shrimp","crush","hush","blush","brash","shawl","smash"],reviewWords:["wait","stay","feet"],nonsenseWords:["shreb*","shoft*"],phrases:["the small shrub","a soft plush fish","gush from the shelf","flash in the shed"],sentences:["The brush fell with a crash on the ship deck.","She can crush the shells with a swift smash.","Flush the cloth and rush it to the shelf."]};}

function sprintRenderSheets(pA,pB,opts){
  const el=document.getElementById("sp-sheets");
  if(!el) return;
  const scoreRow=document.getElementById("sp-score-row");
  if(scoreRow) scoreRow.style.display="grid";
  document.getElementById("sp-score-a").value="";
  document.getElementById("sp-score-b").value="";
  document.getElementById("sp-gain").textContent="Enter scores above to see session gain";
  document.getElementById("sp-gain").style.color="#78716c";
  el.innerHTML=sprintBuildSheet(pA,"A",opts)+sprintBuildSheet(pB,"B",opts);
}

function sprintBuildSheet(parsed,sheet,{sprintNum,date,prevBest,cols,rows,ps,kidName}){
  const isA=sheet==="A";
  const col=isA?"#5b3a8c":"#1e3a5f";
  const bgLight=isA?"#faf5ff":"#eff6ff";
  const bdLight=isA?"#c4b5fd":"#93c5fd";
  const fwCol=isA?"#5b3a8c":"#1e3a5f";
  const kid=masteryKid;
  const emoji=MAST_KID_EMOJI[kid]||"🦄";
  const kidColor=MAST_KID_COL[kid]||col;

  const all=[];
  (parsed.gridWords||[]).forEach(w=>all.push({w,t:"focus"}));
  (parsed.reviewWords||[]).forEach(w=>all.push({w,t:"review"}));
  (parsed.nonsenseWords||[]).forEach(w=>all.push({w:w.replace("*",""),t:"nonsense"}));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  const needed=cols*rows;
  while(all.length<needed) all.push({w:"—",t:"focus"});
  const grid=all.slice(0,needed);

  const dateObj=new Date(date+"T12:00:00");
  const dateStr=dateObj.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  const target=prevBest?Math.ceil(prevBest*1.1):null;

  const esc=(s)=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const hl=(text)=>text.replace(new RegExp(`(\\w*${esc(parsed.focusPhono)}\\w*)`,"gi"),`<span style="color:${fwCol};font-weight:700">$1</span>`);

  let h=`<div style="background:#fff;border:2px solid ${bdLight};border-radius:14px;overflow:hidden;margin-bottom:18px">`;
  h+=`<div style="background:${kidColor};color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:900">${emoji} ${kidName}</div>
      <div style="font-size:10px;opacity:0.75;margin-top:1px">Phonics Sprint #${String(sprintNum).padStart(3,"0")} · ${dateStr}</div>
    </div>
    <div style="font-family:'Fraunces',serif;font-size:44px;font-weight:900;opacity:0.2;line-height:1">${sheet}</div>
  </div>`;
  h+=`<div style="padding:13px 15px">`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px">`;
  if(isA&&prevBest){
    h+=`<div style="border:1.5px solid #c4b5fd;border-radius:10px;padding:9px 12px;background:#faf5ff">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#78716c">🏆 Best</div>
      <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:#d97706">${prevBest}</div>
      ${target?`<div style="font-size:9px;color:#5b3a8c;font-weight:700">Target: ${target}+</div>`:""}
    </div>`;
  } else {
    h+=`<div style="border:1.5px solid ${bdLight};border-radius:10px;padding:9px 12px;background:${bgLight}">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#78716c">${isA?"🏆 Target":"Sheet A Score"}</div>
      <div style="height:2px;background:#e2ddd6;border-radius:1px;margin-top:8px"></div>
      <div style="font-size:9px;color:#78716c;margin-top:3px">words</div>
    </div>`;
  }
  h+=`<div style="border:1.5px solid ${bdLight};border-radius:10px;padding:9px 12px;background:${bgLight}">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#78716c">✏️ Sheet ${sheet} Score</div>
    <div style="height:2px;background:#e2ddd6;border-radius:1px;margin-top:8px"></div>
    <div style="font-size:9px;color:#78716c;margin-top:3px">words / 60s</div>
  </div></div>`;
  h+=`<div style="display:inline-flex;align-items:center;gap:6px;background:${bgLight};border-radius:8px;padding:5px 10px;margin-bottom:11px">
    <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${col}">Focus</span>
    <span style="font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:${col}">${parsed.focusPhono}</span>
    <span style="font-size:11px;color:${col};opacity:0.65">${parsed.focusSounds||""}</span>
    <span style="font-size:9px;font-weight:700;color:${col};opacity:0.4;margin-left:2px">Sheet ${sheet}</span>
  </div>`;
  h+=`<div style="display:flex;gap:10px;margin-bottom:10px;font-size:9px;font-weight:700;flex-wrap:wrap">
    <span style="color:#1c1917">● Focus</span>
    <span style="color:#d97706">● Review</span>
    <span style="color:#9333ea">● Nonsense*</span>
  </div>`;
  h+=`<div style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#78716c;margin-bottom:7px">Word Grid — read across as fast as you can ▶</div>`;
  h+=`<div style="border:1px solid #f0ede8;border-radius:10px;overflow:hidden;margin-bottom:15px">`;
  for(let r=0;r<rows;r++){
    h+=`<div style="display:flex;border-bottom:${r<rows-1?"1px solid #f0ede8":"none"}">`;
    h+=`<div style="width:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;color:#c4b8ae;border-right:1px solid #f0ede8;background:#faf8f5">${r+1}</div>`;
    for(let c=0;c<cols;c++){
      const item=grid[r*cols+c]||{w:"—",t:"focus"};
      const wc=item.t==="review"?"#d97706":item.t==="nonsense"?"#9333ea":"#1c1917";
      const fw=item.t==="review"||item.t==="nonsense"?"700":"500";
      const fi=item.t==="nonsense"?"italic":"normal";
      h+=`<div style="flex:1;padding:8px 5px;font-family:'DM Mono',monospace;font-size:14px;font-weight:${fw};font-style:${fi};text-align:center;border-right:${c<cols-1?"1px solid #f0ede8":"none"};color:${wc}">${item.w}</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  const hasBonus=((ps==="both"||ps==="phrases")&&parsed.phrases&&parsed.phrases.length)||((ps==="both"||ps==="sentences")&&parsed.sentences&&parsed.sentences.length);
  if(ps!=="none"&&hasBonus){
    h+=`<div style="border:2px dashed #22c55e;border-radius:12px;padding:10px 12px 4px;margin-bottom:14px;position:relative">`;
    h+=`<div style="position:absolute;top:-11px;left:10px;background:#fff;padding:0 6px;font-size:10px;font-weight:800;color:#16a34a;letter-spacing:0.06em;text-transform:uppercase">📍 Bonus Zone — if you get here, you're flying!</div>`;
    if((ps==="both"||ps==="phrases")&&parsed.phrases&&parsed.phrases.length){
      h+=`<div style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#78716c;margin-top:6px;margin-bottom:6px">Phrases</div>`;
      parsed.phrases.forEach((ph,i)=>{
        h+=`<div style="padding:6px 0;border-bottom:1px solid #f5f2ee;font-size:13px;display:flex;gap:8px;align-items:baseline">
          <span style="font-family:'DM Mono',monospace;font-size:9px;color:#c4b8ae;flex-shrink:0;width:14px">${i+1}.</span>
          <span>${hl(ph)}</span>
        </div>`;
      });
    }
    if((ps==="both"||ps==="sentences")&&parsed.sentences&&parsed.sentences.length){
      h+=`<div style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#78716c;margin-top:10px;margin-bottom:6px">Sentences</div>`;
      parsed.sentences.forEach((s,i)=>{
        h+=`<div style="padding:8px 0;border-bottom:${i<parsed.sentences.length-1?"1px solid #f5f2ee":"none"};font-size:13px;line-height:1.6;display:flex;gap:8px;align-items:flex-start">
          <span style="font-family:'DM Mono',monospace;font-size:9px;color:#c4b8ae;flex-shrink:0;width:14px;margin-top:3px">${i+1}.</span>
          <span>${hl(s)}</span>
        </div>`;
      });
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  h+=`<div style="background:#faf8f5;border-top:1px solid #f0ede8;padding:8px 15px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:9px;color:#78716c;font-style:italic">Only racing yourself ${emoji} · Sheet ${sheet} of 2</div>
    <div style="font-family:'Fraunces',serif;font-size:10px;font-weight:700;color:#c4b8ae">Howe Academy</div>
  </div>`;
  h+=`</div>`;
  return h;
}

        <input type="number" id="sp-score-a" min="0" placeholder="—" oninput="sprintUpdateGain()" autocomplete="off" style="width:80px;font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:#5b3a8c;border:none;background:transparent;text-align:center;outline:none;padding:0"/>
        <div style="font-size:10px;color:#78716c;margin-top:2px">words / 60s</div>
      </div>
      <div style="border-radius:10px;padding:11px;text-align:center;background:#eff6ff;border:1.5px solid #93c5fd">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#1e3a5f;margin-bottom:4px">Sheet B — Second Pass</div>
        <input type="number" id="sp-score-b" min="0" placeholder="—" oninput="sprintUpdateGain()" autocomplete="off" style="width:80px;font-family:'DM Mono',monospace;font-size:24px;font-weight:700;color:#1e3a5f;border:none;background:transparent;text-align:center;outline:none;padding:0"/>
        <div style="font-size:10px;color:#78716c;margin-top:2px">words / 60s</div>
      </div>
    </div>
    <div id="sp-gain" style="text-align:center;padding-top:8px;border-top:1px solid #e2ddd6;font-size:12px;font-weight:700;color:#78716c">Enter scores above to see session gain</div>
  </div>`;

  h+=`<div id="sp-sheets"></div>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PHASE 4 — PLAN NEXT WEEK WIZARD
// ═══════════════════════════════════════════════════════════════════════════════

function openPlanNextWeek(weekNum){
  if(!adminPinUnlocked){
    pnwPendingWeek=weekNum||null;
    pnwOpen='pin';
    renderPlanNextWeek();
    return;
  }
  pnwStartWizard(weekNum);
}

function pnwStartWizard(weekOverride){
  const nw=weekOverride||currWeekNum()+1;
  gwConfig={weekNum:String(nw),babysitter:{},withSitter:(rulesData&&rulesData.withSitter)||[],skipDays:[],lateStart:{},carSchool:{},theater:false,saturday:false,redistribute:[],autoAdvance:true};
  pnwStep=0; pnwResult=null; pnwDropped=null; pnwConfigReady=false; pnwOpen=true;
  renderPlanNextWeek();
  if(db){
    db.ref("weekConfig/"+nw).once("value",s=>{
      const v=s.val();
      if(v){
        const rawMag=v.babysitter||v.maggie||{};
        const normMag={};
        for(const[k,val] of Object.entries(rawMag)) normMag[k]=gwNormSitter(val);
        gwConfig={weekNum:v.weekNum||String(nw),babysitter:normMag,withSitter:v.withSitter||(rulesData&&rulesData.withSitter)||[],skipDays:v.skipDays||[],lateStart:v.lateStart||{},carSchool:v.carSchool||{},theater:!!v.theater,saturday:!!v.saturday,redistribute:v.redistribute||[],autoAdvance:true};
      }
      pnwConfigReady=true;
      renderPlanNextWeek();
    });
  } else { pnwConfigReady=true; renderPlanNextWeek(); }
}

function closePlanNextWeek(){
  pnwOpen=false; pnwStep=0; pnwResult=null; pnwDropped=null;
  const ol=document.getElementById("pnw-overlay");
  if(ol) ol.remove();
}

let autoCommitRan=false;
function tryAutoCommit(){
  if(autoCommitRan||!db||!currData||!currData.subjects) return;
  const plans=paceData&&paceData.plans?paceData.plans:{};
  const hasAuto=Object.entries(plans).some(([k,p])=>p.autoCommit&&sessionMapData[k]&&sessionMapData[k].map);
  if(!hasAuto) return;
  autoCommitRan=true;
  const nw=currWeekNum()+1;
  db.ref("week"+nw+"/meta").once("value",s=>{
    if(s.val()) return;
    db.ref("weekConfig/"+nw).once("value",cs=>{
      const cfg=cs.val()||{weekNum:String(nw),babysitter:{},withSitter:(rulesData&&rulesData.withSitter)||[],skipDays:[],lateStart:{},carSchool:{},theater:false,saturday:false,redistribute:[],autoAdvance:true};
      cfg.weekNum=String(nw);
      const gen=generateWeek(cfg);
      if(gen.error){console.log("[HA] auto-commit skipped:",gen.error);return;}
      gwConfig=cfg;gwResult=gen.result;gwDropped=gen.dropped;gwCarryOverCount=gen.carryOverCount||0;gwCalendarSkips=gen.calendarSkips||null;
      gwCommit();
      console.log("[HA] auto-committed week "+nw+" from session map");
      gwShowToast("Week "+nw+" auto-committed from session map");
    });
  });
}

function pnwGenerate(){
  if(!currData||!currData.subjects) return;
  if(parseInt(gwConfig.weekNum)<currWeekNum()){
    gwShowToast("Can't generate a past week (current is Week "+currWeekNum()+").");
    return;
  }
  const gen=generateWeek(gwConfig);
  if(gen.error){ gwShowToast(gen.error); return; }
  pnwResult=gen.result; pnwDropped=gen.dropped; pnwCarryOverCount=gen.carryOverCount||0;
  gwCalendarSkips=gen.calendarSkips||null;
  pnwStep=1; pnwExpandedDay=null; pnwExpandedKid=null;
  renderPlanNextWeek();
}

function pnwApply(){
  if(!pnwResult) return;
  gwResult=pnwResult; gwDropped=pnwDropped; gwCarryOverCount=pnwCarryOverCount;
  gwCommit();
  closePlanNextWeek();
}

function pnwBack(){
  if(pnwStep>0){ pnwStep--; renderPlanNextWeek(); }
  else closePlanNextWeek();
}

function renderPlanNextWeek(){
  let ol=document.getElementById("pnw-overlay");
  if(!ol){ ol=document.createElement("div"); ol.id="pnw-overlay"; ol.className="pnw-overlay"; document.body.appendChild(ol); }

  if(pnwOpen==='pin'){
    ol.innerHTML='<div class="pnw-header"><button class="pnw-back" onclick="closePlanNextWeek()">←</button><div class="pnw-title">Plan Next Week</div></div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center">'+
      '<div style="font-size:48px;margin-bottom:12px">📋</div>'+
      '<div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:700;margin-bottom:4px">Enter Mom PIN</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-bottom:16px">Required to plan and generate weeks.</div>'+
      '<input id="pnw-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="off" '+
      'style="width:120px;text-align:center;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;letter-spacing:8px;font-family:\'DM Sans\',sans-serif" '+
      'oninput="pnwCheckPin(this.value)">'+
      '<div id="pnw-pin-err" style="font-size:11px;color:#b5394a;margin-top:6px;min-height:14px"></div></div>';
    setTimeout(()=>{const i=document.getElementById("pnw-pin-input");if(i)i.focus();},50);
    return;
  }

  if(!pnwConfigReady){
    ol.innerHTML='<div class="pnw-header"><button class="pnw-back" onclick="closePlanNextWeek()">←</button><div class="pnw-title">Plan Week '+gwConfig.weekNum+'</div></div>'+
      '<div style="padding:60px 20px;text-align:center;color:var(--muted)"><div style="font-size:24px;margin-bottom:8px">Loading...</div></div>';
    return;
  }

  const WDAYS=["monday","tuesday","wednesday","thursday","friday"];
  const c=gwConfig;
  const stepLabels=["Configure","Preview","Apply"];

  let h='<div class="pnw-header"><button class="pnw-back" onclick="pnwBack()">←</button><div class="pnw-title">Plan Week '+c.weekNum+'</div></div>';
  h+='<div class="pnw-steps">';
  stepLabels.forEach((lbl,i)=>{
    const cls=i===pnwStep?"active":i<pnwStep?"done":"";
    h+='<div class="pnw-step '+cls+'"><span class="pnw-step-num">'+(i<pnwStep?"✓":(i+1))+'</span>'+lbl+'</div>';
  });
  h+='</div>';

  h+='<div class="pnw-body">';

  if(pnwStep===0){
    // ── STEP 1: CONFIGURE ──
    const sitterCount=Object.keys(c.babysitter).length;
    const skipCount=c.skipDays.length;
    const lateCount=Object.keys(c.lateStart).length;
    const carCount=Object.keys(c.carSchool).length;

    h+='<div class="pnw-section"><div class="pnw-section-title">'+SITTER_NAME+' Days'+(sitterCount?' <span style="font-size:11px;color:#16a34a;font-weight:600">'+sitterCount+' selected</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=!!c.babysitter[d];
      h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleSitter(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div>';
    Object.entries(c.babysitter).forEach(([d,v])=>{
      const mg=gwNormSitter(v);
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0;flex-wrap:wrap"><span style="font-size:12px;font-weight:600;width:44px">'+cap(d).substring(0,3)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">Start:</span>'+
        '<input type="time" value="'+ampmTo24(mg.start)+'" class="pnw-time-input" style="width:95px" onchange="gwConfig.babysitter[\''+d+'\'].start=to12h(this.value);renderPlanNextWeek()">'+
        '<span style="font-size:11px;color:var(--muted)">Return:</span>'+
        '<input type="time" value="'+ampmTo24(mg.end)+'" class="pnw-time-input" style="width:95px" onchange="gwConfig.babysitter[\''+d+'\'].end=to12h(this.value);renderPlanNextWeek()"></div>';
    });
    if(sitterCount){
      h+='<div style="margin-top:10px"><span style="font-size:12px;font-weight:600">With '+SITTER_NAME+'</span> <span style="font-size:11px;color:var(--muted)">(no school during window)</span></div>';
      h+='<div class="pnw-chip-row" style="margin-top:4px">';
      ["lincoln","ellis","lucy","julian"].forEach(k=>{
        const on=(c.withSitter||[]).includes(k);
        h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleWithSitter(\''+k+'\')">'+cap(k)+'</div>';
      });
      h+='</div>';
    }
    h+='</div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Skip Days'+(skipCount?' <span style="font-size:11px;color:#991b1b;font-weight:600">'+skipCount+' off</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=c.skipDays.includes(d);
      h+='<div class="pnw-chip'+(on?" skip":"")+'" onclick="pnwToggleSkip(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div></div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Late Start'+(lateCount?' <span style="font-size:11px;color:#c45e1a;font-weight:600">'+lateCount+' day(s)</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=!!c.lateStart[d];
      h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleLate(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div>';
    Object.entries(c.lateStart).forEach(([d,t])=>{
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0"><span style="font-size:12px;font-weight:600;width:60px">'+cap(d).substring(0,3)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">Start:</span>'+
        '<input type="time" value="'+ampmTo24(t)+'" class="pnw-time-input" onchange="gwConfig.lateStart[\''+d+'\']=to12h(this.value);renderPlanNextWeek()"></div>';
    });
    h+='</div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Car School'+(carCount?' <span style="font-size:11px;color:#c45e1a;font-weight:600">'+carCount+' day(s)</span>':'')+'</div>';
    h+='<div class="pnw-chip-row">';
    WDAYS.forEach(d=>{
      const on=!!c.carSchool[d];
      h+='<div class="pnw-chip'+(on?" on":"")+'" onclick="pnwToggleCar(\''+d+'\')">'+cap(d).substring(0,3)+'</div>';
    });
    h+='</div>';
    Object.entries(c.carSchool).forEach(([d,info])=>{
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:6px;padding:4px 0;flex-wrap:wrap"><span style="font-size:12px;font-weight:600;width:60px">'+cap(d).substring(0,3)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">Until:</span>'+
        '<input type="time" value="'+ampmTo24(info.end)+'" class="pnw-time-input" onchange="gwConfig.carSchool[\''+d+'\'].end=to12h(this.value);renderPlanNextWeek()">'+
        '<input type="text" value="'+(info.note||"")+'" placeholder="Note" style="flex:1;min-width:100px;padding:6px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-family:\'DM Sans\',sans-serif" onchange="gwConfig.carSchool[\''+d+'\'].note=this.value"></div>';
    });
    h+='</div>';

    h+='<div class="pnw-section"><div class="pnw-section-title">Options</div>';
    h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
    h+='<div class="pnw-chip'+(c.theater?" on":"")+'" onclick="gwConfig.theater=!gwConfig.theater;renderPlanNextWeek()">Theater Week</div>';
    h+='<div class="pnw-chip'+(c.saturday?" on":"")+'" onclick="gwConfig.saturday=!gwConfig.saturday;renderPlanNextWeek()">Include Saturday</div>';
    h+='</div></div>';

    if(c.redistribute.length){
      h+='<div class="pnw-section"><div class="pnw-section-title">Redistribution Rules <span style="font-size:11px;color:var(--muted);font-weight:500">'+c.redistribute.length+' rule(s)</span></div>';
      c.redistribute.forEach((r,i)=>{
        h+='<div style="background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600">'+
          cap(r.kid)+' · '+cap(r.from)+' → '+cap(r.to)+' ('+r.subjects+')'+
          '<button style="margin-left:auto;background:none;border:none;color:#ef4444;font-size:14px;cursor:pointer" onclick="gwConfig.redistribute.splice('+i+',1);renderPlanNextWeek()">✕</button></div>';
      });
      h+='</div>';
    }

  } else if(pnwStep===1){
    // ── STEP 2: PREVIEW ──
    const r=pnwResult;
    if(!r){ pnwStep=0; renderPlanNextWeek(); return; }

    const tasksByDay={};
    r.tasks.forEach(t=>{
      if(!tasksByDay[t.day]) tasksByDay[t.day]=[];
      tasksByDay[t.day].push(t);
    });
    const droppedByDay={};
    (pnwDropped||[]).forEach(d=>{
      if(!droppedByDay[d.day]) droppedByDay[d.day]=[];
      droppedByDay[d.day].push(d);
    });

    const totalTasks=r.tasks.length;
    const totalDays=Object.keys(r.dates).length;
    const totalDropped=(pnwDropped||[]).filter(d=>d.reason.includes("CUTOFF")).length;
    const totalMin=r.tasks.reduce((s,t)=>s+(t.dur||20),0);

    h+='<div class="pnw-summary"><div class="pnw-summary-big">'+r.week.replace("week","Week ")+'</div>';
    h+='<div class="pnw-summary-sub">'+totalTasks+' tasks across '+totalDays+' days · ~'+Math.round(totalMin/60)+' hrs total';
    if(pnwCarryOverCount) h+=' · <span style="color:#7c3aed">'+pnwCarryOverCount+' carry-over'+(pnwCarryOverCount>1?'s':'')+'</span>';
    if(totalDropped) h+=' · <span style="color:#991b1b">'+totalDropped+' dropped</span>';
    h+='</div></div>';
    const smapPlans=Object.entries(paceData.plans||{}).filter(([k,p])=>sessionMapData[k]&&sessionMapData[k].map);
    if(smapPlans.length){
      h+='<div style="padding:8px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:12px;font-size:11px;display:flex;align-items:center;gap:6px">';
      h+='<span style="font-size:14px">📋</span><span style="color:#1e40af;font-weight:600">Pre-populated from session map</span>';
      h+='<span style="color:#3b82f6">'+smapPlans.map(([_,p])=>p.label).join(", ")+'</span></div>';
    }

    const KID_COL={lincoln:"#1e3a5f",ellis:"#2d5a3d",lucy:"#5b3a8c",julian:"#c45e1a"};
    const dayOrder=["monday","tuesday","wednesday","thursday","friday","saturday"];
    const sortedDays=Object.keys(r.dates).sort((a,b)=>dayOrder.indexOf(a)-dayOrder.indexOf(b));

    sortedDays.forEach(dn=>{
      const dt=r.dates[dn];
      const dayTasks=tasksByDay[dn]||[];
      const dayDrops=droppedByDay[dn]||[];
      const cutoffs=dayDrops.filter(d=>d.reason.includes("CUTOFF"));
      const dayMin=dayTasks.reduce((s,t)=>s+(t.dur||20),0);

      const kidCounts={};
      dayTasks.forEach(t=>{ kidCounts[t.who]=(kidCounts[t.who]||0)+1; });

      h+='<div class="pnw-day-card" style="border-left:3px solid '+(DAY_COL[dn]||"#666")+'">';
      const _exp=(pnwExpandedDay===dn);
      h+='<div class="pnw-day-hdr" style="cursor:pointer" onclick="pnwToggleDay(\''+dn+'\')"><div><div class="pnw-day-name" style="color:'+(DAY_COL[dn]||"#666")+'">'+(DAY_LBL[dn]||dn)+'</div><div class="pnw-day-date">'+dt+' · tap to '+(_exp?'hide':'view')+'</div></div>';
      h+='<div style="display:flex;align-items:center;gap:10px"><div style="font-size:20px;font-weight:700;font-family:\'Fraunces\',serif;color:'+(DAY_COL[dn]||"#666")+'">'+dayTasks.length+'</div><span style="font-size:12px;color:var(--muted)">'+(_exp?"▾":"▸")+'</span></div></div>';

      h+='<div class="pnw-day-stats">';
      h+='<div class="pnw-stat"><div class="pnw-stat-val">'+dayTasks.length+'</div><div class="pnw-stat-lbl">Tasks</div></div>';
      h+='<div class="pnw-stat"><div class="pnw-stat-val">'+Math.round(dayMin/60*10)/10+'h</div><div class="pnw-stat-lbl">Duration</div></div>';
      h+='<div class="pnw-stat"><div class="pnw-stat-val">'+(cutoffs.length||'—')+'</div><div class="pnw-stat-lbl">Dropped</div></div>';
      h+='</div>';

      h+='<div class="pnw-day-kids">';
      Object.entries(kidCounts).sort((a,b)=>b[1]-a[1]).forEach(([k,cnt])=>{
        const _ka=(pnwExpandedDay===dn&&pnwExpandedKid===k);
        h+='<span class="pnw-kid-pill" onclick="event.stopPropagation();pnwShowKid(\''+dn+'\',\''+k+'\')" title="Tap for '+cap(k)+'’s schedule" style="cursor:pointer;background:'+(KID_COL[k]||"#666")+(_ka?';box-shadow:0 0 0 2px #fff,0 0 0 4px '+(KID_COL[k]||"#666"):'')+'">'+cap(k)+' · '+cnt+'</span>';
      });
      h+='</div>';

      if(r.constraints&&r.constraints[dn]){
        h+='<div class="pnw-constraint">'+r.constraints[dn]+'</div>';
      }
      if(cutoffs.length){
        h+='<div class="pnw-dropped">⚠️ '+cutoffs.length+' task(s) ran past cutoff: '+cutoffs.map(d=>cap(d.kid)+' '+d.key).join(', ')+'</div>';
      }
      if(_exp){
        const _lunchS=(rulesData&&rulesData.schoolDay&&rulesData.schoolDay.lunchStart)||"1:00 PM";
        const _lunchMin=toMin(_lunchS);
        let _list=dayTasks.slice(); if(pnwExpandedKid) _list=_list.filter(t=>t.who===pnwExpandedKid);
        const _sorted=_list.sort((a,b)=>toMin(a.time)-toMin(b.time)||(a.who<b.who?-1:1));
        h+='<div style="padding:2px 14px 10px;border-top:1px solid #f3f4f6">';
        if(pnwExpandedKid) h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px"><span style="font-weight:700;color:'+(KID_COL[pnwExpandedKid]||"#666")+'">'+cap(pnwExpandedKid)+'’s schedule</span><button onclick="event.stopPropagation();pnwShowKid(\''+dn+'\',\''+pnwExpandedKid+'\')" style="margin-left:auto;background:none;border:none;color:#3b82f6;font-size:11px;font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit">show all kids</button></div>';
        if(!_sorted.length) h+='<div style="font-size:12px;color:var(--muted);padding:8px 0">No tasks this day.</div>';
        let _lunchShown=false, _prevTime=null;
        _sorted.forEach((t,i)=>{
          if(!_lunchShown && i>0 && toMin(t.time)>=_lunchMin){
            h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:11px;color:#b45309;font-weight:700"><span style="width:62px;flex-shrink:0">'+_lunchS+'</span><span style="flex:1;height:1px;background:#fde68a"></span><span>🍽 Lunch</span><span style="flex:1;height:1px;background:#fde68a"></span></div>';
            _lunchShown=true; _prevTime=null;
          }
          const _newT=(t.time!==_prevTime); _prevTime=t.time;
          const _mt=t.mom==="required"?'<span style="font-size:9px;font-weight:700;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:1px 5px;flex-shrink:0">Mom</span>':t.mom==="maybe"?'<span style="font-size:9px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:1px 5px;flex-shrink:0">Mom?</span>':'';
          h+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-top:'+(_newT?"1px solid #f3f4f6":"none")+'">'+
            '<span style="width:62px;flex-shrink:0;color:#6b7280;font-weight:700;font-size:11px">'+(_newT?t.time:'')+'</span>'+
            (pnwExpandedKid?'':'<span style="background:'+(KID_COL[t.who]||"#666")+';color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;flex-shrink:0">'+cap(t.who)+'</span>')+

            _mt+

// ====== SHARED CURRICULUM — combined subjects (plan: shared-curriculum-combined-subjects) ======
// SHAREDCURR_START
// A combined subject = ONE block taught to 2+ kids at the same time (Mom teaches once).
// Stored as a group registry (currData.groups[gk]) = single source of truth for the
// shared attributes + the one canonical lesson sequence + the one shared cursor; each
// participant carries a thin auto-managed stub subjects[kid][gk]={sharedGroup:gk}. These
// helpers are pure/additive (S1) — nothing routes through them yet.
function isGroupStub(s){ return !!(s&&s.sharedGroup); }
function isCombinedTask(t){ return !!(t&&t.groupId); }
function getGroup(gk){ return ((currData&&currData.groups)||{})[gk]||null; }

// Active participants = group members whose per-kid stub exists and isn't paused.
function groupParticipants(gk){
  var g=getGroup(gk); if(!g) return [];
  return (g.participants||[]).filter(function(k){
    var sub=(((currData&&currData.subjects)||{})[k]||{})[gk];
    return sub&&!sub.paused;
  });
}

// gwGetSubjects, but each membership stub is resolved to look like a normal subject by
// merging the group's shared attributes onto it (so gwByCategory / the generator can treat
// a combined block like any other subject). Dangling stubs (no group) pass through as-is.
function gwGetSubjectsResolved(kid){
  var raw=gwGetSubjects(kid), out={};
  for(var key in raw){
    var s=raw[key];
    if(s&&s.sharedGroup){
      var g=getGroup(s.sharedGroup);
      if(!g){ out[key]=s; continue; }
      out[key]={ display:g.display, device:g.device, mom:g.mom, minutes:g.minutes,
        rules:g.rules, allowedDays:g.allowedDays, timesPerWeek:g.timesPerWeek,
        total:g.total, priority:g.priority, tracking:g.tracking,
        sharedGroup:s.sharedGroup, _group:true, _groupKey:s.sharedGroup,
        paused:!!(g.paused||s.paused) };
    } else out[key]=s;
  }
  return out;
}

// Canonical lesson sequence for a group: explicit lessonSeq, else auto-numbered from total.
function buildGroupLessons(gk){
  var g=getGroup(gk); if(!g) return [];
  if(g.lessonSeq&&g.lessonSeq.length) return g.lessonSeq.map(function(l,i){ return {dayNum:90000+i,lesson:l,date:""}; });
  var total=g.total||0, out=[];
  for(var i=0;i<total;i++) out.push({dayNum:90000+i,lesson:"Lesson "+(i+1),date:""});
  return out;
}

// How many group blocks have been TAUGHT (decision #3): a scheduled day-block counts when
// ≥1 participant is checked off. Counted once per distinct day+time block (not per kid), so
// the per-kid fan-out never multiplies the count. Mirrors paceAutoCount's week+archive sweep.
function groupAutoCount(gk,excludeWeek){
  if(!gk) return 0;
  var count=0;
  function tally(tasks,checkedMap,label){
    if(excludeWeek&&label===excludeWeek) return;
    var byBlock={};
    (tasks||[]).forEach(function(t){
      if(t&&t.groupId===gk&&!String(t.id||"").endsWith("_c")){
        var k=(t.day||"")+"|"+(t.time||"");
        (byBlock[k]=byBlock[k]||[]).push(t);
      }
    });
    for(var bk in byBlock){
      if(byBlock[bk].some(function(t){ return chainDone(t.id,checkedMap,tasks); })) count+=1;
    }
  }
  if(!excludeWeek||excludeWeek!==WK) tally(weekData.tasks,checked,WK);
  var currStart=currFirstWeekNum();
  Object.values(archive).forEach(function(aw){
    var awNum=parseInt(((aw.weekLabel||"").match(/\d+/)||[0])[0])||0;
    if(awNum>0&&awNum<currStart) return;
    tally(aw.tasks,aw.checked||{},aw.weekLabel);
  });
  return count;
}

// One shared cursor for the whole group (advance together). offset/adjust mirror paceData.
function computeGroupCursor(gk,excludeWeek){
  var g=getGroup(gk); if(!g) return 0;
  return (g.offset||0)+groupAutoCount(gk,excludeWeek)+(g.adjust||0);
}

// The next N lessons for a group from its shared cursor (rendered identically for all kids).
function getNextGroupLessons(gk,count){
  var seq=buildGroupLessons(gk); if(!seq.length) return [];
  var cursor=computeGroupCursor(gk), out=[];
  for(var i=cursor;i<seq.length&&out.length<(count||1);i++) out.push(seq[i]);
  return out;
}
// SHAREDCURR_END

function gwByCategory(kid,tasksDict){
  const subjects=gwGetSubjects(kid);
  const buckets={first:[],computer:[],ipad:[],phone:[],independent:[],maybe_paper:[],required_paper:[],last:[]};
  for(const[key,raw] of Object.entries(tasksDict)){
    const s=subjects[key];
    if(!s||s.paused) continue;
    // Expand arrays (doubled-up subjects from autoBalance) into separate entries
    const vals=Array.isArray(raw)?raw:[raw];
    const rules=s.rules||"";
    for(const val of vals){
      if(rules.includes("first")){ buckets.first.push([key,val]); continue; }
      if(rules.includes("last")){ buckets.last.push([key,val]); continue; }
      if(s.device==="computer") buckets.computer.push([key,val]);
      else if(s.device==="ipad"||s.device==="ipad/phone") buckets.ipad.push([key,val]);
      else if(s.device==="phone") buckets.phone.push([key,val]);
      else if(s.mom==="required") buckets.required_paper.push([key,val]);
      else if(s.mom==="maybe") buckets.maybe_paper.push([key,val]);
      else buckets.independent.push([key,val]);
    }
  }
  // Sort all buckets: high priority first, then priority rule, then low last
  const prioRank={"high":0,"normal":2,"low":3};
  const sortBucket=(arr)=>arr.sort((a,b)=>{
    const sa=subjects[a[0]], sb=subjects[b[0]];
    const aR=(sa&&(sa.rules||"").includes("priority"))?1:prioRank[sa&&sa.priority||"normal"]||2;
    const bR=(sb&&(sb.rules||"").includes("priority"))?1:prioRank[sb&&sb.priority||"normal"]||2;
    return aR-bR;
  });
  ["computer","ipad","phone","independent","maybe_paper","required_paper"].forEach(k=>sortBucket(buckets[k]));
  // Sticky rule: pull the subject out of its natural bucket and insert it
  // immediately before/after its partner so the pair schedules back-to-back.
  const bucketNames=Object.keys(buckets);
  for(const[key,s] of Object.entries(subjects)){
    if(!s||s.paused) continue;
    if(!(s.rules||"").includes("sticky")||!s.stickyWith||s.stickyWith===key) continue;
    let pBn=null;
    for(const bn of bucketNames){
      if(buckets[bn].some(e=>e[0]===s.stickyWith)){ pBn=bn; break; }
    }
    if(!pBn) continue; // partner not scheduled this day — stay in natural bucket
    const entries=[];
    for(const bn of bucketNames){
      for(let i=buckets[bn].length-1;i>=0;i--){
        if(buckets[bn][i][0]===key) entries.unshift(buckets[bn].splice(i,1)[0]);
      }
    }
    if(!entries.length) continue;
    const pIdx=buckets[pBn].findIndex(e=>e[0]===s.stickyWith);
    buckets[pBn].splice((s.stickyOrder==="before")?pIdx:pIdx+1,0,...entries);
  }
  return buckets;
}

// ====== SHARED DAY-PACKER — additive, not yet wired (plan: elegant-chasing-lark) ======
// PACKDAY_START
// One duration-aware packer that all four scheduling engines will share.
// Pure arithmetic (minutes-from-midnight) so it can be unit-tested in isolation.
// Items must already be ordered per kid (category rank + sticky); packDay only
// resolves resource/time conflicts and reports what didn't fit.
//
//   item: { id, who, lane, durMin, momRequired, droppable, participants? }
//     lane in computer | ipad | ipadLucy | phone | paper   ("paper"/""/unknown = no device lane)
//     participants:[kid,...] (len>=2) = a COMBINED block — co-scheduled across all
//       participants at one time; it blocks every participant's kidFree but advances the
//       lane and momFree ONCE (Mom teaches them together — the intentional exception to
//       the "no two Mom-required at once" rule, which still holds BETWEEN blocks).
//   ctx:  { start, end, lunchStart, lunchEnd,        // minutes from midnight
//           sitterStart, sitterEnd,                   // 0/0 when no babysitter window
//           kidStart, laneStart, momStart,            // per-kid / per-lane / Mom earliest — seed past already-fixed (checked) work
//           lanes,                                    // contending device lanes (default below)
//           allowOvertime, overtimeMax }              // Saturday catch-up: stack past `end`
//   -> { byId:{id:startMin}, placed:[{id,start}], overflow:[item], dropped:[item] }
//      overflow = couldn't fit and must be re-homed/carried (never silently lost);
//      dropped  = couldn't fit AND flagged droppable (e.g. reflex).
function packDay(items, ctx){
  ctx = ctx || {};
  const dayStart = ctx.start || 0;
  const LANES = ctx.lanes || ["computer","ipad","ipadLucy","phone"];
  const laneSet = {}; LANES.forEach(l => { laneSet[l] = true; });
  const lunchS = ctx.lunchStart, lunchE = ctx.lunchEnd, hasLunch = (lunchE > lunchS);
  const skipLunch = (start, dur) => {
    if(!hasLunch || start >= lunchE || start + dur <= lunchS) return start;
    return lunchE;
  };
  const res = {}; LANES.forEach(l => { res[l] = Math.max(dayStart, (ctx.laneStart && ctx.laneStart[l]) || 0); });
  let momFree = Math.max(dayStart, ctx.momStart || 0);
  const kidFree = {};
  const hardEnd = ctx.allowOvertime ? (ctx.end + (ctx.overtimeMax || 180)) : ctx.end;
  const placed = [], overflow = [], dropped = [], byId = {};
  for(const it of (items || [])){
    // A combined block lists its participants; a normal task is just its one `who`.
    const kids = (it.participants && it.participants.length) ? it.participants : [it.who];
    const dur = it.durMin || 20;
    const lane = (it.lane && laneSet[it.lane]) ? it.lane : null;
    let from = dayStart;
    for(const k of kids) from = Math.max(from, kidFree[k] || 0, (ctx.kidStart && ctx.kidStart[k]) || 0);
    if(lane) from = Math.max(from, res[lane]);
    if(it.momRequired) from = Math.max(from, momFree);
    let start = skipLunch(from, dur);
    // A Mom-required task can't run during the babysitter window — defer to mom's return.
    if(it.momRequired && ctx.sitterEnd > ctx.sitterStart && start < ctx.sitterEnd && start + dur > ctx.sitterStart){
      start = skipLunch(ctx.sitterEnd, dur);
    }
    if(start + dur > hardEnd){ (it.droppable ? dropped : overflow).push(it); continue; }
    const end = start + dur;
    for(const k of kids) kidFree[k] = end;   // every participant is busy for the block…
    if(lane) res[lane] = end;
    if(it.momRequired) momFree = end;         // …but the lane and Mom advance only ONCE
    placed.push({ id: it.id, start }); byId[it.id] = start;
  }
  return { byId, placed, overflow, dropped };
}
// PACKDAY_END

// PACKAROUND_START
// Pack `newTasks` into a day AROUND already-fixed `existing` tasks, via packDay.
// Seeds per-kid / per-lane / Mom cursors past the fixed work (and past any ctx
// floors), mutates each placed task's .time, and returns the tasks that didn't fit
// (overflow — never dropped here). Shared by displacement (_packFit), the daily
// cascade, and the day re-sort so every engine packs identically.
//   existing / newTasks: task objects {id, who, time, dur, device, mom}
//   ctx: {start, end, lunchStart, lunchEnd, momStart?, kidStart?, allowOvertime?, overtimeMax?}
function packAround(existing, newTasks, ctx){
  if(!newTasks || !newTasks.length) return [];
  function laneOf(t){ var dv=t.device||taskDevice(t); return (dv==="ipad"&&t.who==="lucy")?"ipadLucy":dv; }
  var dStart=ctx.start;
  var laneStart={}, momStart=Math.max(dStart, ctx.momStart||0), kidStart={};
  if(ctx.kidStart){ for(var k in ctx.kidStart) kidStart[k]=Math.max(dStart, ctx.kidStart[k]||0); }
  (existing||[]).forEach(function(t){
    var end=toMin(t.time)+(t.dur||20), lane=laneOf(t);
    if(lane&&lane!=="paper") laneStart[lane]=Math.max(laneStart[lane]||dStart,end);
    kidStart[t.who]=Math.max(kidStart[t.who]||dStart,end);
    if(t.mom==="required") momStart=Math.max(momStart,end);
  });
  var items=newTasks.map(function(t){ return {id:t.id,who:t.who,lane:laneOf(t),durMin:t.dur||20,momRequired:t.mom==="required"}; });
  var packed=packDay(items,{start:dStart,end:ctx.end,lunchStart:ctx.lunchStart,lunchEnd:ctx.lunchEnd,
    kidStart:kidStart,laneStart:laneStart,momStart:momStart,allowOvertime:!!ctx.allowOvertime,overtimeMax:ctx.overtimeMax||180,lanes:ctx.lanes});
  var byId={}; newTasks.forEach(function(t){byId[t.id]=t;});
  packed.placed.forEach(function(p){ byId[p.id].time=fromMin(p.start); });
  return packed.overflow.map(function(it){ return byId[it.id]; });
}
// PACKAROUND_END

class GWScheduler{
  constructor(schoolStart,momAvailable,cutoff,sitterStart,sitterEnd){
    this.computerFree=schoolStart;
    this.ipadFree=schoolStart;
    this.ipadFreeLucy=schoolStart;
    this.momFree=momAvailable;
    this.kidFree={lincoln:schoolStart,ellis:schoolStart,lucy:schoolStart};
    this.cutoff=cutoff;
    this.sitterStart=sitterStart||0;
    this.sitterEnd=sitterEnd||0;
  }
  _earliest(kid,reqComp,reqIpad,reqMom){
    let t=this.kidFree[kid];
    if(reqComp) t=Math.max(t,this.computerFree);
    if(reqIpad) t=Math.max(t,kid==="lucy"?this.ipadFreeLucy:this.ipadFree);
    if(reqMom) t=Math.max(t,this.momFree);
    return t;
  }
  place(kid,key,duration,reqComp,reqIpad,reqMom){
    let start=this._earliest(kid,reqComp,reqIpad,reqMom);
    start=gwSkipLunch(start,duration);
    if(reqMom&&this.sitterEnd>this.sitterStart&&start<this.sitterEnd&&start+duration>this.sitterStart){
      start=this.sitterEnd;
      start=gwSkipLunch(start,duration);
    }
    const end=start+duration;
    if(end>this.cutoff) return null;
    this.kidFree[kid]=end;
    if(reqComp) this.computerFree=end;
    if(reqIpad){ if(kid==="lucy") this.ipadFreeLucy=end; else this.ipadFree=end; }
    if(reqMom) this.momFree=end;
    return start;
  }
}

// Workflow-order rank for a curriculum subject (lower = earlier), read from the Rules →
// Workflow Orders. Mirrors the displacement engine's _wfWeight but from curriculum
// metadata. morning/first → very early; closing/last → very late; else by the kid's
// workflow steps (subject match, then device/Mom tier), else neutral.
function gwWorkflowRank(kid, key, s, dayName, isSitterDay){
  const disp=(s.display||key||"");
  const rules=s.rules||"";
  if(/closing notebook/i.test(disp)||rules.includes("last")) return 1000;
  if(/morning notebook/i.test(disp)||rules.includes("first")) return -1;
  const wf=(rulesData&&rulesData.workflow)||{};
  const kidWf=wf[kid]; if(!kidWf) return 500;
  const steps=fbArr(isSitterDay?kidWf.babysitter:kidWf.normal)||fbArr(kidWf.normal)||[];
  const tier=(s.device==="computer"||s.device==="ipad"||s.device==="phone")?"computer":(s.mom==="required"?"required":(s.mom==="maybe"?"maybe":"independent"));
  const subjL=disp.trim().toLowerCase();
  for(let i=0;i<steps.length;i++){ const subs=fbArr((steps[i]||{}).subjects)||[]; for(let j=0;j<subs.length;j++){ if(subjL.includes(String(subs[j]).toLowerCase())) return i*10+j; } }
  for(let i=0;i<steps.length;i++){ if((steps[i]||{}).tier===tier) return i*10+9; }
  return 500;
}

function gwBuildDayTasks(kidAssignments,dayConfig,prefix,counter){
  const schoolStart=dayConfig.schoolStart;
  const momAvailable=dayConfig.momAvailable;
  const isSitter=dayConfig.isSitter;
  const sitterStart=dayConfig.sitterStart;
  const sitterEnd=dayConfig.sitterEnd;
  const withSitter=dayConfig.withSitter||[];
  const isCarSchool=dayConfig.isCarSchool;
  const theater=dayConfig.theater;
  const dayName=dayConfig.dayName;
  const isFriday=dayName==="friday";
  const r=gwRules();
  const cutoff=(theater&&dayName!=="friday"&&dayName!=="saturday")?r.schoolEnd:Math.max(r.schoolEnd,17*60);

  // Notebooks and drills are now managed as regular curriculum subjects — no hardcoded injection needed

  const tasks=[];
  const dropped=[];
  const meta={};   // item id -> {kid,key,excelVal,s} | {notebook:true}
  const items=[];  // ordered placeable proto-tasks fed to the shared packer

  const ellisHasIpad=["nzk_e","eggspress_e"].some(k=>(kidAssignments.ellis||{})[k]);
  function getMeta(kid,key){ return gwGetSubjects(kid)[key]||null; }

  // Turn a (kid,key) into an ordered item, applying the day-skip rules (car-school / no-fri / mon-thu).
  function pushItem(kid,key,excelVal){
    const s=getMeta(kid,key); if(!s) return;
    if(isCarSchool&&s.device!=="ipad"&&!GW_CAR_SAFE_KEYS.has(key)){ dropped.push({kid,day:dayName,key,val:excelVal,reason:"car school day — paper/computer tasks skipped"}); return; }
    const rules=s.rules||"";
    if(rules.includes("no-fri")&&isFriday){ dropped.push({kid,day:dayName,key,val:excelVal,reason:"Not scheduled on Fridays (Excel rule)"}); return; }
    if(rules.includes("mon-thu")&&!["monday","tuesday","wednesday","thursday"].includes(dayName)){ dropped.push({kid,day:dayName,key,val:excelVal,reason:"Mon–Thu only (Excel rule)"}); return; }
    const id=prefix+(counter++);
    items.push({id,who:kid,device:s.device||"paper",dur:s.minutes||20,mom:s.mom||"none"});
    meta[id]={kid,key,excelVal,s};
  }
  function pushBucket(kid,bucket){ (bucket||[]).forEach(([key,val])=>pushItem(kid,key,val)); }

  // Julian's daily notebook (legacy hardcoded subject — migrates to curriculum later).
  const _jnbId=prefix+(counter++);
  items.push({id:_jnbId,who:"julian",device:"paper",dur:10,mom:"none"});
  meta[_jnbId]={notebook:true};

  const buckets={
    lincoln:gwByCategory("lincoln",kidAssignments.lincoln||{}),
    ellis:gwByCategory("ellis",kidAssignments.ellis||{}),
    lucy:gwByCategory("lucy",kidAssignments.lucy||{}),
    julian:gwByCategory("julian",kidAssignments.julian||{})
  };
  const KIDS=["lincoln","ellis","lucy","julian"]; // Julian is a first-class kid now

  // Lesson Map per-day run order (scheduleOverrides[date][kid].order): rank-sort each bucket.
  const dayOrder={};
  KIDS.forEach(kid=>{
    const bk=buckets[kid];
    const a=dayConfig.dateStr?_normOrderArr((schedOv(dayConfig.dateStr,kid)||{}).order):null;
    if(!a||!a.length) return;
    dayOrder[kid]=a;
    const rnk={}; a.forEach((sk,i)=>{ rnk[sk]=i; });
    ["computer","ipad","phone","independent","maybe_paper","required_paper"].forEach(cat=>{
      (bk[cat]||[]).sort((x,y)=>{ const rx=rnk[x[0]]!==undefined?rnk[x[0]]:1e9, ry=rnk[y[0]]!==undefined?rnk[y[0]]:1e9; return rx-ry; });
    });
  });

  // Order each kid's tasks by their Workflow Orders (Mom-required-first, etc.), with a
  // Lesson-Map per-day override taking precedence, then INTERLEAVE round-robin across
  // kids so a shared resource (Mom especially) is allocated fairly per step instead of
  // one kid at a time — this lets each kid's first/Mom work claim the morning rather than
  // waiting for another kid's whole day to be placed first.
  // Group base keeps first-of-day (morning notebook) always earliest and last-of-day
  // (closing notebook) always latest; workflow rank (or an explicit Lesson-Map order)
  // sorts the middle. Without the base, a Lesson-Map order could shove a "first" task late.
  function collectKid(kid){
    const b=buckets[kid], out=[];
    ["first","computer","ipad","phone","independent","maybe_paper","required_paper","last"].forEach(function(cat){
      var base=cat==="first"?-1000:(cat==="last"?1000:0);
      (b[cat]||[]).forEach(function(en){ out.push({key:en[0],val:en[1],base:base}); });
    });
    return out;
  }
  function _feedRank(kid,e){
    var dord=dayOrder[kid];
    if(dord){ var di=dord.indexOf(e.key); if(di>=0) return e.base+di; } // explicit Lesson-Map order within the group
    return e.base+gwWorkflowRank(kid,e.key,getMeta(kid,e.key)||{},dayName,isSitter);
  }
  const perKid={};
  KIDS.forEach(function(kid){ var list=collectKid(kid); list.sort(function(a,b){return _feedRank(kid,a)-_feedRank(kid,b);}); perKid[kid]=list; });
  const kidStart={};
  if(isSitter) KIDS.forEach(function(kid){ if(withSitter.includes(kid)) kidStart[kid]=sitterEnd; });
  var _maxLen=0; KIDS.forEach(function(k){ if(perKid[k].length>_maxLen) _maxLen=perKid[k].length; });
  for(var _i=0;_i<_maxLen;_i++){ KIDS.forEach(function(kid){ var e=perKid[kid][_i]; if(e) pushItem(kid,e.key,e.val); }); }

  // Place everything through the shared packer (no phone lane, to match the prior
  // generator; Mom deferred past the sitter return on babysitter days).
  const overflow=packAround([],items,{start:schoolStart,end:cutoff,lunchStart:r.lunchStart,lunchEnd:r.lunchEnd,
    kidStart:kidStart,momStart:(isSitter?sitterEnd:0),lanes:["computer","ipad","ipadLucy"]});
  const overflowSet=new Set(overflow);
  items.forEach(it=>{
    const mm=meta[it.id];
    if(overflowSet.has(it)){
      if(!mm.notebook) dropped.push({kid:mm.kid,day:dayName,key:mm.key,val:mm.excelVal,reason:"⚠️ RAN PAST SCHOOL-DAY CUTOFF — needs manual placement"});
      return;
    }
    if(mm.notebook){
      tasks.push({id:it.id,who:"julian",day:dayName,time:it.time,dur:10,title:"\u{1F4D6} Notebook — Daily",detail:"Paper. 10 minutes.",mom:"none",cascade:true,device:"paper",subjectKey:"notebook"});
      return;
    }
    const s=mm.s;
    tasks.push({id:it.id,who:mm.kid,day:dayName,time:it.time,dur:s.minutes||20,
      title:gwTaskTitle(mm.kid,mm.key,mm.excelVal,dayName,isCarSchool,ellisHasIpad),
      detail:gwSubjectDetail(mm.kid,mm.key),mom:s.mom||"none",cascade:true,device:s.device||"paper",subjectKey:mm.key});
  });
  tasks.sort((a,b)=>toMin(a.time)-toMin(b.time));
  return {tasks,counter,dropped};
}
