function renderPace(el){
  if(!el){el=document.getElementById("content");if(!el)return;}

  // Seed defaults to Firebase if no plans exist yet
  const hasSavedPlans=paceData.plans&&Object.keys(paceData.plans).length>0;
  if(!hasSavedPlans) Object.entries(PACE_DEFAULT_PLANS).forEach(([k,v])=>savePacePlan(k,v));
  const plans=hasSavedPlans?paceData.plans:PACE_DEFAULT_PLANS;

  // Remove stale/duplicate keys seeded during early testing
  const PACE_STALE_KEYS={ellis:["mathematical_reasoning_level_d_1778793604455"]};
  Object.entries(PACE_STALE_KEYS).forEach(([k,keys])=>{
    const existing=(paceData.subjects&&paceData.subjects[k])||{};
    keys.forEach(key=>{ if(existing[key]) deletePaceSubject(k,key); });
  });

  // Seed subjects per kid — prefer curriculum data, fall back to PACE_DEFAULT_SUBJECTS
  ["lincoln","ellis","lucy"].forEach(k=>{
    const existing=(paceData.subjects&&paceData.subjects[k])||{};
    const currSubjects=(currData&&currData.subjects&&currData.subjects[k])||null;
    const defaults=PACE_DEFAULT_SUBJECTS[k]||{};

    // If curriculum uploaded, sync total + keyword from it
    if(currSubjects){
      Object.entries(currSubjects).forEach(([key,cs])=>{
        const cur=existing[key];
        const kw=cs.display||key;
        if(!cur){
          savePaceSubject(k,key,{label:cs.display,keyword:kw,total:cs.total,offset:0,adjust:0,startWeek:CURR_MIN_WEEK});
        } else if(cur.total!==cs.total||cur.keyword!==kw){
          savePaceSubject(k,key,{...cur,total:cs.total,keyword:kw,label:cs.display});
        }
      });
    } else if(Object.keys(defaults).length){
      // Fallback to hardcoded defaults when no curriculum
      Object.entries(defaults).forEach(([key,subj])=>{
        if(!existing[key]){
          savePaceSubject(k,key,subj);
        } else {
          const cur=existing[key];
          if(cur.startWeek!==subj.startWeek||cur.total!==subj.total){
            savePaceSubject(k,key,{...cur,startWeek:subj.startWeek,total:subj.total});
          }
        }
      });
    }
  });

  let h='<div id="pace-content">';

  // Kid selector (hide when inside schedule tab — main kid filter handles it)
  if(!schedShowPace){
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
    [{k:"all",label:"All",col:"#111827"},...PACE_KIDS.map(k=>({k,label:cap(k),col:PACE_KCOL[k]}))].forEach(({k:k2,label,col})=>{
      const on=kid===k2||(k2==="all"&&(kid==="all"||kid==="mom"));
      h+='<button onclick="selKid(\''+k2+'\')" style="padding:5px 14px;border-radius:20px;border:1.5px solid '+(on?'transparent':'var(--border)')+';background:'+(on?col:'#fff')+';color:'+(on?'#fff':'var(--muted)')+';font-size:12px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif">'+label+'</button>';
    });
    h+='</div>';
  }

  // Weekly progress bar
  const weeklyCol=(kid==="all"||kid==="mom")?"#111827":PACE_KCOL[kid]||"#111827";
  const _wkMatch=t=>(kid==="all"||kid==="mom")?true:t.who===kid;
  const _wkCascAway=new Set(weekData.tasks.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  const _wkCountable=weekData.tasks.filter(t=>_wkMatch(t)&&(!_wkCascAway.has(t.id)||!!checked[t.id])&&!(t.title||"").toLowerCase().includes("lunch"));
  const weeklyTotal=_wkCountable.length;
  const weeklyDone=_wkCountable.filter(t=>chainDone(t.id,checked,weekData.tasks)).length;
  const weeklyPct=weeklyTotal?Math.min(100,Math.round(weeklyDone/weeklyTotal*100)):0;
  h+='<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
    '<div style="font-size:12px;font-weight:600;color:var(--muted)">This week</div>'+
    '<div style="font-size:12px;font-weight:700;color:'+weeklyCol+'">'+weeklyPct+'%</div>'+
    '</div>'+
    '<div class="day-prog-bar" style="margin-top:0"><div class="day-prog-fill" style="width:'+weeklyPct+'%;background:'+weeklyCol+'"></div></div>'+
    '</div>';

  // Plan sections
  Object.entries(plans).forEach(([planKey,plan])=>{
    const planKids=plan.kids||[];
    const visKids=(kid==="all"||kid==="mom")?planKids:planKids.filter(k=>k===kid);
    if(visKids.length===0&&kid!=="all"&&kid!=="mom") return;

    const weekNum=planWeekNum(plan.start||"2026-04-20");
    const totalWeeks=planTotalWeeks(plan.start||"2026-04-20",plan.end||"2026-09-01");
    const planPct=Math.min(100,Math.round(Math.min(weekNum,totalWeeks)/totalWeeks*100));
    const isEditingPlan=paceEditPlan===planKey;

    h+='<div class="pace-plan-section">';

    // Plan banner
    h+='<div class="pace-year-banner" style="align-items:flex-start">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">'+
      '<div class="pace-year-label">'+plan.label+'</div>'+
      '<button class="pace-plan-edit-btn" onclick="togglePlanEdit(\''+planKey+'\')">'+
      (isEditingPlan?'Done':'Edit')+'</button></div>'+
      '<div class="pace-year-sub">'+formatPlanDate(plan.start||"")+' &ndash; '+formatPlanDate(plan.end||"")+'</div>'+
      '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">'+
      planKids.map(k=>'<span class="pace-plan-kid-chip">'+cap(k)+'</span>').join('')+
      '</div>'+
      '<div class="pace-year-bar"><div class="pace-year-fill" style="width:'+planPct+'%"></div></div></div>'+
      '<div style="text-align:right;flex-shrink:0">'+
      '<div class="pace-year-wk">Week '+Math.min(weekNum,totalWeeks)+'</div>'+
      '<div class="pace-year-wklbl">of '+totalWeeks+' &middot; '+planPct+'%</div></div>'+
      '</div>';

    // Plan edit form
    if(isEditingPlan){
      h+='<div class="pace-plan-edit-form">'+
        '<div class="pace-plan-edit-grid">'+
        '<div><div class="pace-config-label">Plan Name</div>'+
        '<input class="pace-config-input" value="'+plan.label.replace(/"/g,'&quot;')+'" '+
        'oninput="updatePlanField(\''+planKey+'\',\'label\',this.value)"/></div>'+
        '<div></div>'+
        '<div><div class="pace-config-label">Start Date</div>'+
        '<input class="pace-config-input" type="date" value="'+(plan.start||'')+'" '+
        'oninput="updatePlanField(\''+planKey+'\',\'start\',this.value)"/></div>'+
        '<div><div class="pace-config-label">End Date</div>'+
        '<input class="pace-config-input" type="date" value="'+(plan.end||'')+'" '+
        'oninput="updatePlanField(\''+planKey+'\',\'end\',this.value)"/></div>'+
        '</div>'+
        '<div class="pace-config-label" style="margin-bottom:6px">Kids in this plan</div>'+
        '<div class="pace-plan-kids-row">'+
        PACE_KIDS.map(k=>{
          const on=(plan.kids||[]).includes(k);
          return '<button class="pace-plan-kid-toggle'+(on?' on':'')+'" onclick="togglePlanKid(\''+planKey+'\',\''+k+'\')">'+cap(k)+'</button>';
        }).join('')+
        '</div>'+
        '<button class="pace-del-btn" onclick="if(confirm(\'Delete this plan?\'))deletePacePlan(\''+planKey+'\')">Delete Plan</button>'+
        '</div>';
    }

    // Kid curriculum cards
    visKids.forEach(k=>{
      const kidSubjs=(paceData.subjects&&paceData.subjects[k])||{};
      const keys=Object.keys(kidSubjs);
      const isEditing=paceEditKid===k;
      const col=PACE_KCOL[k];
      let aheadN=0,onN=0,behindN=0;
      const cwn=currWeekNum();
      keys.forEach(sk=>{
        const s=kidSubjs[sk];
        const kws=paceKeywords(k,sk,s);
        const cur=(s.offset||0)+paceAutoCount(k,kws)+(s.adjust||0);
        const exp=currExpected(k,sk,cwn);
        const st=paceHasPendingCascade(k,kws)?"behind":paceStatus(cur,s.total||0,s.startWeek||1,weekNum,totalWeeks,exp);
        if(st==="ahead")aheadN++; else if(st==="behind")behindN++; else if(st!=="not-started")onN++;
      });
      const summaryStr=keys.length?(behindN?behindN+' behind':aheadN?aheadN+' ahead':'All on track'):'No subjects yet';

      h+='<div class="pace-kid-card">'+
        '<div class="pace-kid-hdr">'+
        '<div><div class="pace-kid-name" style="color:'+col+'">'+cap(k)+'</div>'+
        '<div class="pace-kid-meta">'+summaryStr+(keys.length?' &middot; '+keys.length+' subjects':'')+'</div></div>'+
        '<div class="pace-kid-actions">'+
        '<button class="pace-edit-btn'+(isEditing?' active':'')+'" onclick="togglePaceEdit(\''+k+'\')">'+
        (isEditing?'Done':'Edit')+'</button></div>'+
        '</div>';

      if(keys.length||isEditing){
        h+='<div class="pace-subjects">';
        if(!keys.length) h+='<div class="pace-empty">No subjects yet — add one below.</div>';

        keys.forEach(sk=>{
          const s=kidSubjs[sk];
          const kws=paceKeywords(k,sk,s);
          const autoC=paceAutoCount(k,kws);
          const offset=s.offset||0,adjust=s.adjust||0,sw=s.startWeek||1;
          const cur=offset+autoC+adjust,tot=s.total||1;
          const pct=Math.min(100,Math.round(cur/tot*100));
          const exp=currExpected(k,sk,cwn);
          const status=paceHasPendingCascade(k,kws)?"behind":paceStatus(cur,tot,sw,weekNum,totalWeeks,exp);
          const barCol=status==="ahead"?"#16a34a":status==="behind"?"#ef4444":status==="not-started"?"#d1d5db":"#3b82f6";
          const expPct=exp!==null?Math.min(100,Math.round(exp/tot*100)):null;
          const diff=exp!==null?cur-exp:null;
          const expLabel=exp!==null?' &middot; '+(diff>0?diff+' ahead of expected':diff<0?Math.abs(diff)+' behind expected':'on pace for Wk '+cwn):'';

          // Next Up from curriculum auto-advance
          const _nextLesson=getNextLessonLabel(k,sk);

          h+='<div class="pace-subject-row">'+
            '<div class="pace-subj-hdr">'+
            '<span class="pace-subj-name">'+s.label+'</span>'+
            '<span class="pace-subj-nums">'+cur+' / '+tot+' done</span></div>'+
            '<div class="pace-bar" style="position:relative"><div class="pace-bar-fill" style="width:'+pct+'%;background:'+barCol+'"></div>'+(expPct!==null?'<div style="position:absolute;left:'+expPct+'%;top:-3px;width:2px;height:calc(100% + 6px);background:#374151;border-radius:1px;pointer-events:none" title="Expected: '+exp+'/'+tot+'"></div>':'')+'</div>'+
            '<div class="pace-status-row">'+
            '<span class="pace-badge '+status+'">'+paceStatusLabel(status)+'</span>'+
            '<span class="pace-pct">'+pct+'% complete'+expLabel+(sw>1&&weekNum<sw?' &middot; starts wk '+sw:'')+'</span></div>';

          // Show "Next Up" when curriculum data is available
          if(_nextLesson){
            h+='<div style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:4px 8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px">'+
              '<span style="font-size:10px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap">Next up</span>'+
              '<span style="font-size:12px;color:#15803d;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+_nextLesson+'</span></div>';
          } else if(cur>=tot&&tot>0){
            h+='<div style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:4px 8px;background:#fef9c3;border:1px solid #fde68a;border-radius:6px">'+
              '<span style="font-size:10px;font-weight:700;color:#a16207;text-transform:uppercase;letter-spacing:0.3px">Complete</span>'+
              '<span style="font-size:12px;color:#92400e;font-weight:500">All lessons finished!</span></div>';
          }

          if(isEditing){
            h+='<div class="pace-config-grid">'+
              '<div><div class="pace-config-label">Keyword</div>'+
              '<input class="pace-config-input" value="'+(s.keyword||'').replace(/"/g,'&quot;')+'" placeholder="e.g. AAS Spelling" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'keyword\',this.value)"/></div>'+
              '<div><div class="pace-config-label">Total</div>'+
              '<input class="pace-config-input" type="number" min="1" value="'+(s.total||'')+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'total\',parseInt(this.value)||0)"/></div>'+
              '<div><div class="pace-config-label">Start Wk</div>'+
              '<input class="pace-config-input" type="number" min="1" value="'+sw+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'startWeek\',parseInt(this.value)||1)"/></div>'+
              '</div>'+
              '<div class="pace-auto-info">'+
              '<span>Auto: <span class="pace-auto-num">'+autoC+'</span></span>'+
              '<span style="color:var(--border)">+</span>'+
              '<span>Offset: <input class="pace-num-input" type="number" min="0" value="'+offset+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'offset\',parseInt(this.value)||0)"/></span>'+
              '<span style="color:var(--border)">+</span>'+
              '<span>Adjust: <input class="pace-num-input" type="number" value="'+adjust+'" '+
              'oninput="updatePaceField(\''+k+'\',\''+sk+'\',\'adjust\',parseInt(this.value)||0)"/></span>'+
              '<span style="color:var(--border)">=</span>'+
              '<span><span class="pace-auto-num">'+cur+'</span> done</span>'+
              '<button class="pace-del-btn" style="margin-left:auto" onclick="deletePaceSubject(\''+k+'\',\''+sk+'\')">Remove</button>'+
              '</div>';
          }
          h+='</div>';
        });

        if(isEditing){
          h+='<div class="pace-add-row">'+
            '<input id="pace-new-label-'+k+'" type="text" placeholder="Subject name" maxlength="30"/>'+
            '<input id="pace-new-kw-'+k+'" type="text" placeholder="Keyword" maxlength="40"/>'+
            '<input id="pace-new-total-'+k+'" type="number" placeholder="Total" min="1" max="9999" style="width:60px"/>'+
            '<input id="pace-new-sw-'+k+'" type="number" placeholder="Wk" min="1" title="Start week" style="width:44px"/>'+
            '<button class="pace-add-btn" onclick="addPaceSubject(\''+k+'\')">+ Add</button></div>';
        }
        h+='</div>';
      }
      h+='</div>';
    });

    h+='</div>';
  });

  // Add plan form
  h+='<div class="pace-add-plan-row">'+
    '<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.3px">Add New Plan</div>'+
    '<div class="pace-add-plan-grid">'+
    '<div><div class="pace-config-label">Name</div><input id="pace-new-plan-label" class="pace-config-input" type="text" placeholder="e.g. Summer Session"/></div>'+
    '<div><div class="pace-config-label">Start Date</div><input id="pace-new-plan-start" class="pace-config-input" type="date"/></div>'+
    '<div><div class="pace-config-label">End Date</div><input id="pace-new-plan-end" class="pace-config-input" type="date"/></div>'+
    '</div>'+
    '<button class="pace-add-btn" onclick="addPacePlan()">+ Add Plan</button>'+
    '</div>';

  h+='</div>';
  el.innerHTML=h;
}

function mastCurriculumStatus(){
  const kid=masteryKid||"julian";
  let items=masteryData[kid]||[];
  if(!Array.isArray(items)) items=Object.values(items);
  const result={};
  Object.entries(mastFullCurriculum()).forEach(([cat,all])=>{
    const inRotation=[],graduated=[],available=[];
    all.forEach(name=>{
      const item=items.find(i=>i.prompt===name&&i.subject===cat);
      if(!item) available.push(name);
      else if(item.tier==="graduated") graduated.push(item);
      else inRotation.push(item);
    });
    result[cat]={inRotation,graduated,available};
  });
  return result;
}

function mastGetPrintNum(){
  const today=new Date().toISOString().slice(0,10);
  let pl=masteryData.printLog||[];
  if(!Array.isArray(pl)) pl=Object.values(pl);

  const existing=pl.find(x=>x.date===today);
  if(existing) return existing.num;

  // New day — assign next number and save it immediately
  const maxNum=pl.reduce((m,x)=>Math.max(m,x.num||0),0);
  const num=maxNum+1;
  pl.push({date:today,num:num});
  masteryData.printLog=pl;
  if(db) db.ref("mastery/printLog").set(pl);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}
  return num;
}

function mastIsDue(item,pn){
  const iv=MAST_TIER_INT[item.tier||"daily"];
  if(iv===null||iv===undefined) return false;
  const cy=item.cycle||1;
  return (pn-1)%iv===(cy-1)%iv;
}

function mastDueItems(kid,pn){
  let items=masteryData[kid];
  if(!items) return [];
  if(!Array.isArray(items)) items=Object.values(items);
  const due=items.filter(i=>mastIsDue(i,pn));
  due.sort((a,b)=>MAST_TIER_ORDER.indexOf(a.tier||"daily")-MAST_TIER_ORDER.indexOf(b.tier||"daily"));
  if(MAST_FLASH_KIDS.has(kid)){
    const _mk=masteryKid; masteryKid=kid; const settings=mastJulianSettings(); masteryKid=_mk;
    const byCat={};
    due.forEach(item=>{
      const cat=item.subject||"Other";
      if(!byCat[cat]) byCat[cat]={active:[],intro:[]};
      if(item.status==="introduction") byCat[cat].intro.push(item);
      else byCat[cat].active.push(item);
    });
    const capped=[];
    Object.values(byCat).forEach(bucket=>{
      const combined=bucket.active.concat(bucket.intro);
      capped.push(...combined.slice(0,settings.max_per_cat));
    });
    return capped;
  }
  return due;
}

function mastSaveResults(){
  const pn=mastGetPrintNum();
  const due=mastDueItems(masteryKid,pn);
  const TIER_LADDER_STD=["daily","every_other_day","every_third_day","weekly","bi_weekly","monthly","learned","graduated"];
  const TIER_LADDER=MAST_FLASH_KIDS.has(masteryKid)?mastJulianSettings().ladder:TIER_LADDER_STD;

  // Get all items for this kid
  let items=masteryData[masteryKid];
  if(!items) return;
  if(!Array.isArray(items)) items=Object.values(items);

  // Apply results
  let changes=0;
  due.forEach(dueItem=>{
    const score=mastLogScores[dueItem.id];
    if(!score||score==="shown") return; // "shown" already saved by mastSlideShown
    // Find in items array
    const item=items.find(i=>i.id===dueItem.id);
    if(!item) return;
    if(item.status==="introduction") return; // intro items don't get ladder scoring

    const oldTier=item.tier||"daily";
    const oldIdx=TIER_LADDER.indexOf(oldTier);
    if(oldIdx===-1) return;

    let newIdx=oldIdx;
    if(score==="c") newIdx=Math.min(oldIdx+1,TIER_LADDER.length-1);
    else if(score==="m"){ newIdx=0; item.drop_count=(item.drop_count||0)+1; }
    // ~ stays same

    const newTier=TIER_LADDER[newIdx];
    if(newTier!==oldTier){
      item.tier=newTier;
      // Assign new cycle: count items already in that tier, wrap within interval
      const interval=MAST_TIER_INT[newTier];
      if(interval){
        const countInTier=items.filter(i=>i.tier===newTier&&i.id!==item.id).length;
        item.cycle=(countInTier%interval)+1;
      }
    }
    item.consecutive_correct=score==="c"?(item.consecutive_correct||0)+1:0;
    changes++;
  });

  const hasShown=Object.values(mastLogScores).some(v=>v==="shown");
  if(!changes&&!hasShown){ alert("No items scored"); return; }

  // Update printLog with today if not present
  let pl=masteryData.printLog||[];
  if(!Array.isArray(pl)) pl=Object.values(pl);
  const today=new Date().toISOString().slice(0,10);
  if(!pl.find(e=>e.date===today)) pl.push({date:today,num:pn});
  masteryData.printLog=pl;

  // Build drill history record
  const drillItems=[];
  let correct=0,miss=0,close=0,shown=0;
  due.forEach(d=>{
    const sc=mastLogScores[d.id];
    if(!sc) return;
    if(sc==="shown"){ shown++; drillItems.push({id:d.id,prompt:d.prompt,result:"shown",tier:d.tier||"daily"}); }
    else { drillItems.push({id:d.id,prompt:d.prompt,result:sc,oldTier:d.tier||"daily"}); if(sc==="c")correct++; else if(sc==="m")miss++; else if(sc==="~")close++; }
  });
  const scored=correct+miss+close;
  const histEntry={
    date:today, printNum:pn, total:due.length, scored:scored,
    correct:correct, miss:miss, close:close, shown:shown,
    pct:scored?Math.round(correct/scored*100):0,
    items:drillItems
  };

  // Save to Firebase
  if(db){
    db.ref("mastery/"+masteryKid).set(items);
    db.ref("mastery/printLog").set(pl);
    db.ref("mastery/history/"+masteryKid+"/"+today.replace(/-/g,"")).set(histEntry);
  }
  // Update local
  masteryData[masteryKid]=items;
  if(!masteryData.history) masteryData.history={};
  if(!masteryData.history[masteryKid]) masteryData.history[masteryKid]={};
  masteryData.history[masteryKid][today.replace(/-/g,"")]=histEntry;
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  mastLogMode=false;
  mastLogScores={};
  const c=document.getElementById("content"); if(c) renderMastery(c);
}

function mastAdminToggleTier(tier){
  if(!mastAdminLocal) mastAdminInit();
  const ladder=mastAdminLocal.ladder||["every_other_day","weekly","bi_weekly","monthly","graduated"];
  const allTiers=["every_other_day","every_third_day","weekly","bi_weekly","monthly","learned","graduated"];
  if(tier==="graduated") return;
  const idx=ladder.indexOf(tier);
  if(idx!==-1){ ladder.splice(idx,1); }
  else {
    // Insert in correct order relative to allTiers
    const pos=allTiers.indexOf(tier);
    let insertAt=ladder.length-1; // before graduated
    for(let i=0;i<ladder.length;i++){
      if(allTiers.indexOf(ladder[i])>pos){ insertAt=i; break; }
    }
    ladder.splice(insertAt,0,tier);
  }
  mastAdminLocal.ladder=ladder;
  mastAdminDirty=true;
  _mastRe();
}

function mastGetGenerated(item){
  const today=new Date().toISOString().slice(0,10);
  const key=item.id+"_"+today;

  // Check cache
  if(mastGeneratedCache[key]) return mastGeneratedCache[key];

  // Check Firebase cache
  const fbCached=masteryData._genCache&&masteryData._genCache[item.id];
  if(fbCached&&fbCached.date===today){ mastGeneratedCache[key]=fbCached; return fbCached; }

  // Generate if not already in flight
  if(!mastGenerating[item.id]&&mastAIKey){
    mastGenerating[item.id]=true;
    const kidLabel=SL_KLBL[masteryKid]||masteryKid;
    const count=item.problemCount||1;
    const tier=item.tier||"daily";
    const tierLabel=MAST_TIER_LBL[tier]||tier;

    // Difficulty scaling based on tier
    const diffMap={daily:"beginner — straightforward, one step",every_other_day:"developing — slightly harder, may need two steps",weekly:"intermediate — add a twist or extra step",bi_weekly:"advancing — combine with a related skill",monthly:"challenging — multi-step or requires deeper understanding"};
    const diffHint=diffMap[tier]||"age-appropriate";

    const countInstr=count>1
      ?"Generate exactly "+count+" practice problems"
      :"Generate exactly 1 practice problem";

    const prompt=countInstr+" for a homeschool student.\n\nStudent: "+kidLabel+"\nConcept: "+item.prompt+"\nCurrent mastery tier: "+tierLabel+" (difficulty hint: "+diffHint+")\nRules/Instructions: "+(item.generationRule||item.definition||"Generate an age-appropriate problem for this concept")+"\n\n"+(count>1
      ?"Respond with ONLY a JSON array, no markdown, no explanation. Each element: {\"problem\": \"...\", \"answer\": \"...\"}\nExample: [{\"problem\":\"5+3=\",\"answer\":\"8\"},{\"problem\":\"7+2=\",\"answer\":\"9\"}]"
      :"Respond with ONLY a JSON object, no markdown, no explanation:\n{\"problem\": \"the problem text the student sees\", \"answer\": \"the correct answer\"}");

    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":mastAIKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:count>1?800:200,messages:[{role:"user",content:prompt}]})
    }).then(r=>r.json()).then(data=>{
      try{
        const txt=data.content[0].text.trim();
        const parsed=JSON.parse(txt);
        let entry;
        if(Array.isArray(parsed)){
          entry={date:today,problems:parsed,problem:parsed.map((p,i)=>(i+1)+". "+p.problem).join("\n"),answer:parsed.map(p=>p.answer).join(", ")};
        } else {
          entry={date:today,problems:[parsed],problem:parsed.problem,answer:parsed.answer};
        }
        mastGeneratedCache[key]=entry;
        if(db) db.ref("mastery/_genCache/"+item.id).set(entry);
        if(!masteryData._genCache) masteryData._genCache={};
        masteryData._genCache[item.id]=entry;
      }catch(e){ console.error("Parse error:",e,data); mastGeneratedCache[key]={date:today,problems:[],problem:"[Generation error — tap \u{1F504} to retry]",answer:""}; }
      delete mastGenerating[item.id];
      _mastRe();
    }).catch(err=>{
      console.error("API error:",err);
      mastGeneratedCache[key]={date:today,problems:[],problem:"[API error — check connection]",answer:""};
      delete mastGenerating[item.id];
      _mastRe();
    });
  }

  return null; // Still loading
}

      const rl=h.result==="c"?"✓":h.result==="m"?"✗":h.result==="~"?"~":"👁️";
      const lbl=h.result==="c"?"Correct":h.result==="m"?"Missed":h.result==="~"?"Close":"Shown";
      const dateObj=new Date(h.date+"T12:00:00");
      const dayN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dateObj.getDay()];

      const dateLbl=dayN+", "+monN+" "+dateObj.getDate();
      const tierLbl=MAST_TIER_LBL[h.oldTier]||h.oldTier;

      else if(h.result==="c"&&i<itemHist.length-1) note=' <span style="color:#16a34a">⬆</span>';

      inner+='<span style="color:var(--muted);width:90px;flex-shrink:0">'+dateLbl+'</span>';

      inner+=note;

    });

function mastSlideShown(id){
  // Fill the next tally dot for an introduction item
  let items=masteryData[masteryKid];
  if(!items) return;
  if(!Array.isArray(items)) items=Object.values(items);
  const item=items.find(i=>i.id===id);
  if(!item) return;

  const jset=MAST_FLASH_KIDS.has(masteryKid)?mastJulianSettings():{intro_dots:5};
  const dots=(item.tally_dots||0)+1;
  item.tally_dots=dots;

  if(dots>=jset.intro_dots){
    item.status="active";
    item.tier=jset.ladder[0]||"every_other_day";
    item.cycle=1;
    item.consecutive_correct=0;
    item.tally_dots=jset.intro_dots;

    // Auto-pull next curriculum item if enabled
    if(MAST_FLASH_KIDS.has(masteryKid)&&jset.auto_pull){
      const cat=item.subject;
      const introCount=items.filter(i=>i.subject===cat&&i.status==="introduction"&&i.id!==item.id).length;
      if(introCount<jset.max_intro_per_cat){
        const curriculum=mastFullCurriculum()[cat]||[];
        const existingPrompts=new Set(items.filter(i=>i.subject===cat).map(i=>i.prompt));
        const next=curriculum.find(name=>!existingPrompts.has(name));
        if(next){
          const slug=next.toLowerCase().replace(/[^a-z0-9]/g,"_").substring(0,20);
          const _pfx=masteryKid.substring(0,3);
          const newItem={id:_pfx+"_"+slug,subject:cat,type:cat.toLowerCase(),prompt:next,answer:next,tier:"daily",review_mode:"flash",status:"introduction",drop_count:0,consecutive_correct:0,cycle:1,tally_dots:0};
          if(cat==="Animals"&&MAST_ANIMAL_EMOJI[next]) newItem.emoji=MAST_ANIMAL_EMOJI[next];
          const _apVis=mastGetVisual(cat,next);
          if(_apVis){ if(typeof _apVis==="string") newItem.emoji=_apVis; else if(_apVis.imageUrl) newItem.imageUrl=_apVis.imageUrl; }
          items.push(newItem);
        }
      }
    }
  }

  // Save to Firebase
  masteryData[masteryKid]=items;
  if(db) db.ref("mastery/"+masteryKid).set(items);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  // Mark as handled for this session so we don't double-tap
  mastLogScores[id]="shown";
  // Advance slideshow if item is in the slideshow (flash, flip, or quiz-intro)
  const _shMode=mastGetCatMode(masteryKid,item.subject);
  if(_shMode==="flash"||_shMode==="flip"||(_shMode==="quiz"&&item.status==="introduction")) mastSlideIdx++;
  _mastRe();
}

    prompts=textarea.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  }

  if(!prompts.length) return;

  let items=masteryData[masteryKid];
  if(!items) items=[];
  if(!Array.isArray(items)) items=Object.values(items);

  const existingPrompts=new Set(items.map(i=>(i.prompt||"").toLowerCase()));
  let added=0, skipped=0;

  prompts.forEach(p=>{
    if(existingPrompts.has(p.toLowerCase())){ skipped++; return; }

    const slug=p.toLowerCase().replace(/[^a-z0-9]/g,"_").substring(0,20);
    const prefix=masteryKid.substring(0,3);
    const id=prefix+"_"+slug;

    const typeObj=MAST_ITEM_TYPES.find(t=>t.id===mastAddType)||MAST_ITEM_TYPES[0];
    const subj=isJulian?mastAddJulianCat:(mastAddCustomSubject||mastAddSubject);
    const item={
      id:id,
      subject:subj,
      type:isJulian?mastAddJulianCat.toLowerCase():mastAddType,
      prompt:p,
      answer:p,
      tier:"daily",
      review_mode:isJulian?"flash":typeObj.mode,
      status:isJulian?"introduction":"active",
      drop_count:0,
      consecutive_correct:0,
      cycle:1
    };
    // Attach definition/rule + image for single-add
    if(mastAddTab==="single"&&prompts.length===1){
      const typeInfo=MAST_ITEM_TYPES.find(t=>t.id===mastAddType);
      if(typeInfo&&typeInfo.generated){
        const ruleInput=document.getElementById("mast-add-rule");
        if(ruleInput&&ruleInput.value.trim()){ item.generationRule=ruleInput.value.trim(); item.generated=true; item.problemCount=mastAddProbCount||1; }
      } else {
        const defInput=document.getElementById("mast-add-def");
        if(defInput&&defInput.value.trim()){ item.definition=defInput.value.trim(); item.answer=defInput.value.trim(); }
      }
      if(mastAddImageUrl) item.imageUrl=mastAddImageUrl;
    }
    items.push(item);
    existingPrompts.add(p.toLowerCase());
    added++;

    // Save flip definition if provided
    if(isJulian&&mastAddTab==="single"&&prompts.length===1){
      const _aMode=mastAddItemMode||mastGetCatMode(masteryKid,mastAddJulianCat);
      if(_aMode==="flip"){
        const defInput=document.getElementById("mast-add-def");
        if(defInput&&defInput.value.trim()){
          const s=masteryData[masteryKid+"_settings"]||{};
          if(!s.definitions) s.definitions={};
          s.definitions[p]=defInput.value.trim();
          masteryData[masteryKid+"_settings"]=s;
          if(db) db.ref("mastery/"+masteryKid+"_settings/definitions").set(s.definitions);
        }
      }
    }
  });

  if(!added){
    alert(skipped+" item(s) already exist, nothing added");
    return;
  }

  // If mode was changed from category default, update the category mode
  if(isJulian&&mastAddItemMode&&mastAddItemMode!==mastGetCatMode(masteryKid,mastAddJulianCat)){
    mastAdminCatMode(mastAddJulianCat,mastAddItemMode);
  }

  // Assign cycles for new daily items
  const dailyCount=items.filter(i=>i.tier==="daily").length;
  items.filter(i=>i.tier==="daily").forEach((it,idx)=>{it.cycle=(idx%1)+1;});

  // Save to Firebase
  masteryData[masteryKid]=items;
  if(db) db.ref("mastery/"+masteryKid).set(items);
  try{localStorage.setItem("ha_mastery",JSON.stringify(masteryData));}catch(e){}

  mastAddMode=false;
  mastAddItemMode="";
  alert(added+" item(s) added"+(skipped?" ("+skipped+" duplicate(s) skipped)":""));
  const c=document.getElementById("content"); if(c) renderMastery(c);
}

    h+='<button class="mast-img-btn" onclick="document.getElementById(\'mast-curr-img-file\').click()">\u{1F4F7} Upload Photo</button>';

    // Paste/type emoji
    h+='<div style="margin-bottom:6px"><input class="mast-add-input" placeholder="Or paste/type emoji here\u{2026}" oninput="if(this.value.trim()){mastCurrAddEmoji=this.value.trim();mastCurrEmojiOpen=false;_mastRe()}" style="max-width:200px;font-size:18px"></div>';
    h+='<div class="mast-emoji-tabs">';
    Object.keys(MAST_EMOJI_PAL).forEach(tab=>{
      h+='<button class="mast-emoji-tab'+(mastCurrEmojiTab===tab?" active":"")+'" onclick="mastCurrEmojiTab=\''+tab+'\';_mastRe()">'+tab+'</button>';
    });
    h+='</div>';
    h+='<div class="mast-emoji-grid">';
    const emojis=[...MAST_EMOJI_PAL[mastCurrEmojiTab]||""];
    emojis.forEach(e=>{
      h+='<button class="mast-emoji-btn" onclick="mastCurrAddEmoji=\''+e+'\';mastCurrEmojiOpen=false;_mastRe()">'+e+'</button>';
    });
    h+='</div>';
  }

  h+='<button class="mast-add-submit" onclick="mastCurrAddItem()"'+(mastCurrAddName.trim()?'':' disabled')+'>Add to Curriculum</button>';
  h+='</div></div>';

  // ── VISUAL EDIT MODAL ──
  if(mastVisEditKey){
    const vk=mastVisEditKey;
    const curVis=mastGetVisual(vk.cat,vk.name);
    h+='<div class="mast-vis-overlay" onclick="if(event.target===this){mastVisEditKey=null;_mastRe()}">';
    h+='<div class="mast-vis-modal">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
    h+='<div style="font-family:Fraunces,serif;font-size:15px;font-weight:700">\u{1F3A8} Set Visual — '+vk.name+'</div>';
    h+='<button onclick="mastVisEditKey=null;_mastRe()" style="border:none;background:none;font-size:18px;cursor:pointer">\u{2715}</button>';
    h+='</div>';
    h+='<div style="text-align:center;font-size:48px;margin:10px 0">';
    if(curVis&&typeof curVis==="string") h+=curVis;
    else if(curVis&&curVis.imageUrl) h+='<img src="'+curVis.imageUrl+'" style="width:64px;height:64px;border-radius:12px;object-fit:cover">';
    else{ const ai=MAST_ANIMAL_EMOJI[vk.name]; if(ai) h+=ai; else h+='<span style="color:#d1d5db">\u{2014}</span>'; }
    h+='</div>';
    if(curVis) h+='<div style="text-align:center;margin-bottom:10px"><button class="mast-img-btn" onclick="mastVisEditSet(null)" style="color:#dc2626">\u{2715} Remove Visual</button></div>';
    h+='<div style="margin-bottom:6px"><input class="mast-add-input" placeholder="Paste or type emoji\u{2026}" oninput="if(this.value.trim()){mastVisEditSet(this.value.trim())}" style="font-size:18px"></div>';
    h+='<div class="mast-emoji-tabs">';
    Object.keys(MAST_EMOJI_PAL).forEach(tab=>{
      h+='<button class="mast-emoji-tab'+(mastCurrEmojiTab===tab?" active":"")+'" onclick="mastCurrEmojiTab=\''+tab+'\';_mastRe()">'+tab+'</button>';
    });
    h+='</div>';
    h+='<div class="mast-emoji-grid">';
    const mEmojis=[...MAST_EMOJI_PAL[mastCurrEmojiTab]||""];
    mEmojis.forEach(e=>{
      h+='<button class="mast-emoji-btn" onclick="mastVisEditSet(\''+e+'\')">'+e+'</button>';
    });
    h+='</div>';
    h+='<div style="margin-top:10px;text-align:center">';
    h+='<input type="file" id="mast-vis-img-file" accept="image/*" style="display:none" onchange="mastVisEditUpload(this.files[0])">';
    h+='<button class="mast-img-btn" onclick="document.getElementById(\'mast-vis-img-file\').click()">\u{1F4F7} Upload Photo Instead</button>';
    h+='</div>';
    h+='</div></div>';
  }

  return h;
}

function renderMastery(el){
  try{ _renderMasteryInner(el); }catch(e){ console.error("Mastery render error:",e); el.innerHTML='<div style="padding:40px;text-align:center;color:#dc2626"><b>Mastery tab error</b><br><span style="font-size:11px;color:#666">'+e.message+'</span></div>'; }
}
function _renderMasteryInner(el){
  const kids=["lincoln","ellis","lucy","julian"];
  if(!kids.includes(masteryKid)) masteryKid=kids[0];

  let items=masteryData[masteryKid]||[];
  if(!Array.isArray(items)) items=Object.values(items);
  const color=MAST_KID_COL[masteryKid];
  const emoji=MAST_KID_EMOJI[masteryKid];

  let h='<div style="padding:12px 12px 80px">';

  // Kid filter + add button
  h+='<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;align-items:center">';
  kids.forEach(k=>{
    let kitems=masteryData[k]||[]; if(!Array.isArray(kitems)) kitems=Object.values(kitems);
    const active=k===masteryKid;
    h+='<button class="kid-btn'+(active?' active':'')+'" data-kid="'+k+'" onclick="mastSetKid(\''+k+'\')" style="'+(active?'background:'+MAST_KID_COL[k]+';color:#fff;border-color:transparent':'')+'">';
    h+=MAST_KID_EMOJI[k]+' '+SL_KLBL[k]+' <span style="opacity:0.6;font-size:10px">('+kitems.length+')</span></button>';
  });
  h+='<button onclick="mastOpenAdd()" style="width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:'+color+'">+</button>';
  h+='</div>';

  // View tabs: Drill / Scores / Heat Map
  h+='<div class="mast-view-tabs">';
  h+='<button class="mast-view-tab'+(mastView==="drill"?" active":"")+'" onclick="mastSetView(\'drill\')">Mastery</button>';
  h+='<button class="mast-view-tab'+(mastView==="sprint"?" active":"")+'" onclick="mastSetView(\'sprint\')">Sprint</button>';
  h+='<button class="mast-view-tab'+(mastView==="scores"?" active":"")+'" onclick="mastSetView(\'scores\')">Scores</button>';
  h+='<button class="mast-view-tab'+(mastView==="heatmap"?" active":"")+'" onclick="mastSetView(\'heatmap\')">Heat Map</button>';
  if(MAST_FLASH_KIDS.has(masteryKid)) h+='<button class="mast-view-tab'+(mastView==="admin"?" active":"")+'" onclick="mastSetView(\'admin\')">Admin</button>';
  h+='</div>';

  // ── ADMIN VIEW (Julian only) ──
  if(mastView==="admin"&&MAST_FLASH_KIDS.has(masteryKid)){
    if(!mastAdminPinOk){
      h+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center">';
      h+='<div style="font-size:48px;margin-bottom:12px">&#128274;</div>';
      h+='<div style="font-family:\'Fraunces\',serif;font-size:20px;font-weight:700;margin-bottom:4px">Admin Locked</div>';
      h+='<div style="font-size:13px;color:var(--muted);margin-bottom:16px">Enter the Mom PIN to access drill settings.</div>';
      h+='<input id="mast-admin-pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="off" ';
      h+='style="width:120px;text-align:center;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;letter-spacing:8px;font-family:\'DM Sans\',sans-serif" ';
      h+='oninput="mastAdminCheckPin(this.value)" autofocus>';
      h+='<div id="mast-admin-pin-err" style="font-size:11px;color:#b5394a;margin-top:6px;min-height:14px"></div></div>';
      h+='</div>';
      el.innerHTML=h;
      setTimeout(()=>{const i=document.getElementById("mast-admin-pin");if(i)i.focus();},50);
      return;
    }
    if(!mastAdminLocal) mastAdminInit();
    h+=renderMastAdmin();
    h+='</div>';
    el.innerHTML=h;
    return;
  }

  // ── SPRINT VIEW ──
  if(mastView==="sprint"){
    h+=buildSprintHtml();
    h+='</div>';
    el.innerHTML=h;
    return;
  }

  // ── SCORES VIEW ──
  if(mastView==="scores"){
    const hist=masteryData.history&&masteryData.history[masteryKid]?masteryData.history[masteryKid]:{};
    const entries=Object.values(hist).sort((a,b)=>b.date.localeCompare(a.date));

    // Add past score button + form
    if(mastManualScore){
      h+='<div class="mast-edit-card">';
      h+='<div class="mast-edit-hdr"><span class="mast-edit-title">\u{1F4DD} Add Past Score</span>';
      h+='<button class="mast-add-close" onclick="mastCloseManualScore()">\u{2715}</button></div>';
      h+='<div class="mast-edit-body">';

      h+='<div class="mast-edit-row"><span class="mast-edit-label">Date</span>';
      h+='<input type="date" value="'+mastManualDate+'" onchange="mastManualDate=this.value" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:\'DM Sans\',sans-serif;font-size:12px"></div>';

      h+='<div class="mast-edit-row"><span class="mast-edit-label">\u{2713} Correct</span>';
      h+='<div class="mast-edit-val"><button class="mast-edit-adj" onclick="mastManualAdj(\'c\',-1)">\u{2212}</button>';
      h+='<span class="mast-edit-num" style="color:#16a34a">'+mastManualC+'</span>';
      h+='<button class="mast-edit-adj" onclick="mastManualAdj(\'c\',1)">+</button></div></div>';

      h+='<div class="mast-edit-row"><span class="mast-edit-label">\u{2717} Miss</span>';
      h+='<div class="mast-edit-val"><button class="mast-edit-adj" onclick="mastManualAdj(\'m\',-1)">\u{2212}</button>';
      h+='<span class="mast-edit-num" style="color:#dc2626">'+mastManualM+'</span>';
      h+='<button class="mast-edit-adj" onclick="mastManualAdj(\'m\',1)">+</button></div></div>';

      h+='<div class="mast-edit-row"><span class="mast-edit-label">~ Close</span>';
      h+='<div class="mast-edit-val"><button class="mast-edit-adj" onclick="mastManualAdj(\'t\',-1)">\u{2212}</button>';
      h+='<span class="mast-edit-num" style="color:#d97706">'+mastManualT+'</span>';
      h+='<button class="mast-edit-adj" onclick="mastManualAdj(\'t\',1)">+</button></div></div>';

      h+='<div class="mast-edit-row"><span class="mast-edit-label">\u{1F441}\u{FE0F} Shown (Julian)</span>';
      h+='<div class="mast-edit-val"><button class="mast-edit-adj" onclick="mastManualAdj(\'s\',-1)">\u{2212}</button>';
      h+='<span class="mast-edit-num" style="color:#c2410c">'+mastManualS+'</span>';
      h+='<button class="mast-edit-adj" onclick="mastManualAdj(\'s\',1)">+</button></div></div>';

      const prevScored=mastManualC+mastManualM+mastManualT;
      const prevPct=prevScored?Math.round(mastManualC/prevScored*100):0;
      if(prevScored) h+='<div style="text-align:center;margin-top:8px;font-family:\'Fraunces\',serif;font-size:24px;font-weight:700;color:'+(prevPct>=80?"#16a34a":prevPct>=60?"#d97706":"#dc2626")+'">'+prevPct+'%</div>';

      h+='<button class="mast-edit-save" onclick="mastSaveManualScore()">Save Score</button>';
      h+='</div></div>';
    } else {
      h+='<div style="margin-bottom:14px"><button class="mast-log-btn" onclick="mastOpenManualScore()" style="width:100%;text-align:center;padding:10px">\u{2795} Add Past Score</button></div>';
    }

    if(!entries.length){
      h+='<div class="mast-none">No scores yet. Log a drill to see results here.</div>';
    } else {
      // Trend chart
      const chartData=entries.slice().reverse().slice(-14); // last 14 sessions
      if(chartData.length>=2){
        const w=360,ht=100,pad=20;
        const step=(w-2*pad)/Math.max(chartData.length-1,1);
        let pts="";let labels="";
        chartData.forEach((e,i)=>{
          const x=pad+i*step;
          const y=ht-pad-(e.pct/100)*(ht-2*pad);
          pts+=(i?'L':'M')+x+','+y+' ';
          if(i===0||i===chartData.length-1||i%3===0){
            const d=e.date.slice(5);
            labels+='<text x="'+x+'" y="'+(ht-2)+'" text-anchor="middle" font-size="7" fill="#9ca3af">'+d+'</text>';
          }
        });
        // Dots
        let dots="";
        chartData.forEach((e,i)=>{
          const x=pad+i*step;
          const y=ht-pad-(e.pct/100)*(ht-2*pad);
          const col=e.pct>=80?"#16a34a":e.pct>=60?"#d97706":"#dc2626";
          dots+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+col+'" stroke="white" stroke-width="1.5"/>';
        });
        h+='<div class="mast-chart"><div class="mast-chart-title">Score Trend</div>';
        h+='<svg class="mast-chart-svg" viewBox="0 0 '+w+' '+ht+'">';
        h+='<line x1="'+pad+'" y1="'+(ht-pad)+'" x2="'+(w-pad)+'" y2="'+(ht-pad)+'" stroke="#e5e7eb" stroke-width="1"/>';
        h+='<line x1="'+pad+'" y1="'+pad+'" x2="'+(w-pad)+'" y2="'+pad+'" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="3"/>';
        h+='<text x="'+(pad-4)+'" y="'+(pad+3)+'" text-anchor="end" font-size="7" fill="#9ca3af">100%</text>';
        h+='<text x="'+(pad-4)+'" y="'+(ht-pad+3)+'" text-anchor="end" font-size="7" fill="#9ca3af">0%</text>';
        h+='<path d="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        h+=dots+labels;
        h+='</svg></div>';
      }

      // Daily score cards
      entries.forEach(e=>{
        const pctCol=e.pct>=80?"#16a34a":e.pct>=60?"#d97706":"#dc2626";
        const dateObj=new Date(e.date+"T12:00:00");
        const dayN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dateObj.getDay()];
        const monN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dateObj.getMonth()];
        const dateLbl=dayN+", "+monN+" "+dateObj.getDate();

        h+='<div class="mast-score-card">';
        h+='<div style="display:flex;align-items:center;justify-content:space-between">';
        h+='<div><div class="mast-score-date">'+dateLbl+' \u{00B7} Print #'+e.printNum+'</div>';
        h+='<div class="mast-score-pct" style="color:'+pctCol+'">'+e.pct+'%</div></div>';
        h+='<div style="text-align:right"><div style="font-size:10px;color:var(--muted)">'+e.scored+' scored'+(e.shown?' + '+e.shown+' shown':'')+'</div>';
        h+='<div style="font-size:10px;color:var(--muted)">of '+e.total+' due</div>';
        const dateKey=e.date.replace(/-/g,"");
        h+='<button onclick="event.stopPropagation();mastDeleteScore(\''+dateKey+'\')" style="margin-top:4px;font-size:9px;color:#991b1b;background:none;border:none;cursor:pointer;font-weight:600;font-family:\'DM Sans\',sans-serif">\u{1F5D1}\u{FE0F} Delete</button>';
        h+='</div></div>';

        h+='<div class="mast-score-breakdown">';
        if(e.correct) h+='<span class="sc-c">\u{2713} '+e.correct+'</span>';
        if(e.miss) h+='<span class="sc-m">\u{2717} '+e.miss+'</span>';
        if(e.close) h+='<span class="sc-t">~ '+e.close+'</span>';
        if(e.shown) h+='<span class="sc-s">\u{1F441}\u{FE0F} '+e.shown+'</span>';
        h+='</div>';

        // Expandable item list
        if(e.items&&e.items.length){
          h+='<div style="margin-top:8px;border-top:1px solid #f3f1ee;padding-top:6px">';
          e.items.forEach(it=>{
            const rc=it.result==="c"?"r-c":it.result==="m"?"r-m":it.result==="~"?"r-t":"r-shown";
            const rl=it.result==="c"?"\u{2713}":it.result==="m"?"\u{2717}":it.result==="~"?"~":"\u{1F441}\u{FE0F}";
            h+='<div class="mast-hist-item" onclick="mastShowItemHist(\''+it.id+'\')">';
            h+='<span class="mast-hist-prompt">'+it.prompt+'</span>';
            h+='<span class="mast-hist-result '+rc+'">'+rl+'</span></div>';

            // Per-item history
            if(mastScoreItemId===it.id){
              const allHist=entries.flatMap(en=>(en.items||[]).filter(x=>x.id===it.id).map(x=>({date:en.date,result:x.result})));
              h+='<div class="mast-item-hist-card">';
              h+='<div class="mast-item-hist-hdr"><span style="font-weight:700;font-size:13px">'+it.prompt+'</span>';
              h+='<span style="font-size:10px;color:var(--muted)">'+allHist.length+' session(s)</span></div>';
              allHist.forEach(ah=>{
                const arc=ah.result==="c"?"r-c":ah.result==="m"?"r-m":ah.result==="~"?"r-t":"r-shown";
                const arl=ah.result==="c"?"\u{2713}":ah.result==="m"?"\u{2717}":ah.result==="~"?"~":"\u{1F441}\u{FE0F}";
                h+='<div class="mast-item-hist-row"><span class="mast-item-hist-date">'+ah.date+'</span>';
                h+='<span class="mast-hist-result '+arc+'">'+arl+'</span></div>';
              });
              h+='</div>';
            }
          });
          h+='</div>';
        }
        h+='</div>';
      });
    }

    h+='</div>';
    el.innerHTML=h;
    return;
  }

  // ── HEAT MAP VIEW ──
  if(mastView==="heatmap"){
    const allKids=["lincoln","ellis","lucy","julian"];

    // Legend
    h+='<div class="mast-hm-legend">';
    h+='<span><span class="mast-hm-legend-dot" style="background:#dc2626"></span>Daily</span>';
    h+='<span><span class="mast-hm-legend-dot" style="background:#ea580c"></span>EOD</span>';
    h+='<span><span class="mast-hm-legend-dot" style="background:#ca8a04"></span>Weekly</span>';
    h+='<span><span class="mast-hm-legend-dot" style="background:#65a30d"></span>Bi-Wk</span>';
    h+='<span><span class="mast-hm-legend-dot" style="background:#0d9488"></span>Monthly</span>';
    h+='<span><span class="mast-hm-legend-dot" style="background:#7c3aed"></span>Graduated</span>';
    h+='</div>';

    h+='<div class="mast-hm-all-kids">';
    allKids.forEach(kid=>{
      let kitems=masteryData[kid]||[];
      if(!Array.isArray(kitems)) kitems=Object.values(kitems);
      if(!kitems.length) return;

      const km=MAST_KID_COL[kid];
      h+='<div>';
      h+='<div style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700;color:'+km+';margin-bottom:8px">'+MAST_KID_EMOJI[kid]+' '+SL_KLBL[kid]+' <span style="font-size:11px;color:var(--muted);font-weight:500">('+kitems.length+' items)</span></div>';

      // Group by subject
      const bySubj={};
      kitems.forEach(i=>{const s=i.subject||"Other";if(!bySubj[s])bySubj[s]=[];bySubj[s].push(i);});

      h+='<div class="mast-hm-grid">';
      Object.entries(bySubj).forEach(([subj,sitems])=>{
        const total=sitems.length;
        // Count per tier
        const tc={daily:0,every_other_day:0,every_third_day:0,weekly:0,bi_weekly:0,monthly:0,learned:0,graduated:0};
        let introCount=0;
        sitems.forEach(i=>{
          if(i.status==="introduction") introCount++;
          const t=i.tier||"daily";
          tc[t]=(tc[t]||0)+1;
        });

        // Health score: items at higher tiers = healthier
        const weights={daily:0,every_other_day:1,every_third_day:1.5,weekly:2,bi_weekly:3,monthly:4,learned:5,graduated:5};
        const maxScore=total*5;
        const score=sitems.reduce((s,i)=>s+(weights[i.tier||"daily"]||0),0);
        const health=maxScore?score/maxScore:0;
        const barCol=health>=0.5?"#16a34a":health>=0.25?"#d97706":"#dc2626";
        const healthLbl=health>=0.5?"Climbing":health>=0.25?"Mixed":"Needs Work";

        h+='<div class="mast-hm-card">';
        h+='<div class="mast-hm-card-bar" style="background:'+barCol+'"></div>';
        h+='<div class="mast-hm-subj">'+subj+'</div>';
        h+='<div style="display:flex;align-items:baseline;gap:6px">';
        h+='<div class="mast-hm-count" style="color:'+barCol+'">'+total+'</div>';
        h+='<div class="mast-hm-label">'+healthLbl+'</div></div>';

  const pParent=document.getElementById("mast-chk-parent")?.checked;
  if(!pStudent&&!pParent){alert("Check at least one sheet");return;}

  const pn=mastGetPrintNum();
  const due=mastDueItems(masteryKid,pn);
  const dueW=due.filter(i=>i.review_mode==="written");
  const color=MAST_KID_COL[masteryKid];
  const label=SL_KLBL[masteryKid];
  const emoji=MAST_KID_EMOJI[masteryKid];
  const today=new Date();
  const dayN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()];
  const monN=["January","February","March","April","May","June","July","August","September","October","November","December"][today.getMonth()];
  const dateStr=monN+" "+today.getDate()+", "+today.getFullYear();
  const wkLabel=(weekData.week||WK).replace("week","Week ");

  let pages="";

  // Student sheet
  if(pStudent&&dueW.length){
    const twoCol=dueW.length>10;
    let rows="";
    if(twoCol){
      const half=Math.ceil(dueW.length/2);
      for(let i=0;i<half;i++){
        const li=i+1,ri=i+half+1;
        const right=ri<=dueW.length?'<td class="gap"></td><td class="num">'+ri+'.</td><td class="blank"></td>':'<td colspan="3"></td>';
        rows+='<tr><td class="num">'+li+'.</td><td class="blank"></td>'+right+'</tr>';
      }

// ── DISPLACEMENT ENGINE ──────────────────────────────────────────
let displacedResult=null; // {tasks:[], carryOver:[]}
function getActiveTasks(){ return displacedResult?displacedResult.tasks:weekData.tasks; }

function taskDevice(t){
  const d=(t.detail||"").toLowerCase();
  if(d.includes("computer")) return "computer";
  if(d.includes("ipad")) return "ipad";
  if(d.includes("phone")) return "phone";
  return "paper";
}
function taskSubject(t){
  const m=(t.title||"").match(/^.{1,2}\s*(.+?)\s*[—–]/);
  return m?m[1].trim():(t.title||"").replace(/^.{1,2}\s*/,"");
}
function fromMin(m){
  let h=Math.floor(m/60), mn=m%60;
  const ap=h>=12?"PM":"AM";
  if(h===0) h=12; else if(h>12) h-=12;
  return h+":"+String(mn).padStart(2,"0")+" "+ap;
}
function taskTier(t){
  if(taskDevice(t)==="computer"||taskDevice(t)==="ipad"||taskDevice(t)==="phone") return "computer";
  if(t.mom==="required") return "required";
  if(t.mom==="maybe") return "maybe";
  return "independent";
}

function runDisplacement(){
  const bos=Object.values(blockouts);
  if(!bos.length||!weekData.tasks.length){ displacedResult=null; return; }
  const r=rulesData||{};
  const sd=r.schoolDay||{};
  const sdOv=sd.overrides||{};
  const mp=r.maxPerDay||{};
  const dayOrder=["monday","tuesday","wednesday","thursday","friday","saturday"];
  const tasks=JSON.parse(JSON.stringify(weekData.tasks));
  const carryOver=[];

  const displacedIds=new Set();
  bos.forEach(function(bo){
    var kids=bo.kids||[];
    tasks.forEach(function(t){
      if(t.day!==bo.day||kids.indexOf(t.who)<0) return;
      if(bo.type==="fullDay"){ displacedIds.add(t.id); return; }
      var tMin=toMin(t.time), bS=toMin(bo.start||""), bE=toMin(bo.end||"");
      if(bS&&bE&&tMin>=bS&&tMin<bE) displacedIds.add(t.id);
    });
  });
  if(!displacedIds.size){ displacedResult=null; return; }

  var displacedTasks=tasks.filter(function(t){return displacedIds.has(t.id);});
  var keptTasks=tasks.filter(function(t){return !displacedIds.has(t.id);});
  var working=keptTasks.slice();

  function maxFor(subj){return(mp[subj]&&mp[subj].max!=null)?mp[subj].max:999;}
  function canPlace(t,d){
    var blocked=false;
    bos.forEach(function(bo){if(bo.day===d&&bo.type==="fullDay"&&(bo.kids||[]).indexOf(t.who)>=0)blocked=true;});
    if(blocked)return false;
    var subj=taskSubject(t),mx=maxFor(subj);
    if(mx<999){var ct=0;working.forEach(function(w){if(w.day===d&&taskSubject(w)===subj&&w.who===t.who)ct++;});if(ct>=mx)return false;}
    var bab=null;bos.forEach(function(bo){if(bo.day===d&&bo.type==="babysitter")bab=bo;});
    if(bab&&(bab.kids||[]).indexOf(t.who)>=0){if(t.mom==="required")return false;var _ws=(weekData.babysitter&&weekData.babysitter.withSitter)||(rulesData&&rulesData.withSitter)||[];if(_ws.indexOf(t.who)>=0)return false;}
    return true;
  }
  function _dayStart(d){var ov=sdOv[d];return toMin((ov&&ov.start)||sd.defaultStart||"10:00 AM");}
  function _dayEnd(d){var ov=sdOv[d];return toMin((ov&&ov.end)||sd.defaultEnd||"4:15 PM");}
  function _dayLS(d){var ov=sdOv[d];return toMin((ov&&ov.lunchStart)||sd.lunchStart||"1:00 PM");}
  function _dayLE(d){var ov=sdOv[d];return toMin((ov&&ov.lunchEnd)||sd.lunchEnd||"2:00 PM");}

  displacedTasks.sort(function(a,b){return toMin(a.time)-toMin(b.time);});

  displacedTasks.forEach(function(dt){
    var origIdx=dayOrder.indexOf(dt.day);
    var placed=false;
    for(var di=origIdx+1;di<dayOrder.length&&!placed;di++){
      if(canPlace(dt,dayOrder[di])){
        dt._displaced=true;dt._originalDay=dt.day;dt.day=dayOrder[di];
        working.push(dt);placed=true;
      }
    }
    if(!placed){
      for(var di2=origIdx-1;di2>=0&&!placed;di2--){
        if(canPlace(dt,dayOrder[di2])){
          dt._displaced=true;dt._originalDay=dt.day;dt.day=dayOrder[di2];
          working.push(dt);placed=true;
        }
      }
    }
    if(!placed){dt._displaced=true;dt._originalDay=dt.day;dt._carryOver=true;carryOver.push(dt);}
  });

  // Re-time receiving days
  var touchedDays=new Set(working.filter(function(t){return t._displaced;}).map(function(t){return t.day;}));
  touchedDays.forEach(function(d){
    var dStart=_dayStart(d);
    var dEnd=_dayEnd(d);
    var dLunchS=_dayLS(d);
    var dLunchE=_dayLE(d);

    // Get all tasks on this day, sorted by: original tasks first (by time), then displaced
    const dayTasks=working.filter(t=>t.day===d);
    dayTasks.sort((a,b)=>{
      // Originals keep their time, displaced go after
      if(!a._displaced&&!b._displaced) return toMin(a.time)-toMin(b.time);
      if(!a._displaced) return -1;
      if(!b._displaced) return 1;
      // Both displaced: sort by original time
      return toMin(a.time)-toMin(b.time);
    });

    // Assign times to displaced tasks only (keep originals at their times)
    let cursor=dStart;
    // Find the latest original task end time
    const originals=dayTasks.filter(t=>!t._displaced);
    if(originals.length){
      const lastOrig=Math.max(...originals.map(t=>toMin(t.time)))+20;
      cursor=Math.max(cursor,lastOrig);
    }

    dayTasks.filter(t=>t._displaced).forEach(dt=>{
      // Skip lunch
      if(cursor>=dLunchS&&cursor<dLunchE) cursor=dLunchE;
      // Skip past school end
      if(cursor>=dEnd){
        dt._carryOver=true;
        carryOver.push(dt);
        const idx=working.indexOf(dt);
        if(idx>=0) working.splice(idx,1);
        return;
      }
      dt.time=fromMin(cursor);
      cursor+=20; // 20 min per task
    });
  });

  displacedResult={tasks:working,carryOver};
}

function createBlockout(){
  if(!db) return;
  const f=boForm;
  if(f.kids.length===0){ alert("Select at least one kid."); return; }
  if((f.type==="timed"||f.type==="babysitter")&&(!f.start||!f.end)){ alert("Set start and end times."); return; }
  if(f.type==="babysitter"&&!f.momReturn){ alert("Set mom return time."); return; }
  const id="bo_"+Date.now();
  const bo={day:f.day,type:f.type,kids:f.kids,created:Date.now()};
  if(f.type==="timed"){ bo.start=to12h(f.start); bo.end=to12h(f.end); }
  if(f.type==="babysitter"){ bo.start=to12h(f.start); bo.end=to12h(f.end); bo.momReturn=to12h(f.momReturn); }
  db.ref(WK+"/blockouts/"+id).set(bo);
  closeBoDialog();
}
function removeBlockout(id){
  if(!db) return;
  db.ref(WK+"/blockouts/"+id).remove();
}
function removeConstraint(day){
  if(!db||!adminPinUnlocked) return;
  // Remove constraint and revert window to default for this day
  delete CONSTRAINT[day];
  if(WIN[day]) delete WIN[day];
  // Patch Firebase meta — null removes the child key
  const patch={};
  patch["constraints/"+day]=null;
  patch["windows/"+day]=null;
  db.ref(WK+"/meta").update(patch);
  // Re-sort unchecked tasks for this day using normal school-day timing
  resortDayTasks(day);
  renderAll();
}
function resortDayTasks(day,startOverride,momOverride){
  if(!weekData||!weekData.tasks) return;
  const r=rulesData||{};
  const sd=r.schoolDay||{};
  const sdOv=(sd.overrides||{})[day]||{};
  const schoolStart=startOverride!=null?startOverride:toMin(sdOv.start||sd.defaultStart||"10:00 AM");
  const momAvail=momOverride!=null?momOverride:schoolStart;
  const schoolEnd=toMin(sdOv.end||sd.defaultEnd||"4:15 PM");
  // Get ALL tasks for this day (checked or not) — re-sort the whole day
  const dayTasks=weekData.tasks.filter(t=>t.day===day&&!t.id.endsWith("_c"));
  if(!dayTasks.length) return;
  // Sort by current time to preserve relative order
  dayTasks.sort((a,b)=>toMin(a.time)-toMin(b.time));
  // Build per-resource cursors — mom may be available later (e.g. babysitter window)
  const cur={comp:schoolStart,ipad:schoolStart,ipadLucy:schoolStart,mom:momAvail};
  const kidCur={};
  // Place every task through the scheduler
  let changed=false;
  dayTasks.forEach(t=>{
    const dur=t.dur||20;
    const det=t.detail||"";
    const isComp=det.includes("Computer.");
    const isIpad=det.includes("Ipad.");
    const reqMom=t.mom==="required";
    // Earliest start: max of kid cursor, device cursor, mom cursor
    let s=kidCur[t.who]||schoolStart;
    if(isComp) s=Math.max(s,cur.comp);
    if(isIpad) s=Math.max(s,t.who==="lucy"?cur.ipadLucy:cur.ipad);
    if(reqMom) s=Math.max(s,cur.mom);
    // Skip lunch
    s=gwSkipLunch(s,dur);
    if(s+dur>schoolEnd) s=schoolEnd-dur; // clamp
    const newTime=fromMin(s);
    if(newTime!==t.time){ t.time=newTime; changed=true; }
    // Advance cursors
    const end=s+dur;
    kidCur[t.who]=end;
    if(isComp) cur.comp=end;
    if(isIpad){ if(t.who==="lucy") cur.ipadLucy=end; else cur.ipad=end; }
    if(reqMom) cur.mom=end;
  });
  if(!changed) return;
  sv(WK+"_tasks",weekData.tasks);
  lastTasksWrite=Date.now();
  const obj={};weekData.tasks.forEach(t=>obj[t.id]=t);
  db.ref(WK+"/tasks").set(obj);
}
function getDayBlockouts(d){
  const out=[];
  Object.entries(blockouts).forEach(([id,bo])=>{
    if(bo.day===d) out.push({id,...bo});
  });
  return out;
}
function coAddToSaturday(taskId){
  // Find the carry-over task and manually add it to Saturday in the working list
  if(!displacedResult) return;
  const t=displacedResult.carryOver.find(c=>c.id===taskId);
  if(!t) return;
  // Remove from carry-over, add to tasks on Saturday
  displacedResult.carryOver=displacedResult.carryOver.filter(c=>c.id!==taskId);
  t._carryOver=false;
  t.day="saturday";
  t.time=fromMin(toMin("10:00 AM")+displacedResult.tasks.filter(w=>w.day==="saturday"&&w._displaced).length*20);
  displacedResult.tasks.push(t);
  renderAll();
}
function coSkipTask(taskId){
  if(!coExclusions[WK]) coExclusions[WK]={};
  coExclusions[WK][taskId]=true;
  try{localStorage.setItem("ha_co_excl",JSON.stringify(coExclusions));}catch(e){}
  renderAll();
}
function coUnskipTask(taskId){
  if(coExclusions[WK]) delete coExclusions[WK][taskId];
  try{localStorage.setItem("ha_co_excl",JSON.stringify(coExclusions));}catch(e){}
  renderAll();
}

function renderBlockoutBanners(d){
  const bos=getDayBlockouts(d);
  if(!bos.length) return "";
  let h="";
  bos.forEach(bo=>{
    const typeLbl={fullDay:"Full Day Block",timed:"Timed Block",babysitter:SITTER_NAME}[bo.type]||bo.type;
    const typeCol={fullDay:"#ef4444",timed:"#f59e0b",babysitter:"#3b82f6"}[bo.type]||"#666";
    const kids=(bo.kids||[]).map(k=>cap(k)).join(", ");
    let detail="";
    if(bo.type==="timed") detail=(bo.start||"")+" – "+(bo.end||"");
    if(bo.type==="babysitter") detail=(bo.start||"")+" – "+(bo.end||"")+" · Mom returns "+(bo.momReturn||"");
    if(bo.type==="fullDay") detail="All tasks blocked for the day";
    h+='<div class="bo-banner '+bo.type+'">';
    h+='<div class="bo-banner-body">';
    h+='<div class="bo-banner-type" style="color:'+typeCol+'">'+typeLbl+'</div>';
    h+='<div class="bo-banner-detail">'+detail+'</div>';
    h+='<div class="bo-banner-kids">'+kids+'</div>';
    h+='</div>';
    h+='<button class="bo-banner-rm" onclick="removeBlockout(\''+bo.id+'\')">Remove</button>';
    h+='</div>';
  });
  return h;
}

function saveRules(r){
  if(!db) return;
  db.ref("config/rules").set(r);
  rulesData=r;
  const t=document.createElement("div");t.className="rules-save-toast";t.textContent="Saved";
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),500);},1200);
}

function rulesToggleCard(id){
  rulesOpen[id]=!rulesOpen[id];
  renderAll();
}
function rulesUpdateSitterName(val){
  SITTER_NAME=val.trim()||"Babysitter";
  sv("ha_sitter_name",SITTER_NAME);
  if(db) db.ref("settings/sitterName").set(SITTER_NAME);
  renderAll();
}
function rulesToggleWithSitter(kid){
  const r=JSON.parse(JSON.stringify(rulesData||{}));
  if(!r.withSitter) r.withSitter=[];
  const i=r.withSitter.indexOf(kid);
  if(i>=0) r.withSitter.splice(i,1); else r.withSitter.push(kid);
  saveRules(r);
  renderAll();
}

function rulesUpdateTime(field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.schoolDay) r.schoolDay={};
  r.schoolDay[field]=to12h(val);
  saveRules(r);
}
function rulesUpdateDayOverride(day,field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.schoolDay) r.schoolDay={};
  if(!r.schoolDay.overrides) r.schoolDay.overrides={};
  if(!r.schoolDay.overrides[day]) r.schoolDay.overrides[day]={};
  if(val==="") delete r.schoolDay.overrides[day][field];
  else r.schoolDay.overrides[day][field]=to12h(val);
  if(Object.keys(r.schoolDay.overrides[day]).length===0) delete r.schoolDay.overrides[day];
  if(r.schoolDay.overrides&&Object.keys(r.schoolDay.overrides).length===0) delete r.schoolDay.overrides;
  saveRules(r);
}
function rulesRemoveDayOverride(day){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(r.schoolDay&&r.schoolDay.overrides&&r.schoolDay.overrides[day]){
    delete r.schoolDay.overrides[day];
    if(Object.keys(r.schoolDay.overrides).length===0) delete r.schoolDay.overrides;
    saveRules(r);
  }
}

function rulesSwapWf(kid,mode,i,dir){
  const r=JSON.parse(JSON.stringify(rulesData));
  const arr=fbArr(r.workflow[kid][mode]);
  const j=i+dir;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  r.workflow[kid][mode]=arr;
  saveRules(r);
}

function rulesUpdateMax(subj,field,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.maxPerDay) r.maxPerDay={};
  if(!r.maxPerDay[subj]) r.maxPerDay[subj]={};
  if(field==="max") r.maxPerDay[subj].max=val===""?null:parseInt(val);
  else r.maxPerDay[subj][field]=!r.maxPerDay[subj][field];
  saveRules(r);
}

function rulesToggleOverlap(listKey,idx){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.overlap) r.overlap={};
  const arr=fbArr(r.overlap[listKey])||[];
  arr.splice(idx,1);
  r.overlap[listKey]=arr;
  saveRules(r);
}

function rulesToggleDropOff(subj,field){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.nothingDropsOff) r.nothingDropsOff={enabled:true,exception:{}};
  if(!r.nothingDropsOff.exception) r.nothingDropsOff.exception={};
  if(!r.nothingDropsOff.exception[subj]) r.nothingDropsOff.exception[subj]={};
  r.nothingDropsOff.exception[subj][field]=!r.nothingDropsOff.exception[subj][field];
  saveRules(r);
}

function rulesUpdateDeviceQueue(device,val){
  const r=JSON.parse(JSON.stringify(rulesData));
  if(!r.devices) r.devices={};
  if(!r.devices.queue) r.devices.queue={};
  r.devices.queue[device]=val;
  saveRules(r);
}

function slotCfgEnsure(kid){
  if(!slotConfig[kid]||!slotConfig[kid].length) slotConfig[kid]=JSON.parse(JSON.stringify(SLOT_DEFAULTS));
}
function slotCfgSet(kid,i,field,val){
  slotCfgEnsure(kid);
  slotConfig[kid][i][field]=val;
  slotCfgSave();
}
function slotCfgAddRow(kid){
  slotCfgEnsure(kid);
  slotConfig[kid].push({pts:0,weight:10,msg:"New tier"});
  slotCfgSave(); renderAll();
}
function slotCfgRemoveRow(kid){
  slotCfgEnsure(kid);
  slotConfig[kid].pop();
  slotCfgSave(); renderAll();
}
function slotCfgReset(kid){
  delete slotConfig[kid];
  slotCfgSave(); renderAll();
}
function slotCfgCopy(){
  slotCfgEnsure("lincoln");
  ["ellis","lucy","julian"].forEach(k=>{ slotConfig[k]=JSON.parse(JSON.stringify(slotConfig["lincoln"])); });
  slotCfgSave(); renderAll();
  const m=document.getElementById("slot-cfg-msg"); if(m) m.textContent="Copied Lincoln's config to all kids.";
}
function slotCfgSave(){
  if(db) db.ref("config/slot_config").set(slotConfig);
}

  const el=document.getElementById("sp-gain");
  if(!el) return;
  if(a&&b){
    const gain=b-a, pct=a>0?Math.round((gain/a)*100):0;
    if(gain>0){el.textContent=`🎉 +${gain} words A→B (${pct}% gain) — decoding is clicking!`;el.style.color="#16a34a";}
    else if(gain===0){el.textContent="Consistent score — solid foundation, keep drilling.";el.style.color="#d97706";}
    else{el.textContent="B lower than A — normal early on. Keep going!";el.style.color="#78716c";}
  } else {

    el.style.color="#78716c";
  }
}

RULES: All words decodable with LOE Foundations A+B only. ${sheet==="B"?"Completely different word list from Sheet A.":"No repeated words."} Nonsense words marked with * in JSON only.
Respond ONLY with valid JSON, no markdown:
{"focusPhono":"${focusPhono}","focusSounds":"${focusSounds}","gridWords":["w1","w2"],"reviewWords":[],"nonsenseWords":[],"phrases":[],"sentences":[]}`;

  try{
    const apiKey=mastAIKey;
    const headers={"Content-Type":"application/json","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
    if(apiKey) headers["x-api-key"]=apiKey;
    const _fixJson=(s)=>{let t=s.trim().replace(/```json|```/g,"").trim();if(!t.endsWith("}"))t=t.substring(0,t.lastIndexOf("}")+1);return t;};
    const [resA,resB]=await Promise.all([
      fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:makePrompt("A")}]})}),
      fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:makePrompt("B")}]})})
    ]);
    const [dA,dB]=await Promise.all([resA.json(),resB.json()]);
    if(dA.error||dB.error){ const e=dA.error||dB.error; throw new Error((e.type||"error")+": "+(e.message||JSON.stringify(e))); }
    const pA=JSON.parse(_fixJson(dA.content[0].text));
    const pB=JSON.parse(_fixJson(dB.content[0].text));
    sprintRenderSheets(pA,pB,{sprintNum:_sprintNum,date,prevBest,cols,rows,ps,kidName});
  } catch(e){
    console.error("Sprint generate error:",e);
    sprintRenderSheets(sprintDemoA(focusPhono,focusSounds),sprintDemoB(focusPhono,focusSounds),{sprintNum:_sprintNum,date,prevBest,cols,rows,ps,kidName});
    const errMsg=mastAIKey?"⚠️ API call failed: "+e.message+" — showing demo content":"⚠️ No API key found in Firebase at config/anthropic_key — showing demo content";
    if(statusEl){statusEl.textContent=errMsg;statusEl.style.display="block";statusEl.style.background="#ede9fe";statusEl.style.color="#5b3a8c";}
  } finally{
    sprintGenerating=false;
    if(btn){btn.disabled=false;btn.textContent="✨ Generate A & B Sprint Sheets";}
  }
}

function sprintDemoA(pg,sounds){return{focusPhono:pg||"sh",focusSounds:sounds||"/sh/",gridWords:["ship","shop","shed","shell","fish","dish","wish","rush","flush","brush","shin","shack","shock","shred","shelf","mesh","fresh","clash"],reviewWords:["rain","play","see"],nonsenseWords:["shrop*","shelt*"],phrases:["the big ship","a red fish dish","rush to the shed","wish on a shell"],sentences:["The fish is in the dish on the shelf.","She will rush to the shop and grab the brush.","The ship can flash its bright light at the dock."]};}
function sprintDemoB(pg,sounds){return{focusPhono:pg||"sh",focusSounds:sounds||"/sh/",gridWords:["shim","shaft","shrub","shift","gush","lush","plush","slush","clash","flash","shrug","shrimp","crush","hush","blush","brash","shawl","smash"],reviewWords:["wait","stay","feet"],nonsenseWords:["shreb*","shoft*"],phrases:["the small shrub","a soft plush fish","gush from the shelf","flash in the shed"],sentences:["The brush fell with a crash on the ship deck.","She can crush the shells with a swift smash.","Flush the cloth and rush it to the shelf."]};}

function sprintRenderSheets(pA,pB,opts){
  const el=document.getElementById("sp-sheets");
  if(!el) return;
  const scoreRow=document.getElementById("sp-score-row");
  if(scoreRow) scoreRow.style.display="grid";
  document.getElementById("sp-score-a").value="";
  document.getElementById("sp-score-b").value="";
  document.getElementById("sp-gain").textContent="Enter scores above to see session gain";
  document.getElementById("sp-gain").style.color="#78716c";
  el.innerHTML=sprintBuildSheet(pA,"A",opts)+sprintBuildSheet(pB,"B",opts);
}

function sprintBuildSheet(parsed,sheet,{sprintNum,date,prevBest,cols,rows,ps,kidName}){
  const isA=sheet==="A";
  const col=isA?"#5b3a8c":"#1e3a5f";
  const bgLight=isA?"#faf5ff":"#eff6ff";
  const bdLight=isA?"#c4b5fd":"#93c5fd";
  const fwCol=isA?"#5b3a8c":"#1e3a5f";
  const kid=masteryKid;
  const emoji=MAST_KID_EMOJI[kid]||"🦄";
  const kidColor=MAST_KID_COL[kid]||col;

  const all=[];
  (parsed.gridWords||[]).forEach(w=>all.push({w,t:"focus"}));
  (parsed.reviewWords||[]).forEach(w=>all.push({w,t:"review"}));
  (parsed.nonsenseWords||[]).forEach(w=>all.push({w:w.replace("*",""),t:"nonsense"}));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  const needed=cols*rows;
  while(all.length<needed) all.push({w:"—",t:"focus"});
  const grid=all.slice(0,needed);

  const dateObj=new Date(date+"T12:00:00");
  const dateStr=dateObj.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  const target=prevBest?Math.ceil(prevBest*1.1):null;

  const esc=(s)=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const hl=(text)=>text.replace(new RegExp(`(\\w*${esc(parsed.focusPhono)}\\w*)`,"gi"),`<span style="color:${fwCol};font-weight:700">$1</span>`);

  let h=`<div style="background:#fff;border:2px solid ${bdLight};border-radius:14px;overflow:hidden;margin-bottom:18px">`;
  h+=`<div style="background:${kidColor};color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:900">${emoji} ${kidName}</div>
      <div style="font-size:10px;opacity:0.75;margin-top:1px">Phonics Sprint #${String(sprintNum).padStart(3,"0")} · ${dateStr}</div>
    </div>
    <div style="font-family:'Fraunces',serif;font-size:44px;font-weight:900;opacity:0.2;line-height:1">${sheet}</div>
  </div>`;
  h+=`<div style="padding:13px 15px">`;
  h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px">`;
  if(isA&&prevBest){
    h+=`<div style="border:1.5px solid #c4b5fd;border-radius:10px;padding:9px 12px;background:#faf5ff">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#78716c">🏆 Best</div>
      <div style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:#d97706">${prevBest}</div>
      ${target?`<div style="font-size:9px;color:#5b3a8c;font-weight:700">Target: ${target}+</div>`:""}
    </div>`;
  } else {
    h+=`<div style="border:1.5px solid ${bdLight};border-radius:10px;padding:9px 12px;background:${bgLight}">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#78716c">${isA?"🏆 Target":"Sheet A Score"}</div>
      <div style="height:2px;background:#e2ddd6;border-radius:1px;margin-top:8px"></div>
      <div style="font-size:9px;color:#78716c;margin-top:3px">words</div>
    </div>`;
  }
  h+=`<div style="border:1.5px solid ${bdLight};border-radius:10px;padding:9px 12px;background:${bgLight}">
    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#78716c">✏️ Sheet ${sheet} Score</div>
    <div style="height:2px;background:#e2ddd6;border-radius:1px;margin-top:8px"></div>
    <div style="font-size:9px;color:#78716c;margin-top:3px">words / 60s</div>
  </div></div>`;
  h+=`<div style="display:inline-flex;align-items:center;gap:6px;background:${bgLight};border-radius:8px;padding:5px 10px;margin-bottom:11px">
    <span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${col}">Focus</span>
    <span style="font-family:'DM Mono',monospace;font-size:15px;font-weight:700;color:${col}">${parsed.focusPhono}</span>
    <span style="font-size:11px;color:${col};opacity:0.65">${parsed.focusSounds||""}</span>
    <span style="font-size:9px;font-weight:700;color:${col};opacity:0.4;margin-left:2px">Sheet ${sheet}</span>
  </div>`;
  h+=`<div style="display:flex;gap:10px;margin-bottom:10px;font-size:9px;font-weight:700;flex-wrap:wrap">
    <span style="color:#1c1917">● Focus</span>
    <span style="color:#d97706">● Review</span>
    <span style="color:#9333ea">● Nonsense*</span>
  </div>`;
  h+=`<div style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#78716c;margin-bottom:7px">Word Grid — read across as fast as you can ▶</div>`;
  h+=`<div style="border:1px solid #f0ede8;border-radius:10px;overflow:hidden;margin-bottom:15px">`;
  for(let r=0;r<rows;r++){
    h+=`<div style="display:flex;border-bottom:${r<rows-1?"1px solid #f0ede8":"none"}">`;
    h+=`<div style="width:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;color:#c4b8ae;border-right:1px solid #f0ede8;background:#faf8f5">${r+1}</div>`;
    for(let c=0;c<cols;c++){
      const item=grid[r*cols+c]||{w:"—",t:"focus"};
      const wc=item.t==="review"?"#d97706":item.t==="nonsense"?"#9333ea":"#1c1917";
      const fw=item.t==="review"||item.t==="nonsense"?"700":"500";
      const fi=item.t==="nonsense"?"italic":"normal";
      h+=`<div style="flex:1;padding:8px 5px;font-family:'DM Mono',monospace;font-size:14px;font-weight:${fw};font-style:${fi};text-align:center;border-right:${c<cols-1?"1px solid #f0ede8":"none"};color:${wc}">${item.w}</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  const hasBonus=((ps==="both"||ps==="phrases")&&parsed.phrases&&parsed.phrases.length)||((ps==="both"||ps==="sentences")&&parsed.sentences&&parsed.sentences.length);
  if(ps!=="none"&&hasBonus){
    h+=`<div style="border:2px dashed #22c55e;border-radius:12px;padding:10px 12px 4px;margin-bottom:14px;position:relative">`;
    h+=`<div style="position:absolute;top:-11px;left:10px;background:#fff;padding:0 6px;font-size:10px;font-weight:800;color:#16a34a;letter-spacing:0.06em;text-transform:uppercase">📍 Bonus Zone — if you get here, you're flying!</div>`;
    if((ps==="both"||ps==="phrases")&&parsed.phrases&&parsed.phrases.length){
      h+=`<div style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#78716c;margin-top:6px;margin-bottom:6px">Phrases</div>`;
      parsed.phrases.forEach((ph,i)=>{
        h+=`<div style="padding:6px 0;border-bottom:1px solid #f5f2ee;font-size:13px;display:flex;gap:8px;align-items:baseline">
          <span style="font-family:'DM Mono',monospace;font-size:9px;color:#c4b8ae;flex-shrink:0;width:14px">${i+1}.</span>
          <span>${hl(ph)}</span>
        </div>`;
      });
    }
    if((ps==="both"||ps==="sentences")&&parsed.sentences&&parsed.sentences.length){
      h+=`<div style="font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#78716c;margin-top:10px;margin-bottom:6px">Sentences</div>`;
      parsed.sentences.forEach((s,i)=>{
        h+=`<div style="padding:8px 0;border-bottom:${i<parsed.sentences.length-1?"1px solid #f5f2ee":"none"};font-size:13px;line-height:1.6;display:flex;gap:8px;align-items:flex-start">
          <span style="font-family:'DM Mono',monospace;font-size:9px;color:#c4b8ae;flex-shrink:0;width:14px;margin-top:3px">${i+1}.</span>
          <span>${hl(s)}</span>
        </div>`;
      });
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  h+=`<div style="background:#faf8f5;border-top:1px solid #f0ede8;padding:8px 15px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:9px;color:#78716c;font-style:italic">Only racing yourself ${emoji} · Sheet ${sheet} of 2</div>
    <div style="font-family:'Fraunces',serif;font-size:10px;font-weight:700;color:#c4b8ae">Howe Academy</div>
  </div>`;
  h+=`</div>`;
  return h;
}
