<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="refresh" content="10"/>
<title>Howe Academy — Updating</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',sans-serif;background:#111827;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
h1{font-size:28px;margin-bottom:12px}
h1 span{color:#a5b4fc}
p{color:#9ca3af;font-size:16px;margin-bottom:24px}
.spinner{width:40px;height:40px;border:4px solid #374151;border-top-color:#a5b4fc;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>Howe <span>Academy</span></h1>
<p>Updating... this page will reload automatically.</p>
<div class="spinner"></div>
</body>
</html>
