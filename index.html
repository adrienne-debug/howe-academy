// Spin admin helper functions
function spinAdminRemovePending(taskId){
  claimPendingSpin(taskId);
  renderAll();
}
function spinAdminResetSpin(taskId,kid,d){
  // Remove from spins_used
  const used=ld(WK+"_spins_used")||{};
  delete used[taskId];
  sv(WK+"_spins_used",used); if(db) db.ref(WK+"/spins_used").set(used);
  // Remove from spin_results and subtract pts
  const sr=ld(WK+"_spin_results")||{};
  if(sr[taskId]){
    const pts=sr[taskId].pts||0;
    if(pts>0){
      const all=ld(WK+"_slot_points")||{};
      if(all[kid]&&all[kid][d]){ all[kid][d]=Math.max(0,all[kid][d]-pts); sv(WK+"_slot_points",all); if(db) db.ref(WK+"/slot_points").set(all); }
    }
    delete sr[taskId];
    sv(WK+"_spin_results",sr); if(db) db.ref(WK+"/spin_results").set(sr);
  }
  // Re-add as pending spin
  addPendingSpin(taskId, kid, d);
  renderAll();
}
function spinAdminAwardTask(taskId,kid,d){
  addPendingSpin(taskId, kid, d);
  renderAll();
}
function spinAdminAward(kid,d){
  const taskId="manual_"+kid+"_"+d+"_"+Date.now();
  addPendingSpin(taskId, kid, d);
  renderAll();
}
function spinAdminResetDayBonus(kid,d){
  const u=ld(WK+"_day_bonus_used")||{};
  delete u[kid+"_"+d];
  sv(WK+"_day_bonus_used",u);
  if(db) db.ref(WK+"/day_bonus_used").set(u);
  // Re-add as a bonus spin so it shows at the bottom
  const taskId="daybonus_"+kid+"_"+d+"_"+Date.now();
  addPendingSpin(taskId, kid, d);
  renderAll();
}
function spinAdminReplayCeleb(kid,d){
  const u=ld(WK+"_celeb_used")||{};
  delete u[kid+"_"+d];
  sv(WK+"_celeb_used",u);
  if(db) db.ref(WK+"/celeb_used").set(u);
  renderAll();
}
function kidReplayCeleb(kid){
  const u=ld(WK+"_celeb_used")||{};
  delete u[kid+"_"+day];
  sv(WK+"_celeb_used",u);
  if(db) db.ref(WK+"/celeb_used").set(u);
  celebrateDayComplete(kid);
  // Clear the flag again so the button stays visible for more replays
  setTimeout(()=>{
    const u2=ld(WK+"_celeb_used")||{};
    delete u2[kid+"_"+day];
    sv(WK+"_celeb_used",u2);
    if(db) db.ref(WK+"/celeb_used").set(u2);
  },100);
}
function spinAdminResetAll(kid,d){
  if(!confirm("Reset all spins & points for "+cap(kid)+" on "+cap(d)+"?")) return;
  // Reset day points
  const all=ld(WK+"_slot_points")||{};
  if(all[kid]) { all[kid][d]=0; sv(WK+"_slot_points",all); if(db) db.ref(WK+"/slot_points").set(all); }
  // Reset spins used for this kid's tasks on this day
  const used=ld(WK+"_spins_used")||{};
  const activeTasks=displacedResult?displacedResult.tasks:weekData.tasks;
  activeTasks.forEach(t=>{
    if(t.who===kid && (displacedResult?t.day:effectiveDay(t))===d) delete used[t.id];
  });
  sv(WK+"_spins_used",used); if(db) db.ref(WK+"/spins_used").set(used);
  // Reset spin results for this kid's tasks
  const sr=ld(WK+"_spin_results")||{};
  activeTasks.forEach(t=>{
    if(t.who===kid && (displacedResult?t.day:effectiveDay(t))===d) delete sr[t.id];
  });
  sv(WK+"_spin_results",sr); if(db) db.ref(WK+"/spin_results").set(sr);
  // Reset day bonus
  const db2=ld(WK+"_day_bonus_used")||{};
  delete db2[kid+"_"+d]; sv(WK+"_day_bonus_used",db2); if(db) db.ref(WK+"/day_bonus_used").set(db2);
  // Reset celebration
  const c=ld(WK+"_celeb_used")||{};
  delete c[kid+"_"+d]; sv(WK+"_celeb_used",c); if(db) db.ref(WK+"/celeb_used").set(c);
  // Remove pending spins for this kid+day
  for(const tid in pendingSpins){
    if(pendingSpins[tid].kid===kid && pendingSpins[tid].day===d) delete pendingSpins[tid];
  }
  sv(WK+"_pending_spins",pendingSpins); if(db) db.ref(WK+"/pending_spins").set(pendingSpins);
  renderAll();
}

// ── DAY COMPLETION CELEBRATION ────────────────────────────────────
let celebAudio=null;
let celebAnimId=null;
function hasCelebrated(kid,d){ const u=ld(WK+"_celeb_used")||{}; return !!u[kid+"_"+d]; }
function markCelebrated(kid,d){
  const u=ld(WK+"_celeb_used")||{}; u[kid+"_"+d]=true; sv(WK+"_celeb_used",u);
  if(db) db.ref(WK+"/celeb_used").set(u);
}

let celebSongName="";
function celebrateDayComplete(kid){
  const d=day;
  if(hasCelebrated(kid,d)) return;
  markCelebrated(kid,d);

  const overlay=document.getElementById("celeb-overlay");
  const canvas=document.getElementById("celeb-canvas");
  const titleEl=document.getElementById("celeb-title");
  const songEl=document.getElementById("celeb-song-name");

  titleEl.textContent=cap(kid)+" finished the day!";
  celebSongName="";

  // Pick and play a song — filtered to this kid's assigned songs
  const kidSongs=getSongsForKid(kid);
  if(kidSongs.length){
    const song=kidSongs[Math.floor(Math.random()*kidSongs.length)];
    celebSongName=song.name||"Celebration!";
    songEl.textContent=kidSongs.length>1?("🎲 "+celebSongName+" (surprise!)"):celebSongName;
    try{
      celebAudio=new Audio(song.url);
      celebAudio.volume=0.7;
      celebAudio.play().catch(()=>{});
      celebAudio.onended=()=>{ stopCelebMusic(); };
    }catch(e){}
  } else {
    songEl.textContent="Celebration time!";
  }

  // Confetti
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const ctx=canvas.getContext("2d");
  const colors=["#ef4444","#f59e0b","#22c55e","#3b82f6","#8b5cf6","#ec4899","#f97316","#06b6d4"];
  const pieces=[];
  for(let i=0;i<200;i++){
    pieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height*-1.5,
      w:Math.random()*8+4,
      h:Math.random()*6+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      vx:(Math.random()-0.5)*2.5,
      vy:Math.random()*2.5+1.2,
      rot:Math.random()*360,
      rv:(Math.random()-0.5)*6,
      phase:Math.random()*Math.PI*2
    });
  }
  let frame=0;
  function drawConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    frame++;
    let alive=false;
    pieces.forEach(p=>{
      p.x+=p.vx+Math.sin(frame*0.015+p.phase)*0.8;
      p.vy+=0.02;
      p.y+=p.vy;
      p.rot+=p.rv;
      if(p.y<canvas.height+20) alive=true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(alive){
      celebAnimId=requestAnimationFrame(drawConfetti);
    } else {
      dismissCelebOverlay(kid);
    }
  }
  celebAnimId=requestAnimationFrame(drawConfetti);
  overlay.classList.add("show");

  overlay.onclick=()=>dismissCelebOverlay(kid);
}

function dismissCelebOverlay(kid){
  const overlay=document.getElementById("celeb-overlay");
  if(!overlay.classList.contains("show")) return;
  overlay.classList.remove("show");
  overlay.onclick=null;

  // Let the CSS opacity transition (0.4s) finish before killing confetti
  setTimeout(()=>{
    if(celebAnimId){ cancelAnimationFrame(celebAnimId); celebAnimId=null; }
    const ctx=document.getElementById("celeb-canvas").getContext("2d");
    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  },450);

  // Show "now playing" bar if music is still going
  if(celebAudio && !celebAudio.paused){
    const np=document.getElementById("celeb-np");
    document.getElementById("celeb-np-song").textContent="🎵 "+(celebSongName||"Celebrating!");
    document.getElementById("celeb-np-kid").textContent=cap(kid||"")+" finished the day!";
    np.classList.add("show");
  }
}

function stopCelebMusic(){
  if(celebAudio){ celebAudio.pause(); celebAudio=null; }
  document.getElementById("celeb-np").classList.remove("show");
}

function closeCelebration(){
  dismissCelebOverlay();
  stopCelebMusic();
}

function celebSongUpload(input){
  const file=input.files&&input.files[0];
  if(!file) return;
  if(!file.type.match(/audio\/(mpeg|mp3)/)){
    alert("Please select an MP3 file."); input.value=""; return;
  }
  if(file.size>15*1024*1024){
    alert("File too large (max 15 MB)."); input.value=""; return;
  }
  const status=document.getElementById("celeb-upload-status");
  if(status) status.textContent="Uploading "+file.name+"…";
  const safeName=Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const ref=firebase.storage().ref("songs/"+safeName);
  const task=ref.put(file);
  task.on("state_changed",
    snap=>{
      const pct=Math.round((snap.bytesTransferred/snap.totalBytes)*100);
      if(status) status.textContent="Uploading… "+pct+"%";
    },
    err=>{
      if(status) status.textContent="Upload failed: "+err.message;
      input.value="";
    },
    ()=>{
      task.snapshot.ref.getDownloadURL().then(url=>{
        const name=file.name.replace(/\.[^.]+$/,"").replace(/^\d+[-_ ]+/,"");
        celebSongs.push({name:name,url:url});
        celebSongsSave();
        if(status) status.textContent="";
        input.value="";
        renderAll();
      });
    }
  );
}
function celebSongRemove(i){
  const song=celebSongs[i];
  if(song&&song.url&&song.url.includes("firebasestorage")){
    try{ firebase.storage().refFromURL(song.url).delete().catch(()=>{}); }catch(e){}
  }
  celebSongs.splice(i,1);
  celebSongsSave();
  renderAll();
}
function celebSongsSave(){
  if(db) db.ref("settings/celebration_songs").set(celebSongs);
  const msg=document.getElementById("celeb-cfg-msg");
  if(msg){ msg.textContent="Saved!"; setTimeout(()=>{if(msg)msg.textContent="";},1500); }
}
function celebSongToggleKid(songIdx,kid){
  if(!celebSongs[songIdx]) return;
  if(!celebSongs[songIdx].kids) celebSongs[songIdx].kids={};
  celebSongs[songIdx].kids[kid]=!celebSongs[songIdx].kids[kid];
  // If all are now off, clear kids obj so it defaults to "all kids"
  const anyOn=Object.values(celebSongs[songIdx].kids).some(v=>v);
  if(!anyOn) delete celebSongs[songIdx].kids;
  celebSongsSave();
  renderAll();
}
function celebSongPreview(songIdx){
  const s=celebSongs[songIdx];
  if(!s||!s.url) return;
  if(celebAudio){ celebAudio.pause(); celebAudio=null; }
  celebAudio=new Audio(s.url);
  celebAudio.volume=0.7;
  celebAudio.play().catch(()=>{});
  setTimeout(()=>{ if(celebAudio){ celebAudio.pause(); celebAudio=null; } },8000);
}
function getSongsForKid(kid){
  // Return songs assigned to this kid. If a song has no kids property, it's available to all.
  return celebSongs.filter(s=>{
    if(!s.kids) return true; // no kid filter = all kids
    return !!s.kids[kid];
  });
}

function tapTask(id){
  const t=weekData.tasks.find(x=>x.id===id); if(!t)return;
  const isDone=!!checked[id];
  const future=DAYS.indexOf(t.day)>DAYS.indexOf(day);
  pendingId=id;
  document.getElementById("dlg-title").textContent=t.title;
  document.getElementById("dlg-detail").textContent=isDone?"Completed: "+checked[id]:t.detail;
  const btn=document.getElementById("dlg-ok");
  const unBtn=document.getElementById("dlg-uncheck");
  if(isDone){ btn.style.display="none"; unBtn.style.display="block"; }
  else { btn.style.display="block"; btn.textContent=future?"Mark Done (Future Day)":"✓ Mark Done"; btn.style.background=future?"#f59e0b":"#16a34a"; unBtn.style.display="none"; }
  document.getElementById("dlg").style.display="flex";
}
document.getElementById("dlg-ok").onclick=()=>{
  if(!pendingId)return;
  const ts=nowTs();
  checked[pendingId]=ts; sv(WK+"_checked",checked);
  lastCheckedWrite=Date.now();
  dbg("write checked id="+pendingId+" n="+Object.keys(checked).length);
  if(db) db.ref(WK+"/checked").set(checked);
  const hist=ld(WK+"_history")||{};
  const t=weekData.tasks.find(x=>x.id===pendingId);
  if(t){
    const origDay=t.cascadedFrom||t.day;
    const origDateStr=DAY_DT[origDay];
    let daysLate=null;
    if(origDateStr){const yr=new Date().getFullYear();const od=new Date(origDateStr+", "+yr);const td=new Date();od.setHours(0,0,0,0);td.setHours(0,0,0,0);daysLate=Math.round((td-od)/864e5);}
    const entry={id:pendingId,title:t.title,who:t.who,day:t.day,originalDay:origDay,checkedOnDay:effectiveDay(t),daysLate:daysLate,ts,week:WK};
    hist[pendingId]=entry; histState[pendingId]=entry; sv(WK+"_history",hist); if(db) db.ref(WK+"/history/"+pendingId).set(entry);
  }
  const doneId=pendingId;
  closeDlg(); renderAll();
  showPaceToast(doneId);
};
document.getElementById("dlg-uncheck").onclick=()=>{
  if(!pendingId)return;
  manualUnchecks.add(pendingId);
  delete checked[pendingId]; sv(WK+"_checked",checked);
  lastCheckedWrite=Date.now();
  dbg("write uncheck id="+pendingId+" n="+Object.keys(checked).length);
  if(db) db.ref(WK+"/checked").set(checked);
  const hist=ld(WK+"_history")||{};
  delete hist[pendingId]; delete histState[pendingId]; sv(WK+"_history",hist);
  if(db) db.ref(WK+"/history/"+pendingId).remove();
  closeDlg(); schedCascade(); renderAll();
};
function closeDlg(){ document.getElementById("dlg").style.display="none"; pendingId=null; }

let mpActiveDay = null;
let mpChoreState = {};

function mpInit() {
  try {
    const saved = localStorage.getItem('mp_weekly_data');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.days) {
        MP_DATA.weekLabel = data.weekLabel || MP_DATA.weekLabel;
        MP_DATA.winOfTheDay = data.winOfTheDay || MP_DATA.winOfTheDay;
        MP_DATA.skylightTip = data.skylightTip || MP_DATA.skylightTip;
        MP_DATA.days = data.days;
        MP_DATA.allMeals = data.allMeals || MP_DATA.allMeals;
      }
    }
  } catch(e) {}
  try { const s=localStorage.getItem('mp_chore_state'); mpChoreState=s?JSON.parse(s):{}; } catch(e){}
  const todayDay = MP_DATA.days.find(d=>d.isToday);
  mpActiveDay = todayDay ? todayDay.id : MP_DATA.days[0].id;
}

function renderMomsPlan(el) {
  if (!mpActiveDay) mpInit();
  const d = MP_DATA.days.find(x=>x.id===mpActiveDay) || MP_DATA.days[0];
  const cs = mpChoreState[d.id] || {};
  const doneCount = d.chores.filter((_,i)=>cs[i]).length;
  const pct = d.chores.length ? Math.round(doneCount/d.chores.length*100) : 0;

  const tagColors = {
    laundry:'background:#E8F0F8;color:#2C5F8A',
    meal:'background:#FDF0E8;color:#E07B39',

  const dayStrip = MP_DATA.days.map(x=>`
    <button onclick="mpSelectDay('${x.id}')" style="

function mpSelectDay(id) {
  mpActiveDay = id;
  const el = document.getElementById('content');
  renderMomsPlan(el);
}

function mpToggleChore(dayId, index) {
  if (!mpChoreState[dayId]) mpChoreState[dayId] = {};
  mpChoreState[dayId][index] = !mpChoreState[dayId][index];
  try { localStorage.setItem('mp_chore_state', JSON.stringify(mpChoreState)); } catch(e) {}
  if(db) db.ref("mp_chore_state").set(mpChoreState);
  const el = document.getElementById('content');
  renderMomsPlan(el);
  const day = MP_DATA.days.find(d=>d.id===dayId);
  const total = day.chores.length;
  const done = Object.values(mpChoreState[dayId]).filter(Boolean).length;
  if (done === total && total > 0) {
    const msg = document.createElement('div');
    msg.textContent = '🎉 All tasks done — you crushed it!';
    Object.assign(msg.style, {
      position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',
      background:'#2B7A78',color:'#fff',padding:'8px 18px',borderRadius:'20px',
      fontFamily:"'DM Sans',sans-serif",fontSize:'12px',fontWeight:'700',
      zIndex:'9999',whiteSpace:'nowrap',opacity:'1',transition:'opacity 0.5s'
    });
    document.body.appendChild(msg);
    setTimeout(()=>{ msg.style.opacity='0'; setTimeout(()=>msg.remove(),500); }, 2500);
  }
}

function mpHandleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.days || !Array.isArray(data.days)) throw new Error('Invalid schema — missing days array');
      MP_DATA.weekLabel = data.weekLabel || MP_DATA.weekLabel;
      MP_DATA.winOfTheDay = data.winOfTheDay || MP_DATA.winOfTheDay;
      MP_DATA.skylightTip = data.skylightTip || MP_DATA.skylightTip;
      MP_DATA.days = data.days;
      MP_DATA.allMeals = data.allMeals || MP_DATA.allMeals;
      mpChoreState = {};
      try { localStorage.setItem('mp_weekly_data', JSON.stringify(data)); } catch(err) {}
      try { localStorage.removeItem('mp_chore_state'); } catch(err) {}
      // Sync Mom's Plan to Firebase so all devices stay current
      if(db){ db.ref("mp_data").set(data); db.ref("mp_chore_state").set({}); }
      const todayDay = MP_DATA.days.find(d => d.isToday);
      mpActiveDay = todayDay ? todayDay.id : MP_DATA.days[0].id;
      const el = document.getElementById('content');
      renderMomsPlan(el);
      const msg = document.createElement('div');
      msg.textContent = '✅ New week plan loaded!';
      Object.assign(msg.style, {
        position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',
        background:'#2B7A78',color:'#fff',padding:'8px 18px',borderRadius:'20px',
        fontFamily:"'DM Sans',sans-serif",fontSize:'12px',fontWeight:'700',
        zIndex:'9999',whiteSpace:'nowrap',opacity:'1',transition:'opacity 0.5s'
      });
      document.body.appendChild(msg);
      setTimeout(()=>{ msg.style.opacity='0'; setTimeout(()=>msg.remove(),500); }, 2500);
    } catch(err) {
      alert('❌ Invalid JSON — ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

const HIST_KCOL_LIGHT={lincoln:"#93c5fd",ellis:"#86efac",lucy:"#c4b5fd",julian:"#fdba74"};
function timingStats(histEntries,filterKids){
  const all={onTime:0,early:0,late:0,totalLateDays:0,carryOver:0,total:0};
  const byKid={};
  Object.values(histEntries).forEach(e=>{
    if(!e||!e.who||e.daysLate===undefined||e.daysLate===null)return;
    if(filterKids&&!filterKids.includes(e.who))return;
    if(!byKid[e.who])byKid[e.who]={onTime:0,early:0,late:0,totalLateDays:0,carryOver:0,total:0};
    const s=byKid[e.who];
    s.total++; all.total++;
    if(e.daysLate==="co"){s.carryOver++;all.carryOver++;}
    else if(e.daysLate===0){s.onTime++;all.onTime++;}
    else if(e.daysLate<0){s.early++;all.early++;}
    else{s.late++;s.totalLateDays+=e.daysLate;all.late++;all.totalLateDays+=e.daysLate;}
  });
  return {all,byKid};
}
function renderTimingCard(histEntries,filterKids){
  const ts=timingStats(histEntries,filterKids);
  if(!ts.all.total)return '';
  const pill=(label,count,bg,fg)=>'<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:'+bg+';color:'+fg+';margin:0 2px">'+label+' '+count+'</span>';
  let h='<div style="background:rgba(255,255,255,0.07);border-radius:10px;padding:10px 12px;margin-top:8px">';
  h+='<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:rgba(255,255,255,0.5);margin-bottom:6px">⏱ Completion Timing</div>';
  const order=["lincoln","ellis","lucy","julian"].filter(k=>ts.byKid[k]);
  order.forEach(k=>{
    const s=ts.byKid[k];
    const col=PACE_KCOL[k]||"#fff";
    const avgLate=s.late?Math.round(s.totalLateDays/s.late*10)/10:0;
    h+='<div style="display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap">';
    h+='<span style="font-size:11px;font-weight:700;color:'+col+';min-width:54px">'+cap(k)+'</span>';
    if(s.onTime)h+=pill('✓',s.onTime,'rgba(34,197,94,0.2)','#4ade80');
    if(s.early)h+=pill('Early',s.early,'rgba(96,165,250,0.2)','#93c5fd');
    if(s.late)h+=pill('Late '+avgLate+'d',s.late,'rgba(251,146,60,0.2)','#fb923c');
    if(s.carryOver)h+=pill('CO',s.carryOver,'rgba(168,85,247,0.2)','#c084fc');
    h+='</div>';
  });
  // overall bar
  const a=ts.all;
  if(a.total>1){
    const pOn=Math.round(a.onTime/a.total*100);
    const pEarly=Math.round(a.early/a.total*100);
    const pLate=Math.round(a.late/a.total*100);
    const pCo=Math.round(a.carryOver/a.total*100);
    h+='<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px">';
    if(pOn)h+='<div style="width:'+pOn+'%;background:#4ade80"></div>';
    if(pEarly)h+='<div style="width:'+pEarly+'%;background:#93c5fd"></div>';
    if(pLate)h+='<div style="width:'+pLate+'%;background:#fb923c"></div>';
    if(pCo)h+='<div style="width:'+pCo+'%;background:#c084fc"></div>';
    h+='</div>';
    h+='<div style="display:flex;gap:8px;margin-top:4px;font-size:9px;color:rgba(255,255,255,0.45)">';
    h+='<span>✓ On time '+pOn+'%</span>';
    if(pEarly)h+='<span>Early '+pEarly+'%</span>';
    if(pLate)h+='<span>Late '+pLate+'%</span>';
    if(pCo)h+='<span>CO '+pCo+'%</span>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function histKidStatsRow(tasks, checkedObj){
  let h='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">';

// ── CARRY-OVER REVIEW ────────────────────────────────────────────
function getCarryOverPool(){
  const curWeek=weekData.week||WK;
  // Sort by numeric week number — archivedAt is a human-readable string, not sortable as-is
  const archEntries=Object.values(archive||{})
    .filter(a=>a&&a.tasks&&a.weekLabel!==curWeek)
    .sort((a,b)=>{
      const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
      const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
      return nb-na;
    });
  if(!archEntries.length) return {prev:null,tasks:[]};
  const prev=archEntries[0];
  const awChecked=prev.checked||{};
  const curIds=new Set((weekData.tasks||[]).map(t=>t.id));
  // Mirror exactly what the history log shows as pink "missed" items:
  // non-_c base tasks where neither the original nor its _c was checked.
  // included = true by default; only false if user explicitly unchecked it.
  const excl=coExclusions[WK]||{};
  const tasks=(prev.tasks||[])
    .filter(t=>!t.id.endsWith("_c")
      &&!awChecked[t.id]&&!awChecked[t.id+"_c"]  // not completed in previous week
      &&!checked[t.id+"_c"])                       // not completed this week either
    .map(t=>({...t,id:t.id+"_c",day:"monday",cascade:true,
      included:!excl[t.id+"_c"],
      prevWeek:prev.weekLabel||"prev week"}));
  return {prev,tasks};
}

// Auto-add any non-excluded carry-over tasks that aren't yet in weekData.tasks.
// Figures out the correct school day to place them on (today or next upcoming day).
function _syncCarryOvers(){
  const pool=getCarryOverPool();
  // Find the current or next upcoming school day based on calendar dates + day-of-week
  const _dayOrder=["monday","tuesday","wednesday","thursday","friday"];
  const _jsIdx={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5};
  const _todayIdx=new Date().getDay()||7; // Sunday→7
  const _todayMid=new Date(); _todayMid.setHours(0,0,0,0);
  let targetDay="monday";
  for(const _d of _dayOrder){
    // Use calendar date if available, otherwise fall back to day-of-week index
    if(DAY_DT[_d]){
      const _cal=new Date(DAY_DT[_d]+", "+_todayMid.getFullYear()); _cal.setHours(0,0,0,0);
      if(_cal>=_todayMid){ targetDay=_d; break; }
    } else if(_jsIdx[_d]>=_todayIdx){ targetDay=_d; break; }
  }
  let changed=false;
  pool.tasks.filter(t=>t.included&&!weekData.tasks.some(x=>x.id===t.id)).forEach(t=>{
    weekData.tasks.push({...t,day:targetDay,included:undefined,prevWeek:undefined,
      detail:(t.detail||t.title||"")+" (Carried from "+(t.prevWeek||"prev week")+")"});
    changed=true;
  });
  if(changed){
    sv(WK+"_tasks",weekData.tasks);
    safeWriteTasks("displacement");
    renderAll();
  }
}

function toggleCarryOver(taskId,include){
  if(!coExclusions[WK]) coExclusions[WK]={};
  if(include){
    // Re-check: remove from exclusions, add back to task list
    delete coExclusions[WK][taskId];
    if(!weekData.tasks.some(x=>x.id===taskId)){
      const pool=getCarryOverPool();
      const t=pool.tasks.find(x=>x.id===taskId);
      if(t) weekData.tasks.push({...t,included:undefined,prevWeek:undefined,
        detail:(t.detail||t.title||"")+" (Carried from "+(t.prevWeek||"prev week")+")"});
    }
  } else {
    // Uncheck: add to exclusions, remove from task list
    coExclusions[WK][taskId]=true;
    weekData.tasks=weekData.tasks.filter(x=>x.id!==taskId);
    delete checked[taskId]; sv(WK+"_checked",checked);
    if(db) db.ref(WK+"/checked").set(checked);
  }
  try{localStorage.setItem("ha_co_excl",JSON.stringify(coExclusions));}catch(e){}
  if(db) db.ref("co_excl/"+WK).set(coExclusions[WK]);
  sv(WK+"_tasks",weekData.tasks);
  safeWriteTasks("co-exclusion");
  const el=document.getElementById("content"); if(el&&tab==="history") renderHistory(el);
}

function checkOffCarryOver(taskId){
  const t=weekData.tasks.find(x=>x.id===taskId); if(!t) return;
  const ts=nowTs();
  checked[taskId]=ts; sv(WK+"_checked",checked);
  lastCheckedWrite=Date.now();
  if(db) db.ref(WK+"/checked").set(checked);
  const hist=ld(WK+"_history")||{};
  const entry={id:taskId,title:t.title,who:t.who,day:t.day,originalDay:t.cascadedFrom||t.day,checkedOnDay:"carryover",daysLate:"co",ts,week:WK};
  hist[taskId]=entry; histState[taskId]=entry;
  sv(WK+"_history",hist);
  if(db) db.ref(WK+"/history/"+taskId).set(entry);
  renderAll();
}

function buildKidAttendance(kid){
  const weeks=[]; const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  Object.keys(archive).sort().forEach(wkKey=>{
    const aw=archive[wkKey];
    const awt=(aw.tasks||[]).filter(t=>t.who===kid&&!t.id.endsWith("_c"));
    const awc=aw.checked||{}; const awd=aw.dates||{};
    const days=[];
    DAYS.forEach(d=>{
      const dt=awt.filter(t=>t.day===d);
      const ov=((attOverrides[wkKey]||{})[d]||{})[kid];
      if(!dt.length&&ov===undefined) return; // skip only if no tasks AND no override
      const computed=dt.some(t=>awc[t.id]||awc[t.id+"_c"]);
      const attended=ov!==undefined?ov:computed;
      days.push({day:d,date:awd[d]||null,attended,past:true});
    });
    if(days.length) weeks.push({wkKey,label:(aw.weekLabel||wkKey).replace("week","Week "),days,archived:true});
  });
  const cur=(weekData.tasks||[]).filter(t=>t.who===kid&&!t.id.endsWith("_c"));
  const curDays=[];
  DAYS.forEach(d=>{ const dt=cur.filter(t=>t.day===d); if(!dt.length)return;
    const ds=DAY_DT[d]||""; let past=true;
    if(ds){ const p=new Date(ds+", "+new Date().getFullYear()); p.setHours(0,0,0,0); past=p<=todayMid; }
    curDays.push({day:d,date:ds,attended:dt.some(t=>checked[t.id]||checked[t.id+"_c"]),past}); });
  if(curDays.length) weeks.push({wkKey:WK,label:(WK||"week").replace("week","Week "),days:curDays,current:true});
  const total=weeks.reduce((s,w)=>s+w.days.filter(d=>d.past&&d.attended).length,0);
  return {weeks,total};
}

function printWeekReport(weekKey,filterKid){
  const fk=filterKid||(kid!=="all"&&kid!=="mom"?kid:null);
  let tasks,chk,dates,label,hist;
  if(!weekKey||weekKey===WK){
    tasks=weekData.tasks||[];chk=checked||{};dates={...DAY_DT};
    label=(weekData.week||WK).replace("week","Week ");
    hist=histState||{};
  } else {
    const aw=archive[weekKey]; if(!aw)return;
    tasks=aw.tasks||[];chk=aw.checked||{};dates=aw.dates||{};
    label=(aw.weekLabel||weekKey).replace("week","Week ");
    hist=aw.history||{};
  }
  if(fk) label+=(' — '+cap(fk));
  const kids=fk?[fk]:["lincoln","ellis","lucy","julian"];
  let body='';
  kids.forEach(k=>{
    const kt=tasks.filter(t=>t.who===k&&!t.id.endsWith("_c"));
    if(!kt.length)return;
    const subjs={};
    kt.forEach(t=>{
      const title=t.title||"";
      const dash=title.indexOf(" — ");
      const prefix=dash>0?title.substring(0,dash).replace(/[^\x20-\x7E]/g,"").trim():"Other";
      const detail=dash>0?title.substring(dash+3).trim():title.replace(/[^\x20-\x7E]/g,"").trim();
      const isDone=!!(chk[t.id]||chk[t.id+"_c"]);
      if(!subjs[prefix])subjs[prefix]={done:[],missed:[]};
      subjs[prefix][isDone?"done":"missed"].push({detail,day:t.day||""});
    });
    const totalDone=kt.filter(t=>chk[t.id]||chk[t.id+"_c"]).length;
    const pct=kt.length?Math.round(totalDone/kt.length*100):0;
    const col=PACE_KCOL[k]||"#374151";
    body+='<div style="page-break-inside:avoid;margin-bottom:16px">';
    body+='<h2 style="color:'+col+';margin:16px 0 6px;border-bottom:2px solid '+col+';padding-bottom:4px">'+cap(k);
    body+='<span style="float:right;font-size:11pt;font-weight:400;color:#555">'+totalDone+'/'+kt.length+' ('+pct+'%)</span></h2>';
    Object.keys(subjs).sort().forEach(subj=>{
      const s=subjs[subj];
      body+='<div style="margin:4px 0 8px">';
      body+='<div style="font-weight:700;font-size:10pt;color:#374151;padding:2px 0;border-bottom:1px solid #e5e7eb">'+subj;
      body+='<span style="font-weight:400;color:#9ca3af;font-size:9pt"> — '+s.done.length+'/'+(s.done.length+s.missed.length)+'</span></div>';
      s.done.forEach(t=>{
        body+='<div style="font-size:9pt;color:#16a34a;padding:1px 0 1px 12px">&#10003; '+t.detail;
        if(t.day)body+=' <span style="color:#9ca3af;font-size:8pt">('+cap(t.day).slice(0,3)+')</span>';
        body+='</div>';
      });
      s.missed.forEach(t=>{
        body+='<div style="font-size:9pt;color:#dc2626;padding:1px 0 1px 12px">&#10007; '+t.detail;
        if(t.day)body+=' <span style="color:#9ca3af;font-size:8pt">('+cap(t.day).slice(0,3)+')</span>';
        body+='</div>';
      });
      body+='</div>';
    });
    body+='</div>';
  });
  const dv=Object.values(dates).filter(Boolean).sort();
  const dateStr=dv.length?dv[0]+' – '+dv[dv.length-1]:'';
  let html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Howe Academy — '+label+' Report</title>'+
    '<style>body{font-family:Arial,sans-serif;font-size:10pt;color:#222;max-width:680px;margin:0 auto;padding:24px}'+
    'h1{font-size:16pt;margin-bottom:4px}h2{font-size:12pt;page-break-after:avoid}'+
    '@media print{@page{size:portrait;margin:0.5in}}</style></head><body>'+
    '<h1>Howe Academy — Weekly Completion Report</h1>'+
    '<p style="font-size:10pt;color:#444;margin:2px 0"><strong>'+label+'</strong>'+(dateStr?' &middot; '+dateStr:'')+'</p>'+
    '<p style="font-size:9pt;color:#888;margin:2px 0 10px">Generated '+nowTs()+'</p>'+
    '<hr style="border:none;border-top:1px solid #ccc;margin:0 0 4px">'+body;
  // Timing stats section (only if data exists)
  const ts=timingStats(hist,fk?[fk]:null);
  if(ts.all.total){
    html+='<div style="page-break-inside:avoid;margin-top:16px;padding-top:10px;border-top:1px solid #ccc">';
    html+='<h2 style="font-size:11pt;margin:0 0 6px;color:#374151">Completion Timing</h2>';
    const kidOrder=["lincoln","ellis","lucy","julian"].filter(k=>ts.byKid[k]);
    kidOrder.forEach(k=>{
      const s=ts.byKid[k];const avgL=s.late?Math.round(s.totalLateDays/s.late*10)/10:0;
      const col=PACE_KCOL[k]||"#374151";
      html+='<div style="margin:3px 0;font-size:9pt"><span style="font-weight:700;color:'+col+'">'+cap(k)+':</span> ';
      const parts=[];
      if(s.onTime)parts.push('<span style="color:#16a34a">'+s.onTime+' on time</span>');
      if(s.early)parts.push('<span style="color:#3b82f6">'+s.early+' early</span>');
      if(s.late)parts.push('<span style="color:#ea580c">'+s.late+' late (avg '+avgL+'d)</span>');
      if(s.carryOver)parts.push('<span style="color:#7c3aed">'+s.carryOver+' carry-over</span>');
      html+=parts.join(' · ')+'</div>';
    });
    html+='</div>';
  }
  html+='</body></html>';
  const w=window.open("","_blank");w.document.write(html);w.document.close();w.onload=()=>w.print();
}

// ── JSON LOAD ─────────────────────────────────────────────────────
function loadJson(){
  const f=document.getElementById("json-input").files[0];
  if(!f){document.getElementById("admin-msg").textContent="No file selected.";return;}
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.week||!d.tasks){document.getElementById("admin-msg").textContent="❌ JSON missing week or tasks.";return;}
      const lunchConflicts=(d.tasks||[]).filter(t=>{
        const p=t.time&&t.time.match(/(\d+):(\d+)\s*(AM|PM)/i); if(!p)return false;
        let h=parseInt(p[1]); if(p[3].toUpperCase()==="PM"&&h!==12)h+=12; if(p[3].toUpperCase()==="AM"&&h===12)h=0;
        const m=h*60+parseInt(p[2]); return m>=780&&m<840;
      });
      if(lunchConflicts.length){
        const names=lunchConflicts.map(t=>t.id+"("+t.day+" "+t.time+")").join(", ");
        document.getElementById("admin-msg").textContent="⚠️ "+lunchConflicts.length+" task(s) during lunch (1–2 PM): "+names+". Move to 2:05 PM or later.";
        return;
      }
      isUploading=true;
      const activeWK=localStorage.getItem("ha_active_wk")||WK;
      const isSameWeek=!!(d.week===activeWK);
      if(isSameWeek){
        const lsChecked=ld(activeWK+"_checked")||{};
        const memChecked=checked||{};
        const snapChecked={...lsChecked,...memChecked};
        const snapHist=ld(activeWK+"_history")||{};
        const oldLookup={};
        (weekData.tasks||[]).forEach(t=>{
          const key=(t.title||"")+"|"+(t.who||"");
          if(snapChecked[t.id]) oldLookup[key]={ts:snapChecked[t.id],oldId:t.id};
        });
        d.tasks.forEach(t=>{
          if(snapChecked[t.id]) return;
          const key=(t.title||"")+"|"+(t.who||"");
          if(oldLookup[key]){
            snapChecked[t.id]=oldLookup[key].ts;
            if(snapHist[oldLookup[key].oldId]&&!snapHist[t.id])
              snapHist[t.id]={...snapHist[oldLookup[key].oldId],id:t.id};
          }
        });
        const snapSl=ld(activeWK+"_sl")||slState||{};
        // Re-attach cross-week carry-over tasks:
        // Pass 1 — grab any _c tasks still alive in weekData.tasks whose base isn't in the new JSON
        const newIds=new Set(d.tasks.map(t=>t.id));
        (weekData.tasks||[]).filter(t=>t.id.endsWith("_c")&&!newIds.has(t.id)&&!newIds.has(baseId(t.id)))
          .forEach(t=>{ d.tasks.push(t); newIds.add(t.id); });
        // Pass 2 — reconstruct from the most-recent archive in case carry-overs were already wiped.
        // Same filter as the Carry-overs tab: all base tasks not completed in any form.
        const _archPrev=Object.values(archive||{}).filter(a=>a&&a.tasks&&a.weekLabel!==d.week)
          .sort((a,b)=>{
            const na=parseInt((a.weekLabel||"0").replace(/\D/g,"")||"0");
            const nb=parseInt((b.weekLabel||"0").replace(/\D/g,"")||"0");
            return nb-na;
          })[0];
        if(_archPrev){
          const _awc=_archPrev.checked||{};
          (_archPrev.tasks||[]).filter(t=>!t.id.endsWith("_c")&&!_awc[t.id]&&!_awc[t.id+"_c"])
            .forEach(t=>{
              const _cId=t.id+"_c";
              if(newIds.has(_cId)) return;                        // already present
              if((snapChecked||{})[_cId]) return;               // already completed this week
              if((coExclusions[d.week]||{})[_cId]) return;      // user explicitly excluded
              d.tasks.push({...t,id:_cId,day:"monday",cascade:true,
                detail:(t.detail||t.title||"")+" (Carried from "+(_archPrev.weekLabel||"prev week")+")"});
              newIds.add(_cId);
            });
        }
        // GC: purge checked/history entries for task IDs not in the new set
        const commitIds=new Set(d.tasks.map(t=>t.id));
        for(const id in snapChecked){ if(!commitIds.has(id)) delete snapChecked[id]; }
        for(const id in snapHist){ if(!commitIds.has(id)) delete snapHist[id]; }
        WK=activeWK; weekData=d; checked=snapChecked; slState=snapSl;
        if(d.supplies&&Array.isArray(d.supplies)){SUP=d.supplies;sv(WK+"_supplies_def",d.supplies);}
        if(d.supplyCategories&&Array.isArray(d.supplyCategories)) SUP_CATS=d.supplyCategories;
        applyWeekMeta(d);
        sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
        sv(WK+"_checked",snapChecked); sv(WK+"_history",snapHist); sv(WK+"_sl",snapSl);
        sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        if(db){
          const obj={};d.tasks.forEach(t=>obj[t.id]=t);
          db.ref(WK+"/tasks").set(obj);
          db.ref(WK+"/checked").set(snapChecked);
          db.ref(WK+"/history").set(snapHist);
          if(Object.keys(snapSl).length) db.ref(WK+"/sl").set(snapSl);
          if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
          db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        }
        fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
        renderAll(); runCascade();
        document.getElementById("admin-msg").textContent="✅ "+d.week+" updated — "+d.tasks.length+" tasks. Completions & history preserved.";
      } else {
        const oldWK=activeWK;
        const snapHist=ld(oldWK+"_history")||{};
        const snapTasks=weekData.tasks||[];
        const snapChecked={...(ld(oldWK+"_checked")||{}), ...checked};
        snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"]).forEach(t=>{
          if(!snapHist[t.id+"_missed"])
            snapHist[t.id+"_missed"]={id:t.id,title:t.title,who:t.who,day:t.day,ts:"Week Closed",missed:true,momRequired:t.mom==="required"};
        });
        const hasAnything=Object.keys(snapHist).length>0||snapTasks.length>0;
        if(hasAnything){
          const snapSlotPts=ld(oldWK+"_slot_points")||{};
          const entry={weekLabel:oldWK,archivedAt:nowTs(),history:snapHist,tasks:snapTasks,checked:snapChecked,dates:{...DAY_DT},slot_points:snapSlotPts};
          archive[oldWK]=entry;
          try{localStorage.setItem("ha_archive",JSON.stringify(archive));}catch(e2){}
          if(db) db.ref("archive/"+oldWK).set(entry);
        }
        // Carry ALL uncompleted tasks from old week into Monday of new week.
        // Same filter as Carry-overs tab: base tasks where neither original nor _c was checked.
        snapTasks.filter(t=>!t.id.endsWith("_c")&&!snapChecked[t.id]&&!snapChecked[t.id+"_c"])
          .forEach(t=>{
            const cId=t.id+"_c";
            if(!d.tasks.some(x=>x.id===cId))
              d.tasks.push({...t,id:cId,day:"monday",cascade:true,
                detail:(t.detail||t.title||"")+" (Carried from "+oldWK+")"});
          });
        WK=d.week; localStorage.setItem("ha_active_wk",WK);
        if(db) db.ref("ha_active_wk").set(WK);
        weekData=d; checked={}; slState={};
        if(d.supplies&&Array.isArray(d.supplies)){SUP=d.supplies;sv(WK+"_supplies_def",d.supplies);}
        if(d.supplyCategories&&Array.isArray(d.supplyCategories)) SUP_CATS=d.supplyCategories;
        sv(WK+"_tasks",d.tasks); sv(WK+"_babysitter",d.babysitter||null);
        sv(WK+"_checked",{}); sv(WK+"_sl",{}); sv(WK+"_history",{});
        sv(WK+"_meta",{week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
        if(db){
          db.ref(WK+"/checked").set({}); db.ref(WK+"/sl").set({}); db.ref(WK+"/history").set({});
          const obj={};d.tasks.forEach(t=>obj[t.id]=t);
          db.ref(WK+"/tasks").set(obj);
          if(d.babysitter) db.ref(WK+"/babysitter").set(d.babysitter);
          db.ref(WK+"/meta").set({week:d.week,dates:d.dates||{},constraints:d.constraints||{},windows:d.windows||{}});
          attachWeekListeners(WK);
        }
        applyWeekMeta(d);
        fbCheckedLoaded=true; fbTasksLoaded=true; fbHistoryLoaded=true;
        renderAll(); runCascade();
        document.getElementById("admin-msg").textContent="✅ "+d.week+" loaded — "+d.tasks.length+" tasks. Previous week archived.";
      }
      setTimeout(()=>{ isUploading=false; },3000);
    }catch(err){ isUploading=false; document.getElementById("admin-msg").textContent="❌ "+err.message; }
  };
  r.readAsText(f);
}

            if(dateStr) h+='<button onclick="lmRemoveSubj(\''+k+'\',\''+dateStr+'\',\''+sk+'\')" style="background:none;border:none;color:#9ca3af;font-size:14px;font-weight:700;cursor:pointer;padding:0 3px;line-height:1">&times;</button>';
            h+='</div>';
          });
          // Removed subjects: struck rows with undo, parked after the live lineup
          sKeys.forEach(sk=>{
            if(!lesson[sk]||!rm[sk]) return;
            const s=subjects[sk];
            h+='<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px;opacity:0.5;text-decoration:line-through;">';

              h+='<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">';

                const al=s.allowedDays||[];
                const rl=s.rules||"";
                let warn="";
                if(al.length&&dayAbbr&&!al.includes(dayAbbr)) warn=" ⚠";
                else if(rl.includes("no-fri")&&dayAbbr==="Fri") warn=" ⚠";
                else if(rl.includes("mon-thu")&&["Fri","Sat","Sun"].includes(dayAbbr)) warn=" ⚠";
                h+='<button onclick="lmAddSubj(\''+k+'\',\''+dateStr+'\',\''+sk+'\')" style="border:1px solid var(--border);background:#fff;border-radius:8px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:\'DM Sans\',sans-serif">+ '+esc(s.display)+warn+'</button>';
              });

    } else if(currViewWeek&&!weekDays[currViewWeek]){
      const _gn=parseInt((currViewWeek.match(/\d+/)||[0])[0])||0;
      if(_gn) h+=lmRenderOffWeek(k,col,_gn);
    }
    } // end by-week mode
  }

  h+='</div>';
  el.innerHTML=h;
}

        if(isEditing){

        }
        h+='</div>';
      }

    });

  });

    '<button class="pace-add-btn" onclick="addPacePlan()">+ Add Plan</button>'+
    '</div>';

  h+='</div>';
  // Append plans content below the inner tab bar already in el
  const wrap=document.createElement('div');

  h+='</div></div>';
  h+='<div class="ce-card-tags">';

  if(s.mom==="required") h+='<span class="ce-tag ce-tag-mom-req">Mom Required</span>';
  else if(s.mom==="maybe") h+='<span class="ce-tag ce-tag-mom-may">May Need Mom</span>';

    s.rules.split(",").map(r=>r.trim()).filter(Boolean).forEach(r=>{

    });

  if(s.priority&&s.priority!=="normal") h+='<span class="ce-tag ce-tag-priority">'+cap(s.priority)+' priority</span>';

let ceEditKid=null, ceEditKey=null, ceCloseTimer=null;

function ceOpenEdit(kid,key){
  if(ceCloseTimer){clearTimeout(ceCloseTimer);ceCloseTimer=null;}
  ceEditKid=kid; ceEditKey=key;

function ceCloseSheet(){
  const w=document.getElementById("ce-sheet-wrap");
  const sheet=w.querySelector(".ce-sheet");
  document.body.style.overflow="";
  if(sheet){
    sheet.classList.remove("open");
    ceCloseTimer=setTimeout(()=>{w.style.display="none";ceCloseTimer=null;},250);
  } else { w.style.display="none"; }

function ceGetSubject(){
  if(!currData||!ceEditKid||!ceEditKey) return null;
  return (currData.subjects[ceEditKid]||{})[ceEditKey]||null;
}

function ceSaveField(field,val){
  if(!currData||!ceEditKid||!ceEditKey||!db) return;
  currData.subjects[ceEditKid][ceEditKey][field]=val;
  db.ref("curriculum/subjects/"+ceEditKid+"/"+ceEditKey+"/"+field).set(val);
  currData.lastEdit=new Date().toISOString();
  db.ref("curriculum/lastEdit").set(currData.lastEdit);
}
// Minutes stepper: update the value + the displayed number in place — no full sheet
// re-render, so you keep your place while tapping up/down.
function ceStepMin(delta){
  if(!currData||!ceEditKid||!ceEditKey) return;
  const s=currData.subjects[ceEditKid][ceEditKey]; if(!s) return;
  const v=Math.max(5,Math.min(60,(s.minutes||20)+delta));
  ceSaveField('minutes',v);
  const el=document.getElementById('ce-min-val'); if(el) el.textContent=v;
}
function ceAddStepMin(delta){
  ceAddForm.minutes=Math.max(5,Math.min(60,(ceAddForm.minutes||20)+delta));
  const el=document.getElementById('ce-add-min-val'); if(el) el.textContent=ceAddForm.minutes;
}

function cePacingMath(s){
  const tpw=s.timesPerWeek||0;
  const total=s.total||0;
  if(!tpw||!total) return '<div style="font-size:10px;color:var(--muted);margin-top:4px">Set times/week and total lessons to see pacing projections.</div>';
  let cursor=0;
  try{ cursor=computeSubjectCursor(ceEditKid,ceEditKey); }catch(e){}
  const remaining=Math.max(0,total-cursor);
  const weeksNeeded=Math.ceil(remaining/tpw);
  // Find plan containing this kid for calendar-aware projection
  let plan=null;
  const plans=(paceData&&paceData.plans)||{};
  for(const pk of Object.keys(plans)){
    if((plans[pk].kids||[]).includes(ceEditKid)){plan=plans[pk];break;}
  }
  let finishStr,daysOff=0,schoolDaysRemain=0;
  if(plan){
    const sr=sessionSchoolDaysFromToday(plan,ceEditKid);
    schoolDaysRemain=sr.school;
    daysOff=sr.off;
    const daysNeeded=remaining*Math.ceil(7/(plan.schoolDays||["Mon","Tue","Wed","Thu","Fri"]).length)/tpw*((plan.schoolDays||["Mon","Tue","Wed","Thu","Fri"]).length);
    const projDate=new Date();
    projDate.setDate(projDate.getDate()+Math.ceil(remaining/tpw)*7);
    finishStr=projDate.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    if(plan.end){
      const endD=new Date(plan.end+"T12:00:00");
      const endStr=endD.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      if(projDate>endD) finishStr+=' (past '+endStr+')';
    }
  } else {
    const projDate=new Date();
    projDate.setDate(projDate.getDate()+weeksNeeded*7);
    finishStr=projDate.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  }
  const pct=total>0?Math.round(cursor/total*100):0;
  const statusColor=remaining<=0?"#16a34a":weeksNeeded<=4?"#c45e1a":"var(--muted)";
  let h='<div style="margin-top:8px;padding:10px 12px;background:#f9fafb;border-radius:8px;border:1px solid var(--border);font-size:11px">';
  h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:700">Pacing</span><span style="color:'+statusColor+';font-weight:700">'+(remaining<=0?"Complete":remaining+" remaining")+'</span></div>';
  if(remaining>0){
    h+='<div style="color:var(--muted)">'+tpw+'×/week → '+weeksNeeded+' week'+(weeksNeeded!==1?"s":"")+' → finishes ~'+finishStr+'</div>';
    if(plan&&daysOff) h+='<div style="color:var(--muted);margin-top:2px">'+schoolDaysRemain+' school days remaining ('+daysOff+' off for holidays)</div>';
    h+='<div style="background:#e5e7eb;border-radius:4px;height:6px;margin-top:6px;overflow:hidden"><div style="background:#c45e1a;height:100%;width:'+pct+'%;border-radius:4px"></div></div>';
    h+='<div style="color:var(--muted);margin-top:2px">'+cursor+' of '+total+' done ('+pct+'%)</div>';
  }
  h+='</div>';
  return h;
}

function ceSetTargetEnd(kid,val){
  if(!currData.targetEnd) currData.targetEnd={};
  if(val){ currData.targetEnd[kid]=val; db.ref("curriculum/targetEnd/"+kid).set(val); }
  else { delete currData.targetEnd[kid]; db.ref("curriculum/targetEnd/"+kid).remove(); }
  renderAll();
}

function ceToggleDay(d){
  const s=ceGetSubject();
  if(!s) return;
  let arr=s.allowedDays||[];
  if(arr.includes(d)) arr=arr.filter(x=>x!==d);
  else arr.push(d);
  const order=["Mon","Tue","Wed","Thu","Fri","Sat"];
  arr.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  ceSaveField("allowedDays",arr);
  ceSaveField("days",arr.join(" "));
  ceRenderEditSheet();
}

function ceFindRuleOwner(kid,rule,excludeKey){
  const subs=currData&&currData.subjects[kid]||{};
  for(const k of Object.keys(subs)){
    if(k===excludeKey) continue;
    if(subs[k].paused) continue;
    if((subs[k].rules||"").includes(rule)) return subs[k].display||k;
  }
  return null;
}

function ceToggleRule(r){
  const s=ceGetSubject();
  if(!s) return;
  let parts=(s.rules||"").split(",").map(x=>x.trim()).filter(Boolean);
  if(parts.includes(r)){ parts=parts.filter(x=>x!==r); }
  else {
    if(r==="first"||r==="last"){
      const owner=ceFindRuleOwner(ceEditKid,r,ceEditKey);
      if(owner&&!confirm('"'+owner+'" already has the "'+r+'" rule. Only one subject can be '+r+' in the day. Replace it?')) return;
      if(owner){
        const subs=currData.subjects[ceEditKid];
        for(const k of Object.keys(subs)){
          if(k===ceEditKey||subs[k].paused) continue;
          if((subs[k].rules||"").includes(r)){
            const oldParts=(subs[k].rules||"").split(",").map(x=>x.trim()).filter(Boolean).filter(x=>x!==r);
            subs[k].rules=oldParts.join(", ");
            db.ref("curriculum/subjects/"+ceEditKid+"/"+k+"/rules").set(subs[k].rules);
          }
        }
      }
    }
    parts.push(r);
  }
  ceSaveField("rules",parts.join(", "));
  ceRenderEditSheet();
}

function ceTogglePause(){
  const s=ceGetSubject();
  if(!s) return;
  if(s.paused){
    ceSaveField("paused",false);
    ceSaveField("pausedSince",null);
  } else {
    ceSaveField("paused",true);

  }
  ceRenderEditSheet();

}
// Quick pause/resume from a subject's list card (no need to open the editor).
function ceQuickPause(kid,key){
  const s=currData&&currData.subjects&&currData.subjects[kid]&&currData.subjects[kid][key];
  if(!s) return;
  const now=!s.paused;

    db.ref("curriculum/subjects/"+kid+"/"+key+"/paused").set(now);

    db.ref("curriculum/lastEdit").set(currData.lastEdit);

  renderAll();

function ceSaveLessonSeq(val){

function ceDeleteSubject(){
  const s=ceGetSubject();

}

function ceAddToggleDay(d){
  let parts=(ceAddForm.days||"").split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
  if(parts.includes(d)) parts=parts.filter(x=>x!==d);
  else parts.push(d);
  const order=["Mon","Tue","Wed","Thu","Fri","Sat"];
  parts.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  ceAddForm.days=parts.join(" ");
  ceRenderAddSheet();
}

function ceAddToggleRule(r){
  let parts=(ceAddForm.rules||"").split(",").map(x=>x.trim()).filter(Boolean);
  if(parts.includes(r)){ parts=parts.filter(x=>x!==r); }
  else {
    if(r==="first"||r==="last"){
      const owner=ceFindRuleOwner(ceAddKid,r,null);
      if(owner&&!confirm('"'+owner+'" already has the "'+r+'" rule. Only one subject can be '+r+' in the day. Replace it?')) return;
      if(owner){
        const subs=currData.subjects[ceAddKid];
        for(const k of Object.keys(subs)){
          if(subs[k].paused) continue;
          if((subs[k].rules||"").includes(r)){
            const oldParts=(subs[k].rules||"").split(",").map(x=>x.trim()).filter(Boolean).filter(x=>x!==r);
            subs[k].rules=oldParts.join(", ");
            db.ref("curriculum/subjects/"+ceAddKid+"/"+k+"/rules").set(subs[k].rules);
          }
        }
      }
    }
    parts.push(r);
  }
  ceAddForm.rules=parts.join(", ");
  ceRenderAddSheet();
}

// ── CURRICULUM UPLOAD ─────────────────────────────────────────────
function currParseDetectFormat(rows){
  for(let r=0;r<Math.min(rows.length,12);r++){
    const label=String(rows[r]?.[0]??"").trim().toLowerCase();
    if(label==="key"||label==="keys") return {dynamic:true,keyRow:r};
  }
  return {dynamic:false};
}
function currParseFindRow(rows,label,startAfter){
  for(let r=(startAfter||0);r<Math.min(rows.length,20);r++){
    const v=String(rows[r]?.[0]??"").trim().toLowerCase();
    if(v===label) return r;
  }
  return -1;
}
function currParseDynamic(rows,format){
  const empty=v=>{const s=String(v??"").trim();return !s||s==="nan"||s==="NaN"||s==="None"||s==="—"||s==="undefined";};
  const kr=format.keyRow;
  const keyRow=rows[kr]||[];
  const keyMap={};
  for(let c=3;c<keyRow.length;c++){
    const k=String(keyRow[c]??"").trim().toLowerCase().replace(/[^a-z0-9_]/g,"_");
    if(k) keyMap[c]=k;
  }
  if(!Object.keys(keyMap).length) return null;
  const dispR=currParseFindRow(rows,"display",kr+1);
  const devR=currParseFindRow(rows,"device",kr+1);
  const momR=currParseFindRow(rows,"mom",kr+1);
  const minR=currParseFindRow(rows,"minutes",kr+1);
  const rulR=currParseFindRow(rows,"rules",kr+1);
  const dayR=currParseFindRow(rows,"days",kr+1);
  const tpwR=currParseFindRow(rows,"x/week",kr+1);
  if(tpwR<0){const a=currParseFindRow(rows,"timesperweek",kr+1);if(a>=0) format.tpwRow=a;}
  else format.tpwRow=tpwR;
  const headerR=dispR>=0?dispR:(kr>0?kr-1:-1);
  const dispRow=headerR>=0?rows[headerR]:[];
  const deviceRow=devR>=0?rows[devR]:[];
  const momRow=momR>=0?rows[momR]:[];
  const minutesRow=minR>=0?rows[minR]:[];
  const rulesRow=rulR>=0?rows[rulR]:[];
  const daysRow=dayR>=0?rows[dayR]:[];
  const tpwRow=format.tpwRow>=0?rows[format.tpwRow]:[];
  const lastMeta=Math.max(kr,dispR,devR,momR,minR,rulR,dayR,format.tpwRow||0);
  format.dataStart=lastMeta+1;

  const subjects={};
  for(const[colStr,key] of Object.entries(keyMap)){
    const c=parseInt(colStr);
    let display=String(dispRow[c]??"").trim().replace(/\n/g," ").replace(/\s*\([^)]*\)\s*$/,"").trim();
    if(empty(display)) display=key;
    const device=empty(deviceRow[c])?"paper":String(deviceRow[c]).trim().toLowerCase();
    const mom=empty(momRow[c])?"none":String(momRow[c]).trim().toLowerCase();
    const minutes=parseInt(String(minutesRow[c]??"20"))||20;
    const rules=empty(rulesRow[c])?"":String(rulesRow[c]).trim();
    const days=empty(daysRow[c])?"":String(daysRow[c]).trim();
    const tpw=parseInt(String(tpwRow[c]??""))||0;
    subjects[key]={display,device,mom,minutes,rules,days,total:0};
    if(tpw) subjects[key].timesPerWeek=tpw;
  }
  return {keyMap,subjects,dataStart:format.dataStart};
}

function uploadCurriculum(){
  const msg=document.getElementById("admin-msg");
  if(!adminPinUnlocked){msg.textContent="Enter Mom PIN first (Rules tab).";return;}
  const f=document.getElementById("xlsx-input").files[0];
  if(!f){msg.textContent="No .xlsx file selected.";return;}
  if(!db){msg.textContent="Not connected to Firebase.";return;}
  msg.textContent="Parsing curriculum...";
  const reader=new FileReader();
  reader.onerror=()=>{msg.textContent="Failed to read file.";};
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
      const curriculum={uploadedAt:new Date().toISOString(),fileName:f.name,subjects:{},lessons:{},weekDays:{}};
      // Re-upload replaces the whole curriculum node — carry over settings
      // that live beside the grid so they survive (targets).
      if(currData&&currData.targetEnd) curriculum.targetEnd=currData.targetEnd;
      const empty=v=>{const s=String(v??"").trim();return !s||s==="nan"||s==="NaN"||s==="None"||s==="—"||s==="undefined";};
      const weekNum=w=>{const m=String(w).match(/Wk\s*(\d+)/i);return m?parseInt(m[1]):0;};

      let isDynamic=false;
      const sheetKids={};
      const firstSheet=wb.SheetNames[0]||"";
      const firstRows=XLSX.utils.sheet_to_json(wb.Sheets[firstSheet],{header:1,raw:false,dateNF:'yyyy-mm-dd'});
      const fmt=currParseDetectFormat(firstRows);
      isDynamic=fmt.dynamic;

      if(isDynamic){
        for(const sheet of wb.SheetNames){
          const sheetLower=sheet.toLowerCase().trim();
          const kidMatch=SL_KIDS.find(k=>sheetLower.includes(k));
          if(kidMatch) sheetKids[sheet]=kidMatch;
          else if(sheetLower==="instructions") continue;
          else{
            const known=CURR_SHEET_KID[sheet];
            if(known) sheetKids[sheet]=known;
          }
        }
      } else {
        Object.assign(sheetKids,CURR_SHEET_KID);
      }

      for(const[sheet,kid] of Object.entries(sheetKids)){
        if(!wb.SheetNames.includes(sheet)){msg.textContent="Sheet not found: "+sheet;return;}
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:false,dateNF:'yyyy-mm-dd'});

        let keyMap,subjects,dataStart;
        if(isDynamic){
          const sFmt=currParseDetectFormat(rows);
          if(!sFmt.dynamic){msg.textContent="Sheet '"+sheet+"' missing Key row.";return;}
          const parsed=currParseDynamic(rows,sFmt);
          if(!parsed){msg.textContent="Sheet '"+sheet+"' has no subject keys in Key row.";return;}
          keyMap=parsed.keyMap;subjects=parsed.subjects;dataStart=parsed.dataStart;
        } else {
          keyMap=CURR_KEY_MAP[sheet]||{};
          const headerRow=rows[2]||[];
          const deviceRow=rows[3]||[];
          const momRow=rows[4]||[];
          const minutesRow=rows[5]||[];
          const rulesRow=rows[6]||[];
          const daysRow=rows[7]||[];
          subjects={};
          for(const[colStr,key] of Object.entries(keyMap)){
            const c=parseInt(colStr);
            let display=String(headerRow[c]??"").trim().replace(/\n/g," ").replace(/\s*\([^)]*\)\s*$/,"").trim();
            if(empty(display))display=key;
            const device=empty(deviceRow[c])?"paper":String(deviceRow[c]).trim().toLowerCase();
            const mom=empty(momRow[c])?"none":String(momRow[c]).trim().toLowerCase();
            const minutes=parseInt(String(minutesRow[c]??"20"))||20;
            const rules=empty(rulesRow[c])?"":String(rulesRow[c]).trim();
            const days=empty(daysRow[c])?"":String(daysRow[c]).trim();
            subjects[key]={display,device,mom,minutes,rules,days,total:0};
          }
          dataStart=8;
        }

        const lessons={};
        const wdMap={};
        for(let r=dataStart;r<rows.length;r++){
          const row=rows[r];
          if(!row||!row.length)continue;
          const dayRaw=row[0];
          const dayNum=parseInt(String(dayRaw));
          if(isNaN(dayNum))continue;
          const wkRaw=String(row[2]??"").trim();
          if(!wkRaw||weekNum(wkRaw)<CURR_MIN_WEEK)continue;

          let dateStr="";
          const dateVal=row[1];
          if(dateVal instanceof Date&&!isNaN(dateVal)){dateStr=dateVal.toISOString().split("T")[0];}
          else if(dateVal){
            const s=String(dateVal).trim();
            const p=Date.parse(s);
            if(!isNaN(p))dateStr=new Date(p).toISOString().split("T")[0];
            else dateStr=s;
          }

          const lesson={week:wkRaw,date:dateStr};
          let hasData=false;
          for(const[colStr,key] of Object.entries(keyMap)){
            const c=parseInt(colStr);
            const val=row[c];
            if(!empty(val)){
              lesson[key]=String(val).trim();
              subjects[key].total++;
              hasData=true;
            }
          }
          if(hasData){
            lessons[dayNum]=lesson;
            if(!wdMap[wkRaw])wdMap[wkRaw]=[];
            wdMap[wkRaw].push(dayNum);
          }
        }

        for(const wk of Object.keys(wdMap))wdMap[wk].sort((a,b)=>a-b);
        curriculum.subjects[kid]=subjects;
        curriculum.lessons[kid]=lessons;
        curriculum.weekDays[kid]=wdMap;
      }

      const stats=Object.entries(sheetKids).map(([_,kid])=>{
        const ns=Object.keys(curriculum.subjects[kid]||{}).length;
        const nd=Object.keys(curriculum.lessons[kid]||{}).length;
        const nw=Object.keys(curriculum.weekDays[kid]||{}).length;
        return kid+": "+ns+" subjects, "+nd+" days, "+nw+" weeks";
      });

      msg.textContent="Uploading to Firebase...";
      db.ref("curriculum").set(curriculum).then(()=>{
        msg.innerHTML="Curriculum uploaded!"+(isDynamic?" (dynamic format)":"")+"<br>"+stats.join("<br>");
      }).catch(err=>{
        msg.textContent="Firebase error: "+err.message;
      });
    }catch(err){
      msg.textContent="Parse error: "+err.message;
      console.error("Curriculum parse error:",err);
    }
  };
  reader.readAsArrayBuffer(f);
}

// Build the app's calendar/edit-aware pace targets in the pace_targets.json schema:
//   {kid:{subjectKey:{total, byWeek:[cum_wk1, cum_wk2, ...]}}}  — byWeek is 0-indexed (byWeek[w-1] = cumulative through week w)
function paceTargetsFromApp(){
  try{ if(typeof buildCurrPaceCum==="function") buildCurrPaceCum(); }catch(e){}
  const out={}, subj=(typeof currData!=="undefined"&&currData.subjects)||{};
  const cum=(typeof currPaceCum!=="undefined"&&currPaceCum)||{};
  for(const kid of Object.keys(cum)){
    out[kid]={};
    for(const sk of Object.keys(cum[kid]||{})){
      const m=cum[kid][sk]||{};
      const wns=Object.keys(m).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
      const maxW=wns.length?wns[wns.length-1]:0;
      const byWeek=[]; let last=0;
      for(let w=1; w<=maxW; w++){ if(m[w]!==undefined) last=m[w]; byWeek.push(last); }
      const total=(((subj[kid]||{})[sk]||{}).total)||(byWeek.length?byWeek[byWeek.length-1]:0)||1;
      out[kid][sk]={total:total, byWeek:byWeek};
    }
  }
  return out;
}

// Export the live committed week as weekN.json for the desktop notebook generators.
// Schema = build_week_json + `pace` (current targets) + `mastery` (live drill items):
//   {week, dates, constraints, windows, tasks:[…], pace:{kid:{sk:{total,byWeek[]}}}, mastery:{kid:[{subject,prompt,status,…}]}}
function downloadWeekJSON(){
  const tasks=(weekData.tasks||[]).filter(t=>!String(t.id||"").endsWith("_c"));
  if(!tasks.length){ alert("No tasks in the current week yet — generate & commit a week first."); return; }
  const out={
    week:WK,
    dates:DAY_DT||{},
    constraints:(typeof CONSTRAINT!=="undefined"?CONSTRAINT:{}),
    windows:(typeof WIN!=="undefined"?WIN:{}),
    tasks:tasks,
    pace:paceTargetsFromApp(),
    mastery:masteryFromApp()
  };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=WK+".json"; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},120);
}

// ── GLOBAL CALENDAR ────────────────────────────────────────────────
function calFmtDate(d){ return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function calFmtRange(s,e){ return s===e?calFmtDate(s):calFmtDate(s)+" – "+calFmtDate(e); }
function calGenId(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/_+$/,"")+"_"+Date.now().toString(36); }
function calToday(){ return new Date().toISOString().slice(0,10); }

function getSchoolDays(startDate, endDate, schoolDaysOfWeek, kidId){
  if(!startDate||!endDate) return {total:0,off:0,school:0,details:[]};
  const dayMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  const allowedDows=new Set((schoolDaysOfWeek||["Mon","Tue","Wed","Thu","Fri"]).map(d=>dayMap[d]));
  const holidays=calendarData.holidays||{};
  const vacations=calendarData.vacations||{};
  const overrides=(kidId&&calendarData.kidOverrides&&calendarData.kidOverrides[kidId])||{};
  const offDates=new Set();
  Object.values(holidays).forEach(h=>{
    if(!h.start) return;
    const s=new Date(h.start+"T12:00:00"), e=new Date((h.end||h.start)+"T12:00:00");
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)) offDates.add(d.toISOString().slice(0,10));
  });
  Object.values(vacations).forEach(v=>{
    if(!v.start) return;
    const s=new Date(v.start+"T12:00:00"), e=new Date((v.end||v.start)+"T12:00:00");
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)) offDates.add(d.toISOString().slice(0,10));
  });
  let total=0, school=0, off=0;
  const cur=new Date(startDate+"T12:00:00"), end=new Date(endDate+"T12:00:00");
  for(;cur<=end;cur.setDate(cur.getDate()+1)){
    const iso=cur.toISOString().slice(0,10);
    const dow=cur.getDay();
    if(!allowedDows.has(dow)) continue;
    total++;
    const ov=overrides[iso];
    if(ov){
      if(ov.school===true){ school++; }
      else if(ov.school===false){ off++; }
      else if(offDates.has(iso)){ off++; } else { school++; }
    } else if(offDates.has(iso)){ off++; }
    else { school++; }
  }
  return {total, school, off};
}

function calNavMonth(dir){
  const now=new Date();
  if(!calPreviewMonth) calPreviewMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const[y,m]=calPreviewMonth.split("-").map(Number);
  const nd=new Date(y,m-1+dir,1);
  calPreviewMonth=nd.getFullYear()+"-"+String(nd.getMonth()+1).padStart(2,"0");
  renderAll();
}
function calRenderMonthPreview(){
  const now=new Date();
  let year,month;
  if(calPreviewMonth){
    [year,month]=calPreviewMonth.split("-").map(Number);
    month=month-1;
  } else {
    year=now.getFullYear(); month=now.getMonth();
  }
  const monthName=new Date(year,month).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayIso=calToday();
  const holidays=calendarData.holidays||{}, vacations=calendarData.vacations||{};
  const offDates=new Set();
  Object.values(holidays).forEach(h2=>{
    if(!h2.start)return;
    const s=new Date(h2.start+"T12:00:00"),e=new Date((h2.end||h2.start)+"T12:00:00");
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)) offDates.add(d.toISOString().slice(0,10));
  });
  const vacDates=new Set();
  Object.values(vacations).forEach(v=>{
    if(!v.start)return;
    const s=new Date(v.start+"T12:00:00"),e=new Date((v.end||v.start)+"T12:00:00");
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)) vacDates.add(d.toISOString().slice(0,10));
  });
  let h='<div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:20px">';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
  h+='<button class="smap-nav-btn" onclick="calNavMonth(-1)">&#8249;</button>';
  h+='<div class="gcal-month-label" style="margin:0">'+monthName+'</div>';
  h+='<button class="smap-nav-btn" onclick="calNavMonth(1)">&#8250;</button>';
  h+='</div>';
  h+='<div class="gcal-month-grid">';
  ["S","M","T","W","T","F","S"].forEach(d=>{ h+='<div class="gcal-month-hdr">'+d+'</div>'; });
  for(let i=0;i<firstDay;i++) h+='<div class="gcal-month-day outside"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const iso=new Date(year,month,d).toISOString().slice(0,10);
    const dow=new Date(year,month,d).getDay();
    const isWeekend=dow===0||dow===6;
    const isHol=offDates.has(iso);
    const isVac=vacDates.has(iso);
    const isToday=iso===todayIso;
    let cls="gcal-month-day";
    if(isToday) cls+=" today";
    if(isHol) cls+=" holiday";
    else if(isVac) cls+=" off";
    else if(isWeekend) cls+=" outside";
    else cls+=" school";
    h+='<div class="'+cls+'">'+d+'</div>';
  }
  h+='</div></div>';
  return h;
}

  calAddMode=null; calEditId=null;
  renderAll();

      if(!rows) rows=`<div style="padding:8px;color:#aaa;font-size:8pt;text-align:center">—</div>`;
      cols+=`<div style="border:1px solid #ccc;border-radius:3px;overflow:hidden">
        <div style="background:#2c5f8a;color:#fff;font-weight:bold;font-size:10pt;padding:4px 8px;text-align:center">${names[kid]}</div>
        ${rows}
      </div>`;
    }

    pages+=`<div style="width:100%;page-break-after:always;padding:8px 10px 4px">
      <div style="background:#1a1a1a;color:#fff;font-size:11pt;font-weight:bold;padding:5px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">
        <span>${day.charAt(0).toUpperCase()+day.slice(1)} — ${dateStr}</span>
        <span style="font-size:8pt;font-weight:normal;color:#ccc">${window_}</span>
      </div>
      ${constraintHtml}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">${cols}</div>
      <div style="margin-top:6px;font-size:7.5pt;color:#666;text-align:right">★ Mom Required &nbsp;&nbsp; ◆ May need Mom</div>
    </div>`;

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${(WK||"week").replace("week","Week ")} Schedule</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:9pt;color:#222}

// Debounced cascade scheduler — collapses multiple rapid listener fires into one cascade run.
// Only runs when BOTH checked and tasks have been loaded from Firebase.
function schedCascade(){
  clearTimeout(cascadeDebounce);
  cascadeDebounce=setTimeout(()=>{
    if(fbCheckedLoaded&&fbTasksLoaded&&fbHistoryLoaded){
      cascadeIntraWeek();
      runCascade();
    }
  },2000);
}

function cascadeIntraWeek(){
  const dayOrder=["monday","tuesday","wednesday","thursday","friday","saturday"];
  const JS_DAY_MAP={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
  const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  const jsDay=new Date().getDay()||7;
  let today=null;
  for(const d of dayOrder){
    if(DAY_DT[d]){
      const cal=new Date(DAY_DT[d]+", "+todayMid.getFullYear()); cal.setHours(0,0,0,0);
      if(cal.getTime()===todayMid.getTime()){ today=d; break; }
    } else if(JS_DAY_MAP[d]===jsDay){ today=d; break; }
  }
  if(!today) return;
  const todayIdx=dayOrder.indexOf(today);

  // Self-heal: checked tasks should have t.day matching where they were checked
  weekData.tasks.forEach(t=>{
    if(!checked[t.id]||t.id.endsWith("_c")) return;
    const h=histState[t.id];
    if(h&&h.checkedOnDay&&h.checkedOnDay!=="carryover"&&h.checkedOnDay!==t.day){
      dbg("cascade heal: "+t.id+" day "+t.day+" → "+h.checkedOnDay);
      t.day=h.checkedOnDay;
    }
  });

  // Collect unchecked tasks from past days (don't move them yet)
  const pastTasks=[];
  weekData.tasks.forEach(t=>{
    if(t.id.endsWith("_c")) return;
    if(checked[t.id]) return;
    const idx=dayOrder.indexOf(t.day);
    if(idx<0||idx>=todayIdx) return;
    let isPast=false;
    if(DAY_DT[t.day]){
      const cal=new Date(DAY_DT[t.day]+", "+todayMid.getFullYear()); cal.setHours(0,0,0,0);
      isPast=cal<todayMid;
    } else { isPast=(JS_DAY_MAP[t.day]||0)<jsDay; }
    if(!isPast) return;
    t.cascadedFrom=t.cascadedFrom||t.day;
    pastTasks.push(t);
  });
  if(!pastTasks.length) return;

  const r=rulesData||{};
  const sd=r.schoolDay||{};
  const mag=weekData.babysitter||{};
  const sitterKids=mag.withSitter||(rulesData&&rulesData.withSitter)||[];
  const wf=(r.workflow)||{};

  // Workflow-aware sort weight — matches _wfWeight in runDisplacement
  function cascadeWeight(t,dn){
    const title=(t.title||"").toLowerCase();
    if(title.includes("closing notebook")) return 1000;
    if(title.includes("morning notebook")) return -1;
    // Check curriculum "first"/"last" rules
    const cs=currData&&currData.subjects&&currData.subjects[t.who];
    if(cs){for(const sk in cs){if((cs[sk].rules||"").includes("first")){const lbl=(cs[sk].label||sk.replace(/_/g," ")).toLowerCase();if(title.includes(lbl)) return -1;}}}
    const kidWf=wf[t.who];
    if(!kidWf) return 500;
    const useSitter=!!(mag.days&&mag.days.indexOf(dn)>=0);
    const steps=(useSitter?kidWf.babysitter:kidWf.normal)||kidWf.normal||[];
    const subj=taskSubject(t).toLowerCase();
    // Subject-name match first
    for(let i=0;i<steps.length;i++){
      const subs=steps[i].subjects||[];
      for(let j=0;j<subs.length;j++){ if(subj.includes(subs[j].toLowerCase())) return i*10+j; }
    }
    // Fallback: tier match
    const tier=taskTier(t);
    for(let i=0;i<steps.length;i++){ if(steps[i].tier===tier) return i*10+9; }
    return 500;
  }

  // Distribute past unchecked tasks across today→Saturday via the shared packer.
  // Each day packs around the tasks already there; whatever doesn't fit chains to the
  // next day. Kids pack in parallel, duration-aware (no proportional-slot hack), and
  // calendar off-days are skipped per kid (decision #9).
  function _cascDate(dn){
    if(!DAY_DT[dn]) return null;
    const d=new Date(DAY_DT[dn]+", "+todayMid.getFullYear());
    if(isNaN(d.getTime())) return null;
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  let pool=pastTasks.slice();
  for(let di=todayIdx; di<dayOrder.length&&pool.length; di++){
    const dn=dayOrder[di];
    const sdOv=(sd.overrides||{})[dn]||{};
    const dStart=toMin(sdOv.start||sd.defaultStart||"10:00 AM");
    const dEnd=toMin(sdOv.end||sd.defaultEnd||"4:15 PM");
    const lunchS=toMin(sdOv.lunchStart||sd.lunchStart||"1:00 PM");
    const lunchE=toMin(sdOv.lunchEnd||sd.lunchEnd||"2:00 PM");
    const isSitterDay=mag.days&&mag.days.includes(dn);
    const sitterReturn=isSitterDay?toMin(mag["mom_return_"+dn]||mag.mom_return||"2:00 PM"):0;
    const dStr=_cascDate(dn);
    const offHere=t=>!!(dStr&&smapIsKidOff(t.who,dStr)); // holiday/vacation/kid-off → wait for a later day
    const tryHere=pool.filter(t=>!offHere(t));
    if(!tryHere.length) continue;
    // Order by kid then workflow weight (mirrors the prior per-kid blocks).
    tryHere.sort((a,b)=> (a.who<b.who?-1:a.who>b.who?1:0) || (cascadeWeight(a,dn)-cascadeWeight(b,dn)));
    // Tasks already on this day (not part of the cascade pool) get packed around.
    const poolSet=new Set(pool);
    const existing=weekData.tasks.filter(t=>t.day===dn&&!t.id.endsWith("_c")&&!poolSet.has(t));
    tryHere.forEach(t=>{ t.day=dn; });
    const isLast=(di===dayOrder.length-1);
    const kidStart={}; if(isSitterDay) sitterKids.forEach(k=>{ kidStart[k]=sitterReturn; });
    const overflow=packAround(existing,tryHere,{start:dStart,end:dEnd,lunchStart:lunchS,lunchEnd:lunchE,
      momStart:sitterReturn,kidStart:kidStart,allowOvertime:isLast,overtimeMax:240});
    const overflowSet=new Set(overflow);
    pool=pool.filter(t=>overflowSet.has(t)||offHere(t)); // carry overflow + off-here tasks to the next day
  }

  // Safety net: anything still unplaced (e.g. off every remaining day) stacks at Saturday's end.
  if(pool.length){
    const sdOvSat=(sd.overrides||{})["saturday"]||{};
    const dEndSat=toMin(sdOvSat.end||sd.defaultEnd||"4:15 PM");
    pool.forEach(t=>{ t.day="saturday"; t.time=fromMin(dEndSat-20); });
  }

  // ── Lesson-order pass: ensure sequential lessons stay in day order ──
  // For any subject that has a cascaded task, collect all tasks for that
  // subject+kid, sort lessons naturally, sort slots by day, then assign
  // so earlier lessons always land on earlier (or same) days.
  const subjectGroups={};
  weekData.tasks.forEach(t=>{
    if(t.id.endsWith("_c")) return;
    const subj=taskSubject(t);
    const key=t.who+"|"+subj;
    if(!subjectGroups[key]) subjectGroups[key]=[];
    subjectGroups[key].push(t);
  });

  // Extract lesson detail from title (part after " — ")
  function lessonKey(t){
    const m=(t.title||"").match(/—\s*(.+)$/);
    return m?m[1].trim():"";
  }
  // Natural sort: "4d" < "4e" < "5a" < "L2-7" < "L2-8"
  function natCmp(a,b){
    const ra=/(\d+)|(\D+)/g;
    const pa=a.match(ra)||[], pb=b.match(ra)||[];
    for(let i=0;i<Math.max(pa.length,pb.length);i++){
      const xa=pa[i]||"", xb=pb[i]||"";
      const na=parseInt(xa), nb=parseInt(xb);
      if(!isNaN(na)&&!isNaN(nb)){ if(na!==nb) return na-nb; }
      else{ const c=xa.localeCompare(xb); if(c!==0) return c; }
    }
    return 0;
  }

  for(const key in subjectGroups){
    const grp=subjectGroups[key];
    // Only reorder groups that have at least one cascaded task
    if(!grp.some(t=>t.cascadedFrom)) continue;
    // Only reorder among UNCHECKED tasks — checked ones are done, don't touch them
    const uncheckedGrp=grp.filter(t=>!checked[t.id]);
    if(uncheckedGrp.length<2) continue;

    // Sort by lesson detail (natural order)
    const byLesson=[...uncheckedGrp].sort((a,b)=>natCmp(lessonKey(a),lessonKey(b)));

    // Sort by day+time order (the slots)
    const dayIdx=d=>dayOrder.indexOf(d);
    const bySlot=[...uncheckedGrp].sort((a,b)=>{
      if(a.day!==b.day) return dayIdx(a.day)-dayIdx(b.day);
      return toMin(a.time)-toMin(b.time);
    });

    // Check if order already matches — skip if so
    let needSwap=false;
    for(let i=0;i<byLesson.length;i++){
      if(byLesson[i].id!==bySlot[i].id){ needSwap=true; break; }
    }
    if(!needSwap) continue;

    // Swap: assign lesson content to slots in order
    // Keep each slot's day/time/cascadedFrom, move the lesson content
    const slots=bySlot.map(t=>({day:t.day,time:t.time,cascadedFrom:t.cascadedFrom}));
    for(let i=0;i<byLesson.length;i++){
      const t=byLesson[i];
      t.day=slots[i].day;
      t.time=slots[i].time;
      // Preserve cascadedFrom only if this task was actually cascaded
      if(slots[i].cascadedFrom && !t.cascadedFrom) t.cascadedFrom=slots[i].cascadedFrom;
      else if(!slots[i].cascadedFrom && t.cascadedFrom) delete t.cascadedFrom;
    }
  }

  sv(WK+"_tasks",weekData.tasks);
  safeWriteTasks("cascade");
  renderAll();
}

function runCascade(){
  if(!fbHistoryLoaded||!fbCheckedLoaded||!fbTasksLoaded) return;
  // GC: remove checked/history entries that don't belong to any current task
  const taskIds=new Set(weekData.tasks.map(x=>x.id));
  if(taskIds.size>0){
    let gcCount=0;
    for(const id in checked){ if(!taskIds.has(id)){ delete checked[id]; gcCount++; } }
    for(const id in histState){ if(!taskIds.has(id)){ delete histState[id]; gcCount++; } }
    if(gcCount){
      sv(WK+"_checked",checked); sv(WK+"_history",histState);
      lastCheckedWrite=Date.now();
      if(db){ db.ref(WK+"/checked").set(checked); db.ref(WK+"/history").set(histState); }
      dbg("gc: purged "+gcCount+" orphan entries");
    }
  }
  const toRestore={};
  const histUpdates={};
  const currentIds=taskIds;
  weekData.tasks.forEach(t=>{
    if(checked[t.id]) return;
    if(manualUnchecks.has(t.id)) return;
    const h=histState[t.id];
    if(h&&h.ts&&!h.missed&&!h.flag&&(!h.week||h.week===WK)){ toRestore[t.id]=h.ts; return; }
    if(t.title&&t.who){
      const cutoff=Date.now()-7*24*60*60*1000;
      for(const k in histState){
        if(currentIds.has(k)) continue;
        const v=histState[k];
        if(!v||!v.ts||v.missed||v.flag) continue;
        if(v.title!==t.title||v.who!==t.who||v.day!==t.day) continue;
        if(v.week&&v.week!==WK) continue;
        const tsMs=(typeof v.ts==="number")?v.ts:new Date(v.ts).getTime();
        if(tsMs<cutoff) continue;
        toRestore[t.id]=v.ts;
        if(!histState[t.id]){ histUpdates[t.id]={...v,id:t.id,week:WK}; histState[t.id]=histUpdates[t.id]; }
        break;
      }
    }
  });
  if(Object.keys(toRestore).length){
    Object.assign(checked,toRestore);
    sv(WK+"_checked",checked);
    lastCheckedWrite=Date.now();
    if(db) db.ref(WK+"/checked").update(toRestore);
    if(Object.keys(histUpdates).length){
      sv(WK+"_history",histState);
      if(db) db.ref(WK+"/history").update(histUpdates);
    }
    dbg("reconciled "+Object.keys(toRestore).length+" checks from history");
    renderAll();
  }
}
