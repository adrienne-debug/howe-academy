var actExtras = [];  // holds activities loaded from JSON uploads
var actFavs = {};
var actFilter = 'all';
var actFavOnly = false;
var actUploadMsg = '';

function actAllItems(){ return ACT_BASE.concat(actExtras); }

function actCatColor(id){ for(var i=0;i<ACT_CATS.length;i++) if(ACT_CATS[i].id===id) return ACT_CATS[i].color; return '#888'; }
function actCatLabel(id){ for(var i=0;i<ACT_CATS.length;i++) if(ACT_CATS[i].id===id) return ACT_CATS[i].label; return id; }

function toggleActFav(id){
  actFavs[id]=!actFavs[id];
  if(!actFavs[id]) delete actFavs[id];
  try{localStorage.setItem('act_favs',JSON.stringify(actFavs));}catch(e){}
  if(db) db.ref("act_favs").set(actFavs);
  if(tab==='activities'){ renderActFilters(); renderActCards(); }
}

function loadActJson(){
  var f=document.getElementById('act-json-input').files[0];
  var msg=document.getElementById('act-upload-msg');
  if(!f){if(msg)msg.textContent='No file selected.';return;}
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      var arr=Array.isArray(d)?d:(d.activities||[]);
      if(!arr.length){if(msg)msg.textContent='❌ No activities found. Expecting an array or {activities:[...]}';return;}
      var added=0;
      arr.forEach(function(a){
        if(!a.id||!a.cat||!a.t||!a.d) return;
        var exists=actExtras.find(function(x){return x.id===a.id;});
        if(!exists){actExtras.push(a);added++;}
      });
      actUploadMsg='✅ Added '+added+' new activities ('+actExtras.length+' total extras).';
      if(msg) msg.textContent=actUploadMsg;
      renderActCards();
    }catch(err){
      actUploadMsg='❌ '+err.message;
      if(msg) msg.textContent=actUploadMsg;
    }
  };
  r.readAsText(f);
}

function renderActivities(el){
  // Only build the full shell if it doesn't exist yet (first load or tab switch)
  if(!document.getElementById('act-upload-bar')){
    el.innerHTML=
      '<div id="act-upload-bar">'+
        '<input type="file" id="act-json-input" accept=".json"/>'+
        '<button class="btn-p" onclick="loadActJson()" style="white-space:nowrap">+ Add JSON</button>'+
        '<button class="act-fav-btn" id="act-fav-toggle" onclick="toggleActFavOnly()">★ Favorites</button>'+
        '<div id="act-upload-msg"></div>'+
      '</div>'+
      '<div class="act-search-row">'+
        '<input type="text" id="act-search" placeholder="Search activities…" oninput="renderActCards()"/>'+
      '</div>'+
      '<div class="act-filter-row" id="act-filter-row"></div>'+
      '<div class="act-count" id="act-count"></div>'+
      '<div class="act-grid" id="act-grid"></div>';
    // Restore upload message if there was one
    if(actUploadMsg){ var m=document.getElementById('act-upload-msg'); if(m) m.textContent=actUploadMsg; }
  }
  // Always refresh the dynamic parts
  renderActFilters();
  renderActCards();
}

function renderActFilters(){
  var fb=document.getElementById('act-filter-row');
  if(!fb) return;
  var h='<button class="act-fbtn'+(actFilter==='all'?' on':'')+'" style="'+(actFilter==='all'?'background:#111827;color:#fff;border-color:transparent;':'')+'" onclick="setActFilter(\'all\')">All</button>';
  ACT_CATS.forEach(function(c){
    var on=actFilter===c.id;
    h+='<button class="act-fbtn'+(on?' on':'')+'" style="'+(on?'background:'+c.color+';color:#fff;border-color:transparent;':'')+'" onclick="setActFilter(\''+c.id+'\')">'+c.label+'</button>';
  });
  fb.innerHTML=h;
  var favBtn=document.getElementById('act-fav-toggle');
  if(favBtn) favBtn.className='act-fav-btn'+(actFavOnly?' on':'');
}

function renderActCards(){
  var grid=document.getElementById('act-grid');
  var countEl=document.getElementById('act-count');
  if(!grid||!countEl) return;
  var all=actAllItems();
  var searchEl=document.getElementById('act-search');
  var q=searchEl?searchEl.value.toLowerCase():'';
  var items=all.filter(function(a){
    if(actFilter!=='all'&&a.cat!==actFilter) return false;
    if(actFavOnly&&!actFavs[a.id]) return false;
    if(q&&a.t.toLowerCase().indexOf(q)===-1&&a.d.toLowerCase().indexOf(q)===-1&&actCatLabel(a.cat).toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  countEl.textContent=items.length+' of '+all.length+' activities';
  if(!items.length){
    grid.innerHTML='<div class="act-empty">No activities match — try a different filter or search.</div>';
    return;
  }
  var cards='';
  items.forEach(function(a){
    var starred=!!actFavs[a.id];
    var color=actCatColor(a.cat);
    cards+='<div class="act-card'+(starred?' starred':'')+'">'+
      '<button class="act-star" onclick="toggleActFav(\''+a.id+'\')">'+(starred?'★':'☆')+'</button>'+
      '<div class="act-cat-row"><span class="act-dot" style="background:'+color+'"></span><span class="act-cat-lbl">'+actCatLabel(a.cat)+'</span></div>'+
      '<div class="act-title">'+a.t+'</div>'+
      '<div class="act-desc">'+a.d+'</div>'+
      '</div>';
  });
  grid.innerHTML=cards;
}

function setActFilter(id){ actFilter=id; renderActFilters(); renderActCards(); }
function toggleActFavOnly(){ actFavOnly=!actFavOnly; renderActFilters(); renderActCards(); }

}

}

// Build cumulative expected counts from curriculum data
function buildCurrPaceCum(){
  currPaceCum={};
  currPaceCumBase={};
  if(!currData||!currData.weekDays||!currData.lessons||!currData.subjects) return;
  for(const kid of Object.keys(currData.subjects)){
    currPaceCum[kid]={};
    currPaceCumBase[kid]={};
    const wdMap=currData.weekDays[kid]||{};
    const lessons=currData.lessons[kid]||{};
    const subjectKeys=Object.keys(currData.subjects[kid]||{});
    // Collect all week numbers, sorted
    const weekNums=Object.keys(wdMap).map(w=>{const m=w.match(/Wk\s*(\d+)/i);return m?parseInt(m[1]):0;}).filter(n=>n>0);
    weekNums.sort((a,b)=>a-b);
    for(const sk of subjectKeys){
      let cum=0,cumBase=0;
      const byWk={},byWkBase={};
      for(const wn of weekNums){
        const dayNums=wdMap["Wk "+wn]||[];
        for(const d of dayNums){
          const l=lessons[d]; if(!l) continue;
          const date=l.date||"";
          if(l[sk]) cumBase++; // original Excel plan, as written
          // Expected pace honors the calendar and Lesson Map edits: off days and
          // removed slots don't count; manually added slots do.
          const off=date&&(smapIsKidOff(kid,date)||schedOvKidOff(kid,date));
          const ovv=date?(schedOv(date,kid)||{}):{};
          if(l[sk]&&!off&&!(ovv.removed||{})[sk]) cum++;
          if(!off&&(ovv.added||{})[sk]) cum++;
        }
        byWk[wn]=cum;byWkBase[wn]=cumBase;
      }
      currPaceCum[kid][sk]=byWk;
      currPaceCumBase[kid][sk]=byWkBase;
    }
  }
}

// Get current app week number from WK variable (e.g. "week8" → 8)
function currWeekNum(){
  const m=(WK||"").match(/(\d+)/);
  return m?parseInt(m[1]):1;
}

// Get curriculum-based expected count for a subject through a given week
function currExpected(kid,subjectKey,weekNum){
  const byWk=(currPaceCum[kid]||{})[subjectKey];
  if(!byWk) return null;
  // Find the closest week <= weekNum
  let best=null;
  for(const wn of Object.keys(byWk)){
    const n=parseInt(wn);
    if(n<=weekNum&&(best===null||n>best)) best=n;
  }
  return best!==null?byWk[best]:null;
}

// Same as currExpected but against the ORIGINAL Excel plan (no calendar/edits)
function currExpectedBase(kid,subjectKey,weekNum){
  const byWk=(currPaceCumBase[kid]||{})[subjectKey];
  if(!byWk) return null;
  let best=null;
  for(const wn of Object.keys(byWk)){
    const n=parseInt(wn);
    if(n<=weekNum&&(best===null||n>best)) best=n;
  }
  return best!==null?byWk[best]:null;
}

// Get keyword for auto-counting: prefer curriculum display name, fall back to pace subject keyword
function currKeyword(kid,subjectKey,paceSubj){
  if(currData&&currData.subjects&&currData.subjects[kid]&&currData.subjects[kid][subjectKey]){
    return currData.subjects[kid][subjectKey].display;
  }
  return paceSubj?paceSubj.keyword:"";
}

function paceStatus(current,total,startWeek,weekNum,totalWeeks,expected){
  if(!total) return "on-track";
  // Use curriculum expected count when available
  if(expected!==null&&expected!==undefined){
    const diff=current-expected;
    if(diff>=3) return "ahead";
    if(diff<=-3) return "behind";
    return "on-track";
  }
  // Fallback: linear estimate
  const sw=startWeek||1;
  if(weekNum<sw) return "not-started";
  const weeksActive=weekNum-sw+1;
  const weeksTotal=Math.max(1,totalWeeks-sw+1);
  const diff=(current/total)-(weeksActive/weeksTotal);
  if(diff>0.08) return "ahead";
  if(diff<-0.08) return "behind";
  return "on-track";
}

function paceStatusLabel(s){
  return s==="ahead"?"Ahead":s==="behind"?"Behind":s==="not-started"?"Not Started":"On Track";

function generateSessionMap(planKey){
  const plan=(paceData.plans||{})[planKey];
  if(!plan||!plan.start||!plan.end) return {error:"Plan not found or missing dates"};
  const kids=plan.kids||[];
  if(!kids.length) return {error:"No kids in this plan"};
  const schoolDayNames=plan.schoolDays||["Mon","Tue","Wed","Thu","Fri"];
  const WDAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  const kidSubs={};
  let subjectCount=0;
  for(const kid of kids){
    kidSubs[kid]={};
    const subs=(currData&&currData.subjects&&currData.subjects[kid])||{};
    for(const[sk,s] of Object.entries(subs)){
      if(s.paused||!s.timesPerWeek) continue;
      kidSubs[kid][sk]={tpw:s.timesPerWeek,allowed:s.allowedDays||[],display:s.display||sk};
      subjectCount++;
    }
  }
  if(!subjectCount) return {error:"No subjects have timesPerWeek set. Edit subjects in Curriculum to set pacing."};

  const holidays=calendarData.holidays||{};
  const vacations=calendarData.vacations||{};
  const kidOverrides=calendarData.kidOverrides||{};

  function isGlobalOff(dateStr){
    for(const h of Object.values(holidays)){
      if(dateStr>=(h.start||h.date)&&dateStr<=(h.end||h.start||h.date)) return true;
    }
    for(const v of Object.values(vacations)){
      if(dateStr>=v.start&&dateStr<=v.end) return true;
    }
    return false;
  }
  function isKidOff(kid,dateStr){
    const ov=(kidOverrides[kid]||{})[dateStr];
    if(ov&&ov.school===false) return true;
    if(ov&&ov.school===true) return false;
    return isGlobalOff(dateStr);
  }

  const map={};
  let weekBuf=[];
  let weekCount=0;
  let schoolDayCount=0;
  const cur=new Date(plan.start+"T12:00:00");
  const end=new Date(plan.end+"T12:00:00");

  function flushWeek(){
    if(!weekBuf.length) return;
    weekCount++;
    for(const kid of kids){
      const subs=kidSubs[kid]||{};
      for(const[sk,cfg] of Object.entries(subs)){
        const eligible=weekBuf.filter(wd=>{
          if(isKidOff(kid,wd.date)) return false;
          if(cfg.allowed.length&&!cfg.allowed.includes(wd.dayName)) return false;
          return true;
        });
        if(!eligible.length) continue;
        const count=Math.min(cfg.tpw,eligible.length);
        const step=eligible.length/count;
        for(let i=0;i<count;i++){
          const idx=Math.min(Math.floor(i*step),eligible.length-1);
          const d=eligible[idx].date;
          if(!map[d]) map[d]={};
          if(!map[d][kid]) map[d][kid]={};
          map[d][kid][sk]=true;
        }
      }
    }
    weekBuf=[];
  }

  while(cur<=end){
    const dateStr=cur.toISOString().slice(0,10);
    const dayName=WDAY[cur.getDay()];
    if(schoolDayNames.includes(dayName)&&!isGlobalOff(dateStr)){
      weekBuf.push({date:dateStr,dayName});
      schoolDayCount++;
    }
    if(cur.getDay()===0||cur.getTime()===end.getTime()) flushWeek();
    cur.setDate(cur.getDate()+1);
  }
  flushWeek();

  const stats={subjectCount,schoolDays:schoolDayCount,weeks:weekCount,kids:kids.length};
  const result={map,generatedAt:new Date().toISOString(),stats,planLabel:plan.label};
  sessionMapData[planKey]=result;
  try{localStorage.setItem("ha_sessionMaps",JSON.stringify(sessionMapData));}catch(e){}
  if(db) db.ref("sessionMaps/"+planKey).set(result);
  return result;
}

  if(db) db.ref("sessionMaps/"+planKey).remove();
  renderAll();
}

function smapGetWeekDates(plan,weekOffset){
  const sd=plan.schoolDays||["Mon","Tue","Wed","Thu","Fri"];
  const WDAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const today=new Date();today.setHours(12,0,0,0);
  const monday=new Date(today);
  monday.setDate(monday.getDate()-((today.getDay()+6)%7)+(weekOffset*7));
  const dates=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const dn=WDAY[d.getDay()];

    dates.push({date:ds,dayName:dn,dayLabel:d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),isOff,isPast:ds<today.toISOString().slice(0,10),isToday:ds===today.toISOString().slice(0,10)});
  }
  return dates;
}

// String range compares only work on zero-padded YYYY-MM-DD; normalize so
// entries saved as "2026-6-2", with ISO time suffixes, or via legacy field
// names still match.
function calNormDate(d){
  if(!d) return null;
  const m=String(d).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):String(d);
}
function smapIsOff(dateStr){
  const ds=calNormDate(dateStr);
  for(const v of Object.values(calendarData.holidays||{})){
    const s=calNormDate(v.start||v.date), e=calNormDate(v.end||v.start||v.date);
    if(s&&ds>=s&&ds<=e) return v.name||"Holiday";
  }
  for(const v of Object.values(calendarData.vacations||{})){
    const s=calNormDate(v.start||v.date), e=calNormDate(v.end||v.start||v.date);
    if(s&&ds>=s&&ds<=e) return v.name||"Vacation";
  }
  return null;
}

function smapIsKidOff(kid,dateStr){

  const o=ov[dateStr];
  if(o&&o.school===false) return o.note||"Off";

}

function setSchedOverride(dateStr,kid,mut){

  mut(scheduleOverrides[dateStr][kid]);

  if(!o.dayOff){ delete o.dayOff; delete o._gwOff; }
  if(o._gwRm){
    for(const sk of Object.keys(o._gwRm)){ if(!o.removed||!o.removed[sk]) delete o._gwRm[sk]; }
    if(!Object.keys(o._gwRm).length) delete o._gwRm;
  }

}

// On commit, record the generation's one-off shape choices (skip-days, Saturday
// left off, car-school drops) as auto-tagged overrides so pace drift, Finish
// Line, suggestions, and the Lesson Map all see the week as actually planned.
// Auto entries are cleared and rewritten on every commit of that week; manual
// Lesson Map edits are never touched.
function gwSyncConfigOverrides(weekNum,config,dropped){
  const range=gwWeekDateRange(weekNum);
  if(!range) return;
  const KIDS=["lincoln","ellis","lucy","julian"];
  const dayDate={};
  const mon=gwParseDate(range.start);
  ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"].forEach((dn,i)=>{
    const dt=new Date(mon); dt.setDate(dt.getDate()+i);
    dayDate[dn]=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  });
  // 1) Clear this week's previous auto entries
  for(const dateStr of Object.keys(scheduleOverrides||{})){
    if(dateStr<range.start||dateStr>range.end) continue;
    for(const kid of Object.keys(scheduleOverrides[dateStr]||{})){
      const o=scheduleOverrides[dateStr][kid];
      if(o._gwOff){ delete o.dayOff; delete o._gwOff; }
      if(o._gwRm){
        for(const sk of Object.keys(o._gwRm)){ if(o.removed) delete o.removed[sk]; }
        delete o._gwRm;
      }
      if(o.removed&&!Object.keys(o.removed).length) delete o.removed;
      if(o.added&&!Object.keys(o.added).length) delete o.added;
      if(!Object.keys(o).length) delete scheduleOverrides[dateStr][kid];
    }
    if(!Object.keys(scheduleOverrides[dateStr]).length) delete scheduleOverrides[dateStr];
  }
  // 2) Skip-days → auto day off for everyone
  const offDays=(config.skipDays||[]).map(d=>d.toLowerCase());
  // Saturday left off counts as a cut only when the grid planned Saturday lessons
  if(!config.saturday){
    const satDate=dayDate.saturday;
    let satPlanned=false;
    if(currData&&currData.lessons){
      for(const kid of Object.keys(currData.lessons)){
        const lessons=currData.lessons[kid]||{};
        for(const dn of Object.keys(lessons)){ if(lessons[dn]&&lessons[dn].date===satDate){ satPlanned=true; break; } }
        if(satPlanned) break;
      }
    }
    if(satPlanned) offDays.push("saturday");
  }
  offDays.forEach(dn=>{
    const dateStr=dayDate[dn]; if(!dateStr) return;
    KIDS.forEach(kid=>{
      if(!scheduleOverrides[dateStr]) scheduleOverrides[dateStr]={};
      if(!scheduleOverrides[dateStr][kid]) scheduleOverrides[dateStr][kid]={};
      scheduleOverrides[dateStr][kid].dayOff=true;
      scheduleOverrides[dateStr][kid]._gwOff=true;
    });
  });
  // 3) Car-school drops → auto removed slots
  (dropped||[]).forEach(dp=>{
    if(!dp||!dp.reason||dp.reason.indexOf("car school")<0) return;
    const dateStr=dayDate[(dp.day||"").toLowerCase()]; if(!dateStr||!dp.kid||!dp.key) return;
    if(!scheduleOverrides[dateStr]) scheduleOverrides[dateStr]={};
    if(!scheduleOverrides[dateStr][dp.kid]) scheduleOverrides[dateStr][dp.kid]={};
    const o=scheduleOverrides[dateStr][dp.kid];
    if(!o.removed) o.removed={};
    if(!o._gwRm) o._gwRm={};
    o.removed[dp.key]=true;
    o._gwRm[dp.key]=true;
  });
  saveScheduleOverrides();
  buildCurrPaceCum();
}

// ── WEEK SHAPE SIGNATURE: detect structure edits made AFTER a week was built ──
// Snapshot of the resolved pattern is stored at commit; if Lesson Map or
// Calendar edits later change the active week's pattern, a banner offers
// one-tap regeneration (last-minute schedule changes, forgotten edits).
let committedShapeSigs={}; // {weekLabel: signature-at-commit}
// SHAPESIG_START (node-harness extraction boundary)
// Canonical JSON: recursively sort object keys so equal data always stringifies the
// same way (Firebase can return keys in a different order between sessions).
function _sortKeysDeep(x){
  if(Array.isArray(x)) return x.map(_sortKeysDeep);
  if(x&&typeof x==="object"){ const o={}; Object.keys(x).sort().forEach(k=>{o[k]=_sortKeysDeep(x[k]);}); return o; }
  return x;
}
// Placement signature: inputs that DON'T move a subject to a different day (so the slot
// signature below misses them) but DO change how the day packs, so editing them should
// nudge "regenerate to apply." Two parts: per-subject attrs (scoped to the subjects
// actually scheduled this week) + the global Rules the packers read.
function _placementSig(kids,slots,subjects,rd){
  const attrs=kids.map(k2=>{
    const ks=slots[k2]||{}, ksub=subjects[k2]||{};
    return [k2,Object.keys(ks).sort().map(sk=>{
      const s=ksub[sk]||{};
      return [sk,s.minutes,s.device,s.mom,s.stickyWith,s.stickyOrder,s.rules,s.category];
    })];
  });
  const rules={
    schoolDay:rd.schoolDay||null,                     // start/end/lunch + per-day overrides
    workflow:rd.workflow||null,                       // category order per kid
    overlap:rd.overlap||null,                         // never/ok simultaneous
    deviceQueue:(rd.devices&&rd.devices.queue)||null, // device priority tie-break
    maxPerDay:rd.maxPerDay||null,                     // includes saturday_max per subject
    saturday:rd.saturday||null,                       // reflex_max / lucy_max / computer_sequence
    nothingDropsOff:rd.nothingDropsOff||null
  };
  return JSON.stringify(_sortKeysDeep([attrs,rules]));
}
// Compare a current signature to a committed one. The slot part (before the \n) keeps the
// original byte-for-byte format and is always comparable; the placement part is only
// compared when the stored snapshot also carries it — so weeks committed before the
// signature was extended still get structure-drift detection, without a spurious banner
// the first time they're seen.
function _sigChanged(cur,stored){
  if(!stored||!cur||cur===stored) return false;
  const ci=cur.indexOf("\n"), si=stored.indexOf("\n");
  const curSlots=ci>=0?cur.slice(0,ci):cur, storedSlots=si>=0?stored.slice(0,si):stored;
  if(curSlots!==storedSlots) return true;   // a subject moved to a different day
  if(si<0) return false;                    // pre-extension snapshot: no placement baseline to diff
  return cur.slice(ci+1)!==stored.slice(si+1);
}
function weekShapeSig(weekNum){
  const r=resolveWeekSlots(weekNum);
  if(!r) return "";
  const kids=Object.keys(r.slots).sort();
  // Part 1 (unchanged format): which subject lands on which day, per kid.
  const slotsSig=JSON.stringify(kids.map(k2=>{
    const ks=r.slots[k2];
    return [k2,Object.keys(ks).sort().map(sk=>[sk,ks[sk]])];
  }));
  // Part 2: placement attrs + Rules. Joined by \n, which never appears literally in
  // JSON.stringify output, so the two parts stay cleanly separable for _sigChanged.
  return slotsSig+"\n"+_placementSig(kids,r.slots,(currData&&currData.subjects)||{},rulesData||{});
}
function weekShapeChanged(){
  const stored=committedShapeSigs[WK];
  if(!stored) return false;
  return _sigChanged(weekShapeSig(currWeekNum()),stored);
}

// Effective run order for a kid's day: the saved override (filtered to the
// subjects actually present) if any, else the generator's natural sequence —
// first rules, then device/category flow buckets, then last rules — so the
// first arrow tap freezes exactly what generation would do, changing only
// that one swap.
function lmDayRunOrder(kid,dateStr,lesson){
  if(lesson===undefined) lesson=lmLessonByDate(kid,dateStr);
  const ov=schedOv(dateStr,kid)||{};
  const subjects=((currData||{}).subjects||{})[kid]||{};
  const present=[];
  for(const sk of Object.keys(subjects)){
    if(subjects[sk].paused) continue;
    if(ov.removed&&ov.removed[sk]) continue;
    const hasExcel=lesson&&lesson[sk]&&lesson[sk]!=="—"&&lesson[sk]!=="nan";
    if(hasExcel||(ov.added&&ov.added[sk])) present.push(sk);
  }
  const saved=_normOrderArr(ov.order);
  if(saved&&saved.length){
    const out=[],seen={};
    for(const sk of saved){ if(present.includes(sk)&&!seen[sk]){ out.push(sk); seen[sk]=true; } }
    for(const sk of present){ if(!seen[sk]) out.push(sk); }
    return out;
  }
  // Default order: follow Rules → Workflow Orders (the same gwWorkflowRank the generator
  // uses), so the Lesson Map mirrors Rules and re-sorts whenever the workflow changes.
  // Equal ranks keep their present order (stable). Replaces the retired currData.flowOrder.
  return present.slice().sort((a,b)=>{
    const d=gwWorkflowRank(kid,a,subjects[a]||{},null,false)-gwWorkflowRank(kid,b,subjects[b]||{},null,false);
    return d||(present.indexOf(a)-present.indexOf(b));
  });
}
function lmNudgeSubj(kid,dateStr,sk,dir){
  const ord=lmDayRunOrder(kid,dateStr);
  const i=ord.indexOf(sk), j=i+dir;
  if(i<0||j<0||j>=ord.length) return;
  ord[i]=ord[j]; ord[j]=sk;
  setSchedOverride(dateStr,kid,o=>{ o.order=ord; });
  renderAll();
}
function lmResetOrder(kid,dateStr){
  setSchedOverride(dateStr,kid,o=>{ delete o.order; });
  renderAll();
}

// ── ALIGN WEEKS WITH CALENDAR ────────────────────────────────────────────────
// One confirmed action, all kids: slide lessons sitting on calendar breaks to
// the next school days (cascading the rest of the plan, skipping later breaks
// it runs into), then renumber week labels so "Wk N" means the same calendar
// week for every kid. Break weeks keep their number and show as off — visible
// but nothing scheduled (the Lucy pattern, by request).
function lmWeekAnchor(){
  const t=gwParseDate(_todayStr());
  t.setDate(t.getDate()-((t.getDay()+6)%7));
  return {mon:t,num:currWeekNum()};
}
function lmWeekNumOfDate(ds){
  const a=lmWeekAnchor();
  const d=gwParseDate(ds); d.setDate(d.getDate()-((d.getDay()+6)%7));
  return a.num+Math.round((d-a.mon)/(7*86400000));
}
function lmWeekMonday(weekNum){
  const a=lmWeekAnchor();
  const d=new Date(a.mon); d.setDate(d.getDate()+(weekNum-a.num)*7);
  return d;
}
function alignPlanPreview(){
  const out={any:false,kids:{}};
  if(!currData||!currData.lessons||!currData.weekDays) return out;
  const F=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const today=_todayStr();
  for(const kid of Object.keys(currData.lessons)){
    const lessons=currData.lessons[kid]||{};
    const dns=Object.keys(lessons).map(Number).filter(n=>!isNaN(n)&&lessons[n]&&lessons[n].date).sort((a,b)=>a-b);
    if(!dns.length) continue;
    const wdSet=new Set(dns.map(dn=>gwParseDate(lessons[dn].date).getDay()));
    // old label per dayNum (authoritative: weekDays grouping)
    const oldLabel={};
    for(const w of Object.keys(currData.weekDays[kid]||{})){ for(const dn of currData.weekDays[kid][w]) oldLabel[dn]=w; }
    let prev=null, firstBreak=null, moved=0, onBreak=0;
    const newDates={};
    for(const dn of dns){
      const cur=lessons[dn].date;
      if(cur<today){ newDates[dn]=cur; prev=cur; continue; } // past stays put
      const off=smapIsOff(cur);
      if(off){ onBreak++; firstBreak=firstBreak||off; }
      // Never earlier than planned: candidate = max(own date, day after the
      // previous slot). Displaced lessons cascade forward; planned gaps in
      // the grid absorb the slippage instead of being compacted away.
      let d=gwParseDate(cur);
      if(prev){ const pd=gwParseDate(prev); pd.setDate(pd.getDate()+1); if(pd>d) d=pd; }
      while(true){
        const ds=F(d);
        if(wdSet.has(d.getDay())&&!smapIsOff(ds)) break;
        d.setDate(d.getDate()+1);
      }
      const ds=F(d);
      newDates[dn]=ds; if(ds!==cur) moved++;
      prev=ds;
    }
    // relabel everything by calendar week of its (new) date
    const newWeekDays={}, weekFieldFix={};
    let relabeled=0;
    for(const dn of dns){
      const lbl="Wk "+lmWeekNumOfDate(newDates[dn]);
      if(!newWeekDays[lbl]) newWeekDays[lbl]=[];
      newWeekDays[lbl].push(dn);
      if(oldLabel[dn]!==lbl) relabeled++;
      if(lessons[dn].week!==undefined&&lessons[dn].week!==lbl) weekFieldFix[dn]=lbl;
    }
    for(const lbl of Object.keys(newWeekDays)) newWeekDays[lbl].sort((a,b)=>a-b);
    if(moved||relabeled){
      out.any=true;
      out.kids[kid]={moved,onBreak,relabeled,firstBreak,
        oldEnd:lessons[dns[dns.length-1]].date,newEnd:newDates[dns[dns.length-1]],
        newDates,newWeekDays,weekFieldFix};
    }
  }
  return out;
}
function alignPlanApply(){
  const p=alignPlanPreview();
  if(!p.any){ if(typeof gwShowToast==="function") gwShowToast("Weeks already aligned with the calendar."); return; }
  let msg="Align everyone's weeks with the calendar?\n";
  for(const kid of Object.keys(p.kids)){
    const k=p.kids[kid];
    msg+="\n"+cap(kid)+": ";
    if(k.onBreak) msg+=k.onBreak+" lessons sit on "+(k.firstBreak||"break")+" days — everything after slides to the next school days (last day "+k.oldEnd+" → "+k.newEnd+").";
    else msg+="week numbers renumber to match the calendar ("+k.relabeled+" slots).";
  }
  msg+="\n\nBreak weeks will show as off with nothing scheduled. Weeks already generated on the Schedule are not touched.";
  if(!confirm(msg)) return;
  const updates={};
  for(const kid of Object.keys(p.kids)){
    const k=p.kids[kid];
    for(const dn of Object.keys(k.newDates)){
      if(k.newDates[dn]!==currData.lessons[kid][dn].date){
        currData.lessons[kid][dn].date=k.newDates[dn];
        updates["lessons/"+kid+"/"+dn+"/date"]=k.newDates[dn];
      }
    }
    for(const dn of Object.keys(k.weekFieldFix)){
      currData.lessons[kid][dn].week=k.weekFieldFix[dn];
      updates["lessons/"+kid+"/"+dn+"/week"]=k.weekFieldFix[dn];
    }
    currData.weekDays[kid]=k.newWeekDays;
    updates["weekDays/"+kid]=k.newWeekDays;
  }
  currData.lastEdit=new Date().toISOString();
  updates["lastEdit"]=currData.lastEdit;
  db.ref("curriculum").update(updates);
  buildCurrPaceCum();
  if(typeof gwShowToast==="function") gwShowToast("Weeks aligned — break weeks are now empty for everyone.");
  renderAll();
}
// Synthesized view for a week label with no slots (a break week after
// alignment): visible day cards, holiday name, nothing scheduled.
function lmRenderOffWeek(k,col,weekNum){
  const mon=lmWeekMonday(weekNum);
  const lessons=(currData.lessons||{})[k]||{};
  const wdSet=new Set(Object.keys(lessons).map(dn=>lessons[dn]&&lessons[dn].date?gwParseDate(lessons[dn].date).getDay():null).filter(x=>x!==null));
  if(!wdSet.size) [1,2,3,4,5].forEach(x=>wdSet.add(x));
  let h='<div style="font-weight:700;font-size:13px;margin-bottom:8px">Wk '+weekNum+' &mdash; no school</div>';
  let why=null;
  const cards=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(d.getDate()+i);
    if(!wdSet.has(d.getDay())) continue;
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const off=smapIsKidOff(k,ds);
    if(off&&!why) why=off;
    cards.push({ds,label:d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),off});
  }
  h+='<div style="background:#e0f2fe;border-left:4px solid #0369a1;border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:10px;font-size:12px;color:#0c4a6e">';
  h+='<span style="font-weight:800">'+esc(why||"Break")+'.</span> Nothing is scheduled this week &mdash; lessons continue on the next school day.';
  h+='</div>';
  cards.forEach(c=>{
    h+='<div style="background:#f8f7f4;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:6px;opacity:0.75">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<div style="font-weight:700;font-size:12px">'+c.label+(c.off?' <span style="color:#0369a1;font-weight:600;font-size:10px">&middot; '+esc(c.off)+'</span>':'')+'</div>';
    h+='<div style="font-size:11px;color:var(--muted)">'+c.ds+'</div>';
    h+='</div></div>';
  });
  return h;
}

// ── LIVE SCHEDULE MIRROR: surface this week's checkmarks on the Lesson Map ──
// Strikes follow lesson content (auto-advance cursor), so when a kid is
// catching up the strike lands on the oldest open slot — possibly another
// day's card. This answers the other question, "was this subject checked off
// on THIS day's schedule?", straight from the live checked state.
function lmSchedCheckState(kid,sk,dateStr){
  if(!dateStr||!weekData||!weekData.tasks||!weekData.tasks.length) return null;
  const sig=WK+"|"+JSON.stringify(DAY_DT);
  if(lmSchedCheckState._sig!==sig){
    const m={}; const yr=new Date().getFullYear();
    (DAYS||[]).forEach(d=>{
      if(!DAY_DT[d]) return;
      const dt=new Date(DAY_DT[d]+", "+yr);
      if(isNaN(dt.getTime())) return;
      m[dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")]=d;
    });
    if(!Object.values(m).includes("saturday")&&DAY_DT.friday){
      const fd=new Date(DAY_DT.friday+", "+yr);
      if(!isNaN(fd.getTime())){
        fd.setDate(fd.getDate()+1);
        m[fd.getFullYear()+"-"+String(fd.getMonth()+1).padStart(2,"0")+"-"+String(fd.getDate()).padStart(2,"0")]="saturday";
      }
    }
    lmSchedCheckState._map=m; lmSchedCheckState._sig=sig;
  }
  const dayName=lmSchedCheckState._map[dateStr];
  if(!dayName) return null; // date outside the live schedule week
  const paceSubj=((paceData.subjects||{})[kid]||{})[sk];
  const kws=paceKeywords(kid,sk,paceSubj).map(s=>String(s).toLowerCase().trim());
  if(!kws.length) return null;
  let has=false,done=false,title=null;
  for(const t of weekData.tasks){
    if(t.who!==kid||(t.day||"")!==dayName) continue;
    if(!kws.some(kw=>(t.title||"").toLowerCase().includes(kw))) continue;
    has=true;
    if(chainDone(t.id,checked,weekData.tasks)){ done=true; if(!title) title=t.title; }
  }
  return has?{done,title}:null;
}

// Shared week→day Move picker, used by By Subject rows and By Week day cards.

  const today=_todayStr();

  p+='<div style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">Move to&hellip;</div>';

    (weekDays[lmMoveWeek]||[]).forEach(d2=>{
      const l2=lessons[d2]; if(!l2||!l2.date) return;
      const date2=l2.date;
      if(date2<today) return;
      if(smapIsKidOff(k,date2)||schedOvKidOff(k,date2)) return;
      const ov2=schedOv(date2,k)||{};
      const hasIt=(l2[sk]&&l2[sk]!=="—"&&l2[sk]!=="nan"&&!(ov2.removed&&ov2.removed[sk]))||(ov2.added&&ov2.added[sk]);
      p+='<button onclick="lmMoveSlot(\''+k+'\',\''+sk+'\',\''+date2+'\')" style="padding:3px 8px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:10px;cursor:pointer;font-family:\'DM Sans\',sans-serif">'+fmtD(date2)+(hasIt?' &#9888;':'')+'</button>';
    });
    p+='</div>';
    p+='<div style="font-size:9px;color:var(--muted);margin-top:4px">&#9888; = already has this subject that day</div>';
  }
  p+='</div>';
  return p;
}

function lmOpenMove(date,isAdded,sk){

function lmPickMoveWeek(wk){ lmMoveWeek=wk; renderAll(); }
// Moving a slot = remove it from the old date + add it on the new one (or
// un-remove on the target if it was removed there before). Same override
// layer the generator, pace drift, and Finish Line already respect.
function lmMoveSlot(kid,sk,toDate){
  if(!lmMovePick) return;
  const fromDate=lmMovePick.date, wasAdded=lmMovePick.added;
  if(toDate!==fromDate){
    setSchedOverride(toDate,kid,o=>{
      if(o.removed&&o.removed[sk]) delete o.removed[sk];
      else { if(!o.added)o.added={}; o.added[sk]=true; }
    });
    setSchedOverride(fromDate,kid,o=>{
      if(wasAdded){ if(o.added) delete o.added[sk]; }
      else { if(!o.removed)o.removed={}; o.removed[sk]=true; }
    });
  }
  lmMovePick=null; lmMoveWeek=null;
  renderAll();
}

        if(!hasExcel) rows+='<button onclick="lmAddSubj(\''+k+'\',\''+date+'\',\''+sk+'\')" style="background:none;border:none;color:#9ca3af;font-size:13px;font-weight:700;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0">&times;</button>';
      }
      rows+='</div>';
      if(lmMovePick&&lmMovePick.date===date&&lmMovePick.sk===sk) rows+=lmRenderMovePicker(k,sk,col,weekLabels,weekDays,lessons);
    });
    if(rows){
      h+='<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px">';
      h+='<div style="font-weight:700;font-size:11px;margin-bottom:4px;color:'+col+'">'+wk+'</div>'+rows+'</div>';
    }
  });

  // Beyond-grid make-up days (created by Finish Line "Extend")
  let ext='';
  Object.keys(scheduleOverrides||{}).sort().forEach(date=>{
    const ov=schedOv(date,k);
    if(!ov||!ov.added||!ov.added[sk]||gridDates.has(date)) return;
    ext+='<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px">';
    ext+='<span style="color:var(--muted);width:86px;flex-shrink:0">'+fmtD(date)+'</span>';
    ext+='<span style="flex:1"><span style="font-size:9px;font-weight:800;color:#7c3aed;background:#f5f3ff;border-radius:6px;padding:1px 5px">EXTENDED</span></span>';
    ext+='<button onclick="lmAddSubj(\''+k+'\',\''+date+'\',\''+sk+'\')" style="background:none;border:none;color:#9ca3af;font-size:13px;font-weight:700;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0">&times;</button>';
    ext+='</div>';
  });
  if(ext){
    h+='<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px">';
    h+='<div style="font-weight:700;font-size:11px;margin-bottom:4px;color:#7c3aed">Extended days</div>'+ext+'</div>';
  }
  return h;
}

// Suggest make-up slots for a week's cut days / removed subjects.
// Suggest-and-confirm: nothing is added until mom taps Add (writes an `added` override).
// carryoverCap (per subject, default 2) limits how many make-up slots get suggested.
function lmComputeSuggestions(k,weekLabel){
  if(!currData||!currData.subjects) return [];
  const lessons=(currData.lessons||{})[k]||{};
  const dayNums=((currData.weekDays||{})[k]||{})[weekLabel]||[];
  const subs=currData.subjects[k]||{};
  const WD={0:"Sun",1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri",6:"Sat"};
  const days=[];
  for(const d of dayNums){
    const l=lessons[d]; if(!l||!l.date) continue;
    const ov=schedOv(l.date,k)||{};
    const off=!!ov.dayOff||!!smapIsKidOff(k,l.date);
    const present={};
    Object.keys(subs).forEach(sk=>{ if(l[sk]&&l[sk]!=="—"&&l[sk]!=="nan"&&!(ov.removed||{})[sk]&&!subs[sk].paused) present[sk]=true; });
    Object.keys(ov.added||{}).forEach(sk=>{ present[sk]=true; });
    days.push({date:l.date,off,present,ov,excel:l});
  }
  // Lost slots this week: whole off days + individually removed subjects
  const lost={};
  days.forEach(dy=>{
    if(dy.off){
      Object.keys(subs).forEach(sk=>{ if(dy.excel[sk]&&dy.excel[sk]!=="—"&&dy.excel[sk]!=="nan"&&!subs[sk].paused) lost[sk]=(lost[sk]||0)+1; });
    } else {
      Object.keys(dy.ov.removed||{}).forEach(sk=>{ if(dy.excel[sk]) lost[sk]=(lost[sk]||0)+1; });
    }
  });
  // Slots already added back this week count as compensation
  days.forEach(dy=>{ if(!dy.off) Object.keys(dy.ov.added||{}).forEach(sk=>{ if(lost[sk]) lost[sk]--; }); });
  const gwR=gwRules();
  const dayCap=(gwR.schoolEnd-gwR.schoolStart)-((gwR.lunchEnd||0)-(gwR.lunchStart||0));
  const sugg=[];
  for(const sk of Object.keys(lost)){
    const s=subs[sk]; if(!s||s.paused) continue;
    const maxSugg=(s.carryoverCap!==undefined&&s.carryoverCap!==null)?s.carryoverCap:2;
    let need=Math.min(lost[sk],maxSugg);
    if(need<=0) continue;
    const al=s.allowedDays||[]; const rl=s.rules||"";
    const isSeq=rl.includes("sequential");
    const tryDays=(allowSecond)=>{
      for(const dy of days){
        if(need<=0) break;
        if(dy.off) continue;
        const abbr=WD[gwParseDate(dy.date).getDay()];
        if(al.length&&abbr&&!al.includes(abbr)) continue;
        if(rl.includes("no-fri")&&abbr==="Fri") continue;
        if(rl.includes("mon-thu")&&["Fri","Sat","Sun"].includes(abbr)) continue;
        if(!allowSecond&&dy.present[sk]) continue;
        if(allowSecond&&(!dy.present[sk]||(dy.ov.added||{})[sk])) continue;
        let mins=0;
        Object.keys(dy.present).forEach(psk=>{ mins+=(subs[psk]&&subs[psk].minutes)||20; });
        if(mins+(s.minutes||20)>dayCap) continue;
        sugg.push({sk,date:dy.date,display:s.display||sk,second:allowSecond});
        dy.present[sk]=true;
        need--;
      }
    };
    tryDays(false);
    if(need>0&&isSeq) tryDays(true); // sequential subjects may double up as a 2nd lesson
  }
  return sugg;
}

function smapGetSubjects(planKey,dateStr,kid){
  const sm=sessionMapData[planKey];
  if(!sm||!sm.map) return [];
  const overrides=(sm.overrides||{})[dateStr]||{};
  const kidOv=overrides[kid]||{};
  const autoSubs=(sm.map[dateStr]||{})[kid]||{};
  const result=[];
  for(const sk of Object.keys(autoSubs)){
    if(kidOv[sk]&&kidOv[sk].removed) result.push({key:sk,type:"removed"});
    else result.push({key:sk,type:"auto"});
  }
  for(const sk of Object.keys(kidOv)){
    if(kidOv[sk]&&kidOv[sk].added&&!autoSubs[sk]) result.push({key:sk,type:"override"});
  }
  return result;
}

function smapRemoveSubject(planKey,dateStr,kid,sk){
  const sm=sessionMapData[planKey];
  if(!sm) return;
  if(!sm.overrides) sm.overrides={};
  if(!sm.overrides[dateStr]) sm.overrides[dateStr]={};
  if(!sm.overrides[dateStr][kid]) sm.overrides[dateStr][kid]={};
  const kidOv=sm.overrides[dateStr][kid];
  if(kidOv[sk]&&kidOv[sk].added){delete kidOv[sk];}
  else{kidOv[sk]={removed:true};}
  smapSaveOverrides(planKey);
  renderAll();
}

function smapRestoreSubject(planKey,dateStr,kid,sk){
  const sm=sessionMapData[planKey];
  if(!sm||!sm.overrides) return;
  const kidOv=((sm.overrides[dateStr]||{})[kid]);
  if(kidOv) delete kidOv[sk];
  smapSaveOverrides(planKey);
  renderAll();
}

function smapAddSubject(planKey,dateStr,kid,sk){
  const sm=sessionMapData[planKey];
  if(!sm) return;
  if(!sm.overrides) sm.overrides={};
  if(!sm.overrides[dateStr]) sm.overrides[dateStr]={};
  if(!sm.overrides[dateStr][kid]) sm.overrides[dateStr][kid]={};
  sm.overrides[dateStr][kid][sk]={added:true};
  smapAddDate=null;smapAddKid=null;
  smapSaveOverrides(planKey);
  renderAll();
}

function smapResetWeek(planKey,dates){
  const sm=sessionMapData[planKey];
  if(!sm||!sm.overrides) return;
  for(const d of dates) delete sm.overrides[d.date];
  smapSaveOverrides(planKey);
  renderAll();
}

function smapSaveOverrides(planKey){
  const sm=sessionMapData[planKey];
  if(!sm) return;
  try{localStorage.setItem("ha_sessionMaps",JSON.stringify(sessionMapData));}catch(e){}
  if(db) db.ref("sessionMaps/"+planKey+"/overrides").set(sm.overrides||{});
}

function smapOpenAdd(planKey,dateStr,kid){
  smapAddDate=dateStr;smapAddKid=kid;
  renderAll();
}

function smapCloseAdd(){
  smapAddDate=null;smapAddKid=null;
  renderAll();
}

function smapRenderEditor(planKey,plan){

  const today=new Date().toISOString().slice(0,10);
  const planStart=plan.start||"";
  const planEnd=plan.end||"";
  const weekStart=dates.length?dates[0].date:"";
  const weekEnd=dates.length?dates[dates.length-1].date:"";
  const inRange=weekEnd>=planStart&&weekStart<=planEnd;
  const hasOverrides=dates.some(d=>{
    const ov=(sm.overrides||{})[d.date];
    return ov&&Object.keys(ov).length;
  });

  h+='<div class="smap-wrap">';
  h+='<div class="smap-nav">';
  h+='<button class="smap-nav-btn" onclick="smapNav(-1)">‹</button>';
  h+='<div style="text-align:center">';
  h+='<div class="smap-nav-label">'+(smapViewWeek===0?"This Week":smapViewWeek===1?"Next Week":smapViewWeek===-1?"Last Week":(smapViewWeek>0?smapViewWeek+" weeks ahead":Math.abs(smapViewWeek)+" weeks ago"))+'</div>';
  if(dates.length) h+='<div class="smap-nav-dates">'+dates[0].dayLabel+' – '+dates[dates.length-1].dayLabel+'</div>';
  h+='</div>';
  h+='<button class="smap-nav-btn" onclick="smapNav(1)">›</button>';
  h+='</div>';

  if(!inRange){
    h+='<div style="text-align:center;padding:20px;font-size:11px;color:var(--muted)">Outside session range ('+plan.start+' to '+plan.end+')</div>';
    h+='</div>';
    return h;
  }

  const cols=Math.min(dates.length,5);
  h+='<div class="smap-grid" style="grid-template-columns:repeat('+cols+',1fr)">';
  for(const d of dates){
    const cls='smap-day'+(d.isPast?' past':'')+(d.isToday?' today':'');
    const offReason=smapIsOff(d.date);
    h+='<div class="'+cls+'">';
    h+='<div class="smap-day-hdr"><span>'+d.dayName+'</span><span style="font-weight:400;font-size:9px">'+d.date.slice(5)+'</span></div>';
    if(offReason){
      h+='<div class="smap-day-off">'+offReason+'</div>';
    }
    for(const kid of kids){
      const kidOff=smapIsKidOff(kid,d.date);
      if(kidOff&&!offReason){h+='<div class="smap-kid-label" style="background:'+KCOL[kid]+'">'+cap(kid)+'</div><div class="smap-day-off">'+kidOff+'</div>';continue;}
      if(offReason) continue;
      const subs=smapGetSubjects(planKey,d.date,kid);
      if(!subs.length&&!d.isPast) continue;
      h+='<div class="smap-kid-label" style="background:'+KCOL[kid]+'">'+cap(kid)+'</div>';
      const subjectData=(currData&&currData.subjects&&currData.subjects[kid])||{};
      for(const s of subs){
        const display=(subjectData[s.key]&&subjectData[s.key].display)||s.key;
        const short=display.length>14?display.slice(0,13)+'…':display;
        if(s.type==="removed"){
          h+='<span class="smap-chip removed" title="Removed — tap to restore" onclick="smapRestoreSubject(\''+planKey+'\',\''+d.date+'\',\''+kid+'\',\''+s.key+'\')">'+short+'</span>';
        } else if(s.type==="override"){
          h+='<span class="smap-chip override" title="Added — tap to remove" onclick="smapRemoveSubject(\''+planKey+'\',\''+d.date+'\',\''+kid+'\',\''+s.key+'\')">'+short+'</span>';
        } else {
          if(d.isPast) h+='<span class="smap-chip auto">'+short+'</span>';
          else h+='<span class="smap-chip auto" title="Tap to remove" onclick="smapRemoveSubject(\''+planKey+'\',\''+d.date+'\',\''+kid+'\',\''+s.key+'\')">'+short+'</span>';
        }
      }
      if(!d.isPast) h+='<button class="smap-add-btn" onclick="smapOpenAdd(\''+planKey+'\',\''+d.date+'\',\''+kid+'\')">+</button>';
    }
    h+='</div>';
  }
  h+='</div>';

  if(hasOverrides) h+='<div style="text-align:center;margin-top:8px"><button class="smap-reset-btn" onclick="smapResetWeek(\''+planKey+'\','+JSON.stringify(dates).replace(/"/g,"'")+')">Reset Week</button></div>';
  h+='</div>';

  // Add subject sheet
  if(smapAddDate&&smapAddKid){
    const existing=smapGetSubjects(planKey,smapAddDate,smapAddKid).filter(s=>s.type!=="removed").map(s=>s.key);
    const allSubs=(currData&&currData.subjects&&currData.subjects[smapAddKid])||{};
    const available=Object.entries(allSubs).filter(([k,s])=>!s.paused&&!existing.includes(k)).sort((a,b)=>(a[1].display||a[0]).localeCompare(b[1].display||b[0]));
    h+='<div class="smap-add-sheet">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-weight:700;font-size:13px">Add Subject — '+smapAddDate.slice(5)+'</span><button style="background:none;border:none;font-size:18px;cursor:pointer" onclick="smapCloseAdd()">✕</button></div>';
    h+='<div style="font-size:11px;color:var(--muted);margin-bottom:6px">'+cap(smapAddKid)+' — '+available.length+' available</div>';
    h+='<div class="smap-add-list">';
    for(const[sk,s] of available){
      h+='<div class="smap-add-item" onclick="smapAddSubject(\''+planKey+'\',\''+smapAddDate+'\',\''+smapAddKid+'\',\''+sk+'\')">';
      h+='<span>'+(s.display||sk)+'</span>';
      h+='<span style="font-size:10px;color:var(--muted)">'+(s.timesPerWeek?s.timesPerWeek+'×/wk':'')+(s.total?' · '+s.total+' lessons':'')+'</span>';
      h+='</div>';
    }
    if(!available.length) h+='<div style="padding:12px;text-align:center;color:var(--muted);font-size:11px">All subjects already assigned</div>';
    h+='</div></div>';
  }

  return h;
}

function smapRenderMonth(planKey,plan){
  const sm=sessionMapData[planKey];
  const kids=plan.kids||[];
  const KCOL={lincoln:"#1e3a5f",ellis:"#2d5a3d",lucy:"#5b3a8c",julian:"#c45e1a"};
  const today=new Date().toISOString().slice(0,10);
  if(!smapMonth) smapMonth=today.slice(0,7);
  const[yr,mo]=smapMonth.split("-").map(Number);
  const monthLabel=new Date(yr,mo-1,1).toLocaleString("default",{month:"long",year:"numeric"});
  const first=new Date(yr,mo-1,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(yr,mo,0).getDate();

  let h='<div class="smap-wrap">';
  h+='<div class="smap-nav">';
  const prev=mo===1?(yr-1)+"-12":yr+"-"+String(mo-1).padStart(2,"0");
  const next=mo===12?(yr+1)+"-01":yr+"-"+String(mo+1).padStart(2,"0");
  h+='<button class="smap-nav-btn" onclick="smapMonth=\''+prev+'\';renderAll()">‹</button>';
  h+='<div class="smap-nav-label">'+monthLabel+'</div>';
  h+='<button class="smap-nav-btn" onclick="smapMonth=\''+next+'\';renderAll()">›</button>';
  h+='</div>';

  h+='<div class="smap-month-grid">';
  ["S","M","T","W","T","F","S"].forEach(d=>h+='<div class="smap-month-hdr">'+d+'</div>');
  for(let i=0;i<startDow;i++) h+='<div class="smap-month-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds=yr+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const isPast=ds<today;
    const isToday=ds===today;
    const off=smapIsOff(ds);
    const inRange=ds>=(plan.start||"")&&ds<=(plan.end||"");
    const cls="smap-month-cell"+(isPast?" past":"")+(isToday?" today":"")+(off?" off":"");
    h+='<div class="'+cls+'">';
    h+='<div class="smap-month-num">'+d+'</div>';
    if(inRange&&!off){
      h+='<div class="smap-month-dots">';
      for(const kid of kids){
        const subs=smapGetSubjects(planKey,ds,kid);
        const active=subs.filter(s=>s.type!=="removed");
        if(active.length) h+='<span class="smap-dot" style="background:'+KCOL[kid]+'" title="'+cap(kid)+': '+active.length+' subjects"></span>';
      }
      h+='</div>';
    }
    if(off) h+='<div class="smap-month-off"></div>';
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

function smapRenderSession(planKey,plan){
  const sm=sessionMapData[planKey];
  const kids=plan.kids||[];
  const KCOL={lincoln:"#1e3a5f",ellis:"#2d5a3d",lucy:"#5b3a8c",julian:"#c45e1a"};
  const today=new Date().toISOString().slice(0,10);
  const start=plan.start||today;
  const end=plan.end||today;
  const totalDays=Math.max(1,Math.round((new Date(end)-new Date(start))/86400000));

  let h='<div class="smap-wrap">';
  h+='<div style="text-align:center;margin-bottom:10px"><span class="smap-nav-label" style="font-size:13px">Session Timeline</span><br><span style="font-size:10px;color:var(--muted)">'+start+' → '+end+' ('+totalDays+' days)</span></div>';

  for(const kid of kids){
    const allSubs=(currData&&currData.subjects&&currData.subjects[kid])||{};
    const mapped=Object.entries(allSubs).filter(([k,s])=>s.timesPerWeek&&!s.paused).sort((a,b)=>(a[1].display||a[0]).localeCompare(b[1].display||b[0]));
    if(!mapped.length) continue;

    h+='<div style="margin-bottom:12px">';
    h+='<div style="font-weight:700;font-size:12px;color:'+KCOL[kid]+';margin-bottom:6px">'+cap(kid)+'</div>';

    for(const[sk,s] of mapped){
      const display=s.display||sk;
      const total=s.total||0;
      let scheduled=0;
      const mapDates=Object.keys(sm.map||{}).sort();
      for(const dt of mapDates){
        if((sm.map[dt]||{})[kid]&&sm.map[dt][kid][sk]) scheduled++;
      }
      const ov=sm.overrides||{};
      for(const dt of Object.keys(ov)){
        if(ov[dt][kid]){
          if((ov[dt][kid].removed||[]).includes(sk)) scheduled--;
          if((ov[dt][kid].added||[]).includes(sk)) scheduled++;
        }
      }
      const done=s.cursor||0;
      const pctDone=total?Math.round(done/total*100):0;
      const pctSched=total?Math.round(scheduled/total*100):0;
      const todayPct=Math.min(100,Math.round(((new Date(today)-new Date(start))/86400000)/totalDays*100));
      const status=pctDone>=100?"Done":pctDone>pctSched*0.9?"On Track":pctDone>pctSched*0.5?"Behind":"At Risk";
      const stColor=status==="Done"?"#16a34a":status==="On Track"?"#2563eb":status==="Behind"?"#f59e0b":"#ef4444";

      h+='<div class="smap-session-row">';
      h+='<div class="smap-session-label">'+display+'<span style="font-size:9px;color:var(--muted);margin-left:6px">'+done+'/'+total+'</span></div>';
      h+='<div class="smap-session-bar">';
      h+='<div class="smap-session-fill scheduled" style="width:'+Math.min(pctSched,100)+'%"></div>';
      h+='<div class="smap-session-fill done" style="width:'+Math.min(pctDone,100)+'%;background:'+KCOL[kid]+'"></div>';
      if(todayPct>0&&todayPct<100) h+='<div class="smap-session-now" style="left:'+todayPct+'%" title="Today"></div>';
      h+='</div>';
      h+='<div class="smap-session-status" style="color:'+stColor+'">'+status+'</div>';
      h+='</div>';
    }
    h+='</div>';
  }

  h+='<div style="display:flex;gap:12px;justify-content:center;font-size:9px;color:var(--muted);margin-top:4px">';
  h+='<span>■ Scheduled</span><span>■ Completed</span><span>| Today</span>';
  h+='</div>';
  h+='</div>';
  return h;
}

// ── PACE AUTO-ADVANCE: lesson cursor from curriculum ──
// Build ordered sequence of lessons for a kid+subject from curriculum data
function buildSubjectLessons(kid,subjectKey){
  // Check Excel-based lessons first
  if(currData&&currData.lessons&&currData.lessons[kid]){
    const lessons=currData.lessons[kid];
    const seq=[];
    const dayNums=Object.keys(lessons).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
    for(const dn of dayNums){
      const entry=lessons[dn];
      if(!entry) continue;
      const val=entry[subjectKey];
      if(val&&val!=="—"&&val!=="nan"&&val.trim()){
        seq.push({dayNum:dn,lesson:val,date:entry.date||""});
      }
    }
    if(seq.length) return seq;
  }
  // Fall back to in-app lesson sequence (for subjects added via editor)
  const subj=currData&&currData.subjects&&currData.subjects[kid]&&currData.subjects[kid][subjectKey];
  if(subj&&subj.lessonSeq&&subj.lessonSeq.length){
    return subj.lessonSeq.map((l,i)=>({dayNum:90000+i,lesson:l,date:""}));
  }
  return [];
}

// Get the next upcoming lesson for a kid+subject based on auto-count cursor
function getNextLessons(kid,subjectKey,count){

  const paceSubj=((paceData.subjects||{})[kid]||{})[subjectKey];
  const kws=paceKeywords(kid,subjectKey,paceSubj);
  const autoC=paceAutoCount(kid,kws);
  const offset=(paceSubj&&paceSubj.offset)||0;
  const adjust=(paceSubj&&paceSubj.adjust)||0;
  const cursor=offset+autoC+adjust;
  // Return the next N lessons after the cursor
  const upcoming=[];
  for(let i=cursor;i<seq.length&&upcoming.length<(count||1);i++){
    upcoming.push(seq[i]);
  }
  return upcoming;
}

function parseTaskCount(title){
  let m=title.match(/pp\.\s*(\d+)\s*[–\-]\s*(\d+)/i);
  if(m) return Math.max(1,parseInt(m[2])-parseInt(m[1])+1);
  m=title.match(/\bMod(?:ules?)?\s+(\d+)\s*[–\-]\s*(\d+)/i);
  if(m) return Math.max(1,parseInt(m[2])-parseInt(m[1])+1);
  m=title.match(/\bMod(?:ules?)?\s+([\d][,\d\s]+)/i);
  if(m) return m[1].split(',').filter(x=>x.trim().match(/^\d+$/)).length||1;
  return 1;
}

function baseId(id){ let b=id; while(b.endsWith("_c"))b=b.slice(0,-2); return b; }
function histDone(id){
  // Check histState for a valid completion (not a missed/flag entry) on this id or any _c chain
  let cur=id;
  while(true){
    const e=histState[cur];
    if(e&&typeof e==="object"&&e.ts&&!e.missed&&!e.flag) return true;
    if(!cur.endsWith("_c")) break;
    cur=cur.slice(0,-2);
    if(cur===id) break; // safety
  }
  // Also check the original base id
  const base=baseId(id);
  const eb=histState[base];
  if(eb&&typeof eb==="object"&&eb.ts&&!eb.missed&&!eb.flag) return true;
  // Fallback: a JSON re-upload can renumber task IDs, so history entry may exist under an old ID.
  // Match by title+who on the current task being checked.
  const curTask=(weekData.tasks||[]).find(t=>t.id===id);
  if(curTask&&curTask.title&&curTask.who){
    for(const k in histState){
      const v=histState[k];
      if(v&&typeof v==="object"&&v.ts&&!v.missed&&!v.flag&&v.title===curTask.title&&v.who===curTask.who) return true;
    }
  }
  return false;
}
function chainDone(origId, checkedObj, tasksArr){
  if(checkedObj[origId]||histDone(origId)) return true;
  let id=origId+"_c";
  while(tasksArr.some(t=>t.id===id)){
    if(checkedObj[id]||histDone(id)) return true;
    id=id+"_c";
  }
  return false;
}
function effectiveDay(t){
  if(t.id.endsWith("_c")) return t.day;
  if(checked[t.id]){
    const h=histState[t.id];
    if(h&&h.checkedOnDay) return h.checkedOnDay;
    return t.day;
  }
  const order=["monday","tuesday","wednesday","thursday","friday","saturday"];
  const todayMid=new Date(); todayMid.setHours(0,0,0,0);
  const jsDay=new Date().getDay();
  let idx=order.indexOf(t.day);
  if(idx<0) return t.day;
  while(idx<order.length){
    const d=order[idx];
    let isPast=false;
    if(DAY_DT[d]){
      const cal=new Date(DAY_DT[d]+", "+todayMid.getFullYear());
      cal.setHours(0,0,0,0);
      isPast=cal<todayMid;
    } else {
      const dIdx={monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6}[d]||0;
      isPast=dIdx<(jsDay||7);
    }
    if(!isPast) return d;
    idx++;
  }
  return "carryover";
}
function currFirstWeekNum(){
  if(!currData||!currData.weekDays) return 1;
  let min=9999;
  for(const kid of Object.keys(currData.weekDays)){
    for(const wk of Object.keys(currData.weekDays[kid])){
      const n=parseInt((wk.match(/\d+/)||[0])[0])||0;
      if(n>0&&n<min) min=n;
    }
  }
  return min===9999?1:min;
}
function paceAutoCount(kid,keywords,excludeWeek){
  if(!keywords||!keywords.length) return 0;
  const kws=(typeof keywords==="string"?[keywords]:keywords).map(k=>k.toLowerCase().trim());
  const currStart=currFirstWeekNum();
  let count=0;
  if(!excludeWeek||excludeWeek!==WK){
    weekData.tasks.filter(t=>t.who===kid&&!t.id.endsWith("_c")).forEach(t=>{
      if(chainDone(t.id,checked,weekData.tasks)&&kws.some(kw=>(t.title||"").toLowerCase().includes(kw)))
        count+=1;
    });
  }
  Object.values(archive).forEach(aw=>{
    if(excludeWeek&&aw.weekLabel===excludeWeek) return;
    const awNum=parseInt(((aw.weekLabel||"").match(/\d+/)||[0])[0])||0;
    if(awNum>0&&awNum<currStart) return;
    const awChecked=aw.checked||{};
    const awTasks=aw.tasks||[];
    awTasks.filter(t=>t.who===kid&&!t.id.endsWith("_c")).forEach(t=>{
      if(chainDone(t.id,awChecked,awTasks)&&kws.some(kw=>(t.title||"").toLowerCase().includes(kw)))
        count+=1;
    });
  });
  return count;
}

function paceHasPendingCascade(kid,keywords){

  const kws=(typeof keywords==="string"?[keywords]:keywords).map(k=>k.toLowerCase().trim());

}

// ── FINISH LINE: projected completion per subject from the resolved pattern ──
function _todayStr(){
  const n=new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function _maxPlanWeek(){
  let mx=0;
  if(currData&&currData.weekDays){
    for(const kid of Object.keys(currData.weekDays)){
      for(const lbl of Object.keys(currData.weekDays[kid]||{})){
        const m=lbl.match(/Wk\s*(\d+)/i);
        if(m) mx=Math.max(mx,parseInt(m[1]));
      }
    }
  }
  return mx;
}
// Future slot dates per kid per subject, from this week forward (today onward).
// Walks resolveWeekSlots so calendar (and later, manual overrides) are respected.
function computeFutureSlots(){
  const out={};
  if(!currData||!currData.subjects) return out;
  const fromWk=currWeekNum(), maxWk=_maxPlanWeek(), today=_todayStr();
  for(let w=fromWk;w<=maxWk+52;w++){
    const resolved=resolveWeekSlots(w);
    if(!resolved){ if(w>maxWk) break; continue; }
    let any=false;
    for(const kid of Object.keys(resolved.slots)){
      if(!out[kid]) out[kid]={};
      const ks=resolved.slots[kid];
      for(const sk of Object.keys(ks)){
        if(!out[kid][sk]) out[kid][sk]=[];
        for(const d of ks[sk]){
          if(w===fromWk&&d<today) continue; // earlier this week — already past
          out[kid][sk].push(d);
          any=true;
        }
      }
    }
    if(w>maxWk&&!any) break; // past the grid and no synthesized slots — stop walking
  }
  for(const kid of Object.keys(out)) for(const sk of Object.keys(out[kid])) out[kid][sk].sort();
  return out;
}
function computeFinishLines(forKid){
  const rows=[];
  if(!currData||!currData.subjects) return rows;
  const kids=(forKid==="all"||forKid==="mom")?["lincoln","ellis","lucy","julian"]:[forKid];
  const future=computeFutureSlots();
  for(const kid of kids){
    const subs=currData.subjects[kid]||{};
    for(const sk of Object.keys(subs)){
      const s=subs[sk];
      if(!s||s.paused||s.tracking==="daily") continue;
      const seq=buildSubjectLessons(kid,sk);
      if(!seq.length) continue;
      let cursor=0;
      try{ cursor=computeSubjectCursor(kid,sk); }catch(e){}
      const remaining=Math.max(0,seq.length-cursor);
      const slots=(future[kid]||{})[sk]||[];
      const lastPlanned=slots.length?slots[slots.length-1]:null;
      let projDate=null, overflow=0, status;
      if(remaining===0){ status="done"; }
      else if(remaining<=slots.length){
        projDate=slots[remaining-1];
        status="ontime";
      } else {
        overflow=remaining-slots.length;
        // estimate past plan end using the subject's average weekly pace
        const weeksLeft=Math.max(1,_maxPlanWeek()-currWeekNum()+1);
        const perWeek=slots.length/weeksLeft;
        if(perWeek<=0){ status="stalled"; }
        else {
          const extraWeeks=Math.ceil(overflow/perWeek);
          const base=lastPlanned?gwParseDate(lastPlanned):new Date();
          base.setDate(base.getDate()+extraWeeks*7);
          projDate=base.getFullYear()+"-"+String(base.getMonth()+1).padStart(2,"0")+"-"+String(base.getDate()).padStart(2,"0");
          status="red";
        }
      }
      if(status==="ontime"&&lastPlanned&&projDate>lastPlanned) status="amber";
      // Target finish date (Curriculum → Finish Line Target): red only when
      // the projection slips past it; grid overflow that still lands by the
      // target is amber — those weeks just aren't planned yet. No target set
      // = old behavior (red on any grid overflow).
      const target=calNormDate(((currData.targetEnd||{})[kid])||null);
      if(target&&projDate){
        if(status==="red"&&projDate<=target) status="amber";
        else if((status==="ontime"||status==="amber")&&projDate>target) status="red";
      }
      rows.push({kid,sk,display:s.display||sk,remaining,slots:slots.length,lastPlanned,projDate,overflow,status,target});
    }
  }
  return rows;
}

// Finish Line "Extend": append make-up slots on synthesized weeks past the plan
// end, following the subject's usual weekday pattern. Show slip → extend on tap.
// Mom-only: the Pace tab is kid-visible, so extending requires Mom mode or the
// admin PIN (the button is hidden when locked; this guard backs it up).
function flExtendSubject(kid,sk){
  if(!momModeActive&&!adminPinUnlocked) return;
  if(!currData||!currData.subjects) return;
  const subs=currData.subjects[kid]||{};
  const s=subs[sk]; if(!s) return;
  const seq=buildSubjectLessons(kid,sk);
  let cursor=0; try{cursor=computeSubjectCursor(kid,sk);}catch(e){}
  const remaining=Math.max(0,seq.length-cursor);
  const have=(((computeFutureSlots()[kid])||{})[sk]||[]).length;
  let need=remaining-have;
  if(need<=0){ if(typeof gwShowToast==="function") gwShowToast((s.display||sk)+" already has enough planned slots."); return; }
  // Weekday pattern from grid history; fallback to allowedDays, then Mon–Fri
  const wdCounts={};
  const lessons=(currData.lessons||{})[kid]||{};
  for(const dn of Object.keys(lessons)){
    const l=lessons[dn];
    if(l&&l.date&&l[sk]&&l[sk]!=="—"&&l[sk]!=="nan"){ const wd=gwParseDate(l.date).getDay(); wdCounts[wd]=(wdCounts[wd]||0)+1; }
  }
  let wds=Object.keys(wdCounts).map(Number).sort((a,b)=>a-b);
  if(!wds.length){
    const M={Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0};
    const al=s.allowedDays||[];
    wds=al.length?al.map(a=>M[a]).filter(x=>x!=null):[1,2,3,4,5];
  }
  const mx=_maxPlanWeek();
  let wk=mx+1, added=0, guard=0, lastDate=null;
  while(need>0&&guard<60){
    const range=gwWeekDateRange(wk);
    if(!range) break;
    const mon=gwParseDate(range.start);
    for(const wd of wds){
      if(need<=0) break;
      const dt=new Date(mon); dt.setDate(dt.getDate()+((wd+6)%7));
      const f=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
      if(smapIsKidOff(kid,f)) continue;
      const cur=schedOv(f,kid)||{};
      if(cur.dayOff) continue;
      if(cur.added&&cur.added[sk]) continue;
      if(!scheduleOverrides[f]) scheduleOverrides[f]={};
      if(!scheduleOverrides[f][kid]) scheduleOverrides[f][kid]={};
      if(!scheduleOverrides[f][kid].added) scheduleOverrides[f][kid].added={};
      scheduleOverrides[f][kid].added[sk]=true;
      need--; added++; lastDate=f;
    }
    wk++; guard++;
  }
  if(added){
    saveScheduleOverrides();
    buildCurrPaceCum();
    if(typeof gwShowToast==="function") gwShowToast("Extended "+(s.display||sk)+": +"+added+" make-up slot"+(added>1?"s":"")+(lastDate?" through "+lastDate:""));
  }
  renderAll();
}

// Per-kid pace rollup, shared by the glance Pace view and Admin → Progress.
function paceKidPlan(k){

  for(const pk of Object.keys(plans)){ if((plans[pk].kids||[]).includes(k)) return plans[pk]; }

function paceKidStatus(k){
  const kidSubjs=(paceData.subjects&&paceData.subjects[k])||{};
  const _cs=(currData&&currData.subjects&&currData.subjects[k])||{};
  const keys=Object.keys(kidSubjs).filter(sk=>!(_cs[sk]&&_cs[sk].tracking==="daily")&&(kidSubjs[sk].total||0)>0);
  const plan=paceKidPlan(k);
  const weekNum=plan?planWeekNum(plan.start||"2026-04-20"):1;
  const totalWeeks=plan?planTotalWeeks(plan.start||"2026-04-20",plan.end||"2026-09-01"):40;
  const cwn=currWeekNum();
  let aheadN=0,onN=0,behindN=0; const behindSubs=[];
  keys.forEach(sk=>{
    const s=kidSubjs[sk]; const kws=paceKeywords(k,sk,s);
    const cur=(s.offset||0)+paceAutoCount(k,kws)+(s.adjust||0);
    const exp=currExpected(k,sk,cwn);
    const st=paceHasPendingCascade(k,kws)?"behind":paceStatus(cur,s.total||0,s.startWeek||1,weekNum,totalWeeks,exp);
    if(st==="ahead")aheadN++; else if(st==="behind"){behindN++; behindSubs.push(s.label||sk);} else if(st!=="not-started")onN++;
  });
  return {subjects:keys.length,aheadN,onN,behindN,behindSubs};
}
// This week's task completion for one kid (same countable rule as the weekly
// bar). The "core week" floor is the reassurance bar — distinct from ideal
// curriculum pace — so a kid behind the stretch still reads as success once
// the week's real work is done.
const PACE_CORE_FLOOR=80; // % of countable tasks that counts as "core week met"
function paceKidWeek(k){
  const cascAway=new Set(weekData.tasks.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  const countable=weekData.tasks.filter(t=>t.who===k&&(!cascAway.has(t.id)||!!checked[t.id])&&!(t.title||"").toLowerCase().includes("lunch"));
  const total=countable.length;
  const done=countable.filter(t=>chainDone(t.id,checked,weekData.tasks)).length;
  const pct=total?Math.round(done/total*100):0;
  return {done,total,pct,met:total>0&&pct>=PACE_CORE_FLOOR};
}

  if(withSub.length&&!single) parts.push(onPace+' of '+withSub.length+' kids on pace');
  parts.push(weeklyPct+'% of this week done');
  if(coreMet) parts.push(coreMet+(single?' core week met':' core week'+(coreMet>1?'s':'')+' met'));
  let nudge='';
  if(behind.length===1&&behind[0].st.behindN===1) nudge=' One nudge: '+(single?'':cap(behind[0].k)+'’s ')+behind[0].st.behindSubs[0]+'.';
  else if(behind.length>=1) nudge=' To nudge: '+behind.map(b=>cap(b.k)).join(', ')+'.';
  return '<div style="background:'+bg+';border:1px solid '+bd+';border-radius:12px;padding:12px 14px;margin-bottom:12px">'+
    '<div style="font-size:15px;font-weight:800;color:'+fg+'">'+icon+' '+head+'</div>'+
    '<div style="font-size:12px;color:'+fg+';opacity:0.95;margin-top:3px">'+parts.filter(Boolean).join(' · ')+'.'+nudge+'</div>'+
    '</div>';
}
// Largest page number in a lesson label: "MR5 pp.148–151"→151, "p. 30"→30.
// null when the label isn't page-based (e.g. "Quest 59", "Lesson 103").
function parsePageNum(text){
  const m=String(text||'').match(/\b(?:pp?|pg|pgs|page|pages)\.?\s*(\d+)\s*(?:[–\-]\s*(\d+))?/i);
  return m?parseInt(m[2]||m[1]):null;
}
// "Pages worked through" for a subject — Adrienne's metric: last page reached,
// assuming each book started at page 1 (books were begun before the app). Books
// are detected by the label stem minus the page tokens ("mr5" vs "mr6"), and
// each book's max page is banked so MR5→MR6 doesn't reset the count.
// Label stem minus the page tokens — identifies the book ("MR5 pp.148"→"MR5").
function _bookKey(t){ return String(t||'').replace(/\b(?:pp?|pg|pgs|page|pages)\.?\s*\d+\s*(?:[–\-]\s*\d+)?/ig,'').replace(/\s+/g,' ').trim(); }
// Contiguous book runs in a subject's sequence. A new book starts on a label
// change OR a page reset (the number drops — "starts back at 1"), which is how
// multi-book subjects like MR5→MR6 are split. Non-page lessons are skipped.
function _bookRuns(seq){
  const runs=[]; let prev=null;
  (seq||[]).forEach((e,i)=>{
    const p=parsePageNum(e.lesson); if(p===null) return;
    const key=_bookKey(e.lesson).toLowerCase();
    const last=runs[runs.length-1];
    if(!last||last.key!==key||(prev!==null&&p<prev)) runs.push({name:_bookKey(e.lesson),key,firstIdx:i,lastIdx:i,maxPage:p});
    else { last.lastIdx=i; if(p>last.maxPage) last.maxPage=p; }
    prev=p;
  });
  return runs;
}
// Pages worked through seq[0..uptoIdx], banked per book (each book starts at
// page 1) so MR5→MR6 sums. null when not page-based. Lifetime total uses this.
function _bankedPages(seq,uptoIdx){
  const runs=_bookRuns(seq); if(!runs.length) return null;
  const upto=Math.min(Math.max(uptoIdx,0),(seq.length||1)-1);
  let total=0;
  for(const r of runs){
    if(r.firstIdx>upto) break;
    if(r.lastIdx<=upto){ total+=r.maxPage; continue; }
    let mx=0; for(let i=r.firstIdx;i<=upto;i++){ const p=parsePageNum(seq[i].lesson); if(p!==null&&p>mx) mx=p; }
    total+=mx;
  }
  return total;
}
function subjectPagesReached(kid,sk){
  let cursor=0; try{cursor=computeSubjectCursor(kid,sk);}catch(e){}
  return _bankedPages(buildSubjectLessons(kid,sk),cursor);
}
// Current book the kid is in: page reached within it + that book's last page.
// Counter restarts per book (a fresh book reads as page X of its own total).
function subjectCurrentBook(seq,cursor){
  const runs=_bookRuns(seq); if(!runs.length) return null;
  const upto=Math.min(Math.max(cursor,0),(seq.length||1)-1);
  let cur=runs[0],idx=0;
  runs.forEach((r,i)=>{ if(r.firstIdx<=upto){ cur=r; idx=i; } });
  const end=Math.min(upto,cur.lastIdx);
  let curPage=0; for(let i=cur.firstIdx;i<=end;i++){ const p=parsePageNum(seq[i].lesson); if(p!==null&&p>curPage) curPage=p; }
  return {name:cur.name,curPage,totalPage:cur.maxPage,bookCount:runs.length,bookNum:idx+1};
}
// Last integer in a label ("L2-10"→10, "Ex.21"→21, "5a"→5, "B3 S6"→6).
function _lastInt(s){ const m=String(s||'').match(/(\d+)(?!.*\d)/); return m?parseInt(m[1]):null; }
// Book/volume token: 5A (digit+UPPER), L2/B3 (UPPER+digit), or Book/Level/Unit/
// Vol N. Lowercase ("5a") is intentionally NOT a volume. null otherwise.
function _lessonBookKey(t){
  const m=String(t||'').match(/\b(\d+[A-Z]|[A-Z]\d+)\b/);
  if(m) return m[1];
  const w=String(t||'').match(/\b(Book|Level|Unit|Vol)\.?\s*(\d+)\b/i);
  return w?w[1].charAt(0).toUpperCase()+w[1].slice(1).toLowerCase()+' '+w[2]:null;
}
// Current volume of a multi-book lesson subject + position within it. Within a
// book the lesson NUMBER is read from the label (assume the work before the app:
// "L2-10" = lesson 10) when those numbers climb cleanly; else the book's lessons
// are counted. Guard rejects lesson-code lookalikes (many tiny "books").
function subjectLessonCurrentBook(seq,cursor){
  const keys=(seq||[]).map(e=>_lessonBookKey(e.lesson));
  const order=[]; keys.forEach(k=>{ if(k&&!order.includes(k)) order.push(k); });
  const keyed=keys.filter(Boolean).length;
  if(order.length<2||order.length>8||keyed/order.length<3) return null;
  const upto=Math.min(Math.max(cursor,0),seq.length-1);
  let curKey=null;
  for(let i=upto;i>=0;i--){ if(keys[i]){ curKey=keys[i]; break; } }
  if(!curKey){ for(let i=upto+1;i<seq.length;i++){ if(keys[i]){ curKey=keys[i]; break; } } }
  if(!curKey) return null;
  const base={name:curKey,bookNum:order.indexOf(curKey)+1,bookCount:order.length};
  const idxs=[]; keys.forEach((k,i)=>{ if(k===curKey) idxs.push(i); });
  const ints=idxs.map(i=>_lastInt(seq[i].lesson)), real=ints.filter(n=>n!==null);
  let mono=real.length>=2,mx=0,prev=-Infinity;
  real.forEach(n=>{ if(n<prev) mono=false; prev=n; if(n>mx) mx=n; });
  if(mono&&mx>1){ // within-book numbers climb cleanly → read position from label
    let curN=null; for(let j=idxs.length-1;j>=0;j--){ if(idxs[j]<=upto&&ints[j]!==null){ curN=ints[j]; break; } }
    if(curN===null) curN=real[0];
    return Object.assign(base,{curLesson:Math.min(curN,mx),totalLesson:mx});
  }
  let total=0,done=0; // else count lessons within the book
  keys.forEach((k,i)=>{ if(k===curKey){ total++; if(i<cursor) done++; } });
  return Object.assign(base,{curLesson:done,totalLesson:total});
}
// A single climbing counter across the labels (LOF "ch 13", Kumon "Ex.21",
// Spelling "5a"→5): assume the number counts from 1. null when the numbers
// reset (AAS levels) or aren't a clean monotonic series.
function subjectLessonCounter(seq,cursor){
  const nums=(seq||[]).map(e=>_lastInt(e.lesson));
  if(nums.filter(n=>n!==null).length<3) return null;
  let mono=true,prev=-Infinity,mx=0;
  nums.forEach(n=>{ if(n===null) return; if(n<prev) mono=false; prev=n; if(n>mx) mx=n; });
  if(!mono||mx<=1) return null;
  const upto=Math.min(Math.max(cursor,0),seq.length-1);
  let cur=null;
  for(let i=upto;i>=0;i--){ if(nums[i]!==null){ cur=nums[i]; break; } }
  if(cur===null){ for(let i=upto+1;i<seq.length;i++){ if(nums[i]!==null){ cur=nums[i]; break; } } }
  return cur===null?null:{cur:Math.min(cur,mx),total:mx};
}
// One subject's progress for the Pace bars: CURRENT book — pages for workbooks,
// volume for lesson-based multi-book subjects — both reset per book; plain
// lessons otherwise.
function subjectProgress(kid,sk){
  const s=((paceData.subjects||{})[kid]||{})[sk];
  const _cs=((currData&&currData.subjects)||{})[kid]||{};
  if(!s||(_cs[sk]&&_cs[sk].tracking==="daily")) return null;
  const totL=s.total||0; if(totL<=0) return null;
  let cur=0; try{cur=computeSubjectCursor(kid,sk);}catch(e){}
  const seq=buildSubjectLessons(kid,sk);
  const cb=subjectCurrentBook(seq,cur);
  if(cb){
    return {label:s.label||sk,unit:'page',cur:cb.curPage,total:cb.totalPage,pct:cb.totalPage?Math.min(100,Math.round(cb.curPage/cb.totalPage*100)):0,done:cur>=totL,book:(cb.bookCount>1?cb.name:null),bookNum:cb.bookNum,bookCount:cb.bookCount};
  }
  const lb=subjectLessonCurrentBook(seq,cur);
  if(lb){
    return {label:s.label||sk,unit:'lesson',cur:lb.curLesson,total:lb.totalLesson,pct:lb.totalLesson?Math.min(100,Math.round(lb.curLesson/lb.totalLesson*100)):0,done:cur>=totL,book:lb.name,bookNum:lb.bookNum,bookCount:lb.bookCount};
  }
  const lc=subjectLessonCounter(seq,cur);
  if(lc){
    return {label:s.label||sk,unit:'lesson',cur:lc.cur,total:lc.total,pct:lc.total?Math.min(100,Math.round(lc.cur/lc.total*100)):0,done:cur>=totL,book:null};
  }
  // No clean counter (book titles / resetting numbers) — show where they are now
  let now=''; for(let i=Math.min(Math.max(cur,0),seq.length-1);i>=0;i--){ const L=seq[i]&&seq[i].lesson; if(L&&!/^(complete|testing|done|nan|—|-|free choice|bridge)$/i.test(String(L).trim())){ now=L; break; } }
  return {label:s.label||sk,unit:'at',now:now,pct:0,done:cur>=totL,book:null};
}
// Books inside a page-based subject + whether each is finished (cursor past its
// last lesson) — feeds the wins list with "finished MR5" milestones.
function subjectBooks(kid,sk){
  const seq=buildSubjectLessons(kid,sk); if(!seq.length) return [];
  let cursor=0; try{cursor=computeSubjectCursor(kid,sk);}catch(e){}
  return _bookRuns(seq).map(r=>({name:r.name,finished:cursor>r.lastIdx}));
}
// Lifetime "how far you've come" totals — fully derived (no stored counter to
// drift): lessons from the cursor (offset already folds in pre-app lessons),
// pages from subjectPagesReached. since = earliest plan start.
function lifetimeTotals(kidFilter){
  const kids=(kidFilter&&kidFilter!=="all"&&kidFilter!=="mom")?[kidFilter]:PACE_KIDS;
  let pages=0,lessons=0;
  for(const k of kids){
    const subs=(currData&&currData.subjects&&currData.subjects[k])||{};
    for(const sk of Object.keys(subs)){
      if(subs[sk].paused) continue;
      let cursor=0; try{cursor=computeSubjectCursor(k,sk);}catch(e){}
      lessons+=Math.max(0,cursor);
      const pg=subjectPagesReached(k,sk);
      if(pg) pages+=pg;
    }
  }
  const plans=(paceData.plans&&Object.keys(paceData.plans).length)?paceData.plans:PACE_DEFAULT_PLANS;
  const starts=Object.values(plans).map(p=>p&&p.start).filter(Boolean).sort();
  let since=null;
  if(starts.length){ const d=new Date(starts[0]+"T12:00:00"); if(!isNaN(d)) since=d.toLocaleDateString("en-US",{month:"long",year:"numeric"}); }
  return {pages,lessons,since};
}
// A week "counts as done" when ≥ the core floor of its countable tasks are
// complete (same rule as the per-kid week). null = no countable tasks (a full
// break week) so it neither counts nor breaks a streak.
function weekCompletionPct(tasks,checkedObj,kidFilter){
  const arr=tasks||[], ck=checkedObj||{};
  const all=(kidFilter==null||kidFilter==="all"||kidFilter==="mom");
  const cascAway=new Set(arr.filter(t=>t.id.endsWith("_c")).map(t=>t.id.replace(/_c$/,"")));
  const countable=arr.filter(t=>(all||t.who===kidFilter)&&(!cascAway.has(t.id)||!!ck[t.id])&&!(t.title||"").toLowerCase().includes("lunch"));
  if(!countable.length) return null;
  const done=countable.filter(t=>chainDone(t.id,ck,arr)).length;
  return Math.round(done/countable.length*100);
}
// Core-week streak + finished count — derived from archive + the live week.
// Break weeks (null pct) are skipped so a vacation doesn't reset a streak; the
// in-progress week only extends the streak once it meets the floor.
function paceStreak(kidFilter){
  const weeks=[];
  Object.values(archive||{}).forEach(aw=>{
    const num=parseInt(((aw.weekLabel||"").match(/\d+/)||[0])[0])||0;
    const pct=weekCompletionPct(aw.tasks,aw.checked,kidFilter);
    if(pct===null) return;
    weeks.push({num,met:pct>=PACE_CORE_FLOOR});
  });
  const curNum=currWeekNum();
  if(!weeks.some(w=>w.num===curNum)){
    const cur=weekCompletionPct(weekData.tasks,checked,kidFilter);
    if(cur!==null&&cur>=PACE_CORE_FLOOR) weeks.push({num:curNum,met:true});
  }
  weeks.sort((a,b)=>a.num-b.num);
  let streak=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i].met) streak++; else break; }
  return {finished:weeks.filter(w=>w.met).length,streak,weeks:weeks.length};
}
// Wins feed: finished books (📖, page subjects) + fully-completed non-page
// subjects (🎉). Page subjects are represented by their books, so they're not
// double-listed as completed subjects.
function paceWins(kidFilter){
  const s=paceStreak(kidFilter);
  const kids=(kidFilter&&kidFilter!=="all"&&kidFilter!=="mom")?[kidFilter]:PACE_KIDS;
  const done=[],books=[];
  for(const k of kids){
    const kidSubjs=(paceData.subjects&&paceData.subjects[k])||{};
    const _cs=(currData&&currData.subjects&&currData.subjects[k])||{};
    for(const sk of Object.keys(kidSubjs)){
      const sub=kidSubjs[sk];
      if(_cs[sk]&&_cs[sk].tracking==="daily") continue;
      const tot=sub.total||0; if(tot<=0) continue;
      let cur=0; try{cur=computeSubjectCursor(k,sk);}catch(e){}
      const bks=subjectBooks(k,sk);
      bks.forEach(b=>{ if(b.finished) books.push({kid:k,name:b.name}); });
      if(cur>=tot&&!bks.length) done.push({kid:k,subject:sub.label||sk});
    }
  }
  return {finished:s.finished,streak:s.streak,done,books};
}
// A warm, specific encouragement for the bottom of the Pace page — celebrates
// real progress without just restating the header tiles. Picks the strongest
// true thing about where they are right now.
function paceEncouragement(lt,stk,win){
  const books=(win.books||[]).length;
  if(stk.streak>=3) return '🔥 '+stk.streak+' weeks in a row of core work — that consistency is how big things get done. Keep going!';
  if(books>0) return '📖 '+books+' book'+(books>1?'s':'')+' finished and counting. Look how far you’ve come!';
  if(lt.pages>=300) return lt.pages.toLocaleString()+' pages of real work behind you. 🎉 Every one counts.';
  if(stk.finished>0) return stk.finished+' week'+(stk.finished>1?'s':'')+' of steady work done — you’re building something real. 🌱';
  if(lt.lessons>0) return lt.lessons.toLocaleString()+' lessons in, and every one adds up. 🌱';
  return 'Every page and lesson adds up. Look how far you’ve come. 🌱';
}

      'oninput="checkAdminPin(this.value,\'admin-pin-err\')" autofocus>'+
